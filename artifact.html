 finir plus tôt.",ok:!1,note:"0,5/4",why:"Vision réductrice, qui ne reprend pas l'intérêt pour les soins."},{t:"Partager les informations et éviter les erreurs.",ok:!1,note:"2,5/4",why:"Deux intérêts justes, sans phrase rédigée."},{t:"Parce qu'un infirmier ne peut rien faire seul.",ok:!1,note:"0,5/4",why:"Exagéré et sans explication."}]},{q:"Peut-on être un bon professionnel de santé sans qualités humaines ? Tu développeras une argumentation structurée en abordant les compétences techniques, l'écoute, l'empathie et le travail en équipe (20 à 25 lignes).",points:30,reponses:[{t:`Les professionnels de santé possèdent des compétences techniques indispensables pour prendre en charge les patients. Cependant, exercer un métier dans le domaine des soins ne consiste pas uniquement à réaliser des actes médicaux. Les qualités humaines occupent également une place essentielle.

Tout d'abord, un professionnel doit maîtriser les connaissances et les gestes nécessaires à son métier. Il doit être rigoureux, respecter les protocoles et connaître ses responsabilités afin de garantir la sécurité des patients.

Cependant, les compétences techniques ne suffisent pas. Un patient peut être inquiet, souffrir ou avoir peur de son hospitalisation. Il est donc important de savoir écouter, rassurer et expliquer les soins. Par exemple, prendre quelques minutes pour expliquer un geste peut permettre à une personne de mieux comprendre sa prise en charge et de se sentir davantage en confiance.

De plus, le respect de la dignité et de l'intimité est indispensable. Chaque patient doit être considéré comme une personne à part entière, quels que soient son âge, son état de santé ou sa situation sociale.

Enfin, les professionnels doivent travailler en équipe. La communication et l'entraide permettent d'améliorer la qualité des soins.

Pour conclure, les qualités humaines et les compétences techniques sont complémentaires. Un bon professionnel de santé doit savoir soigner, mais également écouter, respecter et accompagner les personnes.`,ok:!0,note:"30/30",why:"C'est la rédaction modèle du corrigé : elle aborde les quatre éléments demandés (technique, écoute, empathie, équipe) et conclut sur leur complémentarité."},{t:"Non, on ne peut pas être un bon professionnel sans qualités humaines. Les qualités humaines sont indispensables. Un soignant doit être humain, sinon ce n'est pas un bon soignant. L'humain est au cœur du soin.",ok:!1,note:"5/30",why:"Réponse circulaire, sans arguments ni exemples, et sans aborder la technique ni le travail en équipe."},{t:"Oui, car l'important est de bien faire les soins. Un patient veut surtout être guéri. Si l'infirmier fait bien les piqûres et les pansements, peu importe qu'il soit aimable ou non.",ok:!1,note:"6/30",why:"Position non nuancée, qui ignore l'écoute, l'empathie et le travail en équipe demandés par la consigne."},{t:"Je suis quelqu'un de très empathique et à l'écoute, mes collègues me l'ont souvent dit. Je pense donc que je serai un bon infirmier, car j'ai déjà les qualités humaines nécessaires.",ok:!1,note:"3/30",why:"Hors-sujet : tu parles de toi au lieu de construire une argumentation."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement la question de réflexion ?",opts:[{t:"Dire si l'on peut être un bon soignant sans qualités humaines, en abordant technique, écoute, empathie et travail en équipe.",ok:!0,why:"La consigne fixe la question et les quatre points à traiter."},{t:"Lister les gestes techniques d'un infirmier.",ok:!1,why:"Un seul aspect, hors de la question."},{t:"Décrire ses propres qualités.",ok:!1,why:"Piège classique : ce n'est pas une lettre de motivation."},{t:"Raconter une hospitalisation.",ok:!1,why:"Anecdote, pas une argumentation."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Les compétences techniques sont indispensables — II. Mais l'écoute, l'empathie et le respect le sont aussi — III. Le travail en équipe relie les deux.",ok:!0,why:"Plan nuancé qui traite les quatre éléments demandés."},{t:"I. Les médecins — II. Les infirmiers — III. Les aides-soignants.",ok:!1,why:"Plan par métiers, hors question."},{t:"I. Mes qualités — II. Mes défauts.",ok:!1,why:"Plan d'entretien oral."},{t:"Une seule partie sur l'empathie.",ok:!1,why:"Trop étroit."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Les compétences techniques ne suffisent pas, car un patient inquiet a besoin d'être rassuré. Par exemple, expliquer un geste avant de le faire l'aide à se sentir en confiance. »",ok:!0,why:"Idée, justification, exemple."},{t:"« L'empathie est une qualité essentielle. »",ok:!1,why:"Affirmation sans démonstration."},{t:"« Les soignants doivent être gentils. »",ok:!1,why:"Trop vague."},{t:"« La technique, c'est la base. »",ok:!1,why:"Affirmation familière et non développée."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Soigner demande des compétences techniques, mais aussi des qualités humaines. Peut-on être un bon soignant sans ces dernières ? Nous verrons l'importance de la technique, puis celle de l'écoute, de l'empathie et du travail en équipe. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« Je suis très empathique. »",ok:!1,why:"Parler de soi en introduction."},{t:"« Le soin est un art. »",ok:!1,why:"Formule creuse."},{t:"« Voici ma réponse. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Chaque patient doit être considéré comme une personne à part entière. »",ok:!0,why:"Phrase correcte."},{t:"« Chaque patients doivent être considéré comme une personne à part entière. »",ok:!1,why:"« Chaque » est suivi du singulier : « chaque patient doit »."},{t:"« Les patients, faut les respecter. »",ok:!1,why:"Registre oral."},{t:"« Chaque patient, doit être considéré, comme une personne. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Qualités humaines et compétences techniques sont complémentaires : un bon soignant doit savoir soigner, mais aussi écouter, respecter et accompagner. »",ok:!0,why:"Réponse nuancée et claire à la question."},{t:"« En conclusion, il faut être gentil. »",ok:!1,why:"Réducteur."},{t:"« Pour finir, parlons des salaires. »",ok:!1,why:"Nouveau sujet."},{t:"« Voilà, c'est fini. »",ok:!1,why:"Pas une conclusion."}]}]}},Eh=Object.freeze(Object.defineProperty({__proto__:null,addictions:Ud,aidants:kd,antibio:zd,consentement:$d,default:Ph,deserts:Ld,epuisement:Dd,finvie:Nd,handicap:Pd,jeunes:Cd,numerique:Td,precarite:Ed,prendresoin:Ad,sedentarite:Id,vaccin:bd,violence:Sd},Symbol.toStringTag,{value:"Module"}));</script>
