sance du métier",qualites:"Qualités et mises en situation",formation:"Suivre la formation",contenu:"Contenu de la formation",actu:"Actualité santé et médico-sociale"},gf=[{id:"formation",titre:"La formation et son contenu",intro:"Le jury vérifie que tu sais dans quoi tu t’engages. Pour toute question sur la formation, suis la même structure : le cadre → l’organisation → ce que ça implique pour toi. Chaque étape te donne la méthode, puis un QCM pour l’ancrer.",etapes:[{id:"cadre",titre:"Le cadre : diplôme, durée, université",methode:["Donne 3 chiffres : 3 ans, 6 semestres, 180 ECTS.","Nomme le diplôme : diplôme d’État d’infirmier, avec le grade licence.","Ajoute l’universitarisation : le diplôme est délivré par l’université (Paris-Saclay pour Longjumeau)."],phrase:"« C’est une formation de 3 ans, en 6 semestres, qui mène au diplôme d’État d’infirmier avec le grade licence. »",questions:["cm1","c1","c7","f2","fc1","fc2","fc3","fc4","fc5","fc6","fc7","fc8","fc9","fc10","fc11","fc12","fc13","fc14","fc15","fc16"],fiche:{texte:["La formation dure 3 ans, soit 6 semestres de 30 crédits ECTS : 180 ECTS au total. Elle mène au diplôme d'État d'infirmier, enregistré au niveau 6 et qui confère le grade de licence.","Depuis la réforme de 2026, le diplôme est délivré par les universités accréditées, et non plus par le préfet de région. À Longjumeau, une partie des cours a lieu à l'Université Paris-Saclay (site du Kremlin-Bicêtre).","Pour la voie FPC : au moins 25 % des places, une sélection sur dossier, un entretien de 20 minutes et une épreuve écrite. Résultats le 1er février 2027, rentrée en septembre 2027."],image:"form-cadre",sources:[{titre:"Arrêté du 20 février 2026 relatif au diplôme d'État d'infirmier (Légifrance)",url:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000053568913/2026-09-29"},{titre:"Diplôme d’État infirmier : 4 620 heures en trois ans (Caducée.net, 26/02/2026)",url:"https://www.caducee.net/actualite-medicale/16818/diplome-d-etat-infirmier-4-620-heures-en-trois-ans-un-nouveau-referentiel-sous-tension-des-septembre-2026.html"}]}},{id:"programme",titre:"Le programme : le référentiel de ta promotion",methode:["Ta promotion (septembre 2027) suivra le référentiel du 20 février 2026.","Il est organisé en 5 domaines : retiens au moins « raisonnement clinique ».","Le site de l’IFSI présente encore le référentiel de 2009 (10 compétences) : connais-le aussi, sans corriger le jury."],phrase:"« Ma promotion suivra le nouveau référentiel de 2026, centré sur le raisonnement clinique, la prévention et la coordination des soins. »",questions:["c2","c6","c4","c5","c9","fp1","fp2","fp3","fp4","fp5","fp6","fp7","fp8","fp9","fp10","fp11","fp12","fp13","fp14","fp15","fp16","fp17","fp18"],fiche:{texte:["Ta promotion suivra le référentiel du 20 février 2026, applicable aux étudiants entrés à partir de septembre 2026. Il compte 5 domaines, 12 activités et 13 compétences.","Nouveautés : le diagnostic infirmier en première compétence, la prescription de produits de santé et d'examens, les éco-soins (développement durable) et la gestion d'une structure d'exercice (libéral, centre de santé).","Le site de l'IFSI présente encore le référentiel de 2009 : 10 compétences (5 « cœur de métier », 5 transverses). Connais les deux, sans corriger le jury."],image:"form-programme",sources:[{titre:"Arrêté du 20 février 2026 relatif au diplôme d'État d'infirmier (Légifrance)",url:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000053568913/2026-09-29"},{titre:"Référentiel 2026 : présentation (IFSI du CH Charles Perrens)",url:"https://iform.ch-perrens.fr/referentiel-2026"}]}},{id:"stages",titre:"L’alternance et les stages",methode:["Environ la moitié du temps en stage : 66 semaines sur 3 ans.","Des lieux variés : hôpital public ou privé, libéral, médico-social, psychiatrie, santé scolaire…","Explique l’intérêt : apprendre, pratiquer, puis analyser sa pratique."],phrase:"« L’alternance permet de mettre en pratique les cours auprès des patients, puis d’analyser ce qu’on a vécu pour progresser. »",questions:["c3","c8","c10","f7","c14","fs1","fs2","fs3","fs4","fs5","fs6","fs7","fs8","fs9","fs10","fs11","fs12","fs13","fs14","fs15","fs16","fs17","fs18","fs19","fs20"],fiche:{texte:["66 semaines de stage : 12 en 1re année, 26 en 2e, 28 en 3e (60 semaines dans le référentiel de 2009). Une semaine fait 35 h et vaut 1 ECTS, dont 5 h de réflexion sur sa pratique.","4 types de stage : phase aiguë, état stabilisé, soins primaires, accompagnement des personnes vulnérables. À l'hôpital, en libéral, en centre de santé, en médico-social, en santé scolaire…","L'étudiant est encadré par un tuteur infirmier et suit sa progression dans un portfolio. Au-delà de 20 % d'absence, le stage n'est pas validé. Indemnités : 36 €, 46 € puis 60 € par semaine."],image:"form-stages",sources:[{titre:"Arrêté du 20 février 2026 relatif au diplôme d'État d'infirmier (Légifrance)",url:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000053568913/2026-09-29"},{titre:"Diplôme d’État infirmier : 4 620 heures en trois ans (Caducée.net, 26/02/2026)",url:"https://www.caducee.net/actualite-medicale/16818/diplome-d-etat-infirmier-4-620-heures-en-trois-ans-un-nouveau-referentiel-sous-tension-des-septembre-2026.html"},{titre:"Rentrée 2026 : les étudiants infirmiers toujours exposés à la précarité (Infirmiers.com, 02/09/2026)",url:"https://www.infirmiers.com/etudiants/admission-et-cursus-en-ifsi/en-cette-rentree-2026-les-etudiants-infirmiers-toujours-exposes-une-forte-precarite"}]}},{id:"validation",titre:"La validation et les dispenses",methode:["On valide des semestres de 30 ECTS : passage en 2e année avec les 2 semestres ou 51 crédits sur 60.","Pour le diplôme : les 6 semestres validés et l’AFGSU 2.","Des dispenses existent selon le parcours : dis honnêtement si tu es concerné."],phrase:"« On valide des crédits par semestre, en cours comme en stage, avec un suivi régulier des compétences. »",questions:["c13","c12","c15","fv1","fv2","fv3","fv4","fv5","fv6","fv7","fv8","fv9","fv10","fv11","fv12","fv13","fv14","fv15","fv16","fv17"],fiche:{texte:["Une unité d'enseignement est validée à 10/20, avec compensation possible dans le semestre. Deux sessions d'examen par semestre. Les crédits acquis le sont définitivement.","Passage en année supérieure : les deux semestres validés, ou 51 crédits sur 60. Le diplôme exige les 6 semestres et l'AFGSU de niveau 2 (gestes et soins d'urgence).","Des dispenses existent selon le parcours : les aides-soignants avec 3 ans d'expérience sur 5 ans peuvent, sous conditions, entrer en 2e année."],sources:[{titre:"Arrêté du 20 février 2026 relatif au diplôme d'État d'infirmier (Légifrance)",url:"https://www.legifrance.gouv.fr/loda/id/JORFTEXT000053568913/2026-09-29"}]}},{id:"toi",titre:"Toi dans la formation",methode:["Montre que tu t’es organisé : 35 h par semaine, le travail personnel, ta vie personnelle.","Pour le financement, donne une piste principale et un plan B.","Présente le suivi individuel par un formateur comme une ressource que tu utiliseras."],phrase:"« Je me suis organisé pour être pleinement disponible : j’ai prévu mon financement, mon rythme de travail et je compte m’appuyer sur le suivi pédagogique. »",questions:["f1","f3","f4","f5","f6","c11","ft1","ft2","ft3","ft4","ft5","ft6","ft7","ft8","ft9","ft10","ft11","ft12","ft13","ft14"],fiche:{texte:["Le jury vérifie que ton projet est réaliste : organisation personnelle, financement, mobilité pour les stages, capacité à reprendre des études.","Prépare des réponses concrètes : une piste de financement et un plan B, l'organisation de ta semaine, ce que tu feras d'ici la rentrée. Remplace les [crochets] par ta situation.","La précarité est réelle : selon la FAGE, une rentrée coûte en moyenne 3 239 € en 2026. Montrer que tu as anticipé ton budget rassure le jury."],sources:[{titre:"Rentrée 2026 : les étudiants infirmiers toujours exposés à la précarité (Infirmiers.com)",url:"https://www.infirmiers.com/etudiants/admission-et-cursus-en-ifsi/en-cette-rentree-2026-les-etudiants-infirmiers-toujours-exposes-une-forte-precarite"}]}}]},{id:"actu",titre:"L’actualité santé et médico-sociale",intro:"Le jury veut voir que tu t’intéresses à ton futur environnement et que tu sais prendre du recul. Pour chaque actualité : les faits → les enjeux → le rôle infirmier → ton avis nuancé. Prépare 2 sujets à fond, garde les autres en réserve. Informations à jour au 19 novembre 2026.",etapes:[{id:"structure",titre:"La structure de ta réponse",methode:["Les faits : quoi, quand, qui, en 2 phrases avec 1 ou 2 chiffres.","Les enjeux : pour les patients, les soignants, le système de santé.","Le lien avec le rôle infirmier.","Ton avis, en une phrase nuancée."],phrase:"« Un sujet qui m’a marqué, c’est… Concrètement… Pour les infirmiers, cela change… Personnellement, je pense que… »",questions:["am1","a15"],fiche:{texte:["Le jury ne note pas ton opinion : il évalue si tu connais ton futur environnement, si tu comprends les enjeux et si tu sais rester nuancé.","En une minute environ : deux phrases de faits avec un chiffre, une phrase d'enjeux, une phrase sur ce que ça change pour les infirmiers, une phrase d'avis personnel.","Choisis des sources fiables : sites officiels (gouvernement, Légifrance, Assurance maladie), presse santé reconnue, Ordre infirmier. Évite les réseaux sociaux."],image:"actu-structure",sources:[{titre:"Actualités de la semaine du 9 novembre 2026 (Réussir les concours)",url:"https://reussirlesconcours.substack.com/p/actualites-de-la-semaine-du-09-novembre"}]}},{id:"vocabulaire",titre:"Le vocabulaire de base",methode:["PLFSS : le budget de la Sécurité sociale, voté chaque automne.","ONDAM : l’objectif national de dépenses d’assurance maladie.","APA : l’aide du département aux personnes âgées en perte d’autonomie."],phrase:"« Le PLFSS fixe chaque année l’ONDAM, c’est-à-dire ce que l’Assurance maladie peut dépenser. »",questions:["a3","a5","a14","ax15","ax16","ax17","ax18"],fiche:{texte:["Chaque automne, le Parlement vote la loi de financement de la Sécurité sociale (LFSS). Le projet (PLFSS) fixe l'ONDAM, le plafond de dépenses de l'Assurance maladie.","PLFSS 2027 : ONDAM en hausse de 2 %, environ 4 milliards d'économies, déficit visé de 12,7 Md€ (21,8 Md€ en 2026). Rejeté par l'Assemblée en première lecture, il a été adopté par le Sénat le 18 novembre 2026. Une commission mixte paritaire doit suivre.","Autres mesures : extension de la taxe soda à d'autres produits sucrés, transfert de 300 M€ aux départements pour l'APA (personnes âgées) et la PCH (handicap)."],image:"actu-plfss",sources:[{titre:"PLFSS 2027 : contenu, débats et état du texte (Legiwatch, 14/11/2026)",url:"https://www.legiwatch.fr/loi/plfss-2027/"},{titre:"PLFSS 2027 : les sénateurs votent un texte (Hospimedia, 18/11/2026)",url:"https://www.hospimedia.fr/actualite/articles/20261118-plfss-2027-les-senateurs-votent-un-texte-integrant"},{titre:"Projet de loi de financement de la Sécurité sociale 2027 (budget.gouv.fr)",url:"https://www.budget.gouv.fr/documentation/file-download/33499"}]}},{id:"loi",titre:"Sujet n° 1 : la loi infirmière et l’accès aux soins",methode:["Loi du 27 juin 2025 : consultation infirmière, diagnostic infirmier, prescription encadrée.","Les arrêtés du 26 juin 2026 fixent la liste de ce que l’infirmier peut prescrire.","Enjeu : l’accès aux soins face aux déserts médicaux (exemple : les Médicobus)."],phrase:"« La loi de 2025 reconnaît la consultation et le diagnostic infirmiers : la profession gagne en autonomie, et c’est aussi ce qui m’attire. »",questions:["a1","a2","a13","ax1","ax2","ax3","ax4","ax5","ax6"],fiche:{texte:["La loi n° 2025-581 du 27 juin 2025 inscrit dans le Code de la santé publique que l'infirmier effectue des consultations, pose un diagnostic infirmier et prescrit certains produits de santé et examens.","Le décret du 24 décembre 2025 et deux arrêtés du 26 juin 2026 la rendent applicable depuis le 28 juin 2026. Exemples de prescriptions : vaccins, pansements, substituts nicotiniques, antalgiques de palier 1, renouvellement de contraceptifs oraux (6 mois). La liste est révisée au moins tous les 3 ans.","Enjeu : l'accès aux soins. Le gouvernement vise 100 Médicobus en 2027 (34 labellisés en novembre 2026), intégrés au réseau France Santé (des soins à moins de 30 minutes et sous 48 heures)."],image:"actu-loi",sources:[{titre:"Loi n° 2025-581 du 27 juin 2025 sur la profession d’infirmier (AP-HP, affaires juridiques)",url:"https://affairesjuridiques.aphp.fr/textes/loi-n-2025-581-du-27-juin-2025-sur-la-profession-dinfirmier-1/"},{titre:"Décret compétences infirmier 2026 : arrêtés publiés (MonRFS)",url:"https://monrfs.com/article-decret-competences-infirmier-2026"},{titre:"Un deuxième appel à projets pour atteindre 100 Médicobus (Banque des Territoires, 09/11/2026)",url:"https://www.banquedesterritoires.fr/acces-aux-soins-un-deuxieme-appel-projets-pour-atteindre-lobjectif-de-100-medicobus"},{titre:"Déserts médicaux : 100 Médicobus labellisés en 2027 (Vidal)",url:"https://www.vidal.fr/actualites/38566-deserts-medicaux-le-gouvernement-veut-100-medicobus-labellises-en-2027.html"}]}},{id:"mentale",titre:"Sujet n° 2 : la santé mentale",methode:["Grande cause nationale en 2025, prolongée en 2026.","Mesures : objectif « zéro contention » en psychiatrie d’ici 2030, accès rapide pour les élèves en souffrance.","Dispositifs à citer : Mon soutien psy, le 3114 (prévention du suicide)."],phrase:"« La santé mentale est grande cause nationale : l’infirmier y a un rôle clé d’écoute, de repérage et d’orientation. »",questions:["a9","a10","a11","ax7","ax8","ax9","ax10"],fiche:{texte:["La santé mentale est la grande cause nationale de 2025, prolongée en 2026 face à la dégradation de la santé mentale des jeunes. Les acteurs demandent des moyens concrets : l'attente atteint 6 à 12 mois en psychiatrie.","Annonces de juin 2026 : objectif « zéro contention » en psychiatrie d'ici 2030 (formation à la désescalade, espaces d'apaisement), « aucun élève en souffrance psychique sans solution » avec un rendez-vous rapide, Maisons des adolescents renforcées.","Dispositifs à citer : Mon soutien psy (12 séances remboursées par an, en accès direct, près de 1,8 million de bénéficiaires), le 3114 (prévention du suicide), 300 000 personnes formées aux premiers secours en santé mentale."],image:"actu-mentale",sources:[{titre:"Santé mentale : la grande cause nationale prolongée en 2026 (Banque des Territoires)",url:"https://www.banquedesterritoires.fr/sante-mentale-la-grande-cause-nationale-prolongee-en-2026"},{titre:"Santé mentale : les annonces de la ministre Stéphanie Rist (Handicap.fr, 04/06/2026)",url:"https://informations.handicap.fr/a-sante-mentale-les-annonces-de-la-ministre-stephanie-rist-39245.php"},{titre:"3114, numéro national de prévention du suicide",url:"https://3114.fr"}]}},{id:"reserve",titre:"Les sujets de réserve",methode:["Budget 2027 de la Sécurité sociale : toujours en débat au Parlement, vérifie la veille de ton oral.","Aide à mourir : loi adoptée en 2026, décrets attendus. Reste factuel et nuancé.","Vaccination grippe et Covid : campagne depuis le 13 octobre 2026, les infirmiers vaccinent."],phrase:"« Sur les sujets éthiques, je m’appuie sur les faits et je garde en tête le respect de la volonté du patient. »",questions:["a4","a6","a7","a8","a12","ax11","ax12","ax13","ax14"],fiche:{texte:["Aide à mourir : loi n° 2026-794 du 18 août 2026, validée avec trois réserves par le Conseil constitutionnel le 14 août. Conditions : être majeur, atteint d'une maladie grave et incurable en phase avancée ou terminale, avec une souffrance réfractaire ou insupportable, et exprimer une volonté libre et éclairée. La personne s'administre elle-même le produit, sauf impossibilité physique. Clause de conscience pour les médecins, infirmiers et pharmaciens. Décrets d'application attendus.","Vaccination grippe et Covid : campagne depuis le 13 octobre 2026, les deux vaccins le même jour possibles, infirmiers et pharmaciens vaccinent. Une obligation de vaccination antigrippale des soignants se prépare (cadre attendu début 2027).","Budget de la Sécurité sociale : la procédure continue au Parlement. Vérifie où il en est la veille de ton oral."],image:"actu-reserve",sources:[{titre:"Aide à mourir : ce que change la loi promulguée le 18 août 2026 (24matins)",url:"https://www.24matins.fr/aide-a-mourir-ce-que-change-la-loi-promulguee-le-18-aout-2026-1419406"},{titre:"Loi n° 2026-794 du 18 août 2026 relative au droit à l’aide à mourir (AP-HP, affaires juridiques)",url:"https://affairesjuridiques.aphp.fr/textes/loi-n-2026-794-du-18-aout-2026-relative-au-droit-a-laide-a-mourir/"},{titre:"La loi relative au droit à l’aide à mourir définitivement adoptée (Parlons Fin de Vie)",url:"https://www.parlons-fin-de-vie.fr/la-loi-relative-au-droit-a-laide-a-mourir-definitivement-adoptee/"},{titre:"Grippe et Covid-19 : la campagne de vaccination 2026-2027 (Vidal)",url:"https://www.vidal.fr/actualites/38333-grippe-et-covid-19-tous-les-details-de-la-campagne-de-vaccination-2026-2027.html"}]}}]}],yf=[{id:"d1",theme:"deroule",jury:!1,q:"Combien de temps dure l'entretien oral ?",opts:[{t:"10 minutes",ok:!1,why:"C'est trop court : l'entretien dure deux fois plus."},{t:"20 minutes",ok:!0,why:"C'est la durée fixée par le document officiel de l'ARS."},{t:"30 minutes",ok:!1,why:"30 minutes, c'est la durée de chaque sous-épreuve écrite, pas de l'oral."},{t:"45 minutes",ok:!1,why:"Beaucoup trop long : l'entretien dure 20 minutes."}],tip:"Prévois une présentation de 2 à 3 minutes : le reste du temps sert aux questions du jury."},{id:"d2",theme:"deroule",jury:!1,q:"Comment l'oral est-il noté ?",opts:[{t:"Sur 20, et une note inférieure à 8/20 est éliminatoire",ok:!0,why:"C'est la règle : l'oral et l'écrit sont chacun notés sur 20, et sous 8/20 à l'un des deux, la candidature est éliminée."},{t:"Sur 20, et une note inférieure à 10/20 est éliminatoire",ok:!1,why:"Le seuil éliminatoire est 8/20, pas 10/20."},{t:"Sur 10, et une note inférieure à 5/10 est éliminatoire",ok:!1,why:"L'oral est noté sur 20."},{t:"Il n'est pas noté : le jury donne seulement un avis",ok:!1,why:"L'oral est bien noté sur 20 et compte pour la moitié du total."}]},{id:"d3",theme:"deroule",jury:!1,q:"Sur quoi s'appuie l'entretien ?",opts:[{t:"Sur le dossier déposé à l'inscription : CV, lettre de candidature, diplômes, attestations",ok:!0,why:"Le jury s'appuie sur ton dossier pour apprécier ton expérience, ton projet et tes motivations."},{t:"Sur un texte d'actualité tiré au sort",ok:!1,why:"Ce n'est pas le format de l'oral FPC : il porte sur ton expérience et ton projet."},{t:"Sur ta copie de rédaction",ok:!1,why:"La rédaction est évaluée séparément, à l'écrit."},{t:"Sur un cas clinique à résoudre",ok:!1,why:"On n'attend pas de connaissances techniques de soins : c'est l'objet de la formation."}],tip:"Relis ton dossier avant l'entretien : chaque ligne de ton CV et de ta lettre peut donner lieu à une question."},{id:"d4",theme:"deroule",jury:!1,q:"Quelle pièce du dossier sert à exposer ton projet professionnel ?",opts:[{t:"La lettre de candidature",ok:!0,why:"Le document officiel précise que la lettre de candidature expose le projet professionnel."},{t:"Le curriculum vitae",ok:!1,why:"Le CV présente ton parcours, mais ne développe pas ton projet."},{t:"L'attestation employeur",ok:!1,why:"Elle prouve ton expérience, elle n'explique pas ton projet."},{t:"La copie de la pièce d'identité",ok:!1,why:"Elle sert seulement à t'identifier."}]},{id:"d5",theme:"deroule",jury:!1,q:"L'oral peut-il avoir lieu avant l'épreuve écrite du 9 décembre ?",opts:[{t:"Oui : les entretiens ont lieu du 16 novembre au 8 janvier, et il n'y a pas d'épreuve d'admissibilité",ok:!0,why:"C'est écrit dans le calendrier officiel. Il faut donc être prêt pour l'oral dès mi-novembre."},{t:"Non : il faut d'abord réussir l'écrit",ok:!1,why:"Il n'y a pas d'épreuve d'admissibilité : l'oral peut précéder l'écrit."},{t:"Seulement pour les aides-soignants",ok:!1,why:"Le calendrier est le même pour tous les candidats FPC."},{t:"Seulement si le dossier est incomplet",ok:!1,why:"La date dépend de ta convocation, pas de l'état de ton dossier."}]},{id:"d6",theme:"deroule",jury:!1,q:"Que faut-il obtenir au total pour être admis ?",opts:[{t:"Au moins 20/40, sans note inférieure à 8/20 à l'oral ou à l'écrit",ok:!0,why:"C'est la règle du document officiel. Ensuite, le classement décide de l'IFSI où tu es affecté."},{t:"Au moins 24/40",ok:!1,why:"Le minimum est 20/40."},{t:"Au moins 10/20 à l'oral seulement",ok:!1,why:"L'admission dépend du total oral + écrit."},{t:"Au moins 30/40",ok:!1,why:"Le minimum est 20/40, même si une meilleure note améliore ton classement."}]},{id:"d7",theme:"deroule",jury:!1,q:"Le jury évalue ta façon de t'exprimer. Qu'est-ce que cela veut dire concrètement ?",opts:[{t:"Ordonner tes idées et argumenter de façon cohérente",ok:!0,why:"C'est l'objectif cité par le document officiel : s'exprimer et ordonner ses idées pour argumenter."},{t:"Employer le plus de vocabulaire médical possible",ok:!1,why:"Le jargon n'impressionne pas le jury s'il n'est pas maîtrisé. La clarté compte plus."},{t:"Parler le plus longtemps possible",ok:!1,why:"Des réponses trop longues donnent une impression de manque de structure."},{t:"Réciter une présentation apprise par cœur",ok:!1,why:"Le jury repère vite un texte récité, et cela empêche un vrai échange."}]},{id:"p1",theme:"parcours",jury:!0,q:"Pouvez-vous vous présenter ?",opts:[{t:"Une présentation de 2 à 3 minutes : qui je suis, mon parcours en informatique et ce que j'y ai développé, ce qui a fait naître mon projet, où j'en suis aujourd'hui.",ok:!0,why:"Structurée, courte et orientée vers ton projet : le jury a un fil à suivre et des pistes pour ses questions."},{t:"Je raconte toute ma carrière année par année depuis le lycée.",ok:!1,why:"Trop long et sans fil conducteur : le jury veut comprendre ton projet, pas ta chronologie complète."},{t:"Je donne mon nom, je dis que je veux être infirmier et j'attends les questions.",ok:!1,why:"Trop court : tu laisses passer ta meilleure occasion de montrer ton projet."},{t:"Je commence par ce que je n'aimais pas dans mon ancien travail.",ok:!1,why:"Démarrer sur du négatif donne l'image d'une fuite plutôt que d'un projet."}],tip:"Prépare une trame, pas un texte : quelques mots-clés par étape suffisent."},{id:"p2",theme:"parcours",jury:!0,q:"Pourquoi quitter l'informatique ?",opts:[{t:"J'ai apprécié ce métier, en particulier l'aide aux utilisateurs. Mais je veux un métier tourné vers l'accompagnement des personnes, et ce projet s'est construit progressivement.",ok:!0,why:"Tu valorises ton passé, tu fais le lien avec ton projet et tu montres qu'il est réfléchi."},{t:"L'informatique ne m'intéressait plus, j'en avais assez des écrans.",ok:!1,why:"Cela ressemble à une fuite. Le jury veut savoir vers quoi tu vas, pas ce que tu quittes."},{t:"Le secteur infirmier recrute, c'est plus sûr pour l'emploi.",ok:!1,why:"C'est un argument réel, mais seul il ne montre aucune motivation pour le soin."},{t:"Mon ancien employeur ne reconnaissait pas mon travail.",ok:!1,why:"Critiquer un employeur donne une mauvaise image, quelle que soit la réalité."}]},{id:"p3",theme:"parcours",jury:!0,q:"Que vous apporte votre expérience en collectivité pour ce métier ?",opts:[{t:"L'écoute des agents, l'explication claire à des personnes non spécialistes, le respect des procédures et le travail en équipe. Par exemple… (situation vécue)",ok:!0,why:"Tu identifies des compétences transférables au soin et tu les prouves par un exemple."},{t:"Rien, ce sont deux mondes complètement différents.",ok:!1,why:"Tu te prives d'un atout : ton expérience contient des compétences utiles."},{t:"Je sais réparer les ordinateurs du service.",ok:!1,why:"Compétence technique sans lien avec le soin : ce n'est pas ce que le jury cherche."},{t:"Je maîtrise l'informatique, et le dossier patient est informatisé : c'est l'essentiel du métier.",ok:!1,why:"C'est un plus, mais réduire le métier à l'informatique montre une vision faussée du soin."}],tip:"Prépare 2 ou 3 situations concrètes de ton parcours que tu pourras raconter en 1 minute chacune."},{id:"p4",theme:"parcours",jury:!0,q:"Votre parcours n'a rien à voir avec la santé. Pensez-vous vraiment être à votre place ?",opts:[{t:"Je réponds calmement : je pars de zéro sur les savoirs de soins, c'est le rôle de la formation. J'apporte des compétences transférables et j'ai fait des démarches pour découvrir le métier.",ok:!0,why:"Le jury teste ta réaction à la déstabilisation. Rester posé et argumenter, c'est exactement ce qu'il attend."},{t:"Je me vexe un peu et je réponds que mon parcours vaut bien celui des autres.",ok:!1,why:"Une réaction défensive est mal perçue dans un métier où l'on gère des situations tendues."},{t:"Je reconnais que vous avez sans doute raison.",ok:!1,why:"Tu abandonnes ton projet au premier doute : le jury ne peut pas te suivre."},{t:"Je change de sujet pour parler de mes qualités.",ok:!1,why:"Esquiver la question donne l'impression que tu n'as pas de réponse."}]},{id:"p5",theme:"parcours",jury:!0,q:"Avez-vous été en contact avec le milieu du soin ?",opts:[{t:"J'ai accompagné ma mère lors de ses hospitalisations et j'ai échangé avec les infirmiers libéraux qui la soignaient, avec des infirmiers en réanimation, aux urgences et en médecine, et dans des IFSI. Puis je dis ce que j'en ai retenu.",ok:!0,why:"C'est ton vrai parcours : concret, honnête, et suivi d'une réflexion. C'est ce qui rend ta motivation crédible."},{t:"J'invente un stage pour paraître plus crédible.",ok:!1,why:"Le jury pose des questions de détail : un mensonge se repère vite et ruine l'entretien."},{t:"Non, mais je regarde beaucoup de séries médicales.",ok:!1,why:"Les séries donnent une image déformée du métier."},{t:"Non, je découvrirai le métier en formation.",ok:!1,why:"Le jury veut voir que ton choix est éclairé avant d'entrer en formation."}],tip:"Termine par ce que tu en as retenu sur le métier : c'est ce que le jury cherche derrière cette question."},{id:"p6",theme:"parcours",jury:!0,q:"Je vois que vous êtes électricien en intérim. Pouvez-vous m'expliquer ce passage ?",opts:[{t:"Après mon CDD en mairie, j'ai pris une mission d'intérim sur des chantiers. J'y ai appris la sécurité, la vigilance et le travail en équipe, des réflexes utiles en soins, et cette période a confirmé mon projet.",ok:!0,why:"Tu expliques simplement, tu valorises ce que tu y as appris et tu fais le lien avec ton projet."},{t:"J'évite le sujet et j'espère que le jury passe à autre chose.",ok:!1,why:"Tout ce qui est sur ton CV peut être questionné : prépare-toi."},{t:"C'était juste alimentaire, en attendant autre chose.",ok:!1,why:"Même si c'est en partie vrai, dit comme ça, tu dévalorises ton expérience au lieu de montrer ce qu'elle t'a apporté."},{t:"Je m'excuse longuement d'avoir changé plusieurs fois de domaine.",ok:!1,why:"Pas besoin de t'excuser : explique et valorise."}]},{id:"m1",theme:"motivation",jury:!0,q:"Pourquoi voulez-vous devenir infirmier ?",opts:[{t:"Une motivation personnelle et concrète, appuyée sur une expérience ou des échanges, et reliée à des aspects précis du métier : la relation au patient, les soins, le travail en équipe.",ok:!0,why:"Le jury veut une motivation personnelle, argumentée et ancrée dans la réalité du métier."},{t:"J'aime aider les gens.",ok:!1,why:"Sincère, mais trop vague : beaucoup de métiers permettent d'aider. Pourquoi celui-ci ?"},{t:"Pour la sécurité de l'emploi et le salaire.",ok:!1,why:"Ce ne peut pas être ta motivation principale aux yeux du jury."},{t:"Parce que les études de médecine sont trop longues.",ok:!1,why:"Cela présente le métier d'infirmier comme un choix par défaut : à éviter absolument."}],tip:"C'est LA question à préparer. Construis ta réponse autour d'un déclic, de ce que tu as découvert du métier et de ce qui te correspond."},{id:"m2",theme:"motivation",jury:!0,q:"Pourquoi maintenant ?",opts:[{t:"Mon projet a mûri. Je me suis renseigné et j'ai organisé ma situation, notamment le financement et l'organisation personnelle, pour m'engager dans trois ans de formation.",ok:!0,why:"Tu montres que le moment est choisi et préparé, pas subi."},{t:"J'ai perdu mon emploi, il faut bien que je trouve quelque chose.",ok:!1,why:"Le jury entend un choix par défaut. Même si c'est un déclencheur, mets en avant le projet."},{t:"Je ne sais pas trop, c'est arrivé comme ça.",ok:!1,why:"Cela laisse penser que ton projet n'est pas réfléchi."},{t:"Parce que les inscriptions étaient ouvertes.",ok:!1,why:"Aucun argument sur ton projet."}]},{id:"m3",theme:"motivation",jury:!0,q:"Pourquoi infirmier plutôt qu'aide-soignant ?",opts:[{t:"Je connais la différence de rôle : l'infirmier a un rôle propre, applique les prescriptions médicales et assume des responsabilités d'évaluation et de coordination des soins. C'est ce niveau de responsabilité qui m'attire, et je respecte le rôle de l'aide-soignant.",ok:!0,why:"Tu montres que tu connais les deux métiers et que ton choix est raisonné, sans dénigrer personne."},{t:"Aide-soignant, c'est un métier moins intéressant.",ok:!1,why:"Tu travailleras en binôme avec des aides-soignants : dénigrer leur métier est rédhibitoire."},{t:"Je ne connais pas bien la différence.",ok:!1,why:"Cela montre que tu ne t'es pas renseigné sur le métier."},{t:"Parce que le salaire est plus élevé.",ok:!1,why:"L'argument financier seul ne convainc pas le jury."}]},{id:"m4",theme:"motivation",jury:!0,q:"Pourquoi avoir choisi la voie de la formation professionnelle continue ?",opts:[{t:"Parce que je suis en reconversion avec une expérience professionnelle que je veux valoriser : cette voie est faite pour ce profil.",ok:!0,why:"C'est exactement la raison d'être de la voie FPC selon le document officiel."},{t:"Parce que l'écrit est plus facile que sur Parcoursup.",ok:!1,why:"Choisir par facilité donne une image peu engagée."},{t:"Pour que ma formation soit automatiquement financée.",ok:!1,why:"C'est faux : le document officiel précise que la voie FPC ne garantit pas de prise en charge financière."},{t:"Je ne savais pas qu'il existait une autre voie.",ok:!1,why:"Cela montre un manque de renseignement sur ton propre parcours."}]},{id:"m5",theme:"motivation",jury:!0,q:"Qu'est-ce qui vous attire le plus dans ce métier ?",opts:[{t:"Un aspect précis, expliqué : par exemple accompagner un patient dans la durée ou l'éducation à la santé, et pourquoi cela me correspond.",ok:!0,why:"Une réponse précise et personnelle est bien plus convaincante qu'une liste."},{t:"Tout m'attire dans ce métier.",ok:!1,why:"Trop général : le jury ne sait pas ce qui te motive vraiment."},{t:"Les urgences et l'adrénaline.",ok:!1,why:"C'est une vision réductrice : la majorité des infirmiers ne travaillent pas aux urgences."},{t:"La reconnaissance et le prestige de la blouse blanche.",ok:!1,why:"Le jury cherche une motivation tournée vers le patient, pas vers l'image."}]},{id:"m6",theme:"motivation",jury:!0,q:"Que ferez-vous si vous n'êtes pas retenu cette année ?",opts:[{t:"Je repostulerai en renforçant mon projet, par exemple avec plus d'expérience de terrain. Mon projet est durable.",ok:!0,why:"Tu montres que ton projet ne dépend pas d'une seule tentative."},{t:"J'abandonnerai le projet.",ok:!1,why:"Cela fait douter de la solidité de ta motivation."},{t:"Je ferai autre chose, j'ai plusieurs projets en parallèle.",ok:!1,why:"Le jury peut penser que le soin n'est qu'une option parmi d'autres."},{t:"Ce n'est pas possible, je dois être retenu.",ok:!1,why:"Une réponse trop rigide qui met la pression sur le jury."}]},{id:"k1",theme:"metier",jury:!1,q:"Que désigne le « rôle propre » de l'infirmier ?",opts:[{t:"Les soins que l'infirmier décide et réalise de sa propre initiative, dans son champ de compétences (hygiène, confort, surveillance, prévention…)",ok:!0,why:"On distingue le rôle propre des soins réalisés sur prescription médicale."},{t:"Les soins réalisés uniquement sur prescription médicale",ok:!1,why:"C'est l'autre volet du métier, le rôle prescrit."},{t:"Les tâches administratives du service",ok:!1,why:"Le rôle propre concerne des soins, pas l'administratif."},{t:"Les soins réalisés par l'aide-soignant",ok:!1,why:"L'aide-soignant collabore aux soins relevant du rôle propre infirmier, sous sa responsabilité."}]},{id:"k2",theme:"metier",jury:!1,q:"Quelle affirmation sur le secret professionnel est juste ?",opts:[{t:"Il s'impose à l'infirmier comme à l'étudiant en soins infirmiers, pour tout ce qu'il voit ou apprend sur le patient",ok:!0,why:"Dès ton premier stage, tu seras tenu au secret professionnel."},{t:"Il ne concerne que les médecins",ok:!1,why:"Tous les professionnels de santé y sont soumis."},{t:"On peut parler d'un patient à sa famille si on ne donne pas son nom",ok:!1,why:"Le secret couvre toute information sur le patient, nom ou pas."},{t:"Il ne s'applique pas aux étudiants en stage",ok:!1,why:"Les étudiants y sont soumis aussi."}]},{id:"k3",theme:"metier",jury:!1,q:"Avec qui l'infirmier travaille-t-il au quotidien ?",opts:[{t:"Une équipe pluriprofessionnelle : médecins, aides-soignants, kinésithérapeutes, assistants sociaux… et les proches du patient",ok:!0,why:"Le travail en équipe est au cœur du métier : le jury y sera attentif."},{t:"Seul, il est autonome",ok:!1,why:"L'infirmier a une autonomie, mais il travaille toujours en équipe."},{t:"Uniquement avec les médecins",ok:!1,why:"Vision trop étroite de l'équipe de soins."},{t:"Uniquement avec d'autres infirmiers",ok:!1,why:"L'équipe de soins est pluriprofessionnelle."}]},{id:"k4",theme:"metier",jury:!0,q:"Quelles sont, selon vous, les difficultés du métier ?",opts:[{t:"Des difficultés réelles : horaires décalés et week-ends, charge physique et émotionnelle, confrontation à la souffrance et à la mort, responsabilités. Et comment je compte y faire face.",ok:!0,why:"Tu montres une vision réaliste et tu rassures le jury sur ta capacité à tenir."},{t:"Il n'y en a pas vraiment quand on est motivé.",ok:!1,why:"Une vision idéalisée inquiète le jury : la réalité risque de te décourager."},{t:"Le salaire, essentiellement.",ok:!1,why:"Réponse réductrice qui oublie l'essentiel."},{t:"Les patients difficiles, mais je ne m'en occuperai pas.",ok:!1,why:"Prendre soin de tous les patients fait partie du métier."}]},{id:"k5",theme:"metier",jury:!1,q:"Où un infirmier peut-il exercer ?",opts:[{t:"À l'hôpital, en clinique, en EHPAD, à domicile en libéral, en santé scolaire, en entreprise, en psychiatrie…",ok:!0,why:"Les lieux d'exercice sont très variés. Citer cette diversité montre que tu t'es renseigné."},{t:"Uniquement à l'hôpital",ok:!1,why:"L'hôpital n'est qu'un des lieux d'exercice."},{t:"Uniquement en libéral",ok:!1,why:"Le libéral est une possibilité parmi beaucoup d'autres."},{t:"À l'hôpital et en pharmacie",ok:!1,why:"La pharmacie n'est pas un lieu d'exercice infirmier habituel."}]},{id:"k6",theme:"metier",jury:!1,q:"Quelle démarche est obligatoire pour exercer après le diplôme ?",opts:[{t:"S'inscrire à l'Ordre national des infirmiers",ok:!0,why:"L'inscription à l'Ordre est obligatoire pour exercer la profession."},{t:"Réussir un concours de la fonction publique",ok:!1,why:"Il n'est pas nécessaire pour exercer : on peut travailler en clinique, en libéral, etc."},{t:"Travailler deux ans comme aide-soignant",ok:!1,why:"Aucune obligation de ce type."},{t:"Aucune, le diplôme suffit",ok:!1,why:"L'inscription à l'Ordre est aussi obligatoire."}]},{id:"k7",theme:"metier",jury:!1,q:"Qu'est-ce que l'éducation thérapeutique du patient ?",opts:[{t:"Aider un patient atteint d'une maladie chronique à acquérir des compétences pour gérer sa maladie et son traitement au quotidien",ok:!0,why:"C'est une mission importante de l'infirmier, par exemple auprès des patients diabétiques."},{t:"Former les étudiants infirmiers en stage",ok:!1,why:"C'est le tutorat, pas l'éducation thérapeutique."},{t:"Expliquer une ordonnance une seule fois à la sortie",ok:!1,why:"L'éducation thérapeutique est un accompagnement dans la durée."},{t:"Laisser le patient choisir seul son traitement",ok:!1,why:"Le patient participe aux décisions, mais avec l'équipe soignante."}]},{id:"q1",theme:"qualites",jury:!0,q:"Comment gérez-vous le stress ?",opts:[{t:"Je raconte une situation réelle de stress, ce que j'ai fait concrètement (prioriser, demander de l'aide, rester calme) et ce que j'en ai appris.",ok:!0,why:"Un exemple vécu prouve ta capacité, là où une affirmation ne prouve rien."},{t:"Je ne suis jamais stressé.",ok:!1,why:"Peu crédible, et cela peut traduire un manque de conscience de soi."},{t:"Je gère très bien, ne vous inquiétez pas.",ok:!1,why:"Aucun élément concret pour le démontrer."},{t:"Le stress me paralyse, mais ça passera.",ok:!1,why:"Être honnête est bien, mais il faut montrer comment tu y fais face."}],tip:"Méthode simple pour toutes les questions sur tes qualités : situation, action, résultat, ce que tu en retiens."},{id:"q2",theme:"qualites",jury:!0,q:"Citez-moi une de vos qualités.",opts:[{t:"Une qualité utile au métier, illustrée par un exemple vécu.",ok:!0,why:"Une seule qualité bien prouvée vaut mieux que cinq affirmées."},{t:"J'en liste cinq d'affilée, sans exemple.",ok:!1,why:"Une liste sans preuve ne convainc pas."},{t:"Par modestie, je dis que je n'en ai pas particulièrement.",ok:!1,why:"Le jury attend que tu saches te valoriser."},{t:"Une qualité sans rapport avec le soin, comme la créativité en design.",ok:!1,why:"Choisis une qualité qui sert ton projet."}]},{id:"q3",theme:"qualites",jury:!0,q:"Quel est votre principal défaut ?",opts:[{t:"Un vrai défaut, dont j'ai conscience, et ce que je fais pour progresser.",ok:!0,why:"Le jury évalue ta capacité à te remettre en question, une qualité clé pour un futur soignant."},{t:"Je suis trop perfectionniste.",ok:!1,why:"Un défaut déguisé en qualité : le jury l'a entendu cent fois."},{t:"Je n'en ai pas.",ok:!1,why:"Personne n'y croit, et cela montre un manque de recul."},{t:"Je suis souvent en retard, c'est comme ça.",ok:!1,why:"Un défaut incompatible avec le métier, présenté sans volonté de progresser."}]},{id:"q4",theme:"qualites",jury:!0,q:"Un patient refuse son traitement et s'énerve. Que faites-vous ?",opts:[{t:"Je reste calme, je l'écoute pour comprendre son refus, je lui réexplique simplement, je respecte son droit de refuser et je transmets l'information à l'équipe et au médecin.",ok:!0,why:"Écoute, respect du consentement et travail en équipe : tout ce que le jury attend."},{t:"Je lui donne quand même, c'est pour son bien.",ok:!1,why:"Le patient a le droit de refuser un soin : on ne le force pas."},{t:"Je le laisse tranquille et je n'en parle à personne.",ok:!1,why:"Il faut transmettre l'information : l'équipe et le médecin doivent savoir."},{t:"Je lui dis qu'il sortira de l'hôpital s'il ne le prend pas.",ok:!1,why:"Une menace est contraire à l'éthique du soin."}]},{id:"q5",theme:"qualites",jury:!0,q:"Comment réagiriez-vous face au décès d'un patient ?",opts:[{t:"Je reconnais que ce sera difficile. J'en parlerais avec l'équipe et je resterais présent pour les proches.",ok:!0,why:"Une réponse lucide et humaine, qui montre que tu sais t'appuyer sur l'équipe."},{t:"Ça ne me touchera pas.",ok:!1,why:"Peu crédible, et cela inquiète sur ta capacité d'empathie."},{t:"Je pense que je quitterais le service.",ok:!1,why:"Cela fait douter de ta capacité à exercer ce métier."},{t:"Je n'y ai jamais pensé.",ok:!1,why:"C'est une réalité du métier : le jury attend que tu y aies réfléchi."}]},{id:"q6",theme:"qualites",jury:!0,q:"Vous constatez qu'un collègue s'est trompé dans un soin. Que faites-vous ?",opts:[{t:"La sécurité du patient passe d'abord : j'en parle à mon collègue et l'erreur est signalée selon les procédures du service, sans chercher de coupable.",ok:!0,why:"Tu places la sécurité du patient en priorité, dans le respect de l'équipe."},{t:"Je ne dis rien pour éviter un conflit.",ok:!1,why:"Taire une erreur peut mettre le patient en danger."},{t:"Je le dénonce à la direction sans lui en parler.",ok:!1,why:"Tu ignores le dialogue et l'esprit d'équipe."},{t:"Je corrige moi-même sans rien dire.",ok:!1,why:"L'erreur doit être connue pour surveiller le patient et éviter qu'elle se reproduise."}]},{id:"q7",theme:"qualites",jury:!1,q:"Laquelle de ces attitudes montre une écoute active ?",opts:[{t:"Reformuler ce que dit la personne, poser des questions ouvertes, accepter les silences",ok:!0,why:"Ce sont les techniques de base de l'écoute active, utiles avec les patients… et devant le jury."},{t:"Proposer rapidement une solution",ok:!1,why:"Cela coupe souvent la personne avant qu'elle ait tout dit."},{t:"Finir les phrases de la personne pour gagner du temps",ok:!1,why:"C'est l'inverse de l'écoute."},{t:"Hocher la tête en préparant sa réponse",ok:!1,why:"On fait semblant d'écouter, ce que la personne ressent vite."}]},{id:"f1",theme:"formation",jury:!0,q:"Comment allez-vous vous organiser pour les cours et les stages ?",opts:[{t:"J'ai anticipé : organisation personnelle et familiale, transports vers les lieux de stage, financement, et du temps de travail personnel chaque semaine.",ok:!0,why:"Tu montres que tu mesures l'investissement demandé et que tu t'y es préparé."},{t:"Je verrai le moment venu.",ok:!1,why:"Le jury veut un projet réfléchi, organisation comprise."},{t:"Je garderai mon emploi à temps plein en parallèle.",ok:!1,why:"Irréaliste avec les cours et les stages à temps plein : cela inquiète le jury."},{t:"Les stages, ce sera facile, je connais déjà le monde du travail.",ok:!1,why:"Les stages sont exigeants et évalués : il ne faut pas les sous-estimer."}]},{id:"f2",theme:"formation",jury:!1,q:"Comment la formation en soins infirmiers est-elle organisée ?",opts:[{t:"Trois ans qui alternent enseignements théoriques et stages en milieu de soins, et qui mènent au diplôme d'État",ok:!0,why:"Connaître le rythme de la formation montre que tu sais dans quoi tu t'engages."},{t:"Deux ans de cours, sans stage",ok:!1,why:"La formation dure trois ans et les stages en sont une part essentielle."},{t:"Un an en alternance dans un hôpital",ok:!1,why:"La formation dure trois ans."},{t:"Trois ans de stages, sans cours",ok:!1,why:"Les enseignements théoriques sont indispensables."}]},{id:"f3",theme:"formation",jury:!0,q:"Comment comptez-vous financer votre formation ?",opts:[{t:"Je me suis renseigné sur les possibilités, comme la prise en charge régionale selon des critères, un employeur ou un organisme, ou l'autofinancement. Voici ma piste principale et mon plan B.",ok:!0,why:"Tu montres que ton projet est concret jusque dans son financement."},{t:"La voie FPC me garantit le financement.",ok:!1,why:"Faux : le document officiel distingue la voie d'accès et le financement."},{t:"Je n'y ai pas encore réfléchi.",ok:!1,why:"Une formation de trois ans sans financement prévu inquiète le jury."},{t:"Je verrai après la sélection.",ok:!1,why:"Mieux vaut avoir des pistes dès l'entretien."}],tip:"Demande à l'IFSI de Longjumeau les critères de la prise en charge régionale avant ton oral."},{id:"f4",theme:"formation",jury:!0,q:"Comment réagirez-vous face à une difficulté, par exemple une mauvaise note ?",opts:[{t:"J'analyse mes erreurs, je demande de l'aide aux formateurs ou à d'autres étudiants et j'ajuste ma méthode de travail.",ok:!0,why:"Tu montres que tu sais rebondir et utiliser les ressources de la formation."},{t:"Si c'est trop dur, j'arrêterai.",ok:!1,why:"Cela fait douter de ta persévérance."},{t:"Ce sera sûrement la faute du formateur.",ok:!1,why:"Rejeter la faute sur les autres est mal perçu."},{t:"Je n'aurai pas de difficultés.",ok:!1,why:"Excès de confiance : tout étudiant rencontre des difficultés."}]},{id:"f5",theme:"formation",jury:!0,q:"Reprendre des études après plusieurs années, ça ne vous fait pas peur ?",opts:[{t:"J'ai conscience du rythme et je m'y prépare déjà, avec une méthode de travail et des révisions régulières. Mon expérience m'apporte aussi organisation et maturité.",ok:!0,why:"Lucidité et preuves concrètes : la préparation de la sélection est déjà une preuve."},{t:"Non, je n'ai jamais eu de difficulté à l'école.",ok:!1,why:"Le jury attend que tu mesures l'effort, pas que tu le nies."},{t:"Si, beaucoup. Je ne sais pas si j'y arriverai.",ok:!1,why:"L'honnêteté est bonne, mais il faut montrer comment tu vas y faire face."},{t:"Je réviserai seulement avant les examens.",ok:!1,why:"La formation demande un travail régulier."}]},{id:"f6",theme:"formation",jury:!0,q:"Que savez-vous de l'institut où vous souhaitez entrer ?",opts:[{t:"Des éléments concrets : son groupement universitaire, la date de rentrée, et ce que j'ai appris en le visitant ou en échangeant avec des étudiants.",ok:!0,why:"Tu montres un vrai intérêt et une démarche active."},{t:"Rien de particulier, les instituts se ressemblent tous.",ok:!1,why:"Cela montre un manque de préparation."},{t:"C'est le plus proche de chez moi, c'est tout.",ok:!1,why:"Un argument pratique, mais insuffisant seul."},{t:"J'en ai vaguement entendu parler sur internet.",ok:!1,why:"Trop vague pour convaincre."}],tip:"Pour Longjumeau : IFSI du Groupe Hospitalier Nord Essonne, groupement Université Paris-Saclay, rentrée en septembre 2027."},{id:"f7",theme:"formation",jury:!1,q:"Pendant les stages, l'étudiant en soins infirmiers…",opts:[{t:"réalise progressivement des soins sous la responsabilité de professionnels, et ses compétences sont évaluées",ok:!0,why:"Les stages sont un lieu d'apprentissage encadré et évalué."},{t:"observe seulement, sans réaliser de soins",ok:!1,why:"L'étudiant participe aux soins, de façon progressive."},{t:"travaille seul, comme un infirmier diplômé",ok:!1,why:"Il est toujours encadré par des professionnels."},{t:"choisit librement ses horaires",ok:!1,why:"Il suit les horaires du service, y compris parfois en soirée ou le week-end."}]},{id:"cm1",theme:"contenu",jury:!0,q:"« Que savez-vous de la formation ? » Quelle réponse est la mieux construite ?",opts:[{t:"C'est un diplôme d'État en 3 ans, 180 ECTS, avec le grade licence. Elle alterne cours et stages, avec 66 semaines de stage dans des lieux variés. Pour moi, cela demande une vraie organisation, et je m'y suis préparé.",ok:!0,why:"Le cadre, puis l’organisation, puis le lien avec toi : clair, chiffré et personnel."},{t:"C'est une formation difficile, il paraît qu'il y a beaucoup d'abandons.",ok:!1,why:"Négatif et sans contenu : tu ne montres pas ce que tu sais."},{t:"On apprend à faire des piqûres et des pansements.",ok:!1,why:"Réducteur : la formation porte aussi sur le raisonnement clinique, la relation et la prévention."},{t:"Je ne me suis pas encore renseigné, je verrai à la rentrée.",ok:!1,why:"Le jury attend que tu te sois renseigné avant l’oral."}],tip:"Retiens la structure : le cadre → l’organisation → ce que ça implique pour toi."},{id:"c1",theme:"contenu",jury:!1,q:"À quoi mène la formation en soins infirmiers ?",opts:[{t:"Au diplôme d'État d'infirmier, en 6 semestres et 180 crédits ECTS, qui confère le grade de licence",ok:!0,why:"3 ans, 6 semestres de 30 ECTS chacun, soit 180 ECTS : le DE donne le grade licence (niveau 6)."},{t:"À un BTS en 2 ans",ok:!1,why:"Ce n'est pas un BTS : c'est un diplôme d'État en 3 ans, avec le grade licence."},{t:"À un master en 5 ans",ok:!1,why:"Le DE confère le grade licence. Le master vient ensuite (IPA, cadre, spécialisations)."},{t:"À un certificat d'école sans valeur nationale",ok:!1,why:"C'est un diplôme d'État, reconnu partout en France."}],tip:"Phrase à placer : « un diplôme d’État en 3 ans, 180 ECTS, avec le grade licence »."},{id:"c2",theme:"contenu",jury:!1,q:"Si tu entres en septembre 2027, quel référentiel de formation suivras-tu ?",opts:[{t:"Le nouveau référentiel fixé par l'arrêté du 20 février 2026, applicable aux étudiants qui entrent en formation à partir de septembre 2026",ok:!0,why:"L'arrêté du 20 février 2026 remplace celui du 31 juillet 2009 pour les promotions entrées depuis septembre 2026. Ce sera donc ton référentiel."},{t:"Le référentiel du 31 juillet 2009, sans changement",ok:!1,why:"Il ne concerne plus que les étudiants entrés avant septembre 2026. Beaucoup de sites d'IFSI le présentent encore."},{t:"Un référentiel propre à chaque IFSI",ok:!1,why:"Le programme est national : le même pour tous les IFSI."},{t:"Aucun : chaque formateur choisit ce qu'il enseigne",ok:!1,why:"La formation suit un référentiel national fixé par arrêté."}],tip:"Atout à l'oral : « J'ai vu que le site présente le référentiel de 2009, mais ma promotion suivra celui de 2026. » Dis-le avec modestie, sans corriger le jury."},{id:"c3",theme:"contenu",jury:!1,q:"Quel est le volume de la formation dans le référentiel 2026 ?",opts:[{t:"4 620 heures : 2 310 h de stage (66 semaines), 1 890 h d'enseignement et 420 h de travail en autonomie",ok:!0,why:"C'est ce que fixe l'arrêté du 20 février 2026. La part des stages augmente : 66 semaines au lieu de 60."},{t:"4 200 heures : 2 100 h de théorie et 2 100 h de stage, plus 900 h de travail personnel",ok:!1,why:"C'est le référentiel de 2009, celui décrit sur le site de l'IFSI. Bon à connaître, mais ta promotion suivra celui de 2026."},{t:"1 000 heures, surtout en ligne",ok:!1,why:"Beaucoup trop peu : la formation est à temps plein sur 3 ans."},{t:"Uniquement des stages, sans cours",ok:!1,why:"La formation alterne toujours cours et stages."}],tip:"Si tu hésites le jour J, dis simplement : « environ la moitié du temps en stage, sur 3 ans, à 35 h par semaine »."},{id:"c4",theme:"contenu",jury:!1,q:"Le référentiel de 2009 (décrit sur le site de Longjumeau) compte 10 compétences. Laquelle fait partie des 5 compétences « cœur de métier » ?",opts:[{t:"Évaluer une situation clinique et établir un diagnostic dans le domaine infirmier",ok:!0,why:"C'est la compétence 1. Les autres « cœur de métier » : projet de soins, soins du quotidien, actions diagnostiques et thérapeutiques, soins éducatifs et préventifs."},{t:"Gérer le budget du service",ok:!1,why:"Ce n'est pas une compétence du référentiel infirmier."},{t:"Prescrire tous les médicaments",ok:!1,why:"L'infirmier ne prescrit qu'une liste limitée de produits et d'examens."},{t:"Réaliser des interventions chirurgicales",ok:!1,why:"Cela relève du chirurgien."}]},{id:"c5",theme:"contenu",jury:!1,q:"Laquelle de ces compétences est une compétence « transverse » du référentiel de 2009 ?",opts:[{t:"Communiquer et conduire une relation dans un contexte de soins",ok:!0,why:"Les 5 transverses : communiquer et conduire une relation, analyser la qualité des soins, rechercher et traiter des données, organiser et coordonner, informer et former."},{t:"Accompagner une personne dans les soins du quotidien",ok:!1,why:"C'est une compétence « cœur de métier »."},{t:"Concevoir et conduire un projet de soins infirmiers",ok:!1,why:"C'est une compétence « cœur de métier »."},{t:"Établir un diagnostic médical",ok:!1,why:"Le diagnostic médical relève du médecin. L'infirmier pose un diagnostic infirmier."}],tip:"Ton atout : en informatique, tu as déjà formé des utilisateurs, rédigé des procédures et coordonné des interventions. Ce sont des compétences transverses."},{id:"c6",theme:"contenu",jury:!1,q:"Le référentiel 2026 organise les enseignements en 5 domaines. Lequel en fait partie ?",opts:[{t:"Communication, travail en équipe et leadership",ok:!0,why:"Les 5 domaines : sciences infirmières et raisonnement clinique ; pratiques cliniques, qualité et gestion des risques ; prévention et promotion de la santé ; communication, travail en équipe et leadership ; démarche scientifique et recherche."},{t:"Gestion financière de l'hôpital",ok:!1,why:"Ce n'est pas un domaine de la formation infirmière."},{t:"Chirurgie et anesthésie",ok:!1,why:"Ce sont des spécialités médicales."},{t:"Droit pénal et procédure",ok:!1,why:"Le droit est abordé (responsabilité, éthique), mais ce n'est pas un domaine du référentiel."}],tip:"Retiens au moins le premier : « raisonnement clinique ». C’est le fil rouge de la réforme."},{id:"c7",theme:"contenu",jury:!1,q:"Qui délivre désormais le diplôme d’État d’infirmier ?",opts:[{t:"Les universités accréditées, sur proposition d’un jury : c’est l’universitarisation de la formation",ok:!0,why:"Avec le référentiel 2026, le diplôme est délivré par les universités. À Longjumeau, une partie des cours a lieu à l'Université Paris-Saclay (site du Kremlin-Bicêtre)."},{t:"L'hôpital où l'étudiant a fait le plus de stages",ok:!1,why:"Les lieux de stage évaluent, mais ne délivrent pas le diplôme."},{t:"L'Ordre national des infirmiers",ok:!1,why:"L'Ordre inscrit les infirmiers diplômés, mais ne délivre pas le diplôme."},{t:"Une école privée",ok:!1,why:"C'est un diplôme d'État délivré par les universités."}]},{id:"c8",theme:"contenu",jury:!1,q:"Où se déroulent les stages pendant la formation ?",opts:[{t:"À l'hôpital (public ou privé) et hors de l'hôpital : libéral, centres de santé, médico-social, santé scolaire, psychiatrie…",ok:!0,why:"Les stages couvrent des lieux variés pour découvrir l'aigu, le chronique, les soins primaires et les personnes vulnérables."},{t:"Uniquement aux urgences",ok:!1,why:"Les stages sont variés, pas seulement aux urgences."},{t:"Uniquement dans l'hôpital rattaché à l'IFSI",ok:!1,why:"Les stages ont lieu dans de nombreuses structures, à l'hôpital et en dehors."},{t:"Seulement en 3e année",ok:!1,why:"Il y a des stages chaque année, dès la 1re année."}]},{id:"c9",theme:"contenu",jury:!1,q:"Que signifie former un « praticien réflexif » ?",opts:[{t:"Un professionnel qui analyse sa pratique pour comprendre ce qu'il fait et l'améliorer",ok:!0,why:"La formation vise un praticien autonome, responsable et réflexif : on analyse ses situations de stage pour progresser."},{t:"Un professionnel qui réagit très vite, par réflexe",ok:!1,why:"Réflexif vient de « réflexion », pas de « réflexe »."},{t:"Un professionnel qui applique les consignes sans les questionner",ok:!1,why:"C'est l'inverse : on attend une analyse de sa pratique."},{t:"Un professionnel spécialisé dans la rééducation",ok:!1,why:"Ce n'est pas le sens du mot."}],tip:"Exemple à donner : en informatique, après un incident, tu faisais un retour d'expérience pour éviter qu'il se reproduise. C'est déjà une démarche réflexive."},{id:"c10",theme:"contenu",jury:!0,q:"Selon vous, pourquoi la formation alterne-t-elle cours et stages ?",opts:[{t:"Parce que les cours donnent les connaissances et le raisonnement, et les stages permettent de les mettre en pratique auprès de vrais patients, puis d'analyser ce qu'on a vécu. Les deux se nourrissent.",ok:!0,why:"Tu montres que tu as compris la logique de la formation : apprendre, pratiquer, analyser."},{t:"Pour que les étudiants servent de renfort dans les services.",ok:!1,why:"Le stage est un temps d'apprentissage, pas de main-d'œuvre."},{t:"Pour que les cours soient moins longs.",ok:!1,why:"Réponse superficielle, qui ne montre pas la logique pédagogique."},{t:"Je ne sais pas, c'est comme ça.",ok:!1,why:"Le jury attend une réflexion sur la formation."}]},{id:"c11",theme:"contenu",jury:!0,q:"À l'IFSI, chaque étudiant a un suivi individuel par un formateur. Comment comptez-vous l'utiliser ?",opts:[{t:"Comme un appui régulier : faire le point sur mes stages et mes résultats, repérer tôt mes difficultés et construire mon parcours, surtout pour la reprise d'études.",ok:!0,why:"Tu montres que tu sais demander de l’aide et que tu anticipes, ce que le jury apprécie chez un candidat en reconversion."},{t:"Je ne pense pas en avoir besoin, je suis autonome.",ok:!1,why:"L'autonomie, c'est aussi savoir s'appuyer sur les ressources."},{t:"Seulement si j'ai une très mauvaise note.",ok:!1,why:"Le suivi est utile tout au long de la formation, pas seulement en cas d’échec."},{t:"Pour qu’il fasse mes travaux à ma place.",ok:!1,why:"Le formateur accompagne, il ne fait pas à la place."}]},{id:"c12",theme:"contenu",jury:!1,q:"Quelle condition faut-il remplir, en plus de valider les 6 semestres, pour obtenir le diplôme (référentiel 2026) ?",opts:[{t:"Avoir l'attestation de formation aux gestes et soins d'urgence de niveau 2 (AFGSU 2)",ok:!0,why:"L'AFGSU 2 fait partie des conditions de délivrance du diplôme."},{t:"Avoir le permis de conduire",ok:!1,why:"Ce n'est pas une condition du diplôme."},{t:"Avoir travaillé 5 ans à l’hôpital",ok:!1,why:"Aucune expérience n'est exigée pour obtenir le diplôme."},{t:"Réussir un concours national en fin de 3e année",ok:!1,why:"Il n’y a pas de concours final : on valide des semestres et des compétences."}]},{id:"c13",theme:"contenu",jury:!1,q:"Pour passer en 2e année, que faut-il valider (référentiel 2026) ?",opts:[{t:"Les deux semestres de l’année, ou au moins 51 crédits sur 60",ok:!0,why:"C'est la règle de passage fixée par l'arrêté du 20 février 2026."},{t:"Seulement les stages",ok:!1,why:"Les enseignements théoriques comptent aussi."},{t:"Rien : le passage est automatique",ok:!1,why:"Il faut valider des crédits ECTS."},{t:"Un examen oral unique en juin",ok:!1,why:"L’évaluation se fait par contrôle continu et/ou examens terminaux, et par la validation des stages."}]},{id:"c14",theme:"contenu",jury:!1,q:"Pour un étudiant en promotion professionnelle financé par son employeur, combien de semaines de stage peut-il faire chez cet employeur au maximum ?",opts:[{t:"33 semaines",ok:!0,why:"L'arrêté de 2026 limite à 33 semaines les stages chez l'employeur qui finance (hors apprentis), pour garantir la diversité des stages."},{t:"Toutes les 66 semaines",ok:!1,why:"Il faut aussi découvrir d’autres lieux de soins."},{t:"Aucune",ok:!1,why:"Une partie des stages peut avoir lieu chez l’employeur."},{t:"5 semaines",ok:!1,why:"La limite est plus haute : 33 semaines."}],tip:"Utile si ta formation est financée par un employeur : cela montre que tu connais les règles de la voie FPC."},{id:"c15",theme:"contenu",jury:!0,q:"Pouvez-vous bénéficier de dispenses dans la formation ?",opts:[{t:"Des dispenses sont possibles selon les diplômes, certifications et le parcours professionnel, après étude du dossier. Je me suis renseigné : dans mon cas, je pense suivre le cursus complet, ce qui me convient pour bien reprendre les bases.",ok:!0,why:"Tu montres que tu connais le dispositif et que tu l'appliques honnêtement à ta situation."},{t:"Oui, mon expérience en informatique me dispense de la 1re année.",ok:!1,why:"Une expérience hors santé ne donne pas de dispense automatique."},{t:"Je n'en ai aucune idée.",ok:!1,why:"Le jury attend que tu te sois renseigné."},{t:"Non, personne ne peut en avoir.",ok:!1,why:"Faux : des dispenses existent (par exemple pour certains aides-soignants, qui peuvent entrer en 2e année sous conditions)."}],tip:"Adapte la réponse si tu as un diplôme ou une expérience de soin. Les aides-soignants avec 3 ans d'expérience sur les 5 dernières années peuvent, sous conditions, intégrer la 2e année."},{id:"am1",theme:"actu",jury:!1,q:"Dans quel ordre présenter une actualité au jury ?",opts:[{t:"Les faits → les enjeux → le lien avec le rôle infirmier → ton avis nuancé",ok:!0,why:"Tu montres que tu connais le sujet, que tu le comprends et que tu le relies à ton futur métier."},{t:"Ton avis d’abord, les faits seulement si le jury les demande",ok:!1,why:"Sans les faits, ton avis n’a pas de base."},{t:"Le plus de chiffres possible, sans commentaire",ok:!1,why:"Une liste de chiffres ne montre pas ta réflexion."},{t:"Ce que tu as lu sur les réseaux sociaux",ok:!1,why:"Appuie-toi sur des sources fiables : presse, ministère de la Santé, Ordre infirmier."}],tip:"En 1 minute environ : 2 phrases de faits, 1 phrase d’enjeux, 1 phrase sur le rôle infirmier, 1 phrase d’avis."},{id:"a1",theme:"actu",jury:!1,q:"Que permet la loi sur la profession d’infirmier du 27 juin 2025 ?",opts:[{t:"Elle reconnaît la consultation infirmière, le diagnostic infirmier et un droit de prescription encadré",ok:!0,why:"La loi n° 2025-581 modifie le Code de la santé publique : l'infirmier effectue des consultations, pose un diagnostic infirmier et prescrit certains produits et examens."},{t:"Elle permet aux infirmiers de prescrire tous les médicaments",ok:!1,why:"La prescription est limitée à une liste fixée par arrêté."},{t:"Elle supprime le diplôme d’État",ok:!1,why:"Le DE existe toujours."},{t:"Elle réserve la profession aux titulaires d’un master",ok:!1,why:"Le DE (grade licence) reste le diplôme d’accès."}],tip:"C’est LA réforme du métier : elle est entrée en application concrète à l’été 2026."},{id:"a2",theme:"actu",jury:!1,q:"Depuis fin juin 2026, que peut prescrire un infirmier (liste fixée par arrêté) ?",opts:[{t:"Par exemple des substituts nicotiniques, certains vaccins, des pansements et dispositifs pour les plaies, des antalgiques de palier 1",ok:!0,why:"Les arrêtés du 26 juin 2026 fixent la liste. Elle inclut aussi le renouvellement de contraceptifs oraux (6 mois) et certains examens de biologie. Elle sera révisée au moins tous les 3 ans."},{t:"Des morphiniques, sans limite",ok:!1,why:"Les antalgiques autorisés sont de palier 1 (comme le paracétamol)."},{t:"Tous les médicaments",ok:!1,why:"La prescription infirmière est encadrée par une liste."},{t:"Aucun produit de santé",ok:!1,why:"Le droit de prescription existe et a été élargi."}]},{id:"a3",theme:"actu",jury:!1,q:"Qu’est-ce que le PLFSS ?",opts:[{t:"Le projet de loi de financement de la Sécurité sociale, examiné chaque automne, qui fixe notamment l’ONDAM",ok:!0,why:"Le PLFSS fixe chaque année les recettes, les dépenses et l'objectif national de dépenses d'assurance maladie (ONDAM)."},{t:"Un plan de lutte contre les fraudes sociales",ok:!1,why:"Ce n'est pas le sens du sigle."},{t:"Le programme de la formation en soins infirmiers",ok:!1,why:"Aucun rapport : c'est le budget de la Sécu."},{t:"Une prime versée aux soignants",ok:!1,why:"C'est une loi de financement."}]},{id:"a4",theme:"actu",jury:!1,q:"Où en est le budget 2027 de la Sécurité sociale (PLFSS 2027) mi-novembre 2026 ?",opts:[{t:"Rejeté par l'Assemblée nationale en première lecture, puis adopté par le Sénat le 18 novembre 2026 ; une commission mixte paritaire doit suivre",ok:!0,why:"Le texte prévoit un ONDAM en hausse de 2 % et vise un déficit de 12,7 Md€ en 2027 (contre 21,8 Md€ en 2026)."},{t:"Définitivement adopté début octobre",ok:!1,why:"Le débat parlementaire était toujours en cours mi-novembre."},{t:"Abandonné par le gouvernement",ok:!1,why:"Le texte a été examiné par les deux assemblées."},{t:"Remplacé par un référendum",ok:!1,why:"Le budget de la Sécurité sociale est voté par le Parlement."}],tip:"Ça bouge vite : regarde les dernières infos la veille de ton oral (CMP, nouvelle lecture…)."},{id:"a5",theme:"actu",jury:!1,q:"Que signifie le sigle ONDAM ?",opts:[{t:"Objectif national de dépenses d'assurance maladie",ok:!0,why:"C'est le plafond de dépenses de santé voté chaque année. Pour 2027, le projet prévoit +2 %."},{t:"Office national des droits des malades",ok:!1,why:"Ce n'est pas le bon sigle."},{t:"Ordre national des aides médicaux",ok:!1,why:"Ce n'est pas le bon sigle."},{t:"Organisation nationale des dispensaires et maternités",ok:!1,why:"Ce n'est pas le bon sigle."}],tip:"Un ONDAM qui progresse moins vite que les besoins, cela veut dire des hôpitaux sous tension : un lien utile avec le quotidien des soignants."},{id:"a6",theme:"actu",jury:!1,q:"Quelle affirmation sur la loi relative à l’aide à mourir est exacte ?",opts:[{t:"Adoptée définitivement en juillet 2026, validée avec réserves par le Conseil constitutionnel, elle a été publiée au Journal officiel en août 2026 ; ses décrets d'application sont attendus",ok:!0,why:"Elle concerne des adultes atteints d'une maladie grave et incurable, en phase avancée ou terminale, avec une souffrance réfractaire ou insupportable, capables d'une volonté libre et éclairée."},{t:"Elle a été rejetée par le Parlement",ok:!1,why:"Elle a été adoptée définitivement le 15 juillet 2026."},{t:"Elle s’applique aux mineurs",ok:!1,why:"Il faut être majeur."},{t:"Une souffrance psychologique seule suffit",ok:!1,why:"Non : il faut une maladie grave et incurable engageant le pronostic vital."}]},{id:"a7",theme:"actu",jury:!1,q:"Dans l'aide à mourir, quel est le principe pour le geste final ?",opts:[{t:"La personne s'administre elle-même la substance ; un médecin ou un infirmier n'intervient que si elle ne peut pas le faire physiquement",ok:!0,why:"C'est le principe d'autoadministration. Les soignants disposent d'une clause de conscience."},{t:"Le geste est toujours réalisé par un infirmier",ok:!1,why:"L'intervention d'un soignant est l'exception, pas la règle."},{t:"La famille décide à la place du patient",ok:!1,why:"La demande doit venir de la personne elle-même, libre et éclairée."},{t:"Le geste peut être fait sans avis médical",ok:!1,why:"La procédure est encadrée par des médecins."}]},{id:"a8",theme:"actu",jury:!0,q:"Que pensez-vous de la loi sur l’aide à mourir ?",opts:[{t:"Je présente les faits (texte adopté en 2026, conditions strictes), je dis que c'est un sujet éthique sensible, et que pour moi le rôle infirmier reste d'écouter, de soulager et d'accompagner, en lien avec les soins palliatifs, dans le respect de la volonté du patient et de la loi.",ok:!0,why:"Le jury ne note pas ton opinion : il évalue ta connaissance, ta nuance et ta posture professionnelle."},{t:"C'est une très mauvaise loi, je refuserai toujours d'en parler.",ok:!1,why:"Trop tranché et fermé : le jury attend de la nuance et de l'écoute."},{t:"Je n'ai pas d'avis, ça ne me concerne pas.",ok:!1,why:"Ça concerne directement les infirmiers : cela montre un manque d'intérêt."},{t:"C'est une excellente loi, il faut l'étendre à tout le monde.",ok:!1,why:"Trop militant : reste factuel et nuancé."}],tip:"Sur les sujets éthiques : faits → enjeux (autonomie, protection des personnes vulnérables) → rôle infirmier → ton avis, en une phrase, nuancé."},{id:"a9",theme:"actu",jury:!1,q:"Quelle « grande cause nationale » a été lancée en 2025 et prolongée en 2026 ?",opts:[{t:"La santé mentale",ok:!0,why:"Le gouvernement l'a prolongée en 2026, notamment face à la dégradation de la santé mentale des jeunes."},{t:"La lutte contre le tabac",ok:!1,why:"Ce n'est pas la grande cause nationale de 2025-2026."},{t:"Le sport à l’école",ok:!1,why:"Ce n'est pas la grande cause nationale de 2025-2026."},{t:"La sécurité routière",ok:!1,why:"Ce n'est pas la grande cause nationale de 2025-2026."}]},{id:"a10",theme:"actu",jury:!1,q:"Parmi ces mesures annoncées en 2026 pour la santé mentale, laquelle est exacte ?",opts:[{t:"Un objectif de « zéro contention » en psychiatrie à l'horizon 2030, avec formation des équipes à la désescalade",ok:!0,why:"Annoncé en juin 2026, avec aussi l’objectif « aucun élève en souffrance psychique sans solution » et un rendez-vous rapide (48 h si besoin)."},{t:"La fermeture des Maisons des adolescents",ok:!1,why:"C'est l'inverse : elles doivent être renforcées."},{t:"La fin du remboursement des séances de psychologue",ok:!1,why:"Le dispositif Mon soutien psy continue (près de 1,8 million de bénéficiaires)."},{t:"La suppression de la psychiatrie publique",ok:!1,why:"Aucune annonce de ce type."}]},{id:"a11",theme:"actu",jury:!1,q:"Qu'est-ce que « Mon soutien psy » ?",opts:[{t:"Un dispositif de séances avec un psychologue remboursées par l’Assurance maladie",ok:!0,why:"Il permet d'accéder à des séances chez un psychologue partenaire, remboursées, pour les troubles d'intensité légère à modérée."},{t:"Une application de méditation payante",ok:!1,why:"C'est un dispositif de remboursement."},{t:"Un numéro d'urgence psychiatrique",ok:!1,why:"Le numéro national de prévention du suicide est le 3114."},{t:"Une hospitalisation sans consentement",ok:!1,why:"Aucun rapport."}],tip:"À connaître aussi : le 3114, numéro national de prévention du suicide (24 h/24)."},{id:"a12",theme:"actu",jury:!1,q:"Campagne grippe et Covid 2026-2027 : quelle affirmation est juste ?",opts:[{t:"Elle a commencé le 13 octobre 2026 ; les deux vaccins peuvent être faits le même jour, et les infirmiers peuvent vacciner",ok:!0,why:"Elle cible les 65 ans et plus, les malades chroniques, les femmes enceintes, l'entourage et les soignants. Une obligation de vaccination antigrippale des soignants est en préparation."},{t:"Seuls les médecins peuvent vacciner",ok:!1,why:"Infirmiers, pharmaciens et sages-femmes vaccinent aussi."},{t:"La vaccination est réservée aux enfants",ok:!1,why:"Elle cible surtout les personnes à risque de forme grave."},{t:"Il faut attendre 3 mois entre les deux vaccins",ok:!1,why:"Ils peuvent être administrés lors de la même séance."}]},{id:"a13",theme:"actu",jury:!1,q:"Qu'est-ce qu'un Médicobus ?",opts:[{t:"Un cabinet médical itinérant qui va dans les territoires manquant de médecins",ok:!0,why:"En novembre 2026, une deuxième vague a été annoncée pour atteindre 100 cabinets itinérants. C'est une réponse aux déserts médicaux."},{t:"Une ambulance de réanimation",ok:!1,why:"C'est un cabinet de consultation mobile, pas un véhicule d'urgence."},{t:"Un bus qui transporte les patients à l’hôpital",ok:!1,why:"C'est le soignant qui vient au patient."},{t:"Une application de téléconsultation",ok:!1,why:"C'est un véhicule aménagé, présent physiquement."}],tip:"Lien avec ton futur métier : face aux déserts médicaux, l'infirmier (consultation, prescription, libéral) devient un acteur de l'accès aux soins."},{id:"a14",theme:"actu",jury:!1,q:"Qu'est-ce que l'APA ?",opts:[{t:"L'allocation personnalisée d'autonomie, versée par le département aux personnes de 60 ans et plus en perte d'autonomie",ok:!0,why:"Elle finance l'aide à domicile ou une partie du tarif dépendance en EHPAD. Le PLFSS 2027 prévoit de transférer 300 M€ aux départements pour l'APA et la PCH."},{t:"L'aide personnalisée au logement",ok:!1,why:"C'est l'APL."},{t:"Une allocation pour les étudiants",ok:!1,why:"Elle concerne les personnes âgées en perte d'autonomie."},{t:"Une aide pour les personnes handicapées de moins de 20 ans",ok:!1,why:"C'est l'AEEH. Pour les adultes handicapés, c'est la PCH."}],tip:"Le vieillissement de la population est un enjeu majeur : maintien à domicile, EHPAD, besoin croissant d’infirmiers."},{id:"a15",theme:"actu",jury:!0,q:"Quelle actualité dans le domaine de la santé vous a marqué récemment ?",opts:[{t:"Je choisis un sujet précis (par exemple la loi infirmière), je donne les faits en 2 ou 3 phrases, j'explique ce qu'il change pour les infirmiers et les patients, puis ce que j'en pense.",ok:!0,why:"Un sujet maîtrisé et relié au métier vaut mieux que cinq sujets survolés."},{t:"Je ne suis pas trop l'actualité.",ok:!1,why:"Le jury attend que tu t'intéresses à ton futur environnement professionnel."},{t:"Je cite une série médicale que j'ai regardée.",ok:!1,why:"Une fiction n'est pas une actualité."},{t:"Je cite plusieurs sujets sans les expliquer.",ok:!1,why:"Le jury relancera et verra que tu ne maîtrises pas."}],tip:"Prépare 2 sujets à fond : la loi infirmière (consultation, diagnostic, prescription) et la santé mentale. En réserve : aide à mourir, PLFSS 2027, déserts médicaux."},{id:"fc1",theme:"contenu",jury:!1,q:"Combien de crédits ECTS vaut un semestre de formation ?",opts:[{t:"30 ECTS",ok:!0,why:"6 semestres × 30 ECTS = 180 ECTS pour le diplôme."},{t:"10 ECTS",ok:!1,why:"Trop peu : un semestre vaut 30 ECTS."},{t:"60 ECTS",ok:!1,why:"60 ECTS, c'est une année entière (2 semestres)."},{t:"180 ECTS",ok:!1,why:"180 ECTS, c'est le total des 3 ans."}]},{id:"fc2",theme:"contenu",jury:!1,q:"Que signifie le sigle ECTS ?",opts:[{t:"Système européen de transfert et d'accumulation de crédits",ok:!0,why:"Les ECTS permettent de comparer et de faire reconnaître les formations en Europe. Ils s'acquièrent définitivement."},{t:"Examen de contrôle des techniques de soins",ok:!1,why:"Ce n'est pas un examen : ce sont des crédits."},{t:"École de cadres en techniques de santé",ok:!1,why:"Aucun rapport avec une école."},{t:"Évaluation continue des travaux scolaires",ok:!1,why:"Ce n'est pas une modalité d'évaluation."}]},{id:"fc3",theme:"contenu",jury:!1,q:"Que permet le grade de licence conféré par le diplôme d’État ?",opts:[{t:"D'accéder ensuite à un master, par exemple pour devenir infirmier en pratique avancée (IPA)",ok:!0,why:"Le grade licence ouvre la poursuite d’études universitaires."},{t:"D'exercer directement comme médecin",ok:!1,why:"Le diplôme mène au métier d’infirmier, pas à celui de médecin."},{t:"De se dispenser de l’inscription à l’Ordre",ok:!1,why:"L’inscription à l’Ordre reste obligatoire pour exercer."},{t:"Rien de particulier, c'est un titre honorifique",ok:!1,why:"Le grade licence a une vraie valeur universitaire."}]},{id:"fc4",theme:"contenu",jury:!1,q:"À quel niveau du cadre national des certifications le diplôme d’État d’infirmier est-il enregistré ?",opts:[{t:"Niveau 6 (équivalent licence)",ok:!0,why:"L'arrêté de 2026 l'enregistre au niveau 6, comme une licence."},{t:"Niveau 3 (équivalent CAP)",ok:!1,why:"Le niveau 3 correspond au CAP : le DE infirmier est au niveau 6."},{t:"Niveau 5 (équivalent BTS)",ok:!1,why:"Le DE infirmier est au niveau 6."},{t:"Niveau 8 (doctorat)",ok:!1,why:"Beaucoup trop haut."}]},{id:"fc5",theme:"contenu",jury:!1,q:"Quel texte fixe le nouveau référentiel de formation infirmière ?",opts:[{t:"L'arrêté du 20 février 2026 relatif au diplôme d'État d'infirmier, publié au Journal officiel le 25 février 2026",ok:!0,why:"C'est le texte de référence pour les étudiants entrés à partir de septembre 2026."},{t:"La loi du 4 mars 2002 sur les droits des malades",ok:!1,why:"Loi importante, mais elle porte sur les droits des patients."},{t:"Le Code du travail",ok:!1,why:"La formation relève d’un arrêté du ministère de la Santé et de l’Enseignement supérieur."},{t:"Un règlement propre à chaque IFSI",ok:!1,why:"Le référentiel est national. Chaque IFSI a aussi un règlement intérieur, mais il ne fixe pas le programme."}]},{id:"fc6",theme:"contenu",jury:!1,q:"Quelle part minimale des places de l’IFSI est réservée à la formation professionnelle continue (FPC) ?",opts:[{t:"Au moins 25 % de la capacité d’accueil",ok:!0,why:"L'arrêté de 2026 garantit au moins 25 % des places à la voie FPC, la tienne."},{t:"5 %",ok:!1,why:"C’est plus : au moins 25 %."},{t:"50 % exactement",ok:!1,why:"Le minimum est de 25 %."},{t:"Aucune place réservée",ok:!1,why:"Des places sont réservées à la FPC."}],tip:"Utile pour montrer que tu connais ta voie d’accès."},{id:"fc7",theme:"contenu",jury:!1,q:"Comment se déroule la sélection en voie FPC ?",opts:[{t:"Un dossier, puis un entretien de 20 minutes noté sur 20 et une épreuve écrite notée sur 20 ; il faut au moins 20/40 et aucune note sous 8/20",ok:!0,why:"Ce sont les règles de l’arrêté, reprises par l’ARS."},{t:"Un concours national unique avec classement",ok:!1,why:"Chaque groupement organise sa sélection."},{t:"Uniquement un dossier, sans épreuve",ok:!1,why:"Il y a deux épreuves en plus du dossier."},{t:"Parcoursup, comme les lycéens",ok:!1,why:"Parcoursup concerne la voie initiale, pas la FPC."}]},{id:"fc8",theme:"contenu",jury:!1,q:"Quelles sont les voies d’accès à la formation en soins infirmiers ?",opts:[{t:"Parcoursup (formation initiale), l’apprentissage et la formation professionnelle continue",ok:!0,why:"L’arrêté prévoit la voie initiale, dont l’apprentissage, et la FPC."},{t:"Uniquement Parcoursup",ok:!1,why:"Les adultes en reconversion passent par la FPC."},{t:"Uniquement après un bac scientifique",ok:!1,why:"Tous les bacs sont acceptés, et des équivalences existent."},{t:"Uniquement après 3 ans comme aide-soignant",ok:!1,why:"C'est une voie possible pour entrer en 2e année, pas la seule."}]},{id:"fc9",theme:"contenu",jury:!1,q:"Quel âge minimal faut-il avoir pour entrer en formation ?",opts:[{t:"17 ans au 31 décembre de l’année d’entrée",ok:!0,why:"C'est la condition de l'arrêté de 2026. Il n'y a pas d'âge maximal."},{t:"18 ans révolus le jour de la rentrée",ok:!1,why:"L’âge minimal est 17 ans au 31 décembre."},{t:"21 ans",ok:!1,why:"Trop élevé."},{t:"Il faut avoir moins de 45 ans",ok:!1,why:"Il n'y a pas d'âge maximal : la reconversion est possible à tout âge."}]},{id:"fc10",theme:"contenu",jury:!1,q:"Si tu es admis mais que tu ne peux pas entrer en septembre 2027, que se passe-t-il ?",opts:[{t:"Un report d’admission est possible sous conditions (par exemple congé maternité, garde d’un enfant de moins de 3 ans), dans la limite de 3 ans cumulés",ok:!0,why:"L'arrêté encadre les reports : certains sont de droit, d'autres sont accordés par le directeur."},{t:"Tu perds définitivement ta place",ok:!1,why:"Un report est possible dans certains cas."},{t:"Tu peux reporter autant d’années que tu veux",ok:!1,why:"Le report est limité à 3 ans cumulés."},{t:"Tu entres automatiquement en 2e année",ok:!1,why:"Le report ne donne aucune dispense."}]},{id:"fc11",theme:"contenu",jury:!1,q:"Pour le groupement Université Paris-Saclay, quand seront publiés les résultats de la sélection FPC ?",opts:[{t:"Le 1er février 2027, avec confirmation de ton choix avant le 9 février",ok:!0,why:"Ce sont les dates du document ARS du groupement."},{t:"Le jour même de l’oral",ok:!1,why:"Les résultats sont publiés après toutes les épreuves."},{t:"En juillet 2027",ok:!1,why:"C’est plus tôt : le 1er février 2027."},{t:"Il n’y a pas de résultats publiés",ok:!1,why:"Les résultats sont publiés à une date fixée."}],tip:"Note-toi la date de confirmation : sans réponse, la place peut être perdue."},{id:"fc12",theme:"contenu",jury:!1,q:"Avant la réforme, qui délivrait le diplôme d’État d’infirmier ?",opts:[{t:"Le préfet de région",ok:!0,why:"Depuis le référentiel 2026, ce sont les universités accréditées qui le délivrent."},{t:"L’Ordre des infirmiers",ok:!1,why:"L’Ordre n’a jamais délivré le diplôme."},{t:"L’hôpital de rattachement",ok:!1,why:"Les hôpitaux accueillent les stages, sans délivrer le diplôme."},{t:"Le maire",ok:!1,why:"Aucun rapport."}]},{id:"fc13",theme:"contenu",jury:!1,q:"Qu’appelle-t-on « l’universitarisation » de la formation infirmière ?",opts:[{t:"Le rapprochement des IFSI avec l’université : diplôme délivré par l’université, cours partagés, accès aux droits et services étudiants",ok:!0,why:"À Longjumeau, une partie des cours a lieu à l’Université Paris-Saclay (Kremlin-Bicêtre)."},{t:"La suppression des IFSI",ok:!1,why:"Les IFSI continuent d’assurer la formation, avec l’université."},{t:"La fin des stages",ok:!1,why:"Les stages restent la moitié de la formation."},{t:"Le passage à 5 ans d’études",ok:!1,why:"La formation reste en 3 ans."}]},{id:"fc14",theme:"contenu",jury:!1,q:"Quelle est la charge de travail totale estimée sur les 3 ans, en comptant le travail personnel ?",opts:[{t:"Entre 4 620 et 5 400 heures environ",ok:!0,why:"4 620 h prévues par le référentiel, plus jusqu’à 780 h de travail personnel complémentaire."},{t:"Environ 1 500 heures",ok:!1,why:"Beaucoup trop peu."},{t:"Exactement 3 000 heures",ok:!1,why:"C’est plus : au moins 4 620 h."},{t:"Plus de 10 000 heures",ok:!1,why:"Trop élevé."}],tip:"Montre au jury que tu mesures cette charge : c’est l’équivalent d’un emploi à temps plein."},{id:"fc15",theme:"contenu",jury:!1,q:"Après le diplôme d’État, quelles spécialisations un infirmier peut-il envisager ?",opts:[{t:"Infirmier anesthésiste (IADE), de bloc opératoire (IBODE), puéricultrice (IPDE), en pratique avancée (IPA), ou cadre de santé",ok:!0,why:"Ces formations se font après quelques années d’expérience pour la plupart."},{t:"Aucune : le diplôme est définitif",ok:!1,why:"De nombreuses évolutions existent."},{t:"Uniquement médecin, par passerelle automatique",ok:!1,why:"Il n’existe pas de passerelle automatique vers médecine."},{t:"Uniquement aide-soignant",ok:!1,why:"C'est un autre métier, pas une évolution."}],tip:"Au jury, reste ouvert : « j’aimerais d’abord acquérir de l’expérience, puis éventuellement… »"},{id:"fc16",theme:"contenu",jury:!0,q:"« Pourquoi une formation aussi longue pour devenir infirmier ? »",opts:[{t:"Parce que l’infirmier a un rôle propre, raisonne, décide, prescrit certains produits et engage sa responsabilité : il faut des connaissances solides et beaucoup de pratique encadrée."
