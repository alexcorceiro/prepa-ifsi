ne — II. L'histoire des antibiotiques.",ok:!1,why:"Plan historique sans rapport avec le rôle infirmier."},{t:"I. Les bactéries — II. Les virus — III. Les champignons.",ok:!1,why:"Plan de cours de biologie, hors de la question."},{t:"Un seul paragraphe sur le lavage des mains.",ok:!1,why:"Trop limité pour une question d'argumentation."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier peut expliquer pourquoi il faut finir son traitement, car un patient qui arrête trop tôt favorise les bactéries résistantes. Par exemple, il peut le rappeler lors de la sortie d'hospitalisation. »",ok:!0,why:"Action, justification et exemple concret."},{t:"« Les antibiotiques, c'est pas automatique. »",ok:!1,why:"Un slogan n'est pas un argument."},{t:"« L'infirmier est très important. »",ok:!1,why:"Affirmation vide."},{t:"« Les bactéries sont partout. »",ok:!1,why:"Constat sans lien avec le rôle infirmier."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Le mauvais usage des antibiotiques rend certaines bactéries résistantes. Quel rôle le futur infirmier peut-il jouer face à ce danger ? Nous verrons l'importance de l'hygiène, puis celle de l'éducation des patients. »",ok:!0,why:"Sujet amené, problème posé, plan annoncé."},{t:"« Les antibiotiques ont été inventés il y a longtemps. »",ok:!1,why:"Accroche imprécise qui ne pose pas le problème."},{t:"« Je n'aime pas prendre de médicaments. »",ok:!1,why:"Opinion personnelle hors propos."},{t:"« Voici ma réponse sur les antibiotiques. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les antibiotiques sont inefficaces contre les virus. »",ok:!0,why:"Phrase correcte et exacte."},{t:"« Les antibiotiques est inefficace contre les virus. »",ok:!1,why:"Faute d'accord : « sont inefficaces »."},{t:"« Les antibio ça marche pas sur les virus. »",ok:!1,why:"Abréviation et registre oral."},{t:"« Les antibiotiques, sont inefficaces, contre les virus. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Par ses gestes d'hygiène et ses explications, l'infirmier participe à la lutte contre l'antibiorésistance. Futur soignant, je sais que chaque geste quotidien compte. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« En conclusion, les bactéries c'est dangereux. »",ok:!1,why:"Banal et familier."},{t:"« Pour finir, parlons du cancer. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« J'espère avoir bien répondu. »",ok:!1,why:"Ne résume rien."}]}]},Ad={copies:[{q:"« Soigner, ce n'est pas seulement traiter une maladie, c'est prendre soin d'une personne. » Que vous inspire cette affirmation ? Développez une réponse argumentée, appuyée sur des exemples.",points:10,reponses:[{t:`Le mot « soin » recouvre deux réalités : traiter une maladie et prendre soin d'une personne. L'affirmation proposée invite à ne pas les séparer. Je la partage, car soigner efficacement suppose de considérer le patient dans sa globalité.

D'abord, le traitement de la maladie reste indispensable. Administrer un médicament, réaliser un pansement ou surveiller des constantes demande rigueur et compétence. Sans ces gestes techniques, il n'y a pas de guérison possible.

Mais le patient n'est pas réduit à sa maladie. Il a une histoire, des peurs, des habitudes et des proches. Une personne âgée hospitalisée après une chute a besoin d'un soin pour sa blessure, mais aussi d'être rassurée, informée et respectée dans sa pudeur. Prendre le temps de lui expliquer un soin ou d'écouter ses inquiétudes améliore son confort et souvent sa coopération.

Enfin, prendre soin, c'est aussi penser à l'après : préparer le retour à domicile, impliquer la famille, prévenir une nouvelle chute.

En définitive, soigner et prendre soin se complètent. Futur infirmier, je veux allier la rigueur des gestes à l'attention portée à chaque personne.`,ok:!0,note:"10/10",why:"Une introduction qui pose le problème, trois parties argumentées et illustrées, et une conclusion qui répond et ouvre sur le métier."},{t:"Cette phrase veut dire que soigner ce n'est pas seulement traiter une maladie mais aussi prendre soin d'une personne. C'est une phrase très juste. En effet, il faut prendre soin des personnes et pas seulement traiter les maladies. Les patients sont des personnes et pas seulement des maladies. C'est pour cela que je suis d'accord avec cette phrase.",ok:!1,note:"2/10",why:"Tu paraphrases la citation sans l'argumenter : aucune idée n'est développée ni illustrée."},{t:"Je suis d'accord avec cette affirmation. J'ai toujours voulu aider les autres et c'est pour cela que je veux devenir infirmier. Dans mon ancien métier, j'étais déjà à l'écoute de mes collègues. Je pense avoir les qualités pour ce métier : je suis patient, organisé et empathique.",ok:!1,note:"1/10",why:"Tu parles de ta motivation au lieu de réfléchir à l'affirmation : c'est un hors-sujet, à garder pour l'oral."},{t:"Le traitement de la maladie est indispensable : sans médicaments ni gestes techniques, le patient ne guérit pas. Mais le patient a aussi besoin d'être écouté et rassuré. Par exemple, un patient qui va être opéré est souvent inquiet, et quelques explications l'apaisent. Donc soigner et prendre soin vont ensemble.",ok:!1,note:"5/10",why:"Le raisonnement est juste et illustré, mais beaucoup trop court pour un sujet de réflexion : il manque introduction, développement et ouverture."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement ce sujet de réflexion ?",opts:[{t:"Réfléchir au lien entre traiter une maladie et prendre soin d'une personne, et donner un avis argumenté avec des exemples.",ok:!0,why:"Tu identifies les deux notions à relier et la consigne : argumenter avec des exemples."},{t:"Expliquer pourquoi je veux devenir infirmier.",ok:!1,why:"Piège classique : ce n'est pas une lettre de motivation."},{t:"Lister toutes les maladies qu'un infirmier soigne.",ok:!1,why:"Hors-sujet : la réflexion porte sur la relation de soin."},{t:"Dire si l'on est d'accord, en une phrase.",ok:!1,why:"La consigne demande une réponse développée et argumentée."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Traiter la maladie reste indispensable — II. Mais il faut aussi prendre soin de la personne — III. Les deux se complètent.",ok:!0,why:"Un plan progressif qui examine chaque notion avant de les relier."},{t:"I. Ma vie — II. Mes qualités — III. Mon projet.",ok:!1,why:"Plan de lettre de motivation."},{t:"I. Les médecins — II. Les infirmiers — III. Les aides-soignants.",ok:!1,why:"Plan par métiers, sans lien avec la réflexion demandée."},{t:"Un seul paragraphe pour dire que c'est vrai.",ok:!1,why:"Pas de plan pour un sujet qui en demande un."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Le patient n'est pas réduit à sa maladie, car il a des peurs et une histoire. Par exemple, expliquer un soin à une personne âgée inquiète l'apaise et facilite sa coopération. »",ok:!0,why:"Idée, justification, exemple concret."},{t:"« Prendre soin, c'est très important dans le métier. »",ok:!1,why:"Affirmation sans démonstration."},{t:"« Les malades sont des êtres humains comme nous. »",ok:!1,why:"Évidence qui ne fait pas avancer la réflexion."},{t:"« Je suis quelqu'un de très empathique. »",ok:!1,why:"Parler de soi n'est pas argumenter sur le sujet."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Le mot « soin » recouvre deux réalités : traiter une maladie et prendre soin d'une personne. Faut-il les distinguer ? Nous verrons que la technique reste indispensable, mais qu'elle ne suffit pas. »",ok:!0,why:"Elle définit les termes, pose une question et annonce le plan."},{t:"« Cette phrase est très belle. »",ok:!1,why:"Jugement esthétique, pas une introduction."},{t:"« Depuis toujours, les hommes soignent les hommes. »",ok:!1,why:"Accroche creuse."},{t:"« Je veux devenir infirmier depuis que je suis petit. »",ok:!1,why:"Début de lettre de motivation, hors-sujet."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Prendre soin d'une personne, c'est aussi l'écouter et respecter sa pudeur. »",ok:!0,why:"Phrase correcte, virgule bien placée."},{t:"« Prendre soin d'une personne, c'est aussi l'écoutée et respecté sa pudeur. »",ok:!1,why:"Infinitifs fautifs : « l'écouter », « respecter »."},{t:"« Prendre soin des gens, c'est genre les écouter. »",ok:!1,why:"Registre oral : « genre »."},{t:"« Prendre soin, d'une personne c'est aussi, l'écouter et respecter, sa pudeur. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Soigner et prendre soin se complètent : la technique guérit, l'attention accompagne. Futur infirmier, je veux allier la rigueur des gestes à l'écoute de chaque personne. »",ok:!0,why:"Réponse claire à la question et ouverture sur le métier."},{t:"« En conclusion, je suis d'accord. »",ok:!1,why:"Trop pauvre : rien n'est résumé."},{t:"« Pour finir, voici mes qualités. »",ok:!1,why:"Retour à la lettre de motivation."},{t:"« Voilà ce que m'inspire cette phrase. »",ok:!1,why:"Pas une vraie conclusion."}]}]},Dd={copies:[{q:"Quelles sont les causes de l'épuisement professionnel des soignants d'après le texte ?",points:2,reponses:[{t:"D'après le texte, l'épuisement professionnel des soignants a trois causes principales. La première tient à l'organisation du travail : les horaires décalés, de nuit ou le week-end, perturbent le sommeil et la vie personnelle. La deuxième est la charge de travail importante, qui laisse peu de temps pour récupérer. La troisième est la confrontation quotidienne à la souffrance des patients, qui pèse sur le moral.",ok:!0,note:"2/2",why:"Les trois causes sont citées, reformulées et brièvement expliquées."},{t:"Les causes sont « horaires décalés, charge de travail importante, confrontation quotidienne à la souffrance ».",ok:!1,note:"1/2",why:"Recopié sans explication : il fallait montrer en quoi chaque cause épuise."},{t:"Les soignants s'épuisent parce qu'ils ne sont pas assez payés et qu'ils n'aiment plus leur métier.",ok:!1,note:"0/2",why:"Ces causes ne sont pas dans le texte : tu réponds avec tes idées au lieu de t'appuyer sur lui."},{t:"Les soignants travaillent la nuit et le week-end, ce qui les fatigue beaucoup et les empêche de voir leur famille.",ok:!1,note:"0,5/2",why:"Une seule cause, bien expliquée, mais il en manque deux."}]},{q:"Comment se manifeste-t-il, et quelles en sont les conséquences ?",points:3,reponses:[{t:`Selon le texte, l'épuisement professionnel se manifeste par une fatigue intense, qui ne disparaît pas avec le repos, par le sentiment de ne plus être efficace dans son travail, et par une mise à distance des patients : le soignant devient moins disponible, parfois plus froid.

Ses conséquences dépassent la personne. Le soignant épuisé peut être arrêté, voire quitter la profession. Ces absences et ces départs désorganisent les équipes et rendent difficile la continuité des soins, ce qui augmente la charge des collègues restants et peut les épuiser à leur tour.`,ok:!0,note:"3/3",why:"Manifestations et conséquences sont traitées dans deux paragraphes, avec la logique du cercle vicieux."},{t:"Le soignant est très fatigué, il n'a plus envie d'aller travailler et il peut faire une dépression.",ok:!1,note:"1/3",why:"Tu évoques quelques signes, mais pas les conséquences sur les équipes et la continuité des soins."},{t:`- fatigue
- sentiment d'inefficacité
- distance avec les patients
- arrêts
- départs`,ok:!1,note:"1,5/3",why:"Toutes les idées y sont, mais une liste n'est pas une réponse rédigée."},{t:"Il faut que les hôpitaux embauchent plus de personnel et augmentent les salaires pour éviter le burn-out.",ok:!1,note:"0,5/3",why:"Tu proposes des solutions alors que la question porte sur les manifestations et les conséquences."}]},{q:"Comment un futur infirmier peut-il préserver sa santé tout au long de sa carrière ? Argumentez.",points:5,reponses:[{t:`L'épuisement professionnel menace de nombreux soignants. Pour exercer longtemps, le futur infirmier doit apprendre à préserver sa santé, en s'appuyant sur lui-même et sur l'équipe.

D'abord, il doit prendre soin de son équilibre personnel. Respecter son temps de repos, garder des activités en dehors du travail et entretenir ses relations aident à récupérer après des journées difficiles. Connaître ses limites permet aussi de repérer tôt les premiers signes de fatigue.

Ensuite, il ne doit pas rester seul face aux situations difficiles. Parler d'un décès ou d'un patient agressif avec ses collègues, participer aux temps d'échange de l'équipe ou solliciter le psychologue du service aide à prendre du recul. Une équipe solidaire protège chacun de ses membres.

Enfin, il peut continuer à se former, car se sentir compétent réduit le stress.

Ces démarches individuelles ne remplacent pas des conditions de travail correctes, mais elles y contribuent. Futur infirmier, je veux prendre soin de moi pour pouvoir prendre soin des autres.`,ok:!0,note:"5/5",why:"Des moyens concrets, à la fois personnels et collectifs, chacun justifié, une nuance et une conclusion forte."},{t:"Le futur infirmier doit faire attention à sa santé. Il doit se reposer, faire du sport et bien manger. Il doit aussi parler à ses collègues. Comme ça, il ne fera pas de burn-out.",ok:!1,note:"2/5",why:"Les idées sont justes mais listées sans explication, et la dernière phrase promet trop."},{t:"Le futur infirmier doit se protéger en ne s'attachant jamais aux patients et en restant toujours froid et distant, pour ne pas être touché par leur souffrance.",ok:!1,note:"0,5/5",why:"La mise à distance des patients est justement un signe d'épuisement selon le texte : ce n'est pas une protection."},{t:"Franchement, le mieux c'est de pas faire trop d'heures sup et de se changer les idées le week-end. Et si ça va pas, faut en parler aux collègues.",ok:!1,note:"1,5/5",why:"De bonnes pistes, mais en registre familier et sans développement ni structure."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Les conditions d'exercice exposent les soignants à l'épuisement, avec des conséquences pour eux et pour la continuité des soins.",ok:!0,why:"Causes, effets et enjeu réunis."},{t:"Les soignants travaillent la nuit.",ok:!1,why:"Une cause parmi d'autres, pas le problème."},{t:"Les patients sont de plus en plus exigeants.",ok:!1,why:"Le texte n'en parle pas."},{t:"Le travail, c'est fatigant.",ok:!1,why:"Beaucoup trop général."}]},{etape:"Choisir le plan",q:"Pour la question « Comment un futur infirmier peut-il préserver sa santé ? », quel plan est le plus adapté ?",opts:[{t:"I. Préserver son équilibre personnel — II. S'appuyer sur l'équipe pour prendre du recul.",ok:!0,why:"Deux leviers complémentaires, personnel et collectif."},{t:"I. Les causes du burn-out — II. Ses conséquences.",ok:!1,why:"Ce plan répond aux deux premières questions, pas à la dernière."},{t:"I. Les hôpitaux publics — II. Les cliniques privées.",ok:!1,why:"Hors-sujet."},{t:"Une liste de conseils de santé.",ok:!1,why:"Pas de plan ni d'argumentation."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Parler des situations difficiles avec ses collègues aide à prendre du recul, car on ne garde pas tout pour soi. Par exemple, échanger en équipe après le décès d'un patient permet de partager ce qu'on a ressenti. »",ok:!0,why:"Idée, justification, exemple."},{t:"« Il faut se reposer. »",ok:!1,why:"Conseil sans explication."},{t:"« Le burn-out est une maladie grave. »",ok:!1,why:"Constat qui ne répond pas à la question."},{t:"« Les infirmiers doivent être forts. »",ok:!1,why:"Affirmation vague, qui néglige la prévention."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Horaires décalés, charge de travail, souffrance des patients : les soignants sont exposés à l'épuisement. Comment préserver sa santé pour exercer longtemps ? Nous verrons le rôle de l'équilibre personnel, puis celui de l'équipe. »",ok:!0,why:"Sujet amené, problème posé, plan annoncé."},{t:"« Le burn-out, ça peut arriver à tout le monde. »",ok:!1,why:"Banal et sans annonce."},{t:"« J'ai déjà été très fatigué dans mon travail. »",ok:!1,why:"Anecdote personnelle hors propos."},{t:"« Je vais parler du travail des infirmiers. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les soignants épuisés se sentent souvent moins efficaces. »",ok:!0,why:"Accords corrects."},{t:"« Les soignants épuisé se sente souvent moins efficace. »",ok:!1,why:"Fautes d'accord : « épuisés », « sentent », « efficaces »."},{t:"« Les soignants, quand ils sont crevés, ils bossent moins bien. »",ok:!1,why:"Registre familier."},{t:"« Les soignants, épuisés se sentent, souvent moins efficaces. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Préserver son équilibre et s'appuyer sur l'équipe aide à durer dans le métier. Futur infirmier, je veux prendre soin de moi pour pouvoir prendre soin des autres. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« En conclusion, il faut faire attention. »",ok:!1,why:"Trop vague."},{t:"« Pour finir, parlons des salaires des médecins. »",ok:!1,why:"Nouveau sujet."},{t:"« Voilà, j'ai répondu. »",ok:!1,why:"Pas une conclusion."}]}]},Ud={copies:[{q:"Comment le texte définit-il une addiction ?",points:2,reponses:[{t:"Le texte définit l'addiction par deux éléments. D'une part, la personne perd le contrôle de sa consommation ou de son comportement : elle n'arrive plus à s'arrêter, même si elle le souhaite. D'autre part, elle continue malgré les conséquences négatives sur sa santé, sa vie familiale ou professionnelle. Le texte précise que l'addiction peut concerner des produits, comme l'alcool ou le tabac, mais aussi des comportements, comme les jeux d'argent ou les écrans.",ok:!0,note:"2/2",why:"Les deux critères de la définition sont expliqués, et tu précises qu'il existe des addictions sans produit."},{t:"Une addiction, c'est quand on fume, qu'on boit de l'alcool ou qu'on prend du cannabis.",ok:!1,note:"0,5/2",why:"Tu donnes des exemples, pas une définition : consommer ne suffit pas à être dépendant."},{t:"L'addiction se caractérise par « une perte de contrôle et par la poursuite d'un comportement malgré ses conséquences négatives ».",ok:!1,note:"1/2",why:"Juste mais recopié : il fallait expliquer avec tes mots."},{t:"Une addiction, c'est un manque de volonté : les personnes dépendantes pourraient arrêter si elles le voulaient vraiment.",ok:!1,note:"0/2",why:"Contraire au texte, qui parle de perte de contrôle : c'est justement ce préjugé qui freine la demande d'aide."}]},{q:"Pourquoi est-il difficile de demander de l'aide ?",points:3,reponses:[{t:`Demander de l'aide est difficile d'abord à cause de la honte. Le texte souligne que les addictions sont souvent associées à ce sentiment : la personne craint d'être vue comme faible ou responsable de sa situation, et préfère cacher ses difficultés à son entourage comme aux soignants.

Il peut aussi être difficile de reconnaître le problème. Une personne qui a perdu le contrôle minimise parfois sa consommation ou pense pouvoir s'arrêter seule. Enfin, elle ne sait pas toujours que des accompagnements existent. Tous ces freins retardent le premier pas, alors que la situation s'aggrave.`,ok:!0,note:"3/3",why:"Plusieurs raisons, dont celle du texte, développées et reliées à leur conséquence : le retard de la demande d'aide."},{t:"Parce que les gens ont honte.",ok:!1,note:"0,5/3",why:"Idée juste mais pas expliquée : honte de quoi, et avec quelles conséquences ?"},{t:"Les personnes ont honte de leur addiction. Elles ont peur du regard des autres et préfèrent la cacher à leur famille et à leur médecin.",ok:!1,note:"1,5/3",why:"Une raison bien développée, mais une seule : tu pouvais ajouter le déni ou le manque d'information."},{t:"C'est difficile car il n'existe aucune aide pour les personnes dépendantes en France.",ok:!1,note:"0/3",why:"Faux, et contraire au texte qui affirme que des accompagnements existent."}]},{q:"Quelle attitude un soignant doit-il adopter face à un patient présentant une addiction ? Argumentez.",points:5,reponses:[{t:`Les addictions sont souvent vécues dans la honte, ce qui retarde la demande d'aide. L'attitude du soignant peut donc faciliter le premier pas, ou au contraire le décourager.

D'abord, le soignant doit adopter une attitude sans jugement. Considérer l'addiction comme une maladie et non comme une faute permet au patient de se sentir respecté. Par exemple, aborder la consommation d'alcool avec une question ouverte et un ton neutre lors d'un entretien encourage le patient à en parler honnêtement.

Ensuite, il doit écouter et respecter le rythme du patient. Celui-ci n'est pas toujours prêt à arrêter : l'infirmier peut l'aider à réfléchir à sa consommation, valoriser chaque progrès et l'informer des accompagnements existants, sans lui imposer de décision.

Enfin, il travaille en équipe et oriente le patient vers les professionnels et les structures spécialisées.

Futur infirmier, je sais que la confiance est souvent le point de départ du soin.`,ok:!0,note:"5/5",why:"Une attitude décrite en plusieurs dimensions (non-jugement, écoute, orientation), chacune justifiée et illustrée."},{t:"Le soignant doit dire clairement au patient qu'il se détruit la santé et qu'il doit arrêter immédiatement, en lui montrant les risques pour lui faire peur.",ok:!1,note:"1/5",why:"Une attitude moralisatrice et alarmiste renforce souvent la honte et fait fuir le patient."},{t:"Le soignant doit être bienveillant, à l'écoute, sans jugement, patient et respectueux. Ce sont des qualités essentielles pour aider un patient addict.",ok:!1,note:"1,5/5",why:"Une liste de qualités sans explication ni exemple : ce n'est pas une argumentation."},{t:"Le soignant ne doit pas juger le patient, car l'addiction est une maladie. Il doit l'écouter et l'orienter vers des structures spécialisées, comme des consultations en addictologie.",ok:!1,note:"3/5",why:"Les bonnes idées sont là, mais trop brèves : il manque développement, exemples, introduction et conclusion."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Les addictions touchent tout le monde, mais la honte retarde la demande d'aide, alors qu'une attitude sans jugement peut la faciliter.",ok:!0,why:"Tu réunis le constat, le frein et la piste de solution."},{t:"Le tabac provoque le cancer.",ok:!1,why:"Vrai, mais absent du texte : hors-sujet."},{t:"Les jeunes jouent trop aux jeux vidéo.",ok:!1,why:"Un exemple, pris pour le problème."},{t:"Il faut interdire l'alcool.",ok:!1,why:"Opinion absente du texte."}]},{etape:"Choisir le plan",q:"Pour la question « Quelle attitude un soignant doit-il adopter ? », quel plan est le plus adapté ?",opts:[{t:"I. Ne pas juger pour instaurer la confiance — II. Écouter, accompagner et orienter.",ok:!0,why:"Deux parties qui décrivent l'attitude et la justifient par le texte."},{t:"I. Les drogues légales — II. Les drogues illégales.",ok:!1,why:"Plan de classification, hors de la question."},{t:"I. Les dangers de l'alcool — II. Les dangers du tabac.",ok:!1,why:"Ne parle pas de l'attitude du soignant."},{t:"Une phrase : il faut être gentil.",ok:!1,why:"Pas de plan ni d'argument."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Le soignant doit éviter de juger, car la honte pousse le patient à cacher sa consommation. Par exemple, une question ouverte posée sur un ton neutre l'aide à en parler. »",ok:!0,why:"Idée, justification, exemple."},{t:"« Les addictions, c'est dangereux. »",ok:!1,why:"Constat vague."},{t:"« Le patient doit se prendre en main. »",ok:!1,why:"Jugement moral contraire au texte."},{t:"« Il faut être bienveillant et empathique. »",ok:!1,why:"Qualités citées sans explication."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Tabac, alcool, jeux : les addictions sont souvent vécues dans la honte. Comment le soignant peut-il faciliter la demande d'aide ? Nous verrons l'importance du non-jugement, puis de l'accompagnement. »",ok:!0,why:"Sujet, problème et plan."},{t:"« Moi, je n'ai jamais fumé. »",ok:!1,why:"Anecdote personnelle hors propos."},{t:"« La drogue, c'est mal. »",ok:!1,why:"Slogan, pas une introduction."},{t:"« Je vais parler des addictions. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les personnes dépendantes hésitent souvent à demander de l'aide. »",ok:!0,why:"Phrase correcte."},{t:"« Les personnes dépendante hésite souvent à demander de l'aide. »",ok:!1,why:"Fautes d'accord : « dépendantes », « hésitent »."},{t:"« Les gens accros, ils osent pas demander de l'aide. »",ok:!1,why:"Registre familier et négation incomplète."},{t:"« Les personnes, dépendantes hésitent, souvent à demander, de l'aide. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Une attitude sans jugement et une écoute patiente peuvent aider le patient à faire le premier pas. Futur infirmier, je sais que la confiance est souvent le point de départ du soin. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« En conclusion, il ne faut pas boire. »",ok:!1,why:"Morale hors de la question."},{t:"« Pour finir, parlons du sport. »",ok:!1,why:"Nouveau sujet."},{t:"« C'est un sujet difficile. »",ok:!1,why:"Ne résume rien."}]}]},$d={copies:[{q:"Qu'est-ce qu'un consentement « libre et éclairé » d'après le texte ?",points:2,reponses:[{t:"Un consentement est libre lorsque le patient accepte un soin sans pression ni contrainte : il peut aussi le refuser, ou revenir sur son accord à tout moment. Il est éclairé lorsque le patient a reçu au préalable une information claire, adaptée et compréhensible sur le soin proposé. Il sait donc à quoi il consent. Selon le texte, aucun acte ni traitement ne peut être pratiqué sans ce consentement.",ok:!0,note:"2/2",why:"Tu expliques séparément « libre » et « éclairé », et tu rappelles le principe et la possibilité de retrait."},{t:"Le consentement libre et éclairé, c'est quand le patient signe un papier avant une opération.",ok:!1,note:"0,5/2",why:"Réducteur : une signature ne prouve pas que l'information a été comprise, et le consentement concerne tous les soins."},{t:"Le consentement doit être « libre et éclairé », et le patient doit recevoir « une information claire, adaptée et compréhensible ».",ok:!1,note:"1/2",why:"Recopié : tu n'expliques pas ce que signifient « libre » et « éclairé »."},{t:"Le consentement libre et éclairé, c'est quand le médecin décide du meilleur traitement à la place du patient, pour son bien.",ok:!1,note:"0/2",why:"Contresens : c'est le patient qui décide, après avoir été informé."}]},{q:"Pourquoi le respect de ce principe est-il parfois difficile dans la pratique ?",points:3,reponses:[{t:`Le texte cite trois situations qui rendent ce principe difficile à respecter. La première est l'urgence : quand la vie du patient est en jeu, il n'y a pas toujours le temps d'informer longuement, et le patient peut être inconscient.

La deuxième est le manque de temps au quotidien. Dans un service chargé, expliquer un soin, vérifier que le patient a compris et répondre à ses questions demande une disponibilité qui manque parfois.

La troisième concerne les personnes qui ont du mal à exprimer leur volonté, par exemple un patient atteint de troubles cognitifs ou qui ne parle pas la langue. Il faut alors trouver d'autres moyens de l'informer et de recueillir son avis.`,ok:!0,note:"3/3",why:"Les trois difficultés du texte sont expliquées et illustrées, dans une réponse bien organisée."},{t:"Parce qu'en urgence on n'a pas le temps de demander l'avis du patient.",ok:!1,note:"0,5/3",why:"Une seule difficulté, à peine expliquée."},{t:"C'est difficile car les patients ne comprennent rien aux explications médicales, donc ça ne sert à rien de leur demander leur avis.",ok:!1,note:"0/3",why:"Conclusion contraire au principe : c'est au soignant d'adapter son information pour que le patient comprenne."},{t:`- urgence
- manque de temps
- patient qui ne peut pas s'exprimer`,ok:!1,note:"1,5/3",why:"Les trois idées sont justes, mais en liste, sans explication."}]},{q:"Comment l'infirmier peut-il contribuer au respect du consentement du patient ? Argumentez.",points:5,reponses:[{t:`Le consentement libre et éclairé est un droit du patient. Proche de lui au quotidien, l'infirmier a un rôle essentiel pour le faire respecter.

D'abord, il informe avant chaque soin. Expliquer simplement ce qu'il va faire et pourquoi, par exemple avant une prise de sang ou la pose d'une perfusion, permet au patient de comprendre et d'accepter. L'infirmier vérifie ensuite qu'il a compris, en l'invitant à poser des questions.

Ensuite, il respecte le refus. Si un patient refuse un soin, l'infirmier ne le force pas : il cherche à comprendre ses raisons, lui réexplique si besoin, et transmet l'information au médecin et à l'équipe.

Enfin, il adapte sa communication aux personnes qui ont du mal à s'exprimer : mots simples, gestes, interprète, présence d'un proche ou de la personne de confiance.

Respecter le consentement, c'est reconnaître le patient comme acteur de ses soins. Futur infirmier, je veux faire de chaque soin un moment d'explication et de respect.`,ok:!0,note:"5/5",why:"Trois actions concrètes (informer, respecter le refus, adapter la communication), illustrées, avec une conclusion de valeur."},{t:"Si le patient refuse un soin, l'infirmier doit insister jusqu'à ce qu'il accepte, ou le faire quand même s'il pense que c'est pour son bien.",ok:!1,note:"0/5",why:"Faux et contraire au principe énoncé dans le texte : un soin ne peut pas être imposé à un patient qui le refuse."},{t:"L'infirmier doit informer le patient et respecter ses choix. Il doit être à l'écoute et respectueux. C'est très important pour le respect du patient.",ok:!1,note:"1,5/5",why:"Juste mais vague, sans exemple ni développement."},{t:"L'infirmier peut expliquer chaque soin au patient avant de le faire, pour qu'il comprenne. Et si le patient refuse, il doit prévenir le médecin. Comme ça le consentement est respecté.",ok:!1,note:"3/5",why:"Deux bonnes actions, mais peu développées, sans introduction ni conclusion."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Tout soin exige le consentement libre et éclairé du patient, mais ce principe est parfois difficile à respecter en pratique.",ok:!0,why:"Principe et difficulté d'application : c'est le cœur du texte."},{t:"Les patients ne lisent pas les documents qu'on leur donne.",ok:!1,why:"Le texte n'en parle pas."},{t:"Les urgences sont débordées.",ok:!1,why:"Une des difficultés citées, pas le problème."},{t:"Les médecins décident pour les patients.",ok:!1,why:"Contraire au principe exposé."}]},{etape:"Choisir le plan",q:"Pour la question « Comment l'infirmier peut-il contribuer au respect du consentement ? », quel plan est le plus adapté ?",opts:[{t:"I. Informer clairement avant chaque soin — II. Respecter le refus et adapter la communication.",ok:!0,why:"Deux parties qui reprennent les conditions du consentement libre et éclairé."},{t:"I. L'histoire du droit des patients — II. Les lois en Europe.",ok:!1,why:"Plan juridique sans lien avec le rôle infirmier."},{t:"I. Pour le consentement — II. Contre le consentement.",ok:!1,why:"Faux débat : le consentement est un principe à respecter."},{t:"Une seule partie sur la signature des documents.",ok:!1,why:"Trop réducteur."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier informe avant chaque soin, car un patient ne peut accepter que ce qu'il comprend. Par exemple, il explique le déroulement d'une prise de sang et invite le patient à poser ses questions. »",ok:!0,why:"Idée, justification, exemple."},{t:"« Le consentement est un droit fondamental. »",ok:!1,why:"Vrai mais ce n'est pas un argument sur le rôle infirmier."},{t:"« Il faut respecter les patients. »",ok:!1,why:"Trop vague."},{t:"« Le patient doit faire confiance aux soignants. »",ok:!1,why:"Inverse la logique : c'est au soignant d'informer."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Aucun soin ne peut être réalisé sans le consentement libre et éclairé du patient. Comment l'infirmier peut-il le faire respecter au quotidien ? Nous verrons l'importance de l'information, puis du respect du refus. »",ok:!0,why:"Principe rappelé, problème posé, plan annoncé."},{t:"« Les patients ont des droits et des devoirs. »",ok:!1,why:"Généralité sans lien précis."},{t:"« J'ai déjà signé un formulaire à l'hôpital. »",ok:!1,why:"Anecdote hors propos."},{t:"« Je vais répondre aux questions. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Le patient peut retirer son consentement à tout moment. »",ok:!0,why:"Phrase correcte et fidèle au texte."},{t:"« Le patient peux retirer son consentement à tout moments. »",ok:!1,why:"Fautes : « peut », « à tout moment »."},{t:"« Le patient, s'il veut plus, il peut dire non. »",ok:!1,why:"Registre oral."},{t:"« Le patient peut, retirer son consentement, à tout moment. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« En informant, en respectant le refus et en adaptant sa communication, l'infirmier fait du patient un acteur de ses soins. Futur soignant, je veux faire de chaque soin un moment d'explication. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« En conclusion, le patient a toujours raison. »",ok:!1,why:"Formule simpliste qui ne résume pas la réponse."},{t:"« Pour finir, parlons des déserts médicaux. »",ok:!1,why:"Nouveau sujet."},{t:"« Voilà ma copie. »",ok:!1,why:"Pas une conclusion."}]}]},Ph={aidants:kd,deserts:Ld,vaccin:bd,jeunes:Cd,violence:Sd,finvie:Nd,sedentarite:Id,handicap:Pd,precarite:Ed,numerique:Td,antibio:zd,prendresoin:Ad,epuisement:Dd,addictions:Ud,consentement:$d,"pdf-alimentation":{copies:[{q:"Explique pourquoi l'alimentation est essentielle au fonctionnement de l'organisme.",points:4,reponses:[{t:"L'alimentation apporte à l'organisme les nutriments nécessaires à son fonctionnement. Elle lui fournit de l'énergie, contribue au développement physique et intellectuel et participe au maintien d'une bonne santé.",ok:!0,note:"4/4",why:"C'est la réponse du corrigé : rôle des nutriments, énergie, développement et santé, en phrases complètes."},{t:"Parce qu'il faut manger pour vivre.",ok:!1,note:"0,5/4",why:"Vrai mais beaucoup trop court : la question demande d'expliquer, avec les éléments du texte."},{t:"L'alimentation « apporte à l'organisme les nutriments nécessaires à son fonctionnement ».",ok:!1,note:"2/4",why:"Une partie juste, mais recopiée et incomplète : il manque le développement physique et intellectuel."},{t:"L'alimentation est essentielle car les produits transformés rendent malade et font grossir.",ok:!1,note:"0/4",why:"Hors-sujet : tu parles des risques de certains aliments, pas du rôle de l'alimentation pour l'organisme."}]},{q:"Cite trois facteurs qui favorisent le développement de l'obésité selon le texte.",points:4,reponses:[{t:"Le texte cite trois facteurs : la consommation de produits transformés riches en sucres, en sel et en matières grasses ; la sédentarité, liée notamment aux écrans ; et la diminution de l'activité physique quotidienne.",ok:!0,note:"4/4",why:"Les trois facteurs du corrigé sont cités clairement, avec une précision tirée du texte."},{t:"Les sucres, le sel et le gras.",ok:!1,note:"1,5/4",why:"Tu détailles un seul facteur (les produits transformés) et oublies la sédentarité et le manque d'activité physique."},{t:"La génétique, le stress et le manque de sommeil.",ok:!1,note:"0/4",why:"Ces facteurs existent, mais ils ne sont pas dans le texte : la question demande « selon le texte »."},{t:"Les produits transformés, les écrans.",ok:!1,note:"2,5/4",why:"Deux bonnes idées sur trois, sans phrase rédigée."}]},{q:"Quelles maladies chroniques sont mentionnées dans le texte ?",points:4,reponses:[{t:"Le texte mentionne trois maladies chroniques : le diabète de type 2, les maladies cardiovasculaires et l'obésité.",ok:!0,note:"4/4",why:"Les trois maladies du texte, dans une phrase complète."},{t:"Le diabète et le cancer.",ok:!1,note:"1/4",why:"Le diabète est juste, mais le cancer n'est pas cité dans le texte, et il manque deux maladies."},{t:"Le diabète de type 2, les maladies cardiovasculaires.",ok:!1,note:"2,5/4",why:"Deux maladies sur trois : l'obésité manque."},{t:"Les maladies chroniques sont des maladies qui durent longtemps.",ok:!1,note:"0,5/4",why:"Tu définis le mot au lieu de citer les maladies demandées."}]},{q:"Explique ce que signifie « éducation nutritionnelle ».",points:4,reponses:[{t:"L'éducation nutritionnelle regroupe les actions d'information et de sensibilisation qui aident les personnes à comprendre l'équilibre alimentaire et à faire des choix adaptés à leurs besoins.",ok:!0,note:"4/4",why:"Définition claire et complète, conforme au corrigé."},{t:"C'est un régime imposé par un médecin pour perdre du poids.",ok:!1,note:"0/4",why:"Contresens : le texte précise qu'il ne s'agit pas d'imposer un modèle alimentaire."},{t:"C'est apprendre à bien manger.",ok:!1,note:"1,5/4",why:"Idée juste mais trop vague : il faut parler d'information, de compréhension et de choix adaptés."},{t:"L'éducation nutritionnelle, c'est l'école qui donne des cours de cuisine aux enfants.",ok:!1,note:"0,5/4",why:"Exemple réducteur qui ne définit pas la notion."}]},{q:"Pourquoi est-il important que les professionnels de santé accompagnent les patients sans les culpabiliser ?",points:4,reponses:[{t:"Les habitudes alimentaires ne dépendent pas seulement de la volonté : elles sont liées aux revenus, à l'environnement, à la culture et aux conditions de vie. Une approche bienveillante favorise le dialogue et permet des changements progressifs, alors qu'un patient culpabilisé risque de se fermer.",ok:!0,note:"4/4",why:"Tu expliques les deux raisons du corrigé : les causes multiples des habitudes et l'efficacité d'une approche bienveillante."},{t:"Parce que c'est méchant de culpabiliser les gens.",ok:!1,note:"0,5/4",why:"Jugement moral sans explication : pourquoi est-ce contre-productif ?"},{t:"Un patient culpabilisé se sent jugé et n'ose plus parler de ses habitudes. Il vaut mieux l'écouter.",ok:!1,note:"2,5/4",why:"Bonne idée sur le dialogue, mais tu oublies que les habitudes dépendent aussi des revenus, de la culture et du mode de vie."},{t:"Il ne faut pas culpabiliser les patients, sinon ils vont porter plainte contre l'hôpital.",ok:!1,note:"0/4",why:"Raison hors de propos : la question porte sur la relation de soin et la prévention."}]},{q:"Selon toi, comment les professionnels de santé peuvent-ils contribuer à améliorer les habitudes alimentaires de la population ? Développe ton argumentation avec des exemples concrets, une introduction, un développement et une conclusion (20 à 25 lignes).",points:30,reponses:[{t:`L'alimentation occupe une place importante dans notre santé. Pourtant, les habitudes alimentaires évoluent et certaines personnes consomment régulièrement des produits trop riches en sucres, en sel ou en matières grasses. Les professionnels de santé ont donc un rôle essentiel dans la prévention.

Tout d'abord, ils peuvent informer la population sur les bienfaits d'une alimentation équilibrée. Par exemple, ils peuvent expliquer l'intérêt de consommer des fruits et des légumes, de boire suffisamment d'eau et de limiter les produits très transformés.

Ensuite, ils peuvent accompagner individuellement les personnes qui rencontrent des difficultés. Une personne en surpoids ne doit pas être jugée ou culpabilisée. Il est préférable de comprendre ses habitudes et de lui proposer des changements progressifs et réalisables.

Enfin, la prévention doit commencer dès l'enfance. Les écoles, les familles et les professionnels de santé peuvent travailler ensemble pour sensibiliser les jeunes à l'importance de l'alimentation et de l'activité physique.

Pour conclure, les professionnels de santé ne doivent pas seulement soigner les maladies liées à l'alimentation. Ils doivent également informer, écouter et accompagner la population afin de prévenir leur apparition.`,ok:!0,note:"30/30",why:"C'est la rédaction modèle du corrigé : introduction, trois arguments illustrés (informer, accompagner, agir dès l'enfance) et une conclusion qui répond à la question."},{t:"Les professionnels de santé peuvent faire des affiches, des conférences, des vidéos sur internet, des consultations, des ateliers cuisine et des interventions dans les écoles. Ils peuvent aussi conseiller de manger cinq fruits et légumes par jour et de faire du sport.",ok:!1,note:"9/30",why:"Des idées justes mais seulement listées : pas d'introduction, aucun argument expliqué, pas de conclusion."},{t:"J'ai toujours voulu devenir infirmier car j'aime aider les autres. Je pense que je pourrai aider les patients à mieux manger. Mon expérience professionnelle m'a appris l'écoute et la patience, ce qui me servira dans ce métier.",ok:!1,note:"3/30",why:"Hors-sujet : tu parles de ta motivation au lieu de répondre à la question posée."},{t:"Les professionnels de santé doivent obliger les gens à manger équilibré. Il faudrait interdire les fast-foods et taxer fortement les sodas. Les personnes obèses doivent faire des efforts et arrêter de manger n'importe quoi.",ok:!1,note:"6/30",why:"Ton culpabilisant, contraire au texte, et propositions qui ne concernent pas le rôle des soignants."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement la question de réflexion ?",opts:[{t:"Expliquer, avec des exemples, comment les soignants peuvent aider la population à améliorer ses habitudes alimentaires.",ok:!0,why:"Tu identifies l'acteur (les soignants), l'objectif (les habitudes) et la consigne (argumenter avec des exemples)."},{t:"Expliquer ce qu'est l'obésité.",ok:!1,why:"Une définition ne répond pas à la question du rôle des soignants."},{t:"Dire si l'on aime manger équilibré.",ok:!1,why:"Avis personnel hors sujet."},{t:"Résumer le texte.",ok:!1,why:"Le résumé n'est pas demandé dans la réflexion."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Informer la population — II. Accompagner chaque personne sans la juger — III. Agir dès l'enfance.",ok:!0,why:"Trois manières d'agir des soignants : c'est le plan du corrigé."},{t:"I. Les aliments sucrés — II. Les aliments salés — III. Les aliments gras.",ok:!1,why:"Plan de catalogue, qui ne parle pas du rôle des soignants."},{t:"I. Mes habitudes — II. Celles de ma famille.",ok:!1,why:"Plan personnel hors sujet."},{t:"Une seule partie sur le diabète.",ok:!1,why:"Trop étroit et pas en lien avec la question."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Les soignants peuvent accompagner chaque personne sans la juger, car un patient culpabilisé se ferme. Par exemple, ils peuvent proposer des changements progressifs, comme remplacer les sodas par de l'eau. »",ok:!0,why:"Idée, justification et exemple concret."},{t:"« Il faut manger équilibré. »",ok:!1,why:"Conseil général, pas un argument sur le rôle des soignants."},{t:"« L'obésité est un grave problème de santé publique. »",ok:!1,why:"Constat sans lien avec la question."},{t:"« Les soignants sont très importants. »",ok:!1,why:"Affirmation vide."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Les habitudes alimentaires ont évolué et favorisent certaines maladies. Comment les soignants peuvent-ils aider à les améliorer ? Nous verrons qu'ils peuvent informer, accompagner et agir dès l'enfance. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« Moi, je mange équilibré. »",ok:!1,why:"Anecdote personnelle hors propos."},{t:"« Depuis toujours, l'homme mange. »",ok:!1,why:"Accroche creuse."},{t:"« Je vais répondre à la question. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les produits transformés sont souvent riches en sucres et en sel. »",ok:!0,why:"Accords corrects et registre adapté."},{t:"« Les produits transformé est souvent riche en sucres et en sel. »",ok:!1,why:"Fautes d'accord : « transformés », « sont », « riches »."},{t:"« La malbouffe, c'est blindé de sucre. »",ok:!1,why:"Registre familier."},{t:"« Les produits, transformés sont souvent, riches en sucres. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Les soignants ne doivent pas seulement soigner les maladies liées à l'alimentation : en informant, en écoutant et en accompagnant, ils peuvent aussi les prévenir. »",ok:!0,why:"Elle résume les arguments et répond à la question."},{t:"« Bref, il faut manger des légumes. »",ok:!1,why:"Familier et sans bilan."},{t:"« Pour finir, parlons du tabac. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« Voilà ma copie. »",ok:!1,why:"Pas une conclusion."}]}]},"pdf-vieillissement":{copies:[{q:"Pourquoi le vieillissement de la population représente-t-il un enjeu pour le système de santé ?",points:4,reponses:[{t:"L'augmentation du nombre de personnes âgées entraîne des besoins supplémentaires en soins, en accompagnement et en prise en charge de la perte d'autonomie. Le système de santé doit donc s'adapter pour y répondre.",ok:!0,note:"4/4",why:"Réponse du corrigé : plus de personnes âgées, donc plus de besoins en soins et en accompagnement."},{t:"Parce que les personnes âgées coûtent cher à la société.",ok:!1,note:"1/4",why:"Formulation réductrice et peu respectueuse : il faut parler des besoins de soins et d'accompagnement."},{t:"Parce que l'espérance de vie augmente.",ok:!1,note:"1,5/4",why:"C'est le constat de départ, mais tu n'expliques pas pourquoi c'est un enjeu."},{t:"Le vieillissement est un progrès car les gens vivent plus longtemps.",ok:!1,note:"0,5/4",why:"Le texte le dit, mais cela ne répond pas à la question de l'enjeu pour le système de santé."}]},{q:"Cite quatre activités quotidiennes pouvant devenir difficiles avec l'âge.",points:4,reponses:[{t:"Avec l'âge, quatre activités peuvent devenir difficiles : se laver, s'habiller, préparer les repas et se déplacer.",ok:!0,note:"4/4",why:"Les quatre activités du texte, dans une phrase complète."},{t:"Se laver, s'habiller.",ok:!1,note:"2/4",why:"Deux activités sur quatre."},{t:"Conduire, faire du sport, voyager et travailler.",ok:!1,note:"0/4",why:"Ces activités ne sont pas celles du texte, qui parle des gestes de la vie quotidienne."},{t:"Les maladies chroniques, la mobilité et les troubles cognitifs.",ok:!1,note:"0,5/4",why:"Ce sont les causes des difficultés, pas les activités demandées."}]},{q:"Quels sont les avantages du maintien à domicile ?",points:4,reponses:[{t:"Le maintien à domicile permet à la personne âgée de conserver ses habitudes, son environnement familier et ses repères, ainsi qu'une certaine autonomie.",ok:!0,note:"4/4",why:"Les avantages du corrigé : habitudes, environnement, repères et autonomie."},{t:"C'est moins cher qu'une maison de retraite.",ok:!1,note:"0,5/4",why:"Ce n'est pas dans le texte, qui parle du bien-être et de l'autonomie de la personne."},{t:"La personne garde ses habitudes.",ok:!1,note:"1,5/4",why:"Un seul avantage, très bref."},{t:"Le maintien à domicile nécessite l'intervention d'infirmiers et d'aides-soignants.",ok:!1,note:"0,5/4",why:"C'est une condition, pas un avantage."}]},{q:"Pourquoi les proches aidants peuvent-ils avoir besoin de soutien ?",points:4,reponses:[{t:"Accompagner un proche au quotidien peut entraîner une fatigue physique, du stress et parfois un épuisement psychologique. Les aidants ont donc besoin de soutien pour continuer à aider sans mettre leur propre santé en danger.",ok:!0,note:"4/4",why:"Tu nommes les risques (fatigue, stress, épuisement) et tu expliques pourquoi le soutien est nécessaire."},{t:"Parce qu'ils sont fatigués.",ok:!1,note:"1/4",why:"Idée juste mais à peine formulée et sans explication."},{t:"Parce qu'ils n'ont pas envie de s'occuper de leurs parents.",ok:!1,note:"0/4",why:"Jugement absent du texte : le besoin de soutien vient de l'épuisement, pas d'un manque d'envie."},{t:"Leur investissement peut entraîner « une fatigue physique et psychologique ».",ok:!1,note:"2/4",why:"Juste mais recopié, et sans dire à quoi sert le soutien."}]},{q:"Explique la différence entre aider une personne et faire systématiquement à sa place.",points:4,reponses:[{t:"Aider une personne, c'est l'accompagner dans ce qu'elle peut encore faire elle-même. Faire systématiquement à sa place risque au contraire de diminuer son autonomie et sa confiance en elle. Par exemple, laisser une personne âgée s'habiller seule en l'aidant seulement pour les boutons préserve ses capacités.",ok:!0,note:"4/4",why:"Les deux notions sont distinguées, la conséquence est expliquée et un exemple illustre la différence."},{t:"Aider, c'est faire les choses pour la personne pour qu'elle se fatigue moins.",ok:!1,note:"0/4",why:"Contresens : c'est justement ce que le texte appelle « faire à sa place »."},{t:"Aider, c'est laisser la personne faire ce qu'elle peut. Faire à sa place, c'est tout faire pour elle.",ok:!1,note:"2/4",why:"Distinction juste, mais tu n'expliques pas la conséquence sur l'autonomie."},{t:"Il ne faut jamais aider les personnes âgées pour qu'elles restent autonomes.",ok:!1,note:"0,5/4",why:"Excès inverse : l'aide reste nécessaire, elle doit simplement être adaptée."}]},{q:"Le maintien de l'autonomie des personnes âgées doit-il être une priorité dans notre société ? Présente les avantages, les difficultés et le rôle des professionnels de santé (20 à 25 lignes).",points:30,reponses:[{t:`Le vieillissement de la population est une réalité qui concerne l'ensemble de la société. Avec l'âge, certaines personnes rencontrent des difficultés pour réaliser les gestes de la vie quotidienne. Il est donc important de préserver leur autonomie le plus longtemps possible.

Tout d'abord, rester autonome permet à une personne âgée de conserver sa liberté et sa dignité. Par exemple, pouvoir choisir ses vêtements, préparer un repas simple ou participer à ses déplacements contribue à maintenir son indépendance.

Ensuite, le maintien à domicile peut favoriser le bien-être. La personne reste dans un environnement qu'elle connaît et conserve ses habitudes. Les professionnels de santé peuvent intervenir pour assurer les soins et accompagner les gestes devenus difficiles.

Cependant, cette solution présente certaines limites. Une personne vivant seule peut être confrontée à l'isolement ou à des risques d'accident domestique. Les proches aidants peuvent également être épuisés par leurs responsabilités.

Pour conclure, préserver l'autonomie des personnes âgées doit être une priorité. Il faut cependant adapter l'accompagnement à chaque situation, afin de garantir leur sécurité tout en respectant leurs choix et leur dignité.`,ok:!0,note:"30/30",why:"C'est la rédaction modèle du corrigé : avantages, difficultés et rôle des professionnels, avec une conclusion nuancée."},{t:"Oui, l'autonomie des personnes âgées doit être une priorité. C'est très important pour elles et pour la société. Il faut tout faire pour qu'elles restent autonomes, car l'autonomie est essentielle. C'est pourquoi c'est une priorité.",ok:!1,note:"6/30",why:"Tu répètes la même idée sans arguments ni exemples, et tu oublies les difficultés et le rôle des professionnels."},{t:"Avantages : habitudes, liberté. Difficultés : isolement, chutes, aidants fatigués. Rôle des professionnels : soins, aide à la toilette.",ok:!1,note:"10/30",why:"Le contenu est pertinent, mais présenté en notes : il faut une introduction, des paragraphes rédigés et une conclusion."},{t:"Je pense qu'il vaut mieux placer toutes les personnes âgées en maison de retraite, car c'est plus sûr et leurs enfants peuvent continuer à travailler sans s'inquiéter.",ok:!1,note:"4/30",why:"Position non argumentée, qui ignore le respect des choix de la personne souligné par le texte."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement la question de réflexion ?",opts:[{t:"Dire si l'autonomie des personnes âgées doit être une priorité, en présentant avantages, difficultés et rôle des professionnels.",ok:!0,why:"La consigne indique elle-même les trois parties attendues."},{t:"Décrire une maison de retraite.",ok:!1,why:"Hors-sujet."},{t:"Raconter la vie de ses grands-parents.",ok:!1,why:"Anecdote personnelle, pas une argumentation."},{t:"Définir le mot « autonomie » seulement.",ok:!1,why:"Une définition ne suffit pas à répondre."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Les avantages de l'autonomie et du domicile — II. Les difficultés — III. Le rôle des professionnels.",ok:!0,why:"Il suit exactement les trois éléments demandés."},{t:"I. L'enfance — II. L'âge adulte — III. La vieillesse.",ok:!1,why:"Plan chronologique sans lien avec la question."},{t:"I. Pour les EHPAD — II. Contre les EHPAD.",ok:!1,why:"Débat déplacé par rapport à la consigne."},{t:"Une liste d'aides financières.",ok:!1,why:"Hors-sujet."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Rester autonome préserve la dignité, car la personne garde le contrôle de sa vie. Par exemple, choisir ses vêtements ou préparer un repas simple l'aide à rester indépendante. »",ok:!0,why:"Idée, justification, exemple."},{t:"« Les personnes âgées sont nombreuses. »",ok:!1,why:"Constat sans argument."},{t:"« L'autonomie, c'est important. »",ok:!1,why:"Affirmation vide."},{t:"« Les aidants sont fatigués. »",ok:!1,why:"Idée juste mais ni développée ni reliée à la question."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« L'espérance de vie augmente, mais certaines personnes âgées perdent en autonomie. Faut-il en faire une priorité ? Nous verrons les avantages, les difficultés, puis le rôle des soignants. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« Ma grand-mère a 90 ans. »",ok:!1,why:"Anecdote en introduction."},{t:"« Vieillir, c'est la vie. »",ok:!1,why:"Formule creuse."},{t:"« Je vais parler des vieux. »",ok:!1,why:"Registre familier et pas de problématique."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les personnes âgées souhaitent souvent rester chez elles. »",ok:!0,why:"Phrase correcte."},{t:"« Les personnes âgée souhaite souvent rester chez elle. »",ok:!1,why:"Fautes d'accord : « âgées », « souhaitent », « elles »."},{t:"« Les vieux, ils veulent rester chez eux. »",ok:!1,why:"Registre familier."},{t:"« Les personnes âgées, souhaitent souvent, rester chez elles. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Préserver l'autonomie des personnes âgées doit être une priorité, en adaptant l'accompagnement à chacun pour concilier sécurité, choix et dignité. »",ok:!0,why:"Réponse claire et nuancée à la question."},{t:"« En conclusion, vieillir est difficile. »",ok:!1,why:"Ne répond pas à la question."},{t:"« Pour finir, parlons des jeunes. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« Voilà. »",ok:!1,why:"Pas une conclusion."}]}]},"pdf-santementale":{copies:[{q:"Pourquoi la santé mentale ne se limite-t-elle pas à l'absence de maladie psychique ?",points:4,reponses:[{t:"La santé mentale ne se limite pas à l'absence de maladie psychique, car elle comprend aussi le bien-être émotionnel, psychologique et social. Une personne sans maladie diagnostiquée peut donc tout de même aller mal.",ok:!0,note:"4/4",why:"La définition élargie du corrigé, avec une conséquence bien tirée."},{t:"Parce que tout le monde peut être malade.",ok:!1,note:"0,5/4",why:"Réponse vague, qui ne reprend pas la définition du texte."},{t:"Elle concerne « le bien-être émotionnel, psychologique et social ».",ok:!1,note:"2/4",why:"Juste mais recopié, sans phrase rédigée."},{t:"La santé mentale, c'est quand on va voir un psychiatre.",ok:!1,note:"0/4",why:"Contresens : la santé mentale concerne tout le monde, pas seulement les personnes suivies."}]},{q:"Cite quatre facteurs pouvant fragiliser la santé mentale des jeunes.",points:4,reponses:[{t:"Le texte cite plusieurs facteurs qui peuvent fragiliser la santé mentale des jeunes, par exemple les difficultés scolaires, les problèmes familiaux, la précarité et l'isolement. Les discriminations en font aussi partie.",ok:!0,note:"4/4",why:"Quatre facteurs du texte (le corrigé accepte n'importe lesquels des cinq), en phrases."},{t:"Les difficultés scolaires, les problèmes familiaux.",ok:!1,note:"2/4",why:"Deux facteurs sur quatre."},{t:"Le sport, la musique, les amis et les vacances.",ok:!1,note:"0/4",why:"Ce ne sont pas des facteurs de fragilisation, et ils ne sont pas dans le texte."},{t:"Les réseaux sociaux, les écrans, les jeux vidéo et la télévision.",ok:!1,note:"0,5/4",why:"Le texte cite les réseaux sociaux à part ; les autres éléments ne sont pas dans le texte."}]},{q:"Donne deux effets positifs et deux effets négatifs possibles des réseaux sociaux.",points:4,reponses:[{t:"Les réseaux sociaux ont des effets positifs : ils facilitent les échanges et permettent de maintenir des liens à distance. Ils ont aussi des effets négatifs lorsqu'ils sont utilisés de manière excessive : ils favorisent la comparaison sociale et peuvent provoquer des troubles du sommeil ou un sentiment d'exclusion.",ok:!0,note:"4/4",why:"Deux effets positifs et deux négatifs, clairement séparés, conformes au corrigé."},{t:"Les réseaux sociaux sont mauvais pour la santé car ils rendent dépendant.",ok:!1,note:"0,5/4",why:"Aucun effet positif, et l'effet cité n'est pas celui du texte."},{t:"Positif : échanger. Négatif : comparaison sociale, troubles du sommeil.",ok:!1,note:"2,5/4",why:"Il manque un effet positif, et la réponse n'est pas rédigée."},{t:"Positifs : communiquer avec ses amis et s'informer. Négatifs : perdre son temps et voir de la publicité.",ok:!1,note:"1,5/4",why:"Un effet positif juste ; les autres ne viennent pas du texte."}]},{q:"Pourquoi certaines personnes hésitent-elles à demander de l'aide ?",points:4,reponses:[{t:"Certaines personnes hésitent à demander de l'aide par peur d'être jugées, à cause des préjugés qui entourent les troubles psychiques, ou parce qu'elles minimisent leur propre souffrance et pensent qu'elle n'est pas assez grave.",ok:!0,note:"4/4",why:"Les trois freins du corrigé : jugement, préjugés, minimisation."},{t:"Parce qu'elles ont honte.",ok:!1,note:"1/4",why:"Idée proche, mais trop courte et non expliquée."},{t:"Parce que les psychologues sont trop chers.",ok:!1,note:"0/4",why:"Le texte ne parle pas du coût."},{t:"La peur du jugement et les idées reçues.",ok:!1,note:"2,5/4",why:"Deux freins justes, sans phrase rédigée ni explication."}]},{q:"Cite trois moyens de prévention évoqués ou suggérés par le texte.",points:4,reponses:[{t:"Le texte évoque trois moyens de prévention : informer la population sur la santé mentale, favoriser l'écoute, et faciliter l'accès à des professionnels compétents.",ok:!0,note:"4/4",why:"Les trois moyens du corrigé, rédigés."},{t:"Interdire les réseaux sociaux aux moins de 18 ans.",ok:!1,note:"0/4",why:"Ce moyen n'est ni évoqué ni suggéré par le texte."},{t:"L'information et l'écoute.",ok:!1,note:"2/4",why:"Deux moyens sur trois : il manque l'accès aux professionnels."},{t:"Il faut faire de la prévention auprès des jeunes.",ok:!1,note:"0,5/4",why:"Tu répètes la question sans citer de moyens."}]},{q:"Les problèmes de santé mentale chez les jeunes sont-ils suffisamment pris en considération par la société ? Développe ton point de vue en présentant les difficultés, les conséquences et les solutions possibles (20 à 25 lignes).",points:30,reponses:[{t:`La santé mentale est un sujet de plus en plus présent dans notre société. Les jeunes peuvent être confrontés à différentes difficultés qui affectent leur bien-être psychologique. Pourtant, ces problèmes ne sont pas toujours suffisamment reconnus.

Tout d'abord, les jeunes peuvent subir une pression importante liée aux études, à leur avenir professionnel ou à leur situation familiale. Les réseaux sociaux peuvent également renforcer le sentiment de comparaison et d'exclusion.

Ensuite, les conséquences peuvent être importantes. Certaines personnes peuvent s'isoler, perdre confiance en elles ou rencontrer des difficultés dans leur vie quotidienne. Lorsqu'une souffrance psychologique n'est pas prise en charge, elle peut s'aggraver.

Il est donc essentiel de développer la prévention. Les établissements scolaires pourraient renforcer les actions de sensibilisation et faciliter l'accès à des professionnels. Les familles et les proches ont également un rôle important en étant attentifs aux changements de comportement.

Enfin, il faut lutter contre les préjugés. Une personne souffrant psychologiquement ne doit pas être considérée comme faible. Demander de l'aide est au contraire une démarche positive.

Pour conclure, la santé mentale des jeunes mérite une attention particulière. L'information, l'écoute et l'accès aux soins doivent être renforcés pour éviter que certaines souffrances restent invisibles.`,ok:!0,note:"30/30",why:"C'est la rédaction modèle du corrigé : difficultés, conséquences, solutions et lutte contre les préjugés, avec une position claire."},{t:"Non, la société ne prend pas assez en compte la santé mentale des jeunes. C'est un vrai problème. Les jeunes vont mal et personne ne fait rien. Il faudrait que ça change rapidement.",ok:!1,note:"5/30",why:"Une opinion répétée, sans difficultés, conséquences ni solutions développées."},{t:"Les jeunes passent trop de temps sur leur téléphone. C'est la faute des réseaux sociaux s'ils vont mal. Les parents devraient confisquer les téléphones et les jeunes iraient beaucoup mieux.",ok:!1,note:"6/30",why:"Une cause unique et une solution simpliste : le texte cite de nombreux autres facteurs."},{t:"Les jeunes subissent la pression des études et l'isolement. Cela peut les rendre tristes et les isoler davantage. Il faudrait plus de psychologues dans les écoles.",ok:!1,note:"13/30",why:"Les trois éléments sont présents mais à peine développés : il manque une introduction, des exemples et une conclusion."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement la question de réflexion ?",opts:[{t:"Donner un avis argumenté sur la prise en compte de la santé mentale des jeunes, en présentant difficultés, conséquences et solutions.",ok:!0,why:"La consigne indique la question et les trois éléments attendus."},{t:"Lister les maladies psychiatriques.",ok:!1,why:"Hors-sujet."},{t:"Raconter un moment difficile de sa jeunesse.",ok:!1,why:"Anecdote personnelle, pas une argumentation."},{t:"Critiquer les réseaux sociaux.",ok:!1,why:"Un seul aspect, trop étroit."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Les difficultés des jeunes — II. Leurs conséquences — III. Les solutions et la lutte contre les préjugés.",ok:!0,why:"Il reprend les trois éléments demandés, dans un ordre logique."},{t:"I. Facebook — II. Instagram — III. TikTok.",ok:!1,why:"Plan hors sujet."},{t:"I. Les adultes — II. Les personnes âgées.",ok:!1,why:"Le sujet porte sur les jeunes."},{t:"Une seule partie sur l'école.",ok:!1,why:"Trop limité."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Une souffrance non prise en charge peut s'aggraver, car le jeune s'isole davantage. Par exemple, un élève qui n'ose pas parler de son anxiété peut décrocher scolairement. »",ok:!0,why:"Idée, justification, exemple."},{t:"« La santé mentale, c'est important. »",ok:!1,why:"Affirmation vide."},{t:"« Les jeunes sont fragiles. »",ok:!1,why:"Généralisation sans argument."},{t:"« Il faut des psychologues. »",ok:!1,why:"Solution non justifiée."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« La santé mentale des jeunes est de plus en plus évoquée, mais reste mal reconnue. Est-elle assez prise en compte ? Nous verrons les difficultés, leurs conséquences, puis les solutions. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« Les jeunes d'aujourd'hui sont trop sensibles. »",ok:!1,why:"Jugement sans fondement."},{t:"« Je vais parler de la dépression. »",ok:!1,why:"Trop pauvre et trop étroit."},{t:"« Depuis toujours, l'homme est triste. »",ok:!1,why:"Accroche creuse."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Demander de l'aide est une démarche positive. »",ok:!0,why:"Phrase correcte."},{t:"« Demander de l'aide sont une démarche positif. »",ok:!1,why:"Fautes d'accord : « est », « positive »."},{t:"« Demander de l'aide, c'est pas la honte. »",ok:!1,why:"Registre familier et négation incomplète."},{t:"« Demander, de l'aide est, une démarche positive. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« La santé mentale des jeunes mérite plus d'attention : information, écoute et accès aux soins doivent être renforcés pour qu'aucune souffrance ne reste invisible. »",ok:!0,why:"Réponse claire à la question et rappel des solutions."},{t:"« Bref, faut aller voir un psy. »",ok:!1,why:"Familier et sans bilan."},{t:"« Pour finir, parlons du sport. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« J'ai fini. »",ok:!1,why:"Pas une conclusion."}]}]},"pdf-acces":{copies:[{q:"Qu'appelle-t-on un désert médical ?",points:4,reponses:[{t:"On appelle désert médical un territoire où le nombre de professionnels de santé, notamment de médecins, est insuffisant par rapport aux besoins de la population. Il s'agit souvent de zones rurales ou de certaines zones périurbaines.",ok:!0,note:"4/4",why:"Définition du corrigé, complétée par les types de territoires cités dans le texte."},{t:"Un désert médical est un désert où il n'y a pas d'hôpital.",ok:!1,note:"0/4",why:"Sens littéral : le texte parle de territoires habités qui manquent de médecins."},{t:"C'est un endroit où il manque des médecins.",ok:!1,note:"2/4",why:"Idée juste mais imprécise : il faut parler du rapport entre l'offre et les besoins."},{t:"Un désert médical, ce sont les zones rurales.",ok:!1,note:"1/4",why:"Tu donnes un exemple de lieu, pas une définition."}]},{q:"Quelles conséquences peuvent découler du manque de professionnels de santé ?",points:4,reponses:[{t:"Le manque de professionnels de santé entraîne des délais d'attente importants pour obtenir un rendez-vous, des déplacements longs, et parfois un renoncement aux soins.",ok:!0,note:"4/4",why:"Les conséquences du corrigé, en une phrase claire."},{t:"Les médecins sont débordés et fatigués.",ok:!1,note:"0,5/4",why:"Ce n'est pas ce que dit le texte, qui parle des conséquences pour les patients."},{t:"Des délais d'attente.",ok:!1,note:"1,5/4",why:"Une seule conséquence, sans phrase."},{t:"Les gens vont aux urgences, attendent longtemps et renoncent parfois à se soigner.",ok:!1,note:"2,5/4",why:"Deux conséquences justes, mais les urgences ne sont pas citées dans ce texte et les déplacements longs manquent."}]},{q:"Quelles populations sont particulièrement touchées ?",points:4,reponses:[{t:"Les populations particulièrement touchées sont les personnes âgées, les personnes en situation de handicap et les personnes disposant de faibles ressources.",ok:!0,note:"4/4",why:"Les trois populations du texte."},{t:"Les enfants et les sportifs.",ok:!1,note:"0/4",why:"Ces populations ne sont pas citées dans le texte."},{t:"Les personnes âgées.",ok:!1,note:"1,5/4",why:"Une population sur trois."},{t:"Les habitants des campagnes.",ok:!1,note:"1/4",why:"Tu cites un lieu de vie, alors que la question porte sur des populations fragiles."}]},{q:"Cite trois solutions permettant d'améliorer l'accès aux soins.",points:4,reponses:[{t:"Le texte propose plusieurs solutions, par exemple développer les maisons de santé pluriprofessionnelles, favoriser la télémédecine et améliorer l'attractivité des territoires pour les professionnels. Le renforcement des équipes de soins en fait aussi partie.",ok:!0,note:"4/4",why:"Au moins trois solutions du corrigé, rédigées."},{t:"Obliger les médecins à s'installer à la campagne.",ok:!1,note:"0/4",why:"Cette solution n'est pas dans le texte."},{t:"Télémédecine, maisons de santé.",ok:!1,note:"2/4",why:"Deux solutions sur trois, sans phrase."},{t:"Il faut améliorer l'accès aux soins pour tous.",ok:!1,note:"0,5/4",why:"Tu répètes l'objectif sans citer de solution."}]},{q:"Pourquoi la télémédecine ne peut-elle pas remplacer toutes les consultations ?",points:4,reponses:[{t:"La télémédecine ne peut pas remplacer toutes les consultations, car certaines situations nécessitent un examen physique, un contact direct ou des gestes médicaux. La relation de confiance entre le patient et le professionnel reste aussi essentielle.",ok:!0,note:"4/4",why:"Les limites du corrigé, avec l'importance de la relation de confiance soulignée par le texte."},{t:"Parce que tout le monde n'a pas internet.",ok:!1,note:"1/4",why:"C'est une vraie limite, mais ce n'est pas celle du texte."},{t:"Parce que la télémédecine ne marche pas bien.",ok:!1,note:"0/4",why:"Affirmation vague et non justifiée."},{t:"Parce que le médecin doit parfois examiner le patient.",ok:!1,note:"2/4",why:"Une raison juste mais incomplète : il manque le contact humain et la relation de confiance."}]},{q:"L'accès aux soins devrait-il être identique pour tous les citoyens, quel que soit leur lieu de résidence ? Argumente ta réponse en utilisant des exemples concrets (20 à 25 lignes).",points:30,reponses:[{t:`L'accès aux soins est un élément essentiel de notre système de santé. Pourtant, selon leur lieu de résidence, les citoyens ne disposent pas toujours des mêmes possibilités pour consulter un professionnel de santé. Cette situation soulève une question importante d'égalité.

Tout d'abord, chaque personne devrait pouvoir bénéficier de soins adaptés à ses besoins, quel que soit son lieu de résidence. Une personne vivant dans une zone rurale ne devrait pas avoir davantage de difficultés à consulter un médecin qu'une personne habitant dans une grande ville.

Ensuite, les déserts médicaux peuvent entraîner des conséquences importantes. Les patients peuvent attendre plusieurs semaines pour obtenir un rendez-vous ou devoir parcourir de longues distances. Certaines personnes finissent même par renoncer à consulter.

Pour améliorer cette situation, plusieurs solutions peuvent être développées. Les maisons de santé permettent de regrouper différents professionnels. La télémédecine peut également faciliter certaines consultations, notamment pour les personnes ayant des difficultés à se déplacer.

Cependant, les outils numériques ne remplacent pas le contact humain. Certaines situations nécessitent un examen physique et une relation directe entre le patient et le professionnel.

Pour conclure, l'égalité d'accès aux soins doit être un objectif prioritaire. Il est nécessaire de développer des solutions adaptées aux territoires afin que chacun puisse être accompagné correctement.`,ok:!0,note:"30/30",why:"C'est la rédaction modèle du corrigé : principe d'égalité, conséquences, solutions et limite du numérique, avec une conclusion claire."},{t:"Oui, tout le monde doit avoir les mêmes droits. C'est normal, on est en France et c'est l'égalité. Il n'est pas juste que certains aient un médecin et pas d'autres.",ok:!1,note:"5/30",why:"Position juste mais non argumentée, sans exemples concrets ni structure."},{t:"Non, car les gens qui habitent à la campagne ont choisi d'y vivre. Ils savent qu'il y a moins de médecins et doivent accepter de faire de la route.",ok:!1,note:"6/30",why:"Position possible, mais non nuancée et contraire au principe d'égalité rappelé par le texte, sans exemples développés."},{t:"Dans ma ville, il faut trois semaines pour voir un médecin. Ma mère a dû faire 40 minutes de route pour un rendez-vous. C'est pour cela que je veux devenir infirmier, pour aider ces patients.",ok:!1,note:"4/30",why:"Un exemple personnel n'est pas une argumentation, et la fin dérive vers ta motivation."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement la question de réflexion ?",opts:[{t:"Dire si l'accès aux soins devrait être le même partout, en argumentant avec des exemples concrets.",ok:!0,why:"Tu repères la question d'égalité et la consigne d'exemples."},{t:"Expliquer comment devenir médecin.",ok:!1,why:"Hors-sujet."},{t:"Comparer la France et d'autres pays.",ok:!1,why:"La question porte sur les lieux de résidence en France."},{t:"Décrire la télémédecine en détail.",ok:!1,why:"Un aspect seulement, pas la question posée."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Un principe d'égalité — II. Une réalité inégale et ses conséquences — III. Des solutions et leurs limites.",ok:!0,why:"Plan progressif : le principe, le constat, puis les réponses."},{t:"I. La ville — II. La campagne — III. La montagne.",ok:!1,why:"Plan descriptif sans argumentation."},{t:"I. Mon médecin traitant — II. Mon pharmacien.",ok:!1,why:"Plan personnel."},{t:"Une seule partie sur les urgences.",ok:!1,why:"Trop étroit."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Les déserts médicaux créent des inégalités, car certains patients renoncent à se soigner. Par exemple, une personne âgée sans voiture peut abandonner un suivi faute de médecin proche. »",ok:!0,why:"Idée, justification, exemple concret."},{t:"« L'égalité, c'est important. »",ok:!1,why:"Affirmation vide."},{t:"« Il y a moins de médecins à la campagne. »",ok:!1,why:"Constat sans argument."},{t:"« La télémédecine, c'est l'avenir. »",ok:!1,why:"Slogan non justifié."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Selon leur lieu de vie, les citoyens n'ont pas le même accès aux soins. L'accès devrait-il être identique pour tous ? Nous verrons le principe d'égalité, la réalité des déserts médicaux, puis les solutions. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« J'habite en ville. »",ok:!1,why:"Anecdote hors propos."},{t:"« La santé, c'est précieux. »",ok:!1,why:"Formule creuse."},{t:"« Je vais parler des médecins. »",ok:!1,why:"Trop vague."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Certaines personnes doivent parcourir de longues distances pour consulter. »",ok:!0,why:"Phrase correcte."},{t:"« Certaines personnes doit parcourir de longue distances pour consulté. »",ok:!1,why:"Fautes : « doivent », « longues », « consulter »."},{t:"« Y a des gens qui font des kilomètres pour voir un docteur. »",ok:!1,why:"Registre oral."},{t:"« Certaines personnes, doivent parcourir, de longues distances. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« L'égalité d'accès aux soins doit rester un objectif prioritaire, avec des solutions adaptées à chaque territoire pour que chacun soit correctement accompagné. »",ok:!0,why:"Elle répond à la question et rappelle les solutions."},{t:"« En conclusion, c'est injuste. »",ok:!1,why:"Trop pauvre."},{t:"« Pour finir, parlons du prix des médicaments. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« Voilà ce que je pense. »",ok:!1,why:"Pas une conclusion."}]}]},"pdf-ethique":{copies:[{q:"Pourquoi la prise en charge d'un patient ne se limite-t-elle pas aux soins techniques ?",points:4,reponses:[{t:"La prise en charge ne se limite pas aux soins techniques, car le patient a aussi des besoins physiques, psychologiques et sociaux. Sa dignité, son intimité, ses choix et ses émotions doivent être respectés.",ok:!0,note:"4/4",why:"La réponse du corrigé : les différents besoins du patient et le respect de sa personne."},{t:"Parce que les soins techniques ne servent pas à grand-chose.",ok:!1,note:"0/4",why:"Contresens : les soins techniques restent indispensables, ils ne suffisent simplement pas."},{t:"Parce qu'il faut respecter sa « dignité, son intimité, ses choix et ses besoins ».",ok:!1,note:"2/4",why:"Juste mais recopié, sans explication."},{t:"Parce que le patient est un être humain.",ok:!1,note:"1/4",why:"Idée juste mais trop générale, sans les éléments du texte."}]},{q:"Donne quatre exemples de comportements relevant de la bientraitance.",points:4,reponses:[{t:"Plusieurs comportements relèvent de la bientraitance : écouter le patient, lui expliquer les soins, respecter son intimité et adapter les soins à son rythme.",ok:!0,note:"4/4",why:"Les quatre comportements du corrigé."},{t:"Être gentil, souriant.",ok:!1,note:"1/4",why:"Deux attitudes vagues au lieu de quatre comportements concrets."},{t:"Faire les soins vite pour ne pas déranger le patient.",ok:!1,note:"0/4",why:"Contraire au texte, qui insiste sur le temps pris pour écouter et expliquer."},{t:"Écouter le patient et lui expliquer les soins.",ok:!1,note:"2/4",why:"Deux comportements sur quatre."}]},{q:"Quelles contraintes peuvent fragiliser la qualité de l'accompagnement ?",points:4,reponses:[{t:"Plusieurs contraintes peuvent fragiliser la qualité de l'accompagnement : le manque de temps, les effectifs insuffisants, la fatigue des professionnels et les situations d'urgence.",ok:!0,note:"4/4",why:"Les quatre contraintes du texte."},{t:"Les patients difficiles et les familles exigeantes.",ok:!1,note:"0/4",why:"Ces contraintes ne sont pas citées dans le texte."},{t:"Le manque de temps et la fatigue.",ok:!1,note:"2/4",why:"Deux contraintes sur quatre."},{t:"Le manque de matériel médical.",ok:!1,note:"0,5/4",why:"Contrainte réelle, mais absente du texte."}]},{q:"Pourquoi le consentement du patient est-il important ?",points:4,reponses:[{t:"Le consentement est important, car il permet au patient de participer aux décisions concernant sa santé. Il garantit le respect de ses droits et de son autonomie. Pour cela, le patient doit recevoir des informations compréhensibles, et son refus doit être entendu.",ok:!0,note:"4/4",why:"Réponse du corrigé, enrichie par les conditions du consentement données dans le texte."},{t:"Parce que sinon l'hôpital peut avoir des problèmes avec la justice.",ok:!1,note:"0,5/4",why:"Raison secondaire : le texte met en avant les droits et l'autonomie du patient."},{t:"Parce que le patient doit être d'accord.",ok:!1,note:"1,5/4",why:"Vrai mais tautologique : pourquoi son accord compte-t-il ?"},{t:"Le consentement permet au médecin de décider à la place du patient.",ok:!1,note:"0/4",why:"Contresens complet."}]},{q:"Quel est l'intérêt du travail en équipe dans les soins ?",points:4,reponses:[{t:"Le travail en équipe facilite le partage des informations utiles, améliore la coordination des soins, aide à prévenir les erreurs et assure la continuité de la prise en charge.",ok:!0,note:"4/4",why:"Les quatre intérêts du corrigé."},{t:"Le travail en équipe permet de se répartir le travail et de
