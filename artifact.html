/jour en ${n} prises, pour un enfant de ${t} kg. Le sirop est dosé à ${s} mg/mL. Quel volume donner à chaque prise ?`,ans:K(r),unit:"mL",steps:[`Dose par jour : ${e} × ${t} = ${e*t} mg`,`Dose par prise : ${e*t} ÷ ${n} = ${k(e*t/n)} mg`,`Volume : ${k(e*t/n)} ÷ ${s} = ${k(r)} mL`]}},()=>{let e,t,n;do e=T([40,60,80,90,100,120,150,160,200]),t=B(5,20)*15,n=e*t/60;while(!Number.isInteger(n));return{q:`Une perfusion de ${k(n)} mL doit passer en ${Dn(t)}. Quel est le débit en mL/h ?`,ans:e,unit:"mL/h",steps:[`Durée en heures : ${t} min ÷ 60 = ${k(t/60)} h`,`Débit : ${k(n)} ÷ ${k(t/60)} = ${k(e)} mL/h`,t%60?`Piège : ${Dn(t)} = ${k(t/60)} h, et non ${Math.floor(t/60)},${t%60} h.`:"Pense à convertir la durée en heures avant de diviser."]}},()=>{const e=T([24,36,45,48,60,75]),t=B(150,900),n=Math.floor(t/e),s=t-n*e;return{q:`Un service consomme ${e} boîtes de gants par semaine. Il en reste ${t} en stock. Pendant combien de semaines complètes le stock suffira-t-il ?`,ans:n,unit:"semaines",steps:[`${t} ÷ ${e} ≈ ${k(Math.round(t/e*100)/100)}`,`On ne garde que les semaines complètes : ${n} semaines`,`Il restera ${s} boîte${s>1?"s":""}, pas assez pour une semaine de plus.`]}}],sujets:Ym.map(e=>()=>({q:`${e.q} (Sujet : ${e.sujet})`,ans:e.ans,unit:e.unit,steps:e.steps}))};function ma(e){const t=T(e);return{kind:"num",tol:.001,...T(Gm[t])(),cat:t}}function Xm(e=12){const t=Object.keys(_t);let n=[];for(;n.length<e;)n.push(...wn(t));return n.slice(0,e).map(s=>ma([s]))}function Fc(e,t){if(t=String(t||"").trim(),!t)return null;if(e.kind==="time"){const r=t.match(/(\d{1,2})\s*[hH:]\s*(\d{1,2})?/);return r?(Number(r[1])*60+Number(r[2]||0))%1440===e.ans:null}const n=t.replace(/\s/g,"").replace(",",".").replace(/[^\d.-]/g,""),s=parseFloat(n);return Number.isNaN(s)?null:Math.abs(s-e.ans)<=e.tol}const Oc=e=>e.kind==="time"?_e(e.ans):`${k(e.ans)}${e.unit?" "+e.unit:""}`,qs={deroule:"L'épreuve",parcours:"Ton parcours",motivation:"Tes motivations",metier:"Connaissance du métier",qualites:"Qualités et mises en situation",formation:"Suivre la formation"},Vc=[{id:"d1",theme:"deroule",jury:!1,q:"Combien de temps dure l'entretien oral ?",opts:[{t:"10 minutes",ok:!1,why:"C'est trop court : l'entretien dure deux fois plus."},{t:"20 minutes",ok:!0,why:"C'est la durée fixée par le document officiel de l'ARS."},{t:"30 minutes",ok:!1,why:"30 minutes, c'est la durée de chaque sous-épreuve écrite, pas de l'oral."},{t:"45 minutes",ok:!1,why:"Beaucoup trop long : l'entretien dure 20 minutes."}],tip:"Prévois une présentation de 2 à 3 minutes : le reste du temps sert aux questions du jury."},{id:"d2",theme:"deroule",jury:!1,q:"Comment l'oral est-il noté ?",opts:[{t:"Sur 20, et une note inférieure à 8/20 est éliminatoire",ok:!0,why:"C'est la règle : l'oral et l'écrit sont chacun notés sur 20, et sous 8/20 à l'un des deux, la candidature est éliminée."},{t:"Sur 20, et une note inférieure à 10/20 est éliminatoire",ok:!1,why:"Le seuil éliminatoire est 8/20, pas 10/20."},{t:"Sur 10, et une note inférieure à 5/10 est éliminatoire",ok:!1,why:"L'oral est noté sur 20."},{t:"Il n'est pas noté : le jury donne seulement un avis",ok:!1,why:"L'oral est bien noté sur 20 et compte pour la moitié du total."}]},{id:"d3",theme:"deroule",jury:!1,q:"Sur quoi s'appuie l'entretien ?",opts:[{t:"Sur le dossier déposé à l'inscription : CV, lettre de candidature, diplômes, attestations",ok:!0,why:"Le jury s'appuie sur ton dossier pour apprécier ton expérience, ton projet et tes motivations."},{t:"Sur un texte d'actualité tiré au sort",ok:!1,why:"Ce n'est pas le format de l'oral FPC : il porte sur ton expérience et ton projet."},{t:"Sur ta copie de rédaction",ok:!1,why:"La rédaction est évaluée séparément, à l'écrit."},{t:"Sur un cas clinique à résoudre",ok:!1,why:"On n'attend pas de connaissances techniques de soins : c'est l'objet de la formation."}],tip:"Relis ton dossier avant l'entretien : chaque ligne de ton CV et de ta lettre peut donner lieu à une question."},{id:"d4",theme:"deroule",jury:!1,q:"Quelle pièce du dossier sert à exposer ton projet professionnel ?",opts:[{t:"La lettre de candidature",ok:!0,why:"Le document officiel précise que la lettre de candidature expose le projet professionnel."},{t:"Le curriculum vitae",ok:!1,why:"Le CV présente ton parcours, mais ne développe pas ton projet."},{t:"L'attestation employeur",ok:!1,why:"Elle prouve ton expérience, elle n'explique pas ton projet."},{t:"La copie de la pièce d'identité",ok:!1,why:"Elle sert seulement à t'identifier."}]},{id:"d5",theme:"deroule",jury:!1,q:"L'oral peut-il avoir lieu avant l'épreuve écrite du 9 décembre ?",opts:[{t:"Oui : les entretiens ont lieu du 16 novembre au 8 janvier, et il n'y a pas d'épreuve d'admissibilité",ok:!0,why:"C'est écrit dans le calendrier officiel. Il faut donc être prêt pour l'oral dès mi-novembre."},{t:"Non : il faut d'abord réussir l'écrit",ok:!1,why:"Il n'y a pas d'épreuve d'admissibilité : l'oral peut précéder l'écrit."},{t:"Seulement pour les aides-soignants",ok:!1,why:"Le calendrier est le même pour tous les candidats FPC."},{t:"Seulement si le dossier est incomplet",ok:!1,why:"La date dépend de ta convocation, pas de l'état de ton dossier."}]},{id:"d6",theme:"deroule",jury:!1,q:"Que faut-il obtenir au total pour être admis ?",opts:[{t:"Au moins 20/40, sans note inférieure à 8/20 à l'oral ou à l'écrit",ok:!0,why:"C'est la règle du document officiel. Ensuite, le classement décide de l'IFSI où tu es affecté."},{t:"Au moins 24/40",ok:!1,why:"Le minimum est 20/40."},{t:"Au moins 10/20 à l'oral seulement",ok:!1,why:"L'admission dépend du total oral + écrit."},{t:"Au moins 30/40",ok:!1,why:"Le minimum est 20/40, même si une meilleure note améliore ton classement."}]},{id:"d7",theme:"deroule",jury:!1,q:"Le jury évalue ta façon de t'exprimer. Qu'est-ce que cela veut dire concrètement ?",opts:[{t:"Ordonner tes idées et argumenter de façon cohérente",ok:!0,why:"C'est l'objectif cité par le document officiel : s'exprimer et ordonner ses idées pour argumenter."},{t:"Employer le plus de vocabulaire médical possible",ok:!1,why:"Le jargon n'impressionne pas le jury s'il n'est pas maîtrisé. La clarté compte plus."},{t:"Parler le plus longtemps possible",ok:!1,why:"Des réponses trop longues donnent une impression de manque de structure."},{t:"Réciter une présentation apprise par cœur",ok:!1,why:"Le jury repère vite un texte récité, et cela empêche un vrai échange."}]},{id:"p1",theme:"parcours",jury:!0,q:"Pouvez-vous vous présenter ?",opts:[{t:"Une présentation de 2 à 3 minutes : qui je suis, mon parcours en informatique et ce que j'y ai développé, ce qui a fait naître mon projet, où j'en suis aujourd'hui.",ok:!0,why:"Structurée, courte et orientée vers ton projet : le jury a un fil à suivre et des pistes pour ses questions."},{t:"Je raconte toute ma carrière année par année depuis le lycée.",ok:!1,why:"Trop long et sans fil conducteur : le jury veut comprendre ton projet, pas ta chronologie complète."},{t:"Je donne mon nom, je dis que je veux être infirmier et j'attends les questions.",ok:!1,why:"Trop court : tu laisses passer ta meilleure occasion de montrer ton projet."},{t:"Je commence par ce que je n'aimais pas dans mon ancien travail.",ok:!1,why:"Démarrer sur du négatif donne l'image d'une fuite plutôt que d'un projet."}],tip:"Prépare une trame, pas un texte : quelques mots-clés par étape suffisent."},{id:"p2",theme:"parcours",jury:!0,q:"Pourquoi quitter l'informatique ?",opts:[{t:"J'ai apprécié ce métier, en particulier l'aide aux utilisateurs. Mais je veux un métier tourné vers l'accompagnement des personnes, et ce projet s'est construit progressivement.",ok:!0,why:"Tu valorises ton passé, tu fais le lien avec ton projet et tu montres qu'il est réfléchi."},{t:"L'informatique ne m'intéressait plus, j'en avais assez des écrans.",ok:!1,why:"Cela ressemble à une fuite. Le jury veut savoir vers quoi tu vas, pas ce que tu quittes."},{t:"Le secteur infirmier recrute, c'est plus sûr pour l'emploi.",ok:!1,why:"C'est un argument réel, mais seul il ne montre aucune motivation pour le soin."},{t:"Mon ancien employeur ne reconnaissait pas mon travail.",ok:!1,why:"Critiquer un employeur donne une mauvaise image, quelle que soit la réalité."}]},{id:"p3",theme:"parcours",jury:!0,q:"Que vous apporte votre expérience en collectivité pour ce métier ?",opts:[{t:"L'écoute des agents, l'explication claire à des personnes non spécialistes, le respect des procédures et le travail en équipe. Par exemple… (situation vécue)",ok:!0,why:"Tu identifies des compétences transférables au soin et tu les prouves par un exemple."},{t:"Rien, ce sont deux mondes complètement différents.",ok:!1,why:"Tu te prives d'un atout : ton expérience contient des compétences utiles."},{t:"Je sais réparer les ordinateurs du service.",ok:!1,why:"Compétence technique sans lien avec le soin : ce n'est pas ce que le jury cherche."},{t:"Je maîtrise l'informatique, et le dossier patient est informatisé : c'est l'essentiel du métier.",ok:!1,why:"C'est un plus, mais réduire le métier à l'informatique montre une vision faussée du soin."}],tip:"Prépare 2 ou 3 situations concrètes de ton parcours que tu pourras raconter en 1 minute chacune."},{id:"p4",theme:"parcours",jury:!0,q:"Votre parcours n'a rien à voir avec la santé. Pensez-vous vraiment être à votre place ?",opts:[{t:"Je réponds calmement : je pars de zéro sur les savoirs de soins, c'est le rôle de la formation. J'apporte des compétences transférables et j'ai fait des démarches pour découvrir le métier.",ok:!0,why:"Le jury teste ta réaction à la déstabilisation. Rester posé et argumenter, c'est exactement ce qu'il attend."},{t:"Je me vexe un peu et je réponds que mon parcours vaut bien celui des autres.",ok:!1,why:"Une réaction défensive est mal perçue dans un métier où l'on gère des situations tendues."},{t:"Je reconnais que vous avez sans doute raison.",ok:!1,why:"Tu abandonnes ton projet au premier doute : le jury ne peut pas te suivre."},{t:"Je change de sujet pour parler de mes qualités.",ok:!1,why:"Esquiver la question donne l'impression que tu n'as pas de réponse."}]},{id:"p5",theme:"parcours",jury:!0,q:"Avez-vous été en contact avec le milieu du soin ?",opts:[{t:"J'ai accompagné ma mère lors de ses hospitalisations et j'ai échangé avec les infirmiers libéraux qui la soignaient, avec des infirmiers en réanimation, aux urgences et en médecine, et dans des IFSI. Puis je dis ce que j'en ai retenu.",ok:!0,why:"C'est ton vrai parcours : concret, honnête, et suivi d'une réflexion. C'est ce qui rend ta motivation crédible."},{t:"J'invente un stage pour paraître plus crédible.",ok:!1,why:"Le jury pose des questions de détail : un mensonge se repère vite et ruine l'entretien."},{t:"Non, mais je regarde beaucoup de séries médicales.",ok:!1,why:"Les séries donnent une image déformée du métier."},{t:"Non, je découvrirai le métier en formation.",ok:!1,why:"Le jury veut voir que ton choix est éclairé avant d'entrer en formation."}],tip:"Termine par ce que tu en as retenu sur le métier : c'est ce que le jury cherche derrière cette question."},{id:"p6",theme:"parcours",jury:!0,q:"Je vois que vous êtes électricien en intérim. Pouvez-vous m'expliquer ce passage ?",opts:[{t:"Après mon CDD en mairie, j'ai pris une mission d'intérim sur des chantiers. J'y ai appris la sécurité, la vigilance et le travail en équipe, des réflexes utiles en soins, et cette période a confirmé mon projet.",ok:!0,why:"Tu expliques simplement, tu valorises ce que tu y as appris et tu fais le lien avec ton projet."},{t:"J'évite le sujet et j'espère que le jury passe à autre chose.",ok:!1,why:"Tout ce qui est sur ton CV peut être questionné : prépare-toi."},{t:"C'était juste alimentaire, en attendant autre chose.",ok:!1,why:"Même si c'est en partie vrai, dit comme ça, tu dévalorises ton expérience au lieu de montrer ce qu'elle t'a apporté."},{t:"Je m'excuse longuement d'avoir changé plusieurs fois de domaine.",ok:!1,why:"Pas besoin de t'excuser : explique et valorise."}]},{id:"m1",theme:"motivation",jury:!0,q:"Pourquoi voulez-vous devenir infirmier ?",opts:[{t:"Une motivation personnelle et concrète, appuyée sur une expérience ou des échanges, et reliée à des aspects précis du métier : la relation au patient, les soins, le travail en équipe.",ok:!0,why:"Le jury veut une motivation personnelle, argumentée et ancrée dans la réalité du métier."},{t:"J'aime aider les gens.",ok:!1,why:"Sincère, mais trop vague : beaucoup de métiers permettent d'aider. Pourquoi celui-ci ?"},{t:"Pour la sécurité de l'emploi et le salaire.",ok:!1,why:"Ce ne peut pas être ta motivation principale aux yeux du jury."},{t:"Parce que les études de médecine sont trop longues.",ok:!1,why:"Cela présente le métier d'infirmier comme un choix par défaut : à éviter absolument."}],tip:"C'est LA question à préparer. Construis ta réponse autour d'un déclic, de ce que tu as découvert du métier et de ce qui te correspond."},{id:"m2",theme:"motivation",jury:!0,q:"Pourquoi maintenant ?",opts:[{t:"Mon projet a mûri. Je me suis renseigné et j'ai organisé ma situation, notamment le financement et l'organisation personnelle, pour m'engager dans trois ans de formation.",ok:!0,why:"Tu montres que le moment est choisi et préparé, pas subi."},{t:"J'ai perdu mon emploi, il faut bien que je trouve quelque chose.",ok:!1,why:"Le jury entend un choix par défaut. Même si c'est un déclencheur, mets en avant le projet."},{t:"Je ne sais pas trop, c'est arrivé comme ça.",ok:!1,why:"Cela laisse penser que ton projet n'est pas réfléchi."},{t:"Parce que les inscriptions étaient ouvertes.",ok:!1,why:"Aucun argument sur ton projet."}]},{id:"m3",theme:"motivation",jury:!0,q:"Pourquoi infirmier plutôt qu'aide-soignant ?",opts:[{t:"Je connais la différence de rôle : l'infirmier a un rôle propre, applique les prescriptions médicales et assume des responsabilités d'évaluation et de coordination des soins. C'est ce niveau de responsabilité qui m'attire, et je respecte le rôle de l'aide-soignant.",ok:!0,why:"Tu montres que tu connais les deux métiers et que ton choix est raisonné, sans dénigrer personne."},{t:"Aide-soignant, c'est un métier moins intéressant.",ok:!1,why:"Tu travailleras en binôme avec des aides-soignants : dénigrer leur métier est rédhibitoire."},{t:"Je ne connais pas bien la différence.",ok:!1,why:"Cela montre que tu ne t'es pas renseigné sur le métier."},{t:"Parce que le salaire est plus élevé.",ok:!1,why:"L'argument financier seul ne convainc pas le jury."}]},{id:"m4",theme:"motivation",jury:!0,q:"Pourquoi avoir choisi la voie de la formation professionnelle continue ?",opts:[{t:"Parce que je suis en reconversion avec une expérience professionnelle que je veux valoriser : cette voie est faite pour ce profil.",ok:!0,why:"C'est exactement la raison d'être de la voie FPC selon le document officiel."},{t:"Parce que l'écrit est plus facile que sur Parcoursup.",ok:!1,why:"Choisir par facilité donne une image peu engagée."},{t:"Pour que ma formation soit automatiquement financée.",ok:!1,why:"C'est faux : le document officiel précise que la voie FPC ne garantit pas de prise en charge financière."},{t:"Je ne savais pas qu'il existait une autre voie.",ok:!1,why:"Cela montre un manque de renseignement sur ton propre parcours."}]},{id:"m5",theme:"motivation",jury:!0,q:"Qu'est-ce qui vous attire le plus dans ce métier ?",opts:[{t:"Un aspect précis, expliqué : par exemple accompagner un patient dans la durée ou l'éducation à la santé, et pourquoi cela me correspond.",ok:!0,why:"Une réponse précise et personnelle est bien plus convaincante qu'une liste."},{t:"Tout m'attire dans ce métier.",ok:!1,why:"Trop général : le jury ne sait pas ce qui te motive vraiment."},{t:"Les urgences et l'adrénaline.",ok:!1,why:"C'est une vision réductrice : la majorité des infirmiers ne travaillent pas aux urgences."},{t:"La reconnaissance et le prestige de la blouse blanche.",ok:!1,why:"Le jury cherche une motivation tournée vers le patient, pas vers l'image."}]},{id:"m6",theme:"motivation",jury:!0,q:"Que ferez-vous si vous n'êtes pas retenu cette année ?",opts:[{t:"Je repostulerai en renforçant mon projet, par exemple avec plus d'expérience de terrain. Mon projet est durable.",ok:!0,why:"Tu montres que ton projet ne dépend pas d'une seule tentative."},{t:"J'abandonnerai le projet.",ok:!1,why:"Cela fait douter de la solidité de ta motivation."},{t:"Je ferai autre chose, j'ai plusieurs projets en parallèle.",ok:!1,why:"Le jury peut penser que le soin n'est qu'une option parmi d'autres."},{t:"Ce n'est pas possible, je dois être retenu.",ok:!1,why:"Une réponse trop rigide qui met la pression sur le jury."}]},{id:"k1",theme:"metier",jury:!1,q:"Que désigne le « rôle propre » de l'infirmier ?",opts:[{t:"Les soins que l'infirmier décide et réalise de sa propre initiative, dans son champ de compétences (hygiène, confort, surveillance, prévention…)",ok:!0,why:"On distingue le rôle propre des soins réalisés sur prescription médicale."},{t:"Les soins réalisés uniquement sur prescription médicale",ok:!1,why:"C'est l'autre volet du métier, le rôle prescrit."},{t:"Les tâches administratives du service",ok:!1,why:"Le rôle propre concerne des soins, pas l'administratif."},{t:"Les soins réalisés par l'aide-soignant",ok:!1,why:"L'aide-soignant collabore aux soins relevant du rôle propre infirmier, sous sa responsabilité."}]},{id:"k2",theme:"metier",jury:!1,q:"Quelle affirmation sur le secret professionnel est juste ?",opts:[{t:"Il s'impose à l'infirmier comme à l'étudiant en soins infirmiers, pour tout ce qu'il voit ou apprend sur le patient",ok:!0,why:"Dès ton premier stage, tu seras tenu au secret professionnel."},{t:"Il ne concerne que les médecins",ok:!1,why:"Tous les professionnels de santé y sont soumis."},{t:"On peut parler d'un patient à sa famille si on ne donne pas son nom",ok:!1,why:"Le secret couvre toute information sur le patient, nom ou pas."},{t:"Il ne s'applique pas aux étudiants en stage",ok:!1,why:"Les étudiants y sont soumis aussi."}]},{id:"k3",theme:"metier",jury:!1,q:"Avec qui l'infirmier travaille-t-il au quotidien ?",opts:[{t:"Une équipe pluriprofessionnelle : médecins, aides-soignants, kinésithérapeutes, assistants sociaux… et les proches du patient",ok:!0,why:"Le travail en équipe est au cœur du métier : le jury y sera attentif."},{t:"Seul, il est autonome",ok:!1,why:"L'infirmier a une autonomie, mais il travaille toujours en équipe."},{t:"Uniquement avec les médecins",ok:!1,why:"Vision trop étroite de l'équipe de soins."},{t:"Uniquement avec d'autres infirmiers",ok:!1,why:"L'équipe de soins est pluriprofessionnelle."}]},{id:"k4",theme:"metier",jury:!0,q:"Quelles sont, selon vous, les difficultés du métier ?",opts:[{t:"Des difficultés réelles : horaires décalés et week-ends, charge physique et émotionnelle, confrontation à la souffrance et à la mort, responsabilités. Et comment je compte y faire face.",ok:!0,why:"Tu montres une vision réaliste et tu rassures le jury sur ta capacité à tenir."},{t:"Il n'y en a pas vraiment quand on est motivé.",ok:!1,why:"Une vision idéalisée inquiète le jury : la réalité risque de te décourager."},{t:"Le salaire, essentiellement.",ok:!1,why:"Réponse réductrice qui oublie l'essentiel."},{t:"Les patients difficiles, mais je ne m'en occuperai pas.",ok:!1,why:"Prendre soin de tous les patients fait partie du métier."}]},{id:"k5",theme:"metier",jury:!1,q:"Où un infirmier peut-il exercer ?",opts:[{t:"À l'hôpital, en clinique, en EHPAD, à domicile en libéral, en santé scolaire, en entreprise, en psychiatrie…",ok:!0,why:"Les lieux d'exercice sont très variés. Citer cette diversité montre que tu t'es renseigné."},{t:"Uniquement à l'hôpital",ok:!1,why:"L'hôpital n'est qu'un des lieux d'exercice."},{t:"Uniquement en libéral",ok:!1,why:"Le libéral est une possibilité parmi beaucoup d'autres."},{t:"À l'hôpital et en pharmacie",ok:!1,why:"La pharmacie n'est pas un lieu d'exercice infirmier habituel."}]},{id:"k6",theme:"metier",jury:!1,q:"Quelle démarche est obligatoire pour exercer après le diplôme ?",opts:[{t:"S'inscrire à l'Ordre national des infirmiers",ok:!0,why:"L'inscription à l'Ordre est obligatoire pour exercer la profession."},{t:"Réussir un concours de la fonction publique",ok:!1,why:"Il n'est pas nécessaire pour exercer : on peut travailler en clinique, en libéral, etc."},{t:"Travailler deux ans comme aide-soignant",ok:!1,why:"Aucune obligation de ce type."},{t:"Aucune, le diplôme suffit",ok:!1,why:"L'inscription à l'Ordre est aussi obligatoire."}]},{id:"k7",theme:"metier",jury:!1,q:"Qu'est-ce que l'éducation thérapeutique du patient ?",opts:[{t:"Aider un patient atteint d'une maladie chronique à acquérir des compétences pour gérer sa maladie et son traitement au quotidien",ok:!0,why:"C'est une mission importante de l'infirmier, par exemple auprès des patients diabétiques."},{t:"Former les étudiants infirmiers en stage",ok:!1,why:"C'est le tutorat, pas l'éducation thérapeutique."},{t:"Expliquer une ordonnance une seule fois à la sortie",ok:!1,why:"L'éducation thérapeutique est un accompagnement dans la durée."},{t:"Laisser le patient choisir seul son traitement",ok:!1,why:"Le patient participe aux décisions, mais avec l'équipe soignante."}]},{id:"q1",theme:"qualites",jury:!0,q:"Comment gérez-vous le stress ?",opts:[{t:"Je raconte une situation réelle de stress, ce que j'ai fait concrètement (prioriser, demander de l'aide, rester calme) et ce que j'en ai appris.",ok:!0,why:"Un exemple vécu prouve ta capacité, là où une affirmation ne prouve rien."},{t:"Je ne suis jamais stressé.",ok:!1,why:"Peu crédible, et cela peut traduire un manque de conscience de soi."},{t:"Je gère très bien, ne vous inquiétez pas.",ok:!1,why:"Aucun élément concret pour le démontrer."},{t:"Le stress me paralyse, mais ça passera.",ok:!1,why:"Être honnête est bien, mais il faut montrer comment tu y fais face."}],tip:"Méthode simple pour toutes les questions sur tes qualités : situation, action, résultat, ce que tu en retiens."},{id:"q2",theme:"qualites",jury:!0,q:"Citez-moi une de vos qualités.",opts:[{t:"Une qualité utile au métier, illustrée par un exemple vécu.",ok:!0,why:"Une seule qualité bien prouvée vaut mieux que cinq affirmées."},{t:"J'en liste cinq d'affilée, sans exemple.",ok:!1,why:"Une liste sans preuve ne convainc pas."},{t:"Par modestie, je dis que je n'en ai pas particulièrement.",ok:!1,why:"Le jury attend que tu saches te valoriser."},{t:"Une qualité sans rapport avec le soin, comme la créativité en design.",ok:!1,why:"Choisis une qualité qui sert ton projet."}]},{id:"q3",theme:"qualites",jury:!0,q:"Quel est votre principal défaut ?",opts:[{t:"Un vrai défaut, dont j'ai conscience, et ce que je fais pour progresser.",ok:!0,why:"Le jury évalue ta capacité à te remettre en question, une qualité clé pour un futur soignant."},{t:"Je suis trop perfectionniste.",ok:!1,why:"Un défaut déguisé en qualité : le jury l'a entendu cent fois."},{t:"Je n'en ai pas.",ok:!1,why:"Personne n'y croit, et cela montre un manque de recul."},{t:"Je suis souvent en retard, c'est comme ça.",ok:!1,why:"Un défaut incompatible avec le métier, présenté sans volonté de progresser."}]},{id:"q4",theme:"qualites",jury:!0,q:"Un patient refuse son traitement et s'énerve. Que faites-vous ?",opts:[{t:"Je reste calme, je l'écoute pour comprendre son refus, je lui réexplique simplement, je respecte son droit de refuser et je transmets l'information à l'équipe et au médecin.",ok:!0,why:"Écoute, respect du consentement et travail en équipe : tout ce que le jury attend."},{t:"Je lui donne quand même, c'est pour son bien.",ok:!1,why:"Le patient a le droit de refuser un soin : on ne le force pas."},{t:"Je le laisse tranquille et je n'en parle à personne.",ok:!1,why:"Il faut transmettre l'information : l'équipe et le médecin doivent savoir."},{t:"Je lui dis qu'il sortira de l'hôpital s'il ne le prend pas.",ok:!1,why:"Une menace est contraire à l'éthique du soin."}]},{id:"q5",theme:"qualites",jury:!0,q:"Comment réagiriez-vous face au décès d'un patient ?",opts:[{t:"Je reconnais que ce sera difficile. J'en parlerais avec l'équipe et je resterais présent pour les proches.",ok:!0,why:"Une réponse lucide et humaine, qui montre que tu sais t'appuyer sur l'équipe."},{t:"Ça ne me touchera pas.",ok:!1,why:"Peu crédible, et cela inquiète sur ta capacité d'empathie."},{t:"Je pense que je quitterais le service.",ok:!1,why:"Cela fait douter de ta capacité à exercer ce métier."},{t:"Je n'y ai jamais pensé.",ok:!1,why:"C'est une réalité du métier : le jury attend que tu y aies réfléchi."}]},{id:"q6",theme:"qualites",jury:!0,q:"Vous constatez qu'un collègue s'est trompé dans un soin. Que faites-vous ?",opts:[{t:"La sécurité du patient passe d'abord : j'en parle à mon collègue et l'erreur est signalée selon les procédures du service, sans chercher de coupable.",ok:!0,why:"Tu places la sécurité du patient en priorité, dans le respect de l'équipe."},{t:"Je ne dis rien pour éviter un conflit.",ok:!1,why:"Taire une erreur peut mettre le patient en danger."},{t:"Je le dénonce à la direction sans lui en parler.",ok:!1,why:"Tu ignores le dialogue et l'esprit d'équipe."},{t:"Je corrige moi-même sans rien dire.",ok:!1,why:"L'erreur doit être connue pour surveiller le patient et éviter qu'elle se reproduise."}]},{id:"q7",theme:"qualites",jury:!1,q:"Laquelle de ces attitudes montre une écoute active ?",opts:[{t:"Reformuler ce que dit la personne, poser des questions ouvertes, accepter les silences",ok:!0,why:"Ce sont les techniques de base de l'écoute active, utiles avec les patients… et devant le jury."},{t:"Proposer rapidement une solution",ok:!1,why:"Cela coupe souvent la personne avant qu'elle ait tout dit."},{t:"Finir les phrases de la personne pour gagner du temps",ok:!1,why:"C'est l'inverse de l'écoute."},{t:"Hocher la tête en préparant sa réponse",ok:!1,why:"On fait semblant d'écouter, ce que la personne ressent vite."}]},{id:"f1",theme:"formation",jury:!0,q:"Comment allez-vous vous organiser pour les cours et les stages ?",opts:[{t:"J'ai anticipé : organisation personnelle et familiale, transports vers les lieux de stage, financement, et du temps de travail personnel chaque semaine.",ok:!0,why:"Tu montres que tu mesures l'investissement demandé et que tu t'y es préparé."},{t:"Je verrai le moment venu.",ok:!1,why:"Le jury veut un projet réfléchi, organisation comprise."},{t:"Je garderai mon emploi à temps plein en parallèle.",ok:!1,why:"Irréaliste avec les cours et les stages à temps plein : cela inquiète le jury."},{t:"Les stages, ce sera facile, je connais déjà le monde du travail.",ok:!1,why:"Les stages sont exigeants et évalués : il ne faut pas les sous-estimer."}]},{id:"f2",theme:"formation",jury:!1,q:"Comment la formation en soins infirmiers est-elle organisée ?",opts:[{t:"Trois ans qui alternent enseignements théoriques et stages en milieu de soins, et qui mènent au diplôme d'État",ok:!0,why:"Connaître le rythme de la formation montre que tu sais dans quoi tu t'engages."},{t:"Deux ans de cours, sans stage",ok:!1,why:"La formation dure trois ans et les stages en sont une part essentielle."},{t:"Un an en alternance dans un hôpital",ok:!1,why:"La formation dure trois ans."},{t:"Trois ans de stages, sans cours",ok:!1,why:"Les enseignements théoriques sont indispensables."}]},{id:"f3",theme:"formation",jury:!0,q:"Comment comptez-vous financer votre formation ?",opts:[{t:"Je me suis renseigné sur les possibilités, comme la prise en charge régionale selon des critères, un employeur ou un organisme, ou l'autofinancement. Voici ma piste principale et mon plan B.",ok:!0,why:"Tu montres que ton projet est concret jusque dans son financement."},{t:"La voie FPC me garantit le financement.",ok:!1,why:"Faux : le document officiel distingue la voie d'accès et le financement."},{t:"Je n'y ai pas encore réfléchi.",ok:!1,why:"Une formation de trois ans sans financement prévu inquiète le jury."},{t:"Je verrai après la sélection.",ok:!1,why:"Mieux vaut avoir des pistes dès l'entretien."}],tip:"Demande à l'IFSI de Longjumeau les critères de la prise en charge régionale avant ton oral."},{id:"f4",theme:"formation",jury:!0,q:"Comment réagirez-vous face à une difficulté, par exemple une mauvaise note ?",opts:[{t:"J'analyse mes erreurs, je demande de l'aide aux formateurs ou à d'autres étudiants et j'ajuste ma méthode de travail.",ok:!0,why:"Tu montres que tu sais rebondir et utiliser les ressources de la formation."},{t:"Si c'est trop dur, j'arrêterai.",ok:!1,why:"Cela fait douter de ta persévérance."},{t:"Ce sera sûrement la faute du formateur.",ok:!1,why:"Rejeter la faute sur les autres est mal perçu."},{t:"Je n'aurai pas de difficultés.",ok:!1,why:"Excès de confiance : tout étudiant rencontre des difficultés."}]},{id:"f5",theme:"formation",jury:!0,q:"Reprendre des études après plusieurs années, ça ne vous fait pas peur ?",opts:[{t:"J'ai conscience du rythme et je m'y prépare déjà, avec une méthode de travail et des révisions régulières. Mon expérience m'apporte aussi organisation et maturité.",ok:!0,why:"Lucidité et preuves concrètes : la préparation de la sélection est déjà une preuve."},{t:"Non, je n'ai jamais eu de difficulté à l'école.",ok:!1,why:"Le jury attend que tu mesures l'effort, pas que tu le nies."},{t:"Si, beaucoup. Je ne sais pas si j'y arriverai.",ok:!1,why:"L'honnêteté est bonne, mais il faut montrer comment tu vas y faire face."},{t:"Je réviserai seulement avant les examens.",ok:!1,why:"La formation demande un travail régulier."}]},{id:"f6",theme:"formation",jury:!0,q:"Que savez-vous de l'institut où vous souhaitez entrer ?",opts:[{t:"Des éléments concrets : son groupement universitaire, la date de rentrée, et ce que j'ai appris en le visitant ou en échangeant avec des étudiants.",ok:!0,why:"Tu montres un vrai intérêt et une démarche active."},{t:"Rien de particulier, les instituts se ressemblent tous.",ok:!1,why:"Cela montre un manque de préparation."},{t:"C'est le plus proche de chez moi, c'est tout.",ok:!1,why:"Un argument pratique, mais insuffisant seul."},{t: système de santé ?","L'élargissement du rôle des infirmiers vous semble-t-il une réponse adaptée ? Argumentez."]},{id:"vaccin",theme:"Prévention",title:"Le doute vaccinal",doc:"La vaccination a permis de faire reculer, et parfois de faire disparaître, des maladies autrefois très meurtrières. Pourtant, une partie de la population exprime aujourd'hui des doutes : peur des effets indésirables, méfiance envers les laboratoires ou les autorités, informations contradictoires sur les réseaux sociaux. Les professionnels de santé restent cependant parmi les interlocuteurs en qui le public a le plus confiance.",qs:["Quelles sont les raisons de l'hésitation vaccinale évoquées dans le texte ?","Comment un soignant peut-il répondre aux doutes d'un patient sur la vaccination ? Donnez des exemples concrets."]},{id:"jeunes",theme:"Santé mentale",title:"La santé mentale des jeunes",doc:"Anxiété, troubles du sommeil, isolement : les professionnels observent depuis plusieurs années une dégradation de la santé mentale des adolescents et des jeunes adultes. Les services de pédopsychiatrie sont saturés et les délais pour obtenir un rendez-vous se comptent parfois en mois. Parler de sa souffrance psychique reste difficile, par peur d'être jugé ou de ne pas être pris au sérieux.",qs:["Dégagez les idées principales de ce texte.","Pourquoi est-il difficile pour un jeune de demander de l'aide ?","Quelles actions de prévention pourraient être menées auprès des jeunes ? Justifiez vos propositions."]},{id:"violence",theme:"Conditions de travail",title:"Violences envers les soignants",doc:"Insultes, menaces, parfois agressions physiques : les signalements de violences envers les soignants augmentent. Elles surviennent souvent aux urgences, dans un contexte d'attente longue, d'angoisse et d'incompréhension. Ces violences ont des conséquences sur la santé des professionnels et contribuent à rendre certains métiers moins attractifs.",qs:["Quelles sont les causes possibles de ces violences d'après le texte ?","Quelles peuvent en être les conséquences pour les soignants et pour la qualité des soins ?","Comment un infirmier peut-il prévenir ou apaiser une situation de tension ? Argumentez."]},{id:"finvie",theme:"Fin de vie",title:"Les soins palliatifs",doc:"Les soins palliatifs visent à soulager la douleur et les autres symptômes, et à accompagner la personne en fin de vie ainsi que ses proches. Ils ne concernent pas seulement les derniers jours : ils peuvent être proposés tôt dans l'évolution d'une maladie grave. Pourtant, l'accès à ces soins reste inégal selon les territoires, et la fin de vie fait régulièrement l'objet de débats de société.",qs:["Quels sont les objectifs des soins palliatifs présentés dans le texte ?","En quoi l'accompagnement des proches fait-il partie du soin ?","Selon vous, quelles qualités humaines un infirmier doit-il mobiliser auprès d'un patient en fin de vie ?"]},{id:"sedentarite",theme:"Prévention",title:"Sédentarité et santé",doc:"Le manque d'activité physique et le temps passé assis devant les écrans augmentent, chez les enfants comme chez les adultes. Or la sédentarité favorise le surpoids, les maladies cardiovasculaires, le diabète et certains troubles psychologiques. Les campagnes de prévention se multiplient, mais changer ses habitudes de vie reste difficile, en particulier pour les personnes en situation de précarité.",qs:["Quel lien le texte établit-il entre mode de vie et santé ?","Pourquoi les campagnes de prévention ne suffisent-elles pas toujours ?","Proposez et justifiez deux actions de prévention qu'un infirmier pourrait mener."]},{id:"handicap",theme:"Handicap",title:"Se soigner avec un handicap",doc:"Se déplacer, accéder à un cabinet médical, comprendre une ordonnance : pour une personne en situation de handicap, ces démarches simples peuvent devenir des obstacles. Certaines renoncent à des soins courants, comme le dentiste ou les dépistages, faute d'équipements adaptés ou de professionnels formés. L'accès aux soins des personnes handicapées est pourtant un droit.",qs:["Quels obstacles à l'accès aux soins le texte met-il en évidence ?","Comment les établissements de santé pourraient-ils mieux accueillir les personnes en situation de handicap ? Argumentez."]},{id:"precarite",theme:"Précarité",title:"Renoncer à se soigner",doc:"Une consultation mal remboursée, une paire de lunettes, des soins dentaires : pour les personnes aux revenus modestes, certains soins sont repoussés, voire abandonnés. Le renoncement aux soins ne s'explique pas seulement par le coût : la complexité des démarches administratives, l'éloignement géographique ou la méfiance envers les institutions jouent aussi un rôle. Ces retards aggravent souvent l'état de santé et conduisent à des prises en charge plus lourdes.",qs:["Quelles sont les causes du renoncement aux soins évoquées dans le texte ?","Quelles en sont les conséquences pour la personne et pour la société ?","Quel peut être le rôle du soignant face à un patient en situation de précarité ?"]},{id:"numerique",theme:"Santé numérique",title:"Le numérique au service du soin ?",doc:"Prise de rendez-vous en ligne, téléconsultation, dossier médical partagé, objets connectés : le numérique transforme l'organisation des soins. Il peut faciliter le suivi des patients à distance et faire gagner du temps aux professionnels. Mais il soulève aussi des questions : protection des données de santé, exclusion des personnes peu à l'aise avec les outils numériques, risque de déshumanisation de la relation de soin.",qs:["Présentez les avantages et les limites du numérique en santé évoqués dans le texte.","Le numérique peut-il remplacer la relation humaine dans le soin ? Argumentez votre réponse."]},{id:"antibio",theme:"Santé publique",title:"Les antibiotiques en danger",doc:"L'utilisation excessive ou inadaptée des antibiotiques favorise l'apparition de bactéries résistantes. Certaines infections deviennent ainsi plus difficiles, voire impossibles, à traiter. Les autorités de santé rappellent que les antibiotiques sont inefficaces contre les virus et qu'un traitement doit être pris en respectant la durée prescrite. L'hygiène des mains, à l'hôpital comme en ville, reste l'un des moyens les plus efficaces de limiter la transmission des bactéries.",qs:["Expliquez avec vos mots ce qu'est l'antibiorésistance d'après le texte.","Quels comportements permettent de limiter ce phénomène ?","Quel rôle le futur infirmier peut-il jouer dans cette lutte ?"]},{id:"prendresoin",theme:"Sujet de réflexion",title:"Soigner ou prendre soin",doc:null,qs:["« Soigner, ce n'est pas seulement traiter une maladie, c'est prendre soin d'une personne. » Que vous inspire cette affirmation ? Développez une réponse argumentée, appuyée sur des exemples."]},{id:"epuisement",theme:"Conditions de travail",title:"L'épuisement professionnel des soignants",doc:"Horaires décalés, charge de travail importante, confrontation quotidienne à la souffrance : les soignants sont particulièrement exposés à l'épuisement professionnel, parfois appelé burn-out. Il se manifeste par une fatigue intense, le sentiment de ne plus être efficace et une mise à distance des patients. Ses effets dépassent la personne : arrêts de travail, départs de la profession et difficultés à assurer la continuité des soins. Prévenir cet épuisement est devenu un enjeu pour les établissements comme pour les équipes.",qs:["Quelles sont les causes de l'épuisement professionnel des soignants d'après le texte ?","Comment se manifeste-t-il, et quelles en sont les conséquences ?","Comment un futur infirmier peut-il préserver sa santé tout au long de sa carrière ? Argumentez."]},{id:"addictions",theme:"Addictions",title:"Les addictions, un enjeu de santé publique",doc:"Tabac, alcool, cannabis, mais aussi jeux d'argent ou écrans : les addictions touchent tous les âges et tous les milieux. Elles se caractérisent par une perte de contrôle et par la poursuite d'un comportement malgré ses conséquences négatives. Souvent associées à la honte, elles restent difficiles à évoquer, ce qui retarde la demande d'aide. Pourtant, des accompagnements existent, et une attitude sans jugement de la part des professionnels de santé peut faciliter le premier pas.",qs:["Comment le texte définit-il une addiction ?","Pourquoi est-il difficile de demander de l'aide ?","Quelle attitude un soignant doit-il adopter face à un patient présentant une addiction ? Argumentez."]},{id:"consentement",theme:"Droits du patient",title:"Le consentement aux soins",doc:"Aucun acte médical ni aucun traitement ne peut être pratiqué sans le consentement libre et éclairé de la personne, et ce consentement peut être retiré à tout moment. Pour qu'il soit éclairé, le patient doit recevoir une information claire, adaptée et compréhensible. Dans la pratique, le respect de ce principe se heurte parfois à l'urgence, au manque de temps ou à des situations où la personne a des difficultés à exprimer sa volonté.",qs:["Qu'est-ce qu'un consentement « libre et éclairé » d'après le texte ?","Pourquoi le respect de ce principe est-il parfois difficile dans la pratique ?","Comment l'infirmier peut-il contribuer au respect du consentement du patient ? Argumentez."]},{id:"pdf-alimentation",theme:"Prévention",title:"Alimentation, obésité et prévention *",doc:`L'alimentation joue un rôle essentiel dans le maintien d'une bonne santé. Elle apporte à l'organisme les nutriments nécessaires à son fonctionnement et contribue au développement physique et intellectuel.

Cependant, les habitudes alimentaires ont évolué au cours des dernières décennies. La consommation de produits transformés, souvent riches en sucres, en sel et en matières grasses, a augmenté. Parallèlement, les modes de vie sont devenus plus sédentaires, notamment en raison du développement des écrans et de la diminution de certaines activités physiques quotidiennes.

Ces changements favorisent l'apparition de maladies chroniques telles que le diabète de type 2, les maladies cardiovasculaires et l'obésité.

La prévention repose notamment sur l'éducation nutritionnelle, la pratique régulière d'une activité physique et l'accès à une alimentation équilibrée. Les professionnels de santé ont un rôle important à jouer dans l'accompagnement des personnes, sans jugement ni culpabilisation.

L'objectif n'est pas d'imposer un modèle alimentaire unique, mais d'aider chacun à comprendre ses besoins et à adopter progressivement des habitudes favorables à sa santé.`,qs:["Explique pourquoi l'alimentation est essentielle au fonctionnement de l'organisme.","Cite trois facteurs qui favorisent le développement de l'obésité selon le texte.","Quelles maladies chroniques sont mentionnées dans le texte ?","Explique ce que signifie « éducation nutritionnelle ».","Pourquoi est-il important que les professionnels de santé accompagnent les patients sans les culpabiliser ?","Selon toi, comment les professionnels de santé peuvent-ils contribuer à améliorer les habitudes alimentaires de la population ? Développe ton argumentation avec des exemples concrets, une introduction, un développement et une conclusion (20 à 25 lignes)."]},{id:"pdf-vieillissement",theme:"Vieillissement",title:"Vieillissement et maintien à domicile *",doc:`L'espérance de vie augmente dans de nombreux pays. Cette évolution constitue un progrès, mais elle entraîne également de nouveaux besoins en matière de santé et d'accompagnement.

Avec l'âge, certaines personnes peuvent rencontrer des difficultés pour effectuer les gestes de la vie quotidienne : se laver, s'habiller, préparer les repas ou se déplacer. Ces difficultés peuvent être liées à des maladies chroniques, à une diminution de la mobilité ou à des troubles cognitifs.

Le maintien à domicile représente une solution privilégiée par de nombreuses personnes âgées. Il leur permet de conserver leurs habitudes, leur environnement et une certaine autonomie. Toutefois, cette solution nécessite parfois l'intervention de professionnels : infirmiers, aides-soignants, auxiliaires de vie ou services d'aide à domicile.

Les proches jouent également un rôle important. Cependant, leur investissement peut entraîner une fatigue physique et psychologique. Il est donc nécessaire de proposer des dispositifs de soutien aux aidants.

L'accompagnement des personnes âgées doit respecter leur dignité, leurs choix et leur rythme de vie. Il ne s'agit pas de faire systématiquement à leur place, mais de les aider à conserver autant que possible leur autonomie.`,qs:["Pourquoi le vieillissement de la population représente-t-il un enjeu pour le système de santé ?","Cite quatre activités quotidiennes pouvant devenir difficiles avec l'âge.","Quels sont les avantages du maintien à domicile ?","Pourquoi les proches aidants peuvent-ils avoir besoin de soutien ?","Explique la différence entre aider une personne et faire systématiquement à sa place.","Le maintien de l'autonomie des personnes âgées doit-il être une priorité dans notre société ? Présente les avantages, les difficultés et le rôle des professionnels de santé (20 à 25 lignes)."]},{id:"pdf-santementale",theme:"Santé mentale",title:"Santé mentale et isolement social *",doc:`La santé mentale constitue une composante essentielle de la santé globale. Elle ne se limite pas à l'absence de maladie psychique : elle concerne également le bien-être émotionnel, psychologique et social.

Chez les jeunes, plusieurs facteurs peuvent fragiliser cet équilibre. Les difficultés scolaires, les problèmes familiaux, la précarité, les discriminations ou encore l'isolement peuvent avoir des conséquences importantes.

Les réseaux sociaux occupent une place croissante dans la vie quotidienne. Ils facilitent les échanges et permettent de maintenir des liens à distance. Toutefois, leur utilisation excessive peut favoriser la comparaison sociale, le sentiment d'exclusion ou les troubles du sommeil.

Certaines personnes rencontrant des difficultés psychologiques hésitent à demander de l'aide. La peur du jugement et les idées reçues concernant les troubles psychiques peuvent constituer des obstacles.

La prévention passe par l'information, l'écoute et l'accès aux professionnels compétents. Il est important de rappeler qu'une souffrance psychologique ne doit pas être minimisée et qu'une demande d'aide constitue une démarche positive.`,qs:["Pourquoi la santé mentale ne se limite-t-elle pas à l'absence de maladie psychique ?","Cite quatre facteurs pouvant fragiliser la santé mentale des jeunes.","Donne deux effets positifs et deux effets négatifs possibles des réseaux sociaux.","Pourquoi certaines personnes hésitent-elles à demander de l'aide ?","Cite trois moyens de prévention évoqués ou suggérés par le texte.","Les problèmes de santé mentale chez les jeunes sont-ils suffisamment pris en considération par la société ? Développe ton point de vue en présentant les difficultés, les conséquences et les solutions possibles (20 à 25 lignes)."]},{id:"pdf-acces",theme:"Accès aux soins",title:"Accès aux soins et déserts médicaux *",doc:`L'accès aux soins constitue un enjeu majeur de santé publique. En France, toutes les personnes ne bénéficient pas des mêmes possibilités pour consulter un professionnel de santé.

Dans certains territoires, notamment les zones rurales ou certaines zones périurbaines, le nombre de médecins disponibles est insuffisant par rapport aux besoins de la population. Ces territoires sont souvent désignés sous le terme de « déserts médicaux ».

Cette situation peut entraîner des délais d'attente importants, des déplacements longs et parfois un renoncement aux soins. Les personnes âgées, les personnes en situation de handicap et les personnes disposant de faibles ressources peuvent être particulièrement touchées.

Plusieurs solutions sont envisagées pour améliorer la situation : développer les maisons de santé pluriprofessionnelles, renforcer les équipes de soins, favoriser la télémédecine et améliorer l'attractivité des territoires pour les professionnels.

Cependant, les outils numériques ne peuvent pas remplacer toutes les consultations physiques. Le contact humain, l'examen clinique et la relation de confiance restent essentiels dans de nombreuses situations.

L'accès aux soins doit être considéré comme un élément fondamental de l'égalité entre les citoyens.`,qs:["Qu'appelle-t-on un désert médical ?","Quelles conséquences peuvent découler du manque de professionnels de santé ?","Quelles populations sont particulièrement touchées ?","Cite trois solutions permettant d'améliorer l'accès aux soins.","Pourquoi la télémédecine ne peut-elle pas remplacer toutes les consultations ?","L'accès aux soins devrait-il être identique pour tous les citoyens, quel que soit leur lieu de résidence ? Argumente ta réponse en utilisant des exemples concrets (20 à 25 lignes)."]},{id:"pdf-ethique",theme:"Éthique",title:"Éthique, bientraitance et profession infirmière *",doc:`La prise en charge d'une personne malade ne se limite pas à la réalisation de soins techniques. Elle nécessite également une attention particulière à sa dignité, à son intimité, à ses choix et à ses besoins.

La bientraitance repose sur une attitude professionnelle respectueuse, bienveillante et adaptée à chaque personne. Elle implique notamment de prendre le temps d'écouter le patient, de lui expliquer les soins et de respecter autant que possible son rythme.

Dans certaines situations, les professionnels de santé sont confrontés à des difficultés : manque de temps, effectifs insuffisants, fatigue ou situations d'urgence. Ces contraintes peuvent fragiliser la qualité de l'accompagnement.

Le respect du consentement est également essentiel. Un patient doit recevoir des informations compréhensibles afin de pouvoir participer aux décisions concernant sa santé. Son refus doit être entendu et pris en compte dans le cadre légal et médical applicable.

Le travail en équipe permet de partager les informations utiles, d'améliorer la coordination et de prévenir certaines erreurs. Chaque professionnel doit connaître ses responsabilités et respecter les compétences des autres membres de l'équipe.

La qualité des soins dépend donc à la fois des connaissances techniques, de l'organisation et des qualités humaines des professionnels.`,qs:["Pourquoi la prise en charge d'un patient ne se limite-t-elle pas aux soins techniques ?","Donne quatre exemples de comportements relevant de la bientraitance.","Quelles contraintes peuvent fragiliser la qualité de l'accompagnement ?","Pourquoi le consentement du patient est-il important ?","Quel est l'intérêt du travail en équipe dans les soins ?","Peut-on être un bon professionnel de santé sans qualités humaines ? Tu développeras une argumentation structurée en abordant les compétences techniques, l'écoute, l'empathie et le travail en équipe (20 à 25 lignes)."]}],G=lf;let gi=null;function Lt(){return gi||(gi=typeof window<"u"&&window.claude&&window.claude.use?window.claude.use("sample").catch(()=>null):Promise.resolve(null)),gi}const js={not_granted:"Tu n'as pas autorisé cette page à utiliser Claude.",sampling_disabled:"La correction par Claude n'est pas disponible pour ton compte.",rate_limited:"Trop de demandes pour le moment. Réessaie dans quelques minutes.",session_expired:"Ta session a expiré. Reconnecte-toi à Claude puis réessaie.",invalid_json:"La correction est arrivée dans un format illisible. Réessaie.",refused:"Claude n'a pas pu corriger cette copie.",prompt_too_large:"La copie est trop longue pour être corrigée."},uf=e=>["upstream_error","invalid_json","rate_limited","empty_completion","session_expired"].includes(e)||!js[e],uo=e=>Math.max(0,Math.min(20,Number(e&&e.note)||0));function cf(e,t,n){return`Tu es correcteur pour la sélection d'entrée en IFSI (institut de formation en soins infirmiers), voie formation professionnelle continue, en Île-de-France. La sous-épreuve de rédaction dure 30 minutes. Elle évalue les qualités rédactionnelles, l'aptitude au questionnement, à l'analyse et à l'argumentation, et la capacité du candidat à se projeter dans son futur environnement professionnel.

Pour chaque question :
- "points" : le barème de la question ; le total des questions fait 10 (la dernière, qui demande d'argumenter, vaut le plus).
- 4 réponses rédigées, en phrases complètes, de la longueur réaliste d'une copie (40 à 90 mots pour une question courte, 120 à 200 mots en plusieurs paragraphes pour la question d'argumentation, avec une courte introduction et une conclusion tournée vers le métier d'infirmier ; sépare les paragraphes par "\\n\\n").
- Une seule est la meilleure ("ok": true). Les trois autres illustrent chacune une erreur différente et réaliste : décrire le texte sans dégager le problème, recopier le texte, hors-sujet, ne traiter qu'une partie de la question, affirmations sans argument ni exemple, idée inexacte, registre familier avec fautes, liste de mots au lieu de phrases, parler de sa motivation au lieu de répondre.
- "note" : la note que mériterait cette réponse, au format "1,5/3".
- "why" : une phrase courte, au tutoiement, qui explique la note.
Reste factuel : n'invente ni chiffres précis, ni lois, ni études. Français impeccable dans la meilleure réponse.

e montre pas que tu l'as compris : le correcteur attend une reformulation."},{t:"Le problème principal est le manque de places en maison de retraite. C'est pour cela que les familles doivent garder leurs parents chez eux. L'État devrait construire beaucoup plus d'établissements.",ok:!1,note:"0/2",why:"Hors-sujet : le texte ne parle pas des maisons de retraite. Et ton opinion sur l'État n'est pas demandée."}]},{q:"Quelles peuvent être les conséquences de l'épuisement d'un aidant, pour lui et pour la personne aidée ?",points:3,reponses:[{t:`L'épuisement a d'abord des conséquences pour l'aidant lui-même. Fatigué, il manque de sommeil et de temps pour lui. Il peut repousser ses propres soins, s'isoler et finir par tomber malade à son tour, physiquement ou moralement.

Cet épuisement touche aussi la personne aidée. Un aidant à bout de forces est moins disponible et moins patient, ce qui peut nuire à la qualité de l'accompagnement. Dans les cas les plus graves, s'il ne peut plus assumer son rôle, le maintien à domicile devient impossible et une entrée en établissement doit être envisagée, parfois dans l'urgence.`,ok:!0,note:"3/3",why:"La réponse traite les deux parties de la question (l'aidant, puis la personne aidée), dans deux paragraphes clairs, avec des conséquences précises."},{t:`- fatigue
- stress
- il tombe malade
- la personne aidée va en maison de retraite`,ok:!1,note:"1/3",why:"Les idées sont justes, mais une liste de mots n'est pas une rédaction : il faut des phrases et des liens entre les idées."},{t:"L'aidant est très fatigué. Il dort mal, il est stressé et il n'a plus de temps pour ses loisirs ni pour voir ses amis. Il peut même faire une dépression et devoir arrêter de travailler.",ok:!1,note:"1,5/3",why:"Bien rédigé, mais il manque la moitié de la réponse : la question demande aussi les conséquences pour la personne aidée."},{t:"Ben l'aidant il est crevé, du coup il peut plus s'occuper de sa mère correctement et elle va être mal, et lui aussi il va tomber malade c'est sur.",ok:!1,note:"1/3",why:"Les idées sont bonnes, mais le langage est familier (« ben », « crevé », « du coup ») et il y a des fautes : c'est pénalisé à l'écrit."}]},{q:"Selon vous, quel rôle l'infirmier peut-il jouer auprès des aidants ? Argumentez.",points:5,reponses:[{t:`L'infirmier occupe une place privilégiée auprès des aidants, car il intervient souvent au domicile ou rencontre les familles à l'hôpital.

Son premier rôle est de repérer l'épuisement. Lors de ses passages, il peut remarquer des signes de fatigue, une perte de patience, ou un aidant qui néglige sa propre santé. Il peut alors prendre le temps de l'écouter sans le juger, car beaucoup d'aidants n'osent pas dire qu'ils sont à bout.

Son second rôle est d'informer et d'orienter. L'infirmier peut conseiller l'aidant sur les gestes du quotidien pour le soulager, l'informer sur les aides existantes, comme les solutions de répit ou les associations d'aidants, et faire le lien avec le médecin ou l'assistante sociale. Lorsque j'ai accompagné ma mère pendant sa maladie, j'ai constaté combien les explications des soignants rassuraient aussi la famille.

Futur infirmier, je souhaite être attentif au patient, mais aussi à ceux qui l'entourent.`,ok:!0,note:"5/5",why:"Une introduction, deux arguments développés (repérer, puis informer et orienter) avec des exemples, une expérience personnelle et une conclusion tournée vers le métier."},{t:"L'infirmier a un rôle très important auprès des aidants. Il doit les aider, les écouter et les soutenir. Il est essentiel qu'il soit présent pour eux, car ils en ont besoin. C'est pour cela que le rôle de l'infirmier est primordial.",ok:!1,note:"1,5/5",why:"Des affirmations sans explication ni exemple, et des répétitions (« important », « essentiel », « primordial ») : ça n'argumente pas."},{t:"L'infirmier doit remplacer l'aidant : il doit venir tous les jours faire la toilette et les repas, et rester la nuit pour que l'aidant puisse se reposer complètement.",ok:!1,note:"1/5",why:"Idée inexacte et irréaliste : l'infirmier accompagne et oriente l'aidant, il ne le remplace pas."},{t:"Moi, je veux devenir infirmier parce que j'aime aider les gens et que j'ai vu ma mère malade. Je pense que je serai un bon infirmier car je suis à l'écoute et patient. Les aidants, c'est important aussi.",ok:!1,note:"0,5/5",why:"Tu parles de ta motivation au lieu de répondre à la question : c'est un hors-sujet fréquent. Garde-la pour l'oral."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"L'épuisement des aidants familiaux, qui menace leur santé et le maintien à domicile de la personne aidée.",ok:!0,why:"C'est l'idée centrale : le texte part du rôle des aidants pour arriver au risque d'épuisement et à ses conséquences."},{t:"Le manque de maisons de retraite en France.",ok:!1,why:"Le texte n'en parle pas : c'est un hors-sujet, l'erreur la plus pénalisée."},{t:"Les aidants familiaux s'occupent de la toilette et des repas.",ok:!1,why:"C'est un détail du texte, pas le problème qu'il soulève."},{t:"Le vieillissement de la population.",ok:!1,why:"C'est le contexte général, trop large : le texte cible précisément l'épuisement des aidants."}]},{etape:"Choisir le plan",q:"Pour la question « Quel rôle l'infirmier peut-il jouer auprès des aidants ? », quel plan est le plus adapté ?",opts:[{t:"I. Repérer l'épuisement de l'aidant — II. L'informer, l'écouter et l'orienter vers des aides (répit, associations).",ok:!0,why:"Deux parties claires, qui répondent directement à la question et vont du constat à l'action."},{t:"I. Les avantages — II. Les inconvénients.",ok:!1,why:"Plan « pour/contre » plaqué : la question ne demande pas de peser le pour et le contre."},{t:"Une liste de tout ce que fait un infirmier dans une journée.",ok:!1,why:"Pas de plan et hors-sujet : il faut parler de son rôle auprès des aidants."},{t:"I. Ma vie personnelle — II. Mon projet professionnel.",ok:!1,why:"C'est un plan de lettre de motivation, pas de rédaction sur un sujet sanitaire et social."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier peut repérer les signes d'épuisement de l'aidant, car il est souvent présent au domicile. Par exemple, lors d'un passage, il peut remarquer qu'une épouse dort mal et néglige ses propres soins, et lui proposer de l'aide. »",ok:!0,why:"Il y a une idée, une explication (« car… ») et un exemple concret : c'est la structure attendue."},{t:"« L'infirmier a un rôle très important et essentiel auprès des aidants. »",ok:!1,why:"C'est une affirmation sans explication ni exemple : elle ne prouve rien."},{t:"« Les aidants sont fatigués, les infirmiers aussi, tout le monde est fatigué. »",ok:!1,why:"Généralisation familière, sans raisonnement."},{t:"« L'infirmier doit tout faire à la place de l'aidant pour qu'il se repose. »",ok:!1,why:"Idée irréaliste et inexacte : l'infirmier accompagne et oriente, il ne remplace pas l'aidant."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« De nombreuses personnes accompagnent chaque jour un proche malade ou âgé. Ce rôle d'aidant, souvent assuré sans formation, peut mener à l'épuisement. Nous verrons d'abord ce problème et ses conséquences, puis le rôle que l'infirmier peut jouer. »",ok:!0,why:"Elle amène le sujet, pose le problème et annonce le plan : les trois étapes d'une bonne introduction."},{t:"« Dans ce texte, on va parler des aidants. »",ok:!1,why:"Trop pauvre : pas de problème posé, pas de plan annoncé."},{t:"« Depuis la nuit des temps, l'homme aide son prochain. »",ok:!1,why:"Formule creuse et trop générale : les correcteurs la sanctionnent."},{t:"« Je pense que les aidants ont raison d'être fatigués et que l'État ne fait rien. »",ok:!1,why:"Opinion tranchée dès la première phrase, sans nuance ni annonce du plan."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les aidants, qui accompagnent leur proche au quotidien, négligent souvent leur propre santé. »",ok:!0,why:"Accords justes, ponctuation correcte, registre soutenu."},{t:"« Les aidants qui accompagne leurs proche au quotidien néglige souvent leurs propre santé. »",ok:!1,why:"Erreurs d'accord : « accompagnent », « proches » ou « proche », « négligent », « leur propre santé »."},{t:"« Les aidants ils négligent souvent leur santé à eux. »",ok:!1,why:"Registre oral (« ils » répété, « à eux ») : à éviter à l'écrit."},{t:"« Les aidants, négligent souvent, leur propre santé. »",ok:!1,why:"Virgules mal placées : on ne sépare pas le sujet du verbe ni le verbe de son complément."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« L'épuisement des aidants est un enjeu de santé pour eux comme pour leurs proches. Par sa présence et son écoute, l'infirmier peut le repérer et les orienter. Future professionnel, je serai attentif à ne pas oublier ceux qui accompagnent les patients. »",ok:!0,why:"Elle résume la réponse, puis ouvre sur le futur métier : c'est ce que le jury apprécie."},{t:"« Voilà, j'ai fini. »",ok:!1,why:"Ce n'est pas une conclusion."},{t:"« En conclusion, il y a beaucoup de choses à dire sur ce sujet très intéressant. »",ok:!1,why:"Phrase vide, qui ne résume rien et n'ouvre sur rien."},{t:"« Pour conclure, je vais maintenant parler d'un autre problème : le prix des médicaments. »",ok:!1,why:"Une conclusion n'apporte pas une nouvelle partie hors-sujet."}]}]},ud={copies:[{q:"À partir du texte, expliquez ce que l'on appelle un « désert médical ».",points:2,reponses:[{t:"Un désert médical est un territoire où les habitants ont du mal à accéder à un médecin. D'après le texte, cela se traduit par des délais de plusieurs semaines pour obtenir un rendez-vous chez un généraliste, et par de nombreux habitants qui n'ont plus de médecin traitant. Ce n'est donc pas forcément une zone sans aucun médecin, mais une zone où l'offre de soins ne suffit plus à répondre aux besoins de la population.",ok:!0,note:"2/2",why:"Tu donnes une définition claire, tu l'appuies sur les deux indices du texte et tu la nuances avec tes propres mots."},{t:"Un désert médical, c'est quand « obtenir un rendez-vous chez un médecin généraliste demande plusieurs semaines, et de nombreux habitants n'ont plus de médecin traitant ».",ok:!1,note:"1/2",why:"Tu recopies le texte au lieu d'expliquer : le correcteur attend une définition avec tes mots."},{t:"Un désert médical est une région désertique, comme une zone de montagne isolée, où personne n'habite et où il n'y a donc pas d'hôpital. Les rares habitants doivent faire des centaines de kilomètres pour se soigner.",ok:!1,note:"0/2",why:"Tu prends l'expression au sens littéral : le texte parle de territoires habités où l'on manque de médecins, pas de zones vides."},{t:"Les déserts médicaux sont la faute des jeunes médecins qui ne veulent plus travailler à la campagne. Il faudrait les obliger à s'installer là où on a besoin d'eux, sinon la situation ne fera qu'empirer.",ok:!1,note:"0,5/2",why:"Tu donnes une opinion sur les causes au lieu d'expliquer ce qu'est un désert médical, et cette opinion n'est pas dans le texte."}]},{q:"Quelles sont les conséquences de ces difficultés d'accès aux soins sur le système de santé ?",points:3,reponses:[{t:`Ces difficultés d'accès aux soins ont d'abord des conséquences sur les urgences hospitalières. Faute de médecin disponible en ville, des patients s'y rendent pour des problèmes qui auraient pu être traités en cabinet. Les urgences sont alors encombrées, l'attente s'allonge et les équipes s'épuisent, au détriment des cas les plus graves.

Elles pèsent aussi sur le suivi des malades. Sans médecin traitant, une maladie chronique est moins bien surveillée et certains dépistages sont repoussés. Les problèmes de santé sont alors découverts plus tard, à un stade plus avancé, ce qui rend les prises en charge plus lourdes et plus coûteuses.`,ok:!0,note:"3/3",why:"Deux conséquences distinctes, chacune expliquée par un enchaînement de causes, dans deux paragraphes clairs."},{t:"Les urgences sont débordées car les gens qui n'ont pas de médecin y vont pour tout et n'importe quoi. L'attente devient très longue et le personnel est épuisé.",ok:!1,note:"1,5/3",why:"Juste mais incomplet : tu ne développes qu'une conséquence, et « pour tout et n'importe quoi » est un jugement familier."},{t:"Le texte explique qu'il faut plusieurs semaines pour obtenir un rendez-vous et que les pouvoirs publics misent sur les maisons de santé, la télémédecine et les infirmiers en pratique avancée.",ok:!1,note:"0,5/3",why:"Tu résumes le texte sans répondre : la question porte sur les conséquences pour le système de santé."},{t:`- urgences pleines
- attente
- maladies mal suivies
- plus cher`,ok:!1,note:"1/3",why:"Les idées sont justes, mais une liste de mots n'est pas une rédaction : il faut des phrases qui expliquent les liens."}]},{q:"L'élargissement du rôle des infirmiers vous semble-t-il une réponse adaptée ? Argumentez.",points:5,reponses:[{t:`Face au manque de médecins dans certains territoires, confier de nouvelles missions aux infirmiers apparaît comme une réponse possible. Cette solution me semble adaptée, à condition d'être bien encadrée.

D'abord, les infirmiers sont nombreux et présents partout : à domicile, en cabinet libéral, en maison de santé. Ils connaissent souvent bien leurs patients. Les infirmiers en pratique avancée, formés à un niveau master, peuvent par exemple assurer le suivi d'un patient diabétique stable, adapter certains traitements et repérer une aggravation. Le médecin peut alors consacrer son temps aux situations les plus complexes.

Cependant, cette réponse ne suffit pas à elle seule. Elle demande une formation solide, une vraie coordination avec le médecin et des moyens, car les infirmiers manquent aussi dans certaines zones. Elle doit donc compléter les maisons de santé et la télémédecine, et non les remplacer.

Futur infirmier, je vois dans cette évolution une reconnaissance des compétences de la profession, et une responsabilité à assumer en équipe.`,ok:!0,note:"5/5",why:"Une position claire et nuancée : un argument pour, illustré par un exemple, une limite expliquée, puis une conclusion tournée vers le métier."},{t:"Oui, l'élargissement du rôle des infirmiers est une très bonne idée et une réponse vraiment adaptée. Les infirmiers sont compétents et sérieux. Ils pourront donc aider beaucoup de patients. C'est pour cela que cette solution est la meilleure.",ok:!1,note:"1,5/5",why:"Une opinion répétée sans explication ni exemple : tu ne montres pas en quoi la solution répond au problème."},{t:"Oui, car avec ce nouveau rôle, l'infirmier pourra remplacer complètement le médecin : poser tous les diagnostics, prescrire tous les médicaments et faire les opérations simples. Il n'y aura donc plus besoin de médecins dans les campagnes.",ok:!1,note:"1/5",why:"Idée inexacte : l'infirmier, même en pratique avancée, ne remplace pas le médecin, il travaille en coordination avec lui."},{t:"Je pense que oui, car je veux devenir infirmier depuis longtemps et j'aime le contact humain. Dans mon ancien travail, j'aidais déjà beaucoup les gens. Je serai motivé pour apprendre de nouvelles missions.",ok:!1,note:"0,5/5",why:"Tu parles de ta motivation au lieu d'argumenter sur la question posée : garde cela pour l'oral."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Dans certains territoires, l'accès à un médecin devient difficile, ce qui pèse sur les urgences et pousse à chercher de nouvelles solutions.",ok:!0,why:"Tu relies le constat, ses conséquences et les réponses envisagées : c'est le fil du texte."},{t:"Les médecins généralistes gagnent trop peu d'argent.",ok:!1,why:"Le texte n'en parle pas : c'est un hors-sujet."},{t:"La télémédecine existe en France.",ok:!1,why:"C'est un détail, une des solutions citées, pas le problème."},{t:"La santé est importante pour tout le monde.",ok:!1,why:"Beaucoup trop général : cela ne dit rien du texte."}]},{etape:"Choisir le plan",q:"Pour la question « L'élargissement du rôle des infirmiers vous semble-t-il une réponse adaptée ? », quel plan est le plus adapté ?",opts:[{t:"I. Une réponse utile : les infirmiers sont proches des patients et peuvent suivre certains malades — II. Mais une réponse à encadrer et à compléter.",ok:!0,why:"La question appelle un avis nuancé : un plan « oui, mais » répond exactement."},{t:"I. L'histoire de la profession infirmière — II. Les études d'infirmier.",ok:!1,why:"Plan hors-sujet : il ne répond pas à la question posée."},{t:"Une seule partie qui répète que c'est une bonne idée.",ok:!1,why:"Sans plan ni nuance, la copie tourne en rond."},{t:"I. Les déserts médicaux — II. Les urgences — III. La télémédecine.",ok:!1,why:"Ce plan résume le texte au lieu de répondre à la question sur le rôle infirmier."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Les infirmiers peuvent suivre certains patients chroniques, car ils les voient souvent. Par exemple, un infirmier en pratique avancée peut surveiller un patient diabétique stable et alerter le médecin si son état change. »",ok:!0,why:"Une idée, une explication (« car ») et un exemple concret : la structure attendue."},{t:"« Les infirmiers sont indispensables et leur rôle est essentiel dans notre société. »",ok:!1,why:"Affirmation générale, sans explication ni exemple."},{t:"« Les infirmiers peuvent tout faire, donc ils peuvent remplacer les médecins. »",ok:!1,why:"Raisonnement faux : l'infirmier ne remplace pas le médecin."},{t:"« Il faut plusieurs semaines pour avoir un rendez-vous. »",ok:!1,why:"C'est une information du texte, pas un argument qui répond à la question."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Dans certains territoires, trouver un médecin devient difficile. Pour y répondre, on envisage d'élargir le rôle des infirmiers. Nous verrons ce que cette solution peut apporter, puis ses limites. »",ok:!0,why:"Elle amène le sujet, pose le problème et annonce le plan."},{t:"« Je vais répondre aux questions du texte. »",ok:!1,why:"Trop pauvre : ni problème posé, ni plan annoncé."},{t:"« Depuis toujours, l'homme est malade et doit se soigner. »",ok:!1,why:"Formule creuse, trop éloignée du sujet."},{t:"« Les médecins ne veulent plus aller à la campagne, c'est scandaleux. »",ok:!1,why:"Opinion tranchée et non justifiée dès la première phrase."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les patients qui n'ont plus de médecin traitant se rendent souvent aux urgences. »",ok:!0,why:"Accords justes, ponctuation correcte, registre soutenu."},{t:"« Les patients qui n'a plus de médecin traitant se rende souvent aux urgences. »",ok:!1,why:"Erreurs d'accord du verbe avec son sujet pluriel : « ont », « rendent »."},{t:"« Les patients ils vont aux urgences vu qu'ils ont pas de médecin. »",ok:!1,why:"Registre oral : sujet répété, « vu que », négation sans « ne »."},{t:"« Les patients, qui n'ont plus, de médecin traitant se rendent, souvent aux urgences. »",ok:!1,why:"Virgules mal placées qui coupent la phrase sans raison."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Élargir le rôle des infirmiers peut améliorer l'accès aux soins, à condition de l'encadrer et de l'intégrer au travail d'équipe. Futur infirmier, je serai prêt à prendre ces responsabilités. »",ok:!0,why:"Elle fait le bilan de la réponse et ouvre sur le futur métier."},{t:"« Voilà ce que je pense des déserts médicaux. »",ok:!1,why:"Ce n'est pas une conclusion : rien n'est résumé."},{t:"« Pour conclure, parlons maintenant du prix des médicaments. »",ok:!1,why:"Une conclusion n'ouvre pas une nouvelle partie hors-sujet."},{t:"« En conclusion, c'est un sujet très vaste et très intéressant. »",ok:!1,why:"Phrase vide, qui pourrait conclure n'importe quelle copie."}]}]},cd={copies:[{q:"Quelles sont les raisons de l'hésitation vaccinale évoquées dans le texte ?",points:4,reponses:[{t:"Le texte évoque trois raisons principales à l'hésitation vaccinale. La première est la peur des effets indésirables : certaines personnes craignent que le vaccin soit plus dangereux que la maladie. La deuxième est la méfiance envers les laboratoires et les autorités, soupçonnés de ne pas tout dire. Enfin, les informations contradictoires qui circulent sur les réseaux sociaux entretiennent le doute, car il devient difficile de distinguer une information fiable d'une rumeur.",ok:!0,note:"4/4",why:"Les trois raisons du texte sont toutes citées, reformulées et expliquées, avec des connecteurs clairs."},{t:"Les gens ont peur des effets indésirables des vaccins. Ils ont peur d'avoir des réactions graves après l'injection, et cette peur les empêche de se faire vacciner.",ok:!1,note:"1,5/4",why:"Bien rédigé mais incomplet : tu ne donnes qu'une raison sur les trois du texte."},{t:"Les raisons sont : « peur des effets indésirables, méfiance envers les laboratoires ou les autorités, informations contradictoires sur les réseaux sociaux ».",ok:!1,note:"2/4",why:"Les trois raisons sont là, mais recopiées : il fallait les reformuler et les expliquer."},{t:"Les gens hésitent car les vaccins ne servent à rien : les maladies ont disparu toutes seules grâce à l'hygiène. Il est donc normal de douter.",ok:!1,note:"0/4",why:"Idée fausse, contraire au texte qui rappelle que la vaccination a fait reculer des maladies : c'est très pénalisé."}]},{q:"Comment un soignant peut-il répondre aux doutes d'un patient sur la vaccination ? Donnez des exemples concrets.",points:6,reponses:[{t:`Face à un patient qui doute de la vaccination, le soignant dispose d'un atout : la confiance que lui accorde le public. Il peut s'en servir pour l'aider à décider de façon éclairée.

D'abord, il doit écouter sans juger. Si une mère hésite à faire vacciner son enfant, l'infirmier peut lui demander ce qui l'inquiète précisément, plutôt que de lui faire la leçon. Un patient qui se sent écouté est plus ouvert aux explications.

Ensuite, il doit informer simplement et honnêtement. Il peut expliquer le rôle du vaccin, reconnaître que des effets indésirables existent, le plus souvent bénins comme une douleur au point d'injection, et orienter vers des sources fiables plutôt que vers les réseaux sociaux. Si le patient a des questions précises, il peut l'orienter vers le médecin.

Enfin, le soignant respecte la décision du patient, tout en restant disponible pour en reparler. Futur infirmier, je veux faire de la prévention un vrai temps d'échange.`,ok:!0,note:"6/6",why:"Trois actions concrètes (écouter, informer, respecter), chacune illustrée, une introduction et une conclusion tournée vers le métier."},{t:"Le soignant doit dire au patient qu'il a tort et qu'il doit absolument se faire vacciner, sinon il met tout le monde en danger. S'il refuse, le soignant peut lui expliquer qu'il ne pourra plus être soigné dans le service.",ok:!1,note:"0,5/6",why:"Culpabiliser et menacer un patient est contraire à l'éthique du soin : il faut écouter, informer et respecter son choix."},{t:"Le soignant doit écouter le patient. Il doit aussi l'informer. Il doit être patient et gentil. Il doit aussi lui donner confiance. C'est très important pour que le patient change d'avis.",ok:!1,note:"2/6",why:"Les bonnes idées sont listées, mais aucune n'est expliquée ni illustrée, alors que la question demande des exemples concrets."},{t:"Franchement le soignant il doit expliquer au patient que les trucs sur internet c'est n'importe quoi et que les vaccins c'est bien, comme ça il arrête de flipper.",ok:!1,note:"1,5/6",why:"L'idée d'orienter vers des sources fiables est juste, mais le registre est familier et le ton méprisant envers le patient."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Malgré l'efficacité de la vaccination, une partie de la population doute, alors que les soignants restent des interlocuteurs de confiance.",ok:!0,why:"Tu relies le constat (le doute), ses causes et le rôle possible des soignants."},{t:"Les réseaux sociaux sont dangereux pour les jeunes.",ok:!1,why:"Les réseaux sociaux ne sont qu'une des causes citées : tu prends un détail pour le problème."},{t:"Les laboratoires pharmaceutiques gagnent trop d'argent.",ok:!1,why:"Hors-sujet : le texte parle de méfiance, pas des profits des laboratoires."},{t:"Certaines maladies ont disparu.",ok:!1,why:"C'est le contexte de départ, pas le problème soulevé."}]},{etape:"Choisir le plan",q:"Pour la question « Comment un soignant peut-il répondre aux doutes d'un patient ? », quel plan est le plus adapté ?",opts:[{t:"I. Écouter le patient et comprendre ses craintes — II. L'informer simplement et respecter sa décision.",ok:!0,why:"Le plan suit la démarche du soignant, de l'écoute à l'information : il répond directement."},{t:"I. Les vaccins obligatoires — II. Les vaccins recommandés.",ok:!1,why:"Plan de cours, sans rapport avec la question sur l'attitude du soignant."},{t:"I. Pour la vaccination — II. Contre la vaccination.",ok:!1,why:"La question ne demande pas un débat pour/contre mais une manière d'agir."},{t:"I. Mon expérience — II. Mes qualités.",ok:!1,why:"Plan de lettre de motivation, hors-sujet ici."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Le soignant doit d'abord écouter, car un patient qui se sent jugé se ferme. Par exemple, il peut demander à une mère inquiète ce qui lui fait peur avant de lui donner des explications. »",ok:!0,why:"Idée, justification et exemple concret : c'est complet."},{t:"« Le soignant doit convaincre le patient coûte que coûte. »",ok:!1,why:"Affirmation sans argument, et contraire au respect du choix du patient."},{t:"« La vaccination, c'est très important pour la santé publique. »",ok:!1,why:"Vrai mais vague : ni explication, ni exemple, ni lien avec la question."},{t:"« Les réseaux sociaux disent n'importe quoi. »",ok:!1,why:"Généralisation familière qui ne dit pas comment agir."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« La vaccination a fait reculer de nombreuses maladies, mais elle suscite aujourd'hui des doutes. Comment le soignant peut-il y répondre ? Nous verrons qu'il doit d'abord écouter, puis informer. »",ok:!0,why:"Elle amène le sujet, pose la question et annonce le plan."},{t:"« Moi, je suis pour les vaccins. »",ok:!1,why:"Une opinion n'est pas une introduction : pas de problème posé ni de plan."},{t:"« Le texte parle des vaccins. »",ok:!1,why:"Trop pauvre pour introduire une copie."},{t:"« Depuis la nuit des temps, les maladies tuent les hommes. »",ok:!1,why:"Formule creuse et trop générale."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les informations contradictoires qu'on trouve sur les réseaux sociaux entretiennent le doute. »",ok:!0,why:"Accords et syntaxe corrects, registre adapté."},{t:"« Les informations contradictoire qu'on trouve sur les réseaux sociaux entretient le doute. »",ok:!1,why:"Fautes d'accord : « contradictoires », « entretiennent »."},{t:"« Les infos sur les réseaux, ça fait douter les gens. »",ok:!1,why:"Registre oral : « infos », « ça »."},{t:"« Les informations contradictoires, qu'on trouve sur, les réseaux sociaux entretiennent, le doute. »",ok:!1,why:"Virgules mal placées qui coupent les groupes de mots."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Face au doute vaccinal, le soignant convainc mieux en écoutant et en informant qu'en imposant. Futur infirmier, je veux faire de la prévention un vrai temps d'échange avec chaque patient. »",ok:!0,why:"Bilan clair et ouverture sur le futur métier."},{t:"« Donc il faut se faire vacciner, point final. »",ok:!1,why:"Ton autoritaire, sans bilan de la réflexion."},{t:"« En conclusion, les vaccins c'est compliqué. »",ok:!1,why:"Phrase vague et registre familier."},{t:"« Pour finir, je vais parler du cancer. »",ok:!1,why:"Une conclusion n'ouvre pas un nouveau sujet."}]}]},dd={copies:[{q:"Dégagez les idées principales de ce texte.",points:2,reponses:[{t:"Le texte développe trois idées principales. D'abord, la santé mentale des adolescents et des jeunes adultes se dégrade depuis plusieurs années, avec de l'anxiété, des troubles du sommeil et de l'isolement. Ensuite, les services spécialisés sont saturés, si bien que les déla
