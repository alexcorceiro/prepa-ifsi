,ok:!0,why:"Tu relies la durée aux responsabilités réelles du métier."},{t:"Je trouve aussi que c’est trop long.",ok:!1,why:"Tu donnes l’impression de subir la formation."},{t:"C’est pour limiter le nombre d’infirmiers.",ok:!1,why:"Faux et négatif."},{t:"Parce qu’il faut apprendre beaucoup de techniques.",ok:!1,why:"Juste en partie : le raisonnement et la relation comptent autant."}]},{id:"fp1",theme:"contenu",jury:!1,q:"Combien de compétences compte le référentiel 2026 ?",opts:[{t:"13 compétences, réparties dans 5 domaines et 12 activités",ok:!0,why:"C'est la synthèse de l'annexe I de l'arrêté du 20 février 2026."},{t:"10 compétences",ok:!1,why:"C'était le référentiel de 2009."},{t:"5 compétences",ok:!1,why:"5, c’est le nombre de domaines."},{t:"20 compétences",ok:!1,why:"Trop : il y en a 13."}]},{id:"fp2",theme:"contenu",jury:!1,q:"Quelle est la première compétence du référentiel 2026 ?",opts:[{t:"Élaborer le diagnostic infirmier pour une personne ou un groupe de personnes",ok:!0,why:"Le raisonnement clinique et le diagnostic infirmier sont au cœur du nouveau référentiel."},{t:"Prescrire tous les médicaments",ok:!1,why:"La prescription infirmière est limitée à une liste."},{t:"Réaliser des injections",ok:!1,why:"Les soins techniques font partie d’une autre compétence."},{t:"Gérer le budget de l’hôpital",ok:!1,why:"Ce n’est pas une compétence infirmière."}]},{id:"fp3",theme:"contenu",jury:!1,q:"Quelle compétence est nouvelle dans le référentiel 2026, en lien avec la loi infirmière ?",opts:[{t:"Prescrire des produits de santé (médicaments, dispositifs médicaux) et des examens",ok:!0,why:"La loi de 2025 a reconnu la prescription infirmière : la formation l’intègre."},{t:"Communiquer avec le patient",ok:!1,why:"Elle existait déjà en 2009."},{t:"Accompagner dans les soins du quotidien",ok:!1,why:"Elle existait déjà."},{t:"Respecter le secret professionnel",ok:!1,why:"C’est une obligation, pas une nouvelle compétence."}]},{id:"fp4",theme:"contenu",jury:!1,q:"Le référentiel 2026 introduit une compétence sur les « éco-soins ». De quoi s’agit-il ?",opts:[{t:"De projets et d’actions de soins qui tiennent compte du développement durable (déchets, ressources, impact environnemental)",ok:!0,why:"Le secteur de la santé pèse sur l’environnement : la formation intègre cette dimension."},{t:"De soins à base de plantes",ok:!1,why:"Ce n'est pas le sens."},{t:"De soins réalisés à domicile uniquement",ok:!1,why:"Ce n'est pas le sens."},{t:"De soins moins chers pour l’Assurance maladie",ok:!1,why:"L'enjeu est environnemental, pas seulement financier."}]},{id:"fp5",theme:"contenu",jury:!1,q:"Quelle compétence du référentiel 2026 concerne l’exercice libéral ou en centre de santé ?",opts:[{t:"Gérer ou organiser une structure d’exercice individuel ou collectif",ok:!0,why:"Elle prépare aussi à exercer en cabinet libéral, comme les infirmiers qui soignaient ta mère."},{t:"Réaliser des soins palliatifs",ok:!1,why:"C’est une autre compétence."},{t:"Élaborer le diagnostic infirmier",ok:!1,why:"C’est la compétence 1."},{t:"Aucune : le libéral n’est pas abordé",ok:!1,why:"Le libéral est bien intégré au référentiel 2026."}]},{id:"fp6",theme:"contenu",jury:!1,q:"Qu’est-ce que le diagnostic infirmier ?",opts:[{t:"Le jugement clinique de l’infirmier sur les réactions d’une personne à un problème de santé, qui guide ses interventions",ok:!0,why:"Il ne remplace pas le diagnostic médical : il porte sur les besoins et réactions de la personne (douleur, anxiété, risque de chute…)."},{t:"Le nom de la maladie posé par le médecin",ok:!1,why:"C'est le diagnostic médical."},{t:"Le résultat d’une prise de sang",ok:!1,why:"C'est un examen biologique."},{t:"Un avis demandé à l’Ordre",ok:!1,why:"Aucun rapport."}]},{id:"fp7",theme:"contenu",jury:!1,q:"Dans quel ordre se déroule la démarche de soins infirmiers ?",opts:[{t:"Recueil de données → analyse et diagnostic infirmier → objectifs → interventions → évaluation",ok:!0,why:"C’est la démarche clinique enseignée dès la 1re année."},{t:"Interventions → recueil de données → objectifs",ok:!1,why:"On ne soigne pas avant d’avoir recueilli et analysé les données."},{t:"Évaluation → diagnostic → recueil",ok:!1,why:"L’ordre est inversé."},{t:"Il n’y a pas d’ordre, on improvise",ok:!1,why:"La démarche est structurée."}]},{id:"fp8",theme:"contenu",jury:!1,q:"Que sont les transmissions ciblées, souvent apprises en formation ?",opts:[{t:"Une façon structurée d’écrire dans le dossier de soins : une cible, puis Données, Actions, Résultats (DAR)",ok:!0,why:"Elles assurent la continuité des soins entre les équipes."},{t:"Des messages envoyés à la famille",ok:!1,why:"Ce sont des écrits professionnels dans le dossier patient."},{t:"Des ordonnances du médecin",ok:!1,why:"Ce sont des écrits infirmiers."},{t:"Des informations confidentielles qu’on ne note pas",ok:!1,why:"Au contraire : on écrit pour assurer la continuité."}],tip:"Ton expérience des tickets et procédures en informatique est un bon lien : tracer pour assurer la continuité."},{id:"fp9",theme:"contenu",jury:!1,q:"Quelle place la simulation peut-elle occuper dans l’enseignement clinique ?",opts:[{t:"Jusqu’à 10 % de l’enseignement clinique",ok:!0,why:"La simulation (mannequins, situations jouées) permet de s'entraîner sans risque pour le patient."},{t:"Elle remplace tous les stages",ok:!1,why:"Les stages restent indispensables."},{t:"Elle est interdite",ok:!1,why:"Elle est encouragée et encadrée."},{t:"50 % des stages",ok:!1,why:"La limite est de 10 %."}],tip:"Principe souvent cité : « jamais la première fois sur le patient »."},{id:"fp10",theme:"contenu",jury:!1,q:"Le domaine 3 du référentiel 2026 porte sur la promotion de la santé. Laquelle de ces actions en relève ?",opts:[{t:"Mener une action de prévention sur le tabac auprès de lycéens",ok:!0,why:"Prévention, éducation à la santé et éducation thérapeutique font partie du domaine 3."},{t:"Poser une perfusion",ok:!1,why:"C’est un soin technique (domaine 2)."},{t:"Faire le planning de l’équipe",ok:!1,why:"C’est de l’organisation (domaine 4)."},{t:"Écrire un article scientifique",ok:!1,why:"C’est la démarche scientifique (domaine 5)."}]},{id:"fp11",theme:"contenu",jury:!1,q:"Le domaine 2 du référentiel 2026 couvre les soins. Lesquels ?",opts:[{t:"Les soins à visée de dépistage, préventive, diagnostique, thérapeutique et palliative",ok:!0,why:"Le domaine 2 couvre toute la palette des soins, jusqu’aux soins palliatifs."},{t:"Uniquement les soins d’urgence",ok:!1,why:"Les urgences n’en sont qu’une partie."},{t:"Uniquement les soins d’hygiène",ok:!1,why:"C’est beaucoup plus large."},{t:"Uniquement les soins prescrits par le médecin",ok:!1,why:"Le rôle propre et la prescription infirmière en font partie."}]},{id:"fp12",theme:"contenu",jury:!1,q:"Le domaine 5 du référentiel 2026 porte sur la démarche scientifique. Qu’apprend-on ?",opts:[{t:"À rechercher et analyser des données scientifiques pour améliorer sa pratique, et à formaliser des documents professionnels",ok:!0,why:"C’est l’initiation à la recherche en soins infirmiers."},{t:"À faire des expériences en laboratoire",ok:!1,why:"Ce n’est pas le sens."},{t:"À devenir chercheur à temps plein",ok:!1,why:"C’est une initiation, pas une carrière de chercheur."},{t:"Rien d’utile pour le soin",ok:!1,why:"Au contraire : c’est pour soigner selon les connaissances actuelles."}]},{id:"fp13",theme:"contenu",jury:!1,q:"Dans le référentiel 2026, quelle compétence concerne la transmission du savoir ?",opts:[{t:"Accompagner les pairs, les apprenants et les autres professionnels",ok:!0,why:"L'infirmier encadre les stagiaires et les nouveaux collègues : on l'apprend en formation."},{t:"Élaborer le diagnostic infirmier",ok:!1,why:"C’est la compétence 1."},{t:"Prescrire des examens",ok:!1,why:"C’est la compétence 4."},{t:"Aucune",ok:!1,why:"Elle existe : compétence 10."}],tip:"Ton expérience de formation des agents en mairie est un vrai atout ici."},{id:"fp14",theme:"contenu",jury:!1,q:"Quelles matières retrouve-t-on dans la formation infirmière ?",opts:[{t:"Sciences infirmières, biologie, anatomie, pharmacologie, santé publique, psychologie, sociologie, droit et éthique",ok:!0,why:"La formation mélange sciences biologiques, sciences humaines et sciences infirmières."},{t:"Uniquement des techniques de soins",ok:!1,why:"Les sciences humaines et le raisonnement sont essentiels."},{t:"Uniquement de la médecine",ok:!1,why:"Les sciences infirmières sont au centre."},{t:"Uniquement de la psychologie",ok:!1,why:"C’est une partie seulement."}]},{id:"fp15",theme:"contenu",jury:!1,q:"Les calculs de doses sont-ils enseignés en formation ?",opts:[{t:"Oui, avec la pharmacologie : ils sont indispensables pour préparer et administrer les traitements en sécurité",ok:!0,why:"C'est aussi pourquoi l'épreuve écrite de sélection comporte des calculs."},{t:"Non, c’est le pharmacien qui calcule",ok:!1,why:"L'infirmier prépare et calcule les doses à administrer."},{t:"Non, les machines calculent tout",ok:!1,why:"Le contrôle humain reste indispensable."},{t:"Seulement en option",ok:!1,why:"Ce sont des compétences obligatoires."}],tip:"Lien à faire au jury : « je m’entraîne déjà aux calculs pour l’écrit »."},{id:"fp16",theme:"contenu",jury:!1,q:"Le référentiel de 2009 était organisé en 6 champs d’unités d’enseignement. Lequel en faisait partie ?",opts:[{t:"Sciences humaines, sociales et droit",ok:!0,why:"Les 6 champs : sciences humaines, sociales et droit ; sciences biologiques et médicales ; fondements des soins ; interventions infirmières ; intégration des savoirs ; méthodes de travail."},{t:"Gestion et comptabilité",ok:!1,why:"Ce champ n’existait pas."},{t:"Langues anciennes",ok:!1,why:"Ce champ n’existait pas."},{t:"Mathématiques avancées",ok:!1,why:"Ce champ n’existait pas."}]},{id:"fp17",theme:"contenu",jury:!0,q:"« Quelle compétence du référentiel vous semble la plus difficile pour vous ? »",opts:[{t:"Les soins techniques, que je n’ai jamais pratiqués : je compte beaucoup sur la simulation et les stages pour progresser pas à pas, en demandant conseil.",ok:!0,why:"Tu es honnête, tu nommes une vraie difficulté et tu montres comment tu vas la travailler."},{t:"Aucune, je suis à l’aise partout.",ok:!1,why:"Peu crédible pour quelqu’un qui débute."},{t:"Toutes, je ne sais pas si j’y arriverai.",ok:!1,why:"Trop négatif : le jury doute de ta capacité."},{t:"La relation avec les patients, je n’aime pas trop parler.",ok:!1,why:"Inquiétant pour un futur soignant."}]},{id:"fp18",theme:"contenu",jury:!0,q:"« Quelles compétences de votre parcours retrouvez-vous dans le référentiel ? »",opts:[{t:"La communication (expliquer simplement aux agents), l’organisation et la coordination des interventions, et la formation des utilisateurs : ce sont des compétences du référentiel.",ok:!0,why:"Tu fais un lien concret entre ton expérience et la formation."},{t:"Aucune, l’informatique n’a rien à voir.",ok:!1,why:"Tu dévalorises ton parcours."},{t:"Toutes : je suis déjà presque infirmier.",ok:!1,why:"Excessif : le jury attend de la modestie."},{t:"Je sais réparer les ordinateurs du service.",ok:!1,why:"Hors sujet par rapport aux compétences de soins."}]},{id:"fs1",theme:"contenu",jury:!1,q:"Comment les 66 semaines de stage sont-elles réparties dans le référentiel 2026 ?",opts:[{t:"12 semaines en 1re année, 26 en 2e, 28 en 3e",ok:!0,why:"La part de stage augmente chaque année."},{t:"22 semaines chaque année",ok:!1,why:"La répartition n’est pas égale."},{t:"15, 20 et 25 semaines",ok:!1,why:"C'était le référentiel de 2009 (60 semaines)."},{t:"Tout en 3e année",ok:!1,why:"Il y a des stages dès la 1re année."}]},{id:"fs2",theme:"contenu",jury:!1,q:"Combien d’heures représente en moyenne une semaine de stage ?",opts:[{t:"35 heures",ok:!0,why:"Une semaine de stage de 35 h vaut 1 ECTS, dont 5 h d'appropriation réflexive."},{t:"20 heures",ok:!1,why:"Trop peu."},{t:"48 heures",ok:!1,why:"Trop : la moyenne est de 35 h."},{t:"Cela dépend uniquement de l’étudiant",ok:!1,why:"Les horaires sont fixés avec le lieu de stage."}]},{id:"fs3",theme:"contenu",jury:!1,q:"Combien de semaines de stage comptait le référentiel de 2009 ?",opts:[{t:"60 semaines",ok:!0,why:"Le référentiel 2026 passe à 66 semaines."},{t:"66 semaines",ok:!1,why:"C'est le référentiel 2026."},{t:"30 semaines",ok:!1,why:"Trop peu."},{t:"100 semaines",ok:!1,why:"Trop."}]},{id:"fs4",theme:"contenu",jury:!1,q:"Quels sont les 4 types de stage du référentiel 2026 ?",opts:[{t:"Soins en phase aiguë, état stabilisé, soins primaires, accompagnement des personnes vulnérables",ok:!0,why:"Ces 4 types garantissent un parcours varié."},{t:"Urgences, bloc, réanimation, pédiatrie",ok:!1,why:"Ce sont des services, pas les types de stage."},{t:"Matin, après-midi, nuit, week-end",ok:!1,why:"Ce sont des horaires."},{t:"Public, privé, libéral, associatif",ok:!1,why:"Ce sont des statuts d’établissement."}]},{id:"fs5",theme:"contenu",jury:!1,q:"Qui encadre l’étudiant au quotidien sur son lieu de stage ?",opts:[{t:"Un tuteur, infirmier diplômé d’État, avec les professionnels de proximité",ok:!0,why:"Le tuteur suit la progression ; un cadre de santé ou un formateur est le référent du stage."},{t:"Personne, l’étudiant est autonome",ok:!1,why:"L'étudiant est toujours encadré."},{t:"Uniquement le médecin du service",ok:!1,why:"Le tuteur est un infirmier."},{t:"Un autre étudiant de 3e année",ok:!1,why:"Les étudiants s’entraident, mais le tuteur est un professionnel."}]},{id:"fs6",theme:"contenu",jury:!1,q:"Qu’est-ce que le portfolio de l’étudiant ?",opts:[{t:"Un outil de suivi des compétences et des actes acquis en stage, rempli avec les tuteurs",ok:!0,why:"Il sert à la validation des stages par le jury de semestre."},{t:"Un classeur de photos des stages",ok:!1,why:"C’est un outil pédagogique, pas un album."},{t:"Le dossier médical des patients",ok:!1,why:"Il ne contient aucune donnée de patient."},{t:"Un CV pour trouver un emploi",ok:!1,why:"C’est un outil de formation."}]},{id:"fs7",theme:"contenu",jury:!1,q:"À partir de quel taux d’absence un stage ne peut-il pas être validé ?",opts:[{t:"Plus de 20 % d’absence sur le stage",ok:!0,why:"Il faut au moins 80 % de présence effective. Sinon, on refait un stage du même type."},{t:"Dès 1 jour d’absence",ok:!1,why:"Une absence ponctuelle n’empêche pas la validation."},{t:"Plus de 50 %",ok:!1,why:"La limite est de 20 %."},{t:"Les absences ne comptent pas",ok:!1,why:"La présence est obligatoire en stage."}]},{id:"fs8",theme:"contenu",jury:!1,q:"Que se passe-t-il si un stage n’est pas validé ?",opts:[{t:"L’étudiant refait un stage du même type",ok:!0,why:"Le stage manqué doit être rattrapé pour acquérir la compétence."},{t:"Il est exclu de la formation",ok:!1,why:"Ce n’est pas automatique."},{t:"Rien, on passe au suivant",ok:!1,why:"Le stage doit être rattrapé."},{t:"Il repasse la sélection",ok:!1,why:"Aucun rapport."}]},{id:"fs9",theme:"contenu",jury:!1,q:"Quelles indemnités de stage prévoit l’arrêté de 2026 ?",opts:[{t:"36 € par semaine en 1re année, 46 € en 2e, 60 € en 3e",ok:!0,why:"Des frais de déplacement peuvent aussi être pris en charge. La FNESI juge ces montants trop faibles."},{t:"Un salaire d’infirmier",ok:!1,why:"L'étudiant n'est pas salarié pendant ses stages."},{t:"Rien du tout",ok:!1,why:"Une indemnité existe."},{t:"500 € par semaine",ok:!1,why:"Beaucoup trop."}],tip:"Si ta formation est financée (salaire maintenu, rémunération Transitions Pro…), ces indemnités dépendent de ta situation : renseigne-toi."},{id:"fs10",theme:"contenu",jury:!1,q:"Quels horaires un étudiant peut-il faire en stage ?",opts:[{t:"Ceux du service : matin, après-midi, parfois nuit et week-end",ok:!0,why:"L'étudiant suit les horaires de l'équipe pour découvrir la continuité des soins."},{t:"Uniquement 9 h – 17 h en semaine",ok:!1,why:"Les soins sont assurés 24 h/24."},{t:"Uniquement la nuit",ok:!1,why:"Les horaires varient."},{t:"Il choisit librement",ok:!1,why:"Ils sont fixés avec le lieu de stage."}]},{id:"fs11",theme:"contenu",jury:!1,q:"Qui choisit et agrée les lieux de stage ?",opts:[{t:"L’institut, avec une commission dédiée qui agrée les lieux de stage",ok:!0,why:"Les lieux doivent offrir un encadrement de qualité. L'étudiant ne choisit pas seul."},{t:"L’étudiant uniquement",ok:!1,why:"L'étudiant peut exprimer des souhaits, mais ne décide pas seul."},{t:"L’Ordre des infirmiers",ok:!1,why:"L’Ordre ne gère pas les stages."},{t:"Le patient",ok:!1,why:"Aucun rapport."}]},{id:"fs12",theme:"contenu",jury:!1,q:"Un stage à l’étranger est-il possible ?",opts:[{t:"Oui, la mobilité de stage est possible, dans l’Union européenne ou ailleurs, avec l’accord de l’institut",ok:!0,why:"La mobilité pour les études est, elle, limitée à un semestre."},{t:"Non, jamais",ok:!1,why:"La mobilité internationale est prévue."},{t:"Oui, toute la formation peut se faire à l’étranger",ok:!1,why:"C’est encadré et limité."},{t:"Seulement après le diplôme",ok:!1,why:"Elle est possible pendant la formation."}]},{id:"fs13",theme:"contenu",jury:!1,q:"Si ton employeur finance ta formation, peux-tu faire un stage dans le service où tu travaillais ?",opts:[{t:"Non : les stages chez l’employeur sont possibles (33 semaines maximum), mais pas dans un service où tu as déjà travaillé",ok:!0,why:"Un regard neuf est nécessaire pour apprendre en tant qu’étudiant."},{t:"Oui, tous tes stages",ok:!1,why:"C’est limité et exclu dans ton ancien service."},{t:"Oui, c’est même obligatoire",ok:!1,why:"Ce n’est pas obligatoire."},{t:"Aucune règle",ok:!1,why:"L’arrêté de 2026 fixe des règles."}]},{id:"fs14",theme:"contenu",jury:!1,q:"Pendant un stage, l’étudiant est-il tenu au secret professionnel ?",opts:[{t:"Oui, comme tous les professionnels qui interviennent auprès des patients",ok:!0,why:"Le secret s’applique dès le premier jour de stage."},{t:"Non, il n’est pas encore diplômé",ok:!1,why:"Le secret s’impose aussi aux étudiants."},{t:"Seulement en psychiatrie",ok:!1,why:"Il s’applique partout."},{t:"Seulement s’il signe un contrat",ok:!1,why:"Il s’applique par la loi."}]},{id:"fs15",theme:"contenu",jury:!1,q:"À quoi sert l’analyse de la pratique professionnelle après un stage ?",opts:[{t:"À revenir sur des situations vécues pour comprendre, prendre du recul et progresser",ok:!0,why:"C’est ce qui fait de toi un praticien réflexif."},{t:"À noter le tuteur",ok:!1,why:"Ce n'est pas l’objectif."},{t:"À raconter sa vie personnelle",ok:!1,why:"On analyse des situations professionnelles."},{t:"À rien, c’est facultatif",ok:!1,why:"C'est un temps de formation important."}]},{id:"fs16",theme:"formation",jury:!0,q:"« En stage, on vous demande un soin que vous ne maîtrisez pas. Que faites-vous ? »",opts:[{t:"Je le dis honnêtement, je demande à être accompagné ou à observer d’abord, et je ne le réalise pas seul tant que je ne suis pas en sécurité.",ok:!0,why:"La sécurité du patient passe avant tout : savoir dire « je ne sais pas » est une compétence."},{t:"Je le fais quand même pour ne pas décevoir.",ok:!1,why:"Dangereux pour le patient."},{t:"Je refuse et je quitte le service.",ok:!1,why:"Trop brutal : il faut demander de l’aide."},{t:"Je cherche un tutoriel sur internet et je le fais.",ok:!1,why:"Pas de soin sans encadrement quand on ne maîtrise pas."}]},{id:"fs17",theme:"formation",jury:!0,q:"« Un stage en psychiatrie ou en gériatrie vous fait-il peur ? »",opts:[{t:"Je les aborde avec curiosité : ce sont des stages où l’écoute et la relation sont centrales. Si une situation me met en difficulté, j’en parlerai à mon tuteur.",ok:!0,why:"Tu montres de l’ouverture et tu sais où trouver du soutien."},{t:"Oui, je préfère les éviter.",ok:!1,why:"Ils font partie du parcours : tu ne peux pas les éviter."},{t:"Non, ça ne me fait rien du tout.",ok:!1,why:"Peu crédible : mieux vaut reconnaître ses appréhensions."},{t:"Je ne veux faire que les urgences.",ok:!1,why:"Trop fermé."}]},{id:"fs18",theme:"formation",jury:!0,q:"« Votre tuteur de stage vous fait une remarque critique. Comment réagissez-vous ? »",opts:[{t:"Je l’écoute sans me justifier tout de suite, je demande des précisions pour comprendre, et je m’en sers pour progresser.",ok:!0,why:"La critique est un outil d’apprentissage : le jury attend cette posture."},{t:"Je me défends : je sais ce que je fais.",ok:!1,why:"Fermé à l’apprentissage."},{t:"Je me plains au formateur.",ok:!1,why:"Inadapté : il faut d’abord en parler avec le tuteur."},{t:"Je ne dis rien mais je n’en tiens pas compte.",ok:!1,why:"Pas constructif."}]},{id:"fs19",theme:"formation",jury:!0,q:"« Les stages peuvent être loin de chez vous. Comment allez-vous faire ? »",opts:[{t:"J’ai anticipé : je suis mobile [permis, voiture ou transports], et j’organiserai mes trajets selon les horaires du service.",ok:!0,why:"Tu montres que tu as anticipé une contrainte concrète."},{t:"Je demanderai des stages à côté de chez moi uniquement.",ok:!1,why:"Ce n’est pas toujours possible."},{t:"Je n’y ai pas pensé.",ok:!1,why:"Manque d’anticipation."},{t:"Je serai souvent en retard, ce n’est pas grave.",ok:!1,why:"La ponctualité est essentielle en soins."}],tip:"Remplace le crochet par ta situation réelle (permis, véhicule, RER…)."},{id:"fs20",theme:"contenu",jury:!1,q:"Pourquoi les stages ont-ils lieu aussi hors de l’hôpital (libéral, centres de santé, médico-social, santé scolaire) ?",opts:[{t:"Parce que les infirmiers exercent de plus en plus hors de l’hôpital, notamment avec le virage domiciliaire et les soins primaires",ok:!0,why:"Le référentiel 2026 met l’accent sur les soins primaires et l’accès aux soins."},{t:"Parce que les hôpitaux n’ont plus de place",ok:!1,why:"Ce n'est pas la raison pédagogique."},{t:"Pour que les stages soient plus courts",ok:!1,why:"La durée ne change pas."},{t:"Pour éviter les soins techniques",ok:!1,why:"On y fait aussi des soins techniques."}]},{id:"fv1",theme:"contenu",jury:!1,q:"Avec quelle note une unité d’enseignement est-elle validée ?",opts:[{t:"10/20, avec une compensation possible entre unités d’un même semestre",ok:!0,why:"Une UE validée apporte ses crédits ECTS, acquis définitivement."},{t:"12/20 sans compensation",ok:!1,why:"Le seuil est 10/20."},{t:"8/20",ok:!1,why:"Ce seuil concerne la sélection (note éliminatoire), pas les UE."},{t:"Il n’y a pas de note",ok:!1,why:"Les UE sont notées."}]},{id:"fv2",theme:"contenu",jury:!1,q:"Combien de sessions d’examen y a-t-il par semestre ?",opts:[{t:"Deux sessions : en cas d’échec, on peut se rattraper",ok:!0,why:"La meilleure note des deux sessions est retenue."},{t:"Une seule, sans rattrapage",ok:!1,why:"Il existe une deuxième session."},{t:"Cinq sessions",ok:!1,why:"Il y en a deux."},{t:"Aucune : tout est validé automatiquement",ok:!1,why:"Il faut réussir les évaluations."}]},{id:"fv3",theme:"contenu",jury:!1,q:"Que se passe-t-il si un étudiant obtient entre 30 et 50 crédits sur l’année ?",opts:[{t:"Il peut redoubler pour valider ce qui lui manque",ok:!0,why:"Le passage en année supérieure exige 51 crédits sur 60 ou les deux semestres."},{t:"Il passe quand même en année supérieure",ok:!1,why:"Il faut au moins 51 crédits."},{t:"Il est exclu définitivement",ok:!1,why:"Le redoublement est possible."},{t:"Il obtient le diplôme",ok:!1,why:"Le diplôme exige les 6 semestres."}]},{id:"fv4",theme:"contenu",jury:!1,q:"Comment les stages sont-ils validés ?",opts:[{t:"Par le jury de semestre, à partir de la présence (au moins 80 %), du portfolio et de l’évaluation du tuteur",ok:!0,why:"La validation des stages repose sur la mise en œuvre des compétences."},{t:"Par un examen écrit",ok:!1,why:"Le stage s’évalue en situation."},{t:"Automatiquement",ok:!1,why:"La validation n’est pas automatique."},{t:"Par le patient",ok:!1,why:"Aucun rapport."}]},{id:"fv5",theme:"contenu",jury:!1,q:"Combien de temps peut durer une interruption de formation ?",opts:[{t:"3 ans au maximum, et une seule fois",ok:!0,why:"Les notes obtenues sont conservées."},{t:"1 mois",ok:!1,why:"C’est plus long."},{t:"Sans limite",ok:!1,why:"L’interruption est limitée."},{t:"Interdite",ok:!1,why:"Elle est possible, par exemple pour raison de santé ou familiale."}],tip:"Bon à savoir en reconversion, mais au jury, mets l'accent sur ton engagement."},{id:"fv6",theme:"contenu",jury:!1,q:"Quelle condition doit remplir un aide-soignant pour intégrer directement la 2e année ?",opts:[{t:"Au moins 3 ans d’expérience sur les 5 dernières années, la sélection FPC et un parcours spécifique de 3 mois",ok:!0,why:"C'est le dispositif prévu par l'arrêté de 2026."},{t:"Aucune, c’est automatique",ok:!1,why:"Il y a des conditions."},{t:"10 ans d’expérience",ok:!1,why:"C’est 3 ans sur les 5 dernières années."},{t:"Avoir le bac scientifique",ok:!1,why:"Ce n’est pas une condition."}]},{id:"fv7",theme:"contenu",jury:!1,q:"Un étudiant venant d’une autre formation de santé peut-il bénéficier d’un parcours adapté ?",opts:[{t:"Oui, selon sa formation, il peut accéder à la 1re ou à la 2e année avec des dispenses",ok:!0,why:"Les dispenses sont étudiées au cas par cas."},{t:"Non, jamais",ok:!1,why:"Des passerelles existent."},{t:"Oui, il obtient directement le diplôme",ok:!1,why:"Il doit suivre une partie de la formation."},{t:"Seulement s’il est médecin à l’étranger",ok:!1,why:"D’autres profils sont concernés."}]},{id:"fv8",theme:"contenu",jury:!1,q:"Quels sont les modes d’évaluation pendant la formation ?",opts:[{t:"Contrôle continu et/ou examen terminal : écrits, oraux, études de situation, simulation, et validation des stages",ok:!0,why:"Les formes varient selon les unités d’enseignement."},{t:"Un seul examen final en 3e année",ok:!1,why:"Les évaluations ont lieu chaque semestre."},{t:"Uniquement des QCM",ok:!1,why:"Les formes sont variées."},{t:"Uniquement les stages",ok:!1,why:"Les UE théoriques sont aussi évaluées."}]},{id:"fv9",theme:"contenu",jury:!1,q:"Que contient l’AFGSU 2, obligatoire pour le diplôme ?",opts:[{t:"Une formation aux gestes et soins d’urgence : arrêt cardiaque, défibrillateur, hémorragie, alerte, situations sanitaires exceptionnelles",ok:!0,why:"Elle s'acquiert pendant la formation."},{t:"Un permis de conduire les ambulances",ok:!1,why:"Aucun rapport."},{t:"Un diplôme de secourisme en montagne",ok:!1,why:"Aucun rapport."},{t:"Un stage aux urgences",ok:!1,why:"C'est une formation spécifique, pas un stage."}],tip:"Si tu as un PSC1 ou une formation de secourisme, cite-la au jury."},{id:"fv10",theme:"contenu",jury:!1,q:"Qui délivre le diplôme à la fin des 3 ans ?",opts:[{t:"Une université accréditée, sur proposition d’un jury qui se réunit au moins deux fois par an",ok:!0,why:"C’est l’une des nouveautés du référentiel 2026."},{t:"Le directeur de l’IFSI seul",ok:!1,why:"Il préside des instances, mais le diplôme est délivré par l’université."},{t:"Le tuteur de dernier stage",ok:!1,why:"Il évalue le stage, pas le diplôme."},{t:"Le ministère, sans jury",ok:!1,why:"Un jury est prévu."}]},{id:"fv11",theme:"contenu",jury:!1,q:"Après le diplôme, que doit faire l’infirmier pour exercer ?",opts:[{t:"S’inscrire à l’Ordre national des infirmiers",ok:!0,why:"L'inscription à l'Ordre est obligatoire pour exercer, quel que soit le mode d'exercice."},{t:"Repasser un concours",ok:!1,why:"Aucun concours après le diplôme."},{t:"Attendre 2 ans",ok:!1,why:"Il peut exercer dès son inscription."},{t:"Rien",ok:!1,why:"L’inscription est obligatoire."}]},{id:"fv12",theme:"contenu",jury:!1,q:"Une unité d’enseignement validée doit-elle être repassée en cas de redoublement ?",opts:[{t:"Non : les crédits d’une UE validée sont acquis définitivement",ok:!0,why:"C’est le principe des crédits ECTS capitalisables."},{t:"Oui, toujours",ok:!1,why:"Les crédits acquis sont conservés."},{t:"Oui, si la note est inférieure à 15",ok:!1,why:"Une UE validée reste acquise."},{t:"Cela dépend du formateur",ok:!1,why:"La règle est nationale."}]},{id:"fv13",theme:"contenu",jury:!1,q:"Qui examine la situation individuelle d’un étudiant (difficultés, absences, redoublement, comportement) ?",opts:[{t:"Une instance compétente de l’institut, qui réunit direction, formateurs et représentants des étudiants",ok:!0,why:"Ces instances garantissent un traitement équitable."},{t:"Le directeur de l’hôpital seul",ok:!1,why:"Une instance collégiale est prévue."},{t:"Les autres étudiants",ok:!1,why:"Ils sont représentés, mais ne décident pas seuls."},{t:"Personne",ok:!1,why:"Une instance est prévue par les textes."}]},{id:"fv14",theme:"contenu",jury:!1,q:"En 3e année, on parle souvent d’initiation à la recherche. De quoi s’agit-il ?",opts:[{t:"D’un travail écrit où l’étudiant analyse une question de soins à partir de données scientifiques et de sa pratique",ok:!0,why:"Il prépare à la démarche scientifique du domaine 5."},{t:"D’une thèse de doctorat",ok:!1,why:"C’est une initiation, pas une thèse."},{t:"D’une expérience en laboratoire",ok:!1,why:"Ce n’est pas le sens."},{t:"D’un exposé sur sa vie personnelle",ok:!1,why:"C’est un travail professionnel."}]},{id:"fv15",theme:"contenu",jury:!1,q:"Combien de stages non validés peut-on rattraper ?",opts:[{t:"On refait un stage du même type pour acquérir la compétence ; le jury de semestre décide de la suite",ok:!0,why:"La règle est d’acquérir la compétence, pas de cumuler les heures."},{t:"Aucun : un échec, c’est l’exclusion",ok:!1,why:"Le rattrapage est prévu."},{t:"Tous, sans conséquence",ok:!1,why:"Les échecs répétés peuvent mener au redoublement."},{t:"On rattrape en faisant un examen écrit",ok:!1,why:"Un stage se rattrape par un stage."}]},{id:"fv16",theme:"contenu",jury:!0,q:"« Que ferez-vous si vous échouez à une unité d’enseignement ? »",opts:[{t:"J’analyserai mes erreurs avec le formateur, je réviserai avec une méthode adaptée et je me présenterai à la deuxième session.",ok:!0,why:"Tu montres que tu connais le rattrapage et que tu réagis de façon constructive."},{t:"J’abandonnerai, ce n’est pas fait pour moi.",ok:!1,why:"Trop défaitiste."},{t:"Je contesterai la note.",ok:!1,why:"Pas constructif en premier réflexe."},{t:"Ça ne m’arrivera pas.",ok:!1,why:"Peu crédible."}]},{id:"fv17",theme:"contenu",jury:!1,q:"Pourquoi faut-il au moins 80 % de présence en stage ?",opts:[{t:"Parce que les compétences s’acquièrent en situation réelle : sans présence suffisante, on ne peut pas les évaluer",ok:!0,why:"La présence en stage est obligatoire."},{t:"Pour que le service ait assez de personnel",ok:!1,why:"L'étudiant n'est pas un renfort."},{t:"Pour toucher les indemnités",ok:!1,why:"Ce n'est pas la raison."},{t:"Ce n’est pas une règle",ok:!1,why:"C'est une règle de l'arrêté."}]},{id:"ft1",theme:"formation",jury:!0,q:"« Comment allez-vous concilier la formation et votre vie personnelle ? »",opts:[{t:"J’ai prévu une organisation concrète : [garde, aide de mes proches, répartition des tâches], un temps de travail personnel chaque jour, et j’en ai parlé avec mon entourage.",ok:!0,why:"Le jury veut voir que ton projet est réaliste et soutenu."},{t:"Je verrai au fur et à mesure.",ok:!1,why:"Manque d’anticipation."},{t:"Ma vie personnelle passera toujours avant.",ok:!1,why:"Le jury doute de ta disponibilité."},{t:"Je n’aurai plus de vie personnelle pendant 3 ans.",ok:!1,why:"Peu réaliste : le jury craint l’épuisement."}],tip:"Remplace les crochets par ta situation réelle."},{id:"ft2",theme:"formation",jury:!0,q:"« Pourquoi passer par la formation professionnelle continue ? »",opts:[{t:"Parce que je suis un adulte en reconversion, avec une expérience professionnelle : cette voie reconnaît mon parcours et me permet de chercher un financement adapté.",ok:!0,why:"Tu montres que tu connais ta voie d’accès et ses avantages."},{t:"Parce que c’est plus facile que Parcoursup.",ok:!1,why:"Maladroit : le jury attend une raison positive."},{t:"Je ne savais pas qu’il y avait d’autres voies.",ok:!1,why:"Manque d’information."},{t:"Pour être payé pendant la formation.",ok:!1,why:"Réducteur : la motivation doit être le métier."}]},{id:"ft3",theme:"formation",jury:!0,q:"« Quelles méthodes de travail comptez-vous utiliser ? »",opts:[{t:"Des fiches de synthèse après chaque cours, des révisions régulières plutôt qu’au dernier moment, du travail en groupe et des outils numériques que je maîtrise.",ok:!0,why:"Concret et réaliste : tu valorises aussi ton aisance avec le numérique."},{t:"Je réviserai la veille des examens.",ok:!1,why:"Risqué vu la charge de travail."},{t:"Je n’ai pas besoin de méthode.",ok:!1,why:"Le jury en doute."},{t:"Je recopierai les cours de mes camarades.",ok:!1,why:"Pas une méthode personnelle."}]},{id:"ft4",theme:"formation",jury:!0,q:"« Comment vivez-vous le travail en groupe ? »",opts:[{t:"Bien : en informatique, je travaillais en équipe avec des techniciens et des agents. J’écoute, je partage les tâches et je respecte les échéances.",ok:!0,why:"Le travail en groupe est fréquent en IFSI : un exemple vécu rassure le jury."},{t:"Je préfère travailler seul.",ok:!1,why:"Inquiétant pour un métier d’équipe."},{t:"Je laisse les autres faire.",ok:!1,why:"Manque d’implication."},{t:"Je prends toujours la direction.",ok:!1,why:"Peut mettre en difficulté le groupe."}]},{id:"ft5",theme:"formation",jury:!0,q:"« Un conflit éclate dans votre groupe de travail. Que faites-vous ? »",opts:[{t:"Je propose d’en parler calmement, j’écoute chaque point de vue et on cherche ensemble une solution ; si ça bloque, on sollicite le formateur.",ok:!0,why:"Tu montres des compétences de communication et de médiation."},{t:"Je quitte le groupe.",ok:!1,why:"Fuite du problème."},{t:"J’impose ma solution.",ok:!1,why:"Autoritaire."},{t:"Je laisse faire, ça finira par passer.",ok:!1,why:"Passif."}]},{id:"ft6",theme:"formation",jury:!0,q:"« Êtes-vous à l’aise avec l’écrit et l’informatique ? »",opts:[{t:"Oui : j’ai rédigé des procédures et des documents en mairie, et l’informatique est mon métier. C’est utile pour le dossier de soins informatisé et les travaux écrits.",ok:!0,why:"Tu transformes ton parcours en atout concret."},{t:"Pas trop, mais ce n’est pas important pour un infirmier.",ok:!1,why:"Faux : les écrits professionnels sont essentiels."},{t:"Je suis expert, je n’aurai rien à apprendre.",ok:!1,why:"Trop sûr de toi."},{t:"Je ferai écrire les autres.",ok:!1,why:"Inadapté."}]},{id:"ft7",theme:"formation",jury:!0,q:"« Les horaires de nuit et de week-end ne vous font-ils pas peur ? »",opts:[{t:"J’en ai conscience : la continuité des soins l’exige. J’ai déjà eu des horaires variables [en intérim], et mon entourage est prêt.",ok:!0,why:"Tu montres que tu as anticipé une contrainte réelle du métier."},{t:"Je n’en ferai pas.",ok:!1,why:"Ce n'est pas négociable en soins."},{t:"Je ne savais pas.",ok:!1,why:"Manque de connaissance du métier."},{t:"Je demanderai une dispense.",ok:!1,why:"Pas réaliste."}]},{id:"ft8",theme:"formation",jury:!0,q:"« Que ferez-vous d’ici la rentrée de septembre 2027 ? »",opts:[{t:"Je continue à découvrir le métier [échanges avec des infirmiers, bénévolat, emploi d’agent hospitalier si possible], je révise les bases (calculs, biologie) et je prépare mon financement.",ok:!0,why:"Tu montres que tu utilises le temps avant la rentrée de façon active."},{t:"Rien de particulier, j’attends.",ok:!1,why:"Passif."},{t:"Je pars en vacances, ce sera dur après.",ok:!1,why:"Pas une mauvaise idée en soi, mais insuffisant."},{t:"J’apprends déjà toutes les techniques de soins seul.",ok:!1,why:"Irréaliste et inutile sans encadrement."}],tip:"Remplace les crochets par ce que tu prévois vraiment."},{id:"ft9",theme:"formation",jury:!0,q:"« Et si vous n’êtes pas retenu cette année ? »",opts:[{t:"Je serai déçu, mais je chercherai à comprendre pourquoi, je renforcerai mon projet et je me représenterai : mon envie est réfléchie et durable.",ok:!0,why:"Tu montres que ton projet ne dépend pas d’une seule tentative."},{t:"Je laisserai tomber.",ok:!1,why:"Fait douter de ta motivation."},{t:"Ce n’est pas possible, je serai pris.",ok:!1,why:"Trop sûr de toi."},{t:"Je deviendrai aide-soignant à la place.",ok:!1,why:"Donne l’impression d’un projet par défaut."}]},{id:"ft10",theme:"formation",jury:!0,q:"« Que craignez-vous le plus dans la formation ? »",opts:[{t:"La quantité de connaissances à acquérir après plusieurs années sans études. C’est pourquoi je m’organise dès maintenant et je compterai sur le suivi pédagogique.",ok:!0,why:"Une crainte honnête, accompagnée d’une solution."},{t:"Rien du tout.",ok:!1,why:"Peu crédible."},{t:"Les patients.",ok:!1,why:"Inquiétant pour un futur soignant."},{t:"Tout, je ne suis pas sûr d’y arriver.",ok:!1,why:"Trop négatif."}]},{id:"ft11",theme:"formation",jury:!0,q:"« Quel infirmier aimeriez-vous être plus tard ? »",opts:[{t:"J’aimerais d’abord acquérir de l’expérience, peut-être à l’hôpital, puis me tourner vers le domicile ou le libéral, comme les infirmiers qui ont soigné ma mère. Je reste ouvert à ce que je découvrirai en stage.",ok:!0,why:"Un projet personnel, mais ouvert : c’est ce que le jury apprécie."},{t:"Infirmier libéral dès le diplôme, c’est décidé.",ok:!1,why:"Trop fermé : l’expérience est recommandée avant le libéral."},{t:"Je ne sais pas du tout.",ok:!1,why:"Manque de projection."},{t:"Cadre de santé le plus vite possible.",ok:!1,why:"Donne l’impression de vouloir fuir le soin."}]},{id:"ft12",theme:"formation",jury:!1,q:"Quels dispositifs peuvent financer une reconversion en FPC ?",opts:[{t:"Le projet de transition professionnelle (Transitions Pro), le CPF, l’employeur, France Travail ou la Région selon la situation",ok:!0,why:"Les dispositifs dépendent de ton statut : salarié, intérimaire, demandeur d’emploi."},{t:"Uniquement les économies personnelles",ok:!1,why:"De nombreux dispositifs existent."},{t:"L’IFSI paie tout automatiquement",ok:!1,why:"Ce n’est pas automatique."},{t:"Seulement un prêt bancaire",ok:!1,why:"C'est une option parmi d'autres."}],tip:"Pour le jury : une piste principale + un plan B, avec les démarches déjà faites."},{id:"ft13",theme:"formation",jury:!1,q:"Selon l’enquête de la FAGE relayée par la FNESI, combien coûte en moyenne la rentrée d’un étudiant en 2026 ?",opts:[{t:"Environ 3 200 € (3 239 €)",ok:!0,why:"La précarité étudiante est un sujet d’actualité pour les étudiants infirmiers."},{t:"Environ 300 €",ok:!1,why:"Bien plus."},{t:"Environ 10 000 €",ok:!1,why:"Moins."},{t:"Rien, tout est gratuit",ok:!1,why:"Il y a des frais (logement, transport, matériel…)."}],tip:"Montre que tu as anticipé ton budget : c’est un facteur d’abandon selon la FNESI."},{id:"ft14",theme:"formation",jury:!0,q:"« Vous avez plus d’expérience de vie que la plupart des étudiants. Comment le vivrez-vous ? »",opts:[{t:"Comme une richesse : je peux apporter mon expérience au groupe, tout en restant à ma place d’étudiant, prêt à apprendre de tous, y compris des plus jeunes.",ok:!0,why:"Tu montres humilité et ouverture."},{t:"Je n’aurai pas grand-chose à apprendre d’eux.",ok:!1,why:"Condescendant."},{t:"Ça me gênera, je resterai à l’écart.",ok:!1,why:"Isolement inquiétant."},{t:"Je compte devenir le délégué pour les diriger.",ok:!1,why:"Maladroit."}]},{id:"ax1",theme:"actu",jury:!1,q:"Quand les arrêtés d’application de la loi infirmière sont-ils entrés en vigueur ?",opts:[{t:"Le 28 juin 2026, après leur publication au Journal officiel le 27 juin 2026",ok:!0,why:"Le décret de décembre 2025 entrait en vigueur au lendemain de la publication des arrêtés."},{t:"Le 1er janvier 2025",ok:!1,why:"Trop tôt : la loi date du 27 juin 2025."},{t:"Ils ne sont pas encore publiés",ok:!1,why:"Ils ont été publiés en juin 2026."},{t:"En 2030",ok:!1,why:"Ils sont déjà en vigueur."}]},{id:"ax2",theme:"actu",jury:!1,q:"Tous les combien de temps la liste des prescriptions infirmières doit-elle être révisée ?",opts:[{t:"Au moins tous les 3 ans, après avis de la HAS et de l’Académie nationale de médecine",ok:!0,why:"La liste peut donc s’élargir avec le temps."},{t:"Jamais",ok:!1,why:"Elle est révisable."},{t:"Chaque mois",ok:!1,why:"Trop fréquent."},{t:"Tous les 20 ans",ok:!1,why:"C’est au moins tous les 3 ans."}]},{id:"ax3",theme:"actu",jury:!1,q:"Le renouvellement de contraceptifs oraux par l’infirmier est limité à :",opts:[{t:"6 mois",ok:!0,why:"C'est l'une des prescriptions prévues par l'arrêté du 26 juin 2026."},{t:"1 semaine",ok:!1,why:"Trop court."},{t:"5 ans",ok:!1,why:"Trop long."},{t:"Il est interdit",ok:!1,why:"Il est autorisé, dans la limite de 6 mois."}]},{id:"ax4",theme:"actu",jury:!1,q:"Qu’est-ce que le réseau « France Santé » ?",opts:[{t:"Un réseau de structures de soins labellisées pour offrir des soins à moins de 30 minutes et sous 48 heures, avec 5 000 structures visées fin 2027",ok:!0,why:"Centres de santé, maisons pluriprofessionnelles, hôpitaux de proximité, pharmacies… Les Médicobus doivent s’y intégrer."},{t:"Une mutuelle publique",ok:!1,why:"Ce n'est pas une mutuelle."},{t:"Une chaîne de télévision santé",ok:!1,why:"Aucun rapport."},{t:"Un site de prise de rendez-vous privé",ok:!1,why:"C'est un réseau public de structures de soins."}]},{id:"ax5",theme:"actu",jury:!1,q:"Combien de Médicobus étaient labellisés en novembre 2026 ?",opts:[{t:"34, avec un objectif de 100 en 2027",ok:!0,why:"Un 2e appel à projets vise 70 Médicobus supplémentaires (coût moyen : 200 000 € par an)."},{t:"1 000",ok:!1,why:"Beaucoup trop."},{t:"Aucun",ok:!1,why:"Il y en a déjà 34."},{t:"100, objectif déjà atteint",ok:!1,why:"L'objectif de 100 est pour 2027."}]},{id:"ax6",theme:"actu",jury:!1,q:"Dans un Médicobus, quel peut être le rôle de l’infirmier ?",opts:[{t:"Assister des téléconsultations avec un médecin à distance",ok:!0,why:"C'est un exemple concret d'infirmier au cœur de l'accès aux soins."},{t:"Aucun, il n’y a que des médecins",ok:!1,why:"Les infirmiers peuvent y intervenir."},{t:"Conduire le bus uniquement",ok:!1,why:"Aucun rapport."},{t:"Opérer les patients",ok:!1,why:"Aucun rapport."}]},{id:"ax7",theme:"actu",jury:!1,q:"Combien de séances avec un psychologue « Mon soutien psy » rembourse-t-il par an ?",opts:[{t:"12 séances, accessibles directement, sans ordonnance du médecin",ok:!0,why:"Depuis 2024, l'accès est direct et le nombre de séances est passé à 12."},{t:"3 séances",ok:!1,why:"C’est plus."},{t:"Illimité",ok:!1,why:"Le nombre est limité."},{t:"Aucune, il faut tout payer",ok:!1,why:"Les séances sont remboursées."}]},{id:"ax8",theme:"actu",jury:!1,q:"Le 3114, c’est :",opts:[{t:"Le numéro national de prévention du suicide, gratuit, 24 h/24 et 7 j/7",ok:!0,why:"Il s'adresse aux personnes en souffrance et à leurs proches, mais aussi aux professionnels."},{t:"Le numéro du SAMU",ok:!1,why:"Le SAMU, c’est le 15."},{t:"Le numéro de l’Assurance maladie",ok:!1,why:"Ce n'est pas le bon numéro."},{t:"Le numéro contre le harcèlement scolaire",ok:!1,why:"C'est le 3018 pour le cyberharcèlement."}]},{id:"ax9",theme:"actu",jury:!1,q:"Quels délais d’accès aux soins en psychiatrie sont dénoncés par les acteurs du secteur ?",opts:[{t:"Souvent 6 à 12 mois d’attente selon la FHP Psy",ok:!0,why:"Ces délais expliquent les demandes de mesures concrètes au-delà de la grande cause nationale."},{t:"Moins de 24 heures partout",ok:!1,why:"Malheureusement non."},{t:"Aucun délai",ok:!1,why:"Les délais sont un problème majeur."},{t:"10 ans",ok:!1,why:"Exagéré."}]},{id:"ax10",theme:"actu",jury:!1,q:"Combien de personnes ont été formées aux Premiers secours en santé mentale (PSSM) ?",opts:[{t:"Environ 300 000",ok:!0,why:"Ces formations apprennent à repérer une détresse psychique et à orienter vers l’aide adaptée."},{t:"Environ 300",ok:!1,why:"Bien plus."},{t:"Toute la population",ok:!1,why:"Pas encore."},{t:"Personne, la formation n’existe pas",ok:!1,why:"Elle existe."}],tip:"Si tu as fait la formation PSSM ou PSC1, cite-la au jury."},{id:"ax11",theme:"actu",jury:!1,q:"Quel est le numéro et la date de la loi sur l’aide à mourir ?",opts:[{t:"Loi n° 2026-794 du 18 août 2026",ok:!0,why:"Promulguée 4 jours après la décision du Conseil constitutionnel du 14 août 2026."},{t:"Loi du 27 juin 2025",ok:!1,why:"C'est la loi infirmière."},{t:"Loi Leonetti de 2005",ok:!1,why:"C'est une loi plus ancienne sur la fin de vie."},{t:"Elle n’a pas encore de numéro",ok:!1,why:"Elle a été promulguée."}]},{id:"ax12",theme:"actu",jury:!1,q:"Que prévoit la clause de conscience dans la loi sur l’aide à mourir ?",opts:[{t:"Médecins, infirmiers et pharmaciens peuvent refuser d’y participer, mais doivent orienter immédiatement la personne vers un autre professionnel",ok:!0,why:"Le Conseil constitutionnel a précisé la clause des pharmaciens dans ses réserves."},{t:"Aucun soignant ne peut refuser",ok:!1,why:"Une clause de conscience existe."},{t:"Le soignant qui refuse n’a rien à faire de plus",ok:!1,why:"Il doit orienter vers un confrère."},{t:"Seuls les médecins peuvent refuser",ok:!1,why:"Les infirmiers et pharmaciens aussi."}]},{id:"ax13",theme:"actu",jury:!1,q:"Quelle loi plus ancienne encadre déjà la fin de vie et la sédation profonde et continue ?",opts:[{t:"La loi Claeys-Leonetti de 2016",ok:!0,why:"Elle a créé la sédation profonde et continue jusqu'au décès et renforcé les directives anticipées."},{t:"La loi Veil de 1975",ok:!1,why:"Elle concerne l'IVG."},{t:"La loi Kouchner de 2002",ok:!1,why:"Elle concerne les droits des malades (consentement, accès au dossier)."},{t:"Aucune",ok:!1,why:"La fin de vie est encadrée depuis 2005 (loi Leonetti)."}],tip:"Les directives anticipées et la personne de confiance sont des notions à connaître."},{id:"ax14",theme:"actu",jury:!1,q:"Quel nouveau projet concernant les soignants a été annoncé pour la vaccination contre la grippe ?",opts:[{t:"Une obligation vaccinale antigrippale pour les professionnels de santé, dont le cadre est attendu début 2027",ok:!0,why:"Elle vise à protéger les patients fragiles."},{t:"L’interdiction de vacciner pour les infirmiers",ok:!1,why:"Les infirmiers vaccinent."},{t:"La fin de la campagne annuelle",ok:!1,why:"La campagne a lieu chaque automne."},{t:"Un vaccin unique pour toute la vie",ok:!1,why:"Ce n'est pas le cas pour la grippe."}]},{id:"ax15",theme:"actu",jury:!1,q:"Qu’est-ce qu’une commission mixte paritaire (CMP) ?",opts:[{t:"Une réunion de 7 députés et 7 sénateurs chargée de trouver un texte commun quand les deux assemblées ne sont pas d’ac que pour sa santé, mais aussi pour la personne aidée, dont le maintien à domicile peut alors être remis en cause.",qs:["Quel est le problème principal soulevé par ce texte ?","Quelles peuvent être les conséquences de l'épuisement d'un aidant, pour lui et pour la personne aidée ?","Selon vous, quel rôle l'infirmier peut-il jouer auprès des aidants ? Argumentez."]},{id:"deserts",theme:"Accès aux soins",title:"Trouver un médecin",doc:"Dans certains territoires, obtenir un rendez-vous chez un médecin généraliste demande plusieurs semaines, et de nombreux habitants n'ont plus de médecin traitant. Les urgences hospitalières accueillent alors des patients dont la situation aurait pu être prise en charge en ville. Pour répondre à ces difficultés, les pouvoirs publics misent notamment sur les maisons de santé pluriprofessionnelles, la télémédecine et l'élargissement des missions de certains professionnels, dont les infirmiers en pratique avancée.",qs:["À partir du texte, expliquez ce que l'on appelle un « désert médical ».","Quelles sont les conséquences de ces difficultés d'accès aux soins sur le système de santé ?","L'élargissement du rôle des infirmiers vous semble-t-il une réponse adaptée ? Argumentez."]},{id:"vaccin",theme:"Prévention",title:"Le doute vaccinal",doc:"La vaccination a permis de faire reculer, et parfois de faire disparaître, des maladies autrefois très meurtrières. Pourtant, une partie de la population exprime aujourd'hui des doutes : peur des effets indésirables, méfiance envers les laboratoires ou les autorités, informations contradictoires sur les réseaux sociaux. Les professionnels de santé restent cependant parmi les interlocuteurs en qui le public a le plus confiance.",qs:["Quelles sont les raisons de l'hésitation vaccinale évoquées dans le texte ?","Comment un soignant peut-il répondre aux doutes d'un patient sur la vaccination ? Donnez des exemples concrets."]},{id:"jeunes",theme:"Santé mentale",title:"La santé mentale des jeunes",doc:"Anxiété, troubles du sommeil, isolement : les professionnels observent depuis plusieurs années une dégradation de la santé mentale des adolescents et des jeunes adultes. Les services de pédopsychiatrie sont saturés et les délais pour obtenir un rendez-vous se comptent parfois en mois. Parler de sa souffrance psychique reste difficile, par peur d'être jugé ou de ne pas être pris au sérieux.",qs:["Dégagez les idées principales de ce texte.","Pourquoi est-il difficile pour un jeune de demander de l'aide ?","Quelles actions de prévention pourraient être menées auprès des jeunes ? Justifiez vos propositions."]},{id:"violence",theme:"Conditions de travail",title:"Violences envers les soignants",doc:"Insultes, menaces, parfois agressions physiques : les signalements de violences envers les soignants augmentent. Elles surviennent souvent aux urgences, dans un contexte d'attente longue, d'angoisse et d'incompréhension. Ces violences ont des conséquences sur la santé des professionnels et contribuent à rendre certains métiers moins attractifs.",qs:["Quelles sont les causes possibles de ces violences d'après le texte ?","Quelles peuvent en être les conséquences pour les soignants et pour la qualité des soins ?","Comment un infirmier peut-il prévenir ou apaiser une situation de tension ? Argumentez."]},{id:"finvie",theme:"Fin de vie",title:"Les soins palliatifs",doc:"Les soins palliatifs visent à soulager la douleur et les autres symptômes, et à accompagner la personne en fin de vie ainsi que ses proches. Ils ne concernent pas seulement les derniers jours : ils peuvent être proposés tôt dans l'évolution d'une maladie grave. Pourtant, l'accès à ces soins reste inégal selon les territoires, et la fin de vie fait régulièrement l'objet de débats de société.",qs:["Quels sont les objectifs des soins palliatifs présentés dans le texte ?","En quoi l'accompagnement des proches fait-il partie du soin ?","Selon vous, quelles qualités humaines un infirmier doit-il mobiliser auprès d'un patient en fin de vie ?"]},{id:"sedentarite",theme:"Prévention",title:"Sédentarité et santé",doc:"Le manque d'activité physique et le temps passé assis devant les écrans augmentent, chez les enfants comme chez les adultes. Or la sédentarité favorise le surpoids, les maladies cardiovasculaires, le diabète et certains troubles psychologiques. Les campagnes de prévention se multiplient, mais changer ses habitudes de vie reste difficile, en particulier pour les personnes en situation de précarité.",qs:["Quel lien le texte établit-il entre mode de vie et santé ?","Pourquoi les campagnes de prévention ne suffisent-elles pas toujours ?","Proposez et justifiez deux actions de prévention qu'un infirmier pourrait mener."]},{id:"handicap",theme:"Handicap",title:"Se soigner avec un handicap",doc:"Se déplacer, accéder à un cabinet médical, comprendre une ordonnance : pour une personne en situation de handicap, ces démarches simples peuvent devenir des obstacles. Certaines renoncent à des soins courants, comme le dentiste ou les dépistages, faute d'équipements adaptés ou de professionnels formés. L'accès aux soins des personnes handicapées est pourtant un droit.",qs:["Quels obstacles à l'accès aux soins le texte met-il en évidence ?","Comment les établissements de santé pourraient-ils mieux accueillir les personnes en situation de handicap ? Argumentez."]},{id:"precarite",theme:"Précarité",title:"Renoncer à se soigner",doc:"Une consultation mal remboursée, une paire de lunettes, des soins dentaires : pour les personnes aux revenus modestes, certains soins sont repoussés, voire abandonnés. Le renoncement aux soins ne s'explique pas seulement par le coût : la complexité des démarches administratives, l'éloignement géographique ou la méfiance envers les institutions jouent aussi un rôle. Ces retards aggravent souvent l'état de santé et conduisent à des prises en charge plus lourdes.",qs:["Quelles sont les causes du renoncement aux soins évoquées dans le texte ?","Quelles en sont les conséquences pour la personne et pour la société ?","Quel peut être le rôle du soignant face à un patient en situation de précarité ?"]},{id:"numerique",theme:"Santé numérique",title:"Le numérique au service du soin ?",doc:"Prise de rendez-vous en ligne, téléconsultation, dossier médical partagé, objets connectés : le numérique transforme l'organisation des soins. Il peut faciliter le suivi des patients à distance et faire gagner du temps aux professionnels. Mais il soulève aussi des questions : protection des données de santé, exclusion des personnes peu à l'aise avec les outils numériques, risque de déshumanisation de la relation de soin.",qs:["Présentez les avantages et les limites du numérique en santé évoqués dans le texte.","Le numérique peut-il remplacer la relation humaine dans le soin ? Argumentez votre réponse."]},{id:"antibio",theme:"Santé publique",title:"Les antibiotiques en danger",doc:"L'utilisation excessive ou inadaptée des antibiotiques favorise l'apparition de bactéries résistantes. Certaines infections deviennent ainsi plus difficiles, voire impossibles, à traiter. Les autorités de santé rappellent que les antibiotiques sont inefficaces contre les virus et qu'un traitement doit être pris en respectant la durée prescrite. L'hygiène des mains, à l'hôpital comme en ville, reste l'un des moyens les plus efficaces de limiter la transmission des bactéries.",qs:["Expliquez avec vos mots ce qu'est l'antibiorésistance d'après le texte.","Quels comportements permettent de limiter ce phénomène ?","Quel rôle le futur infirmier peut-il jouer dans cette lutte ?"]},{id:"prendresoin",theme:"Sujet de réflexion",title:"Soigner ou prendre soin",doc:null,qs:["« Soigner, ce n'est pas seulement traiter une maladie, c'est prendre soin d'une personne. » Que vous inspire cette affirmation ? Développez une réponse argumentée, appuyée sur des exemples."]},{id:"epuisement",theme:"Conditions de travail",title:"L'épuisement professionnel des soignants",doc:"Horaires décalés, charge de travail importante, confrontation quotidienne à la souffrance : les soignants sont particulièrement exposés à l'épuisement professionnel, parfois appelé burn-out. Il se manifeste par une fatigue intense, le sentiment de ne plus être efficace et une mise à distance des patients. Ses effets dépassent la personne : arrêts de travail, départs de la profession et difficultés à assurer la continuité des soins. Prévenir cet épuisement est devenu un enjeu pour les établissements comme pour les équipes.",qs:["Quelles sont les causes de l'épuisement professionnel des soignants d'après le texte ?","Comment se manifeste-t-il, et quelles en sont les conséquences ?","Comment un futur infirmier peut-il préserver sa santé tout au long de sa carrière ? Argumentez."]},{id:"addictions",theme:"Addictions",title:"Les addictions, un enjeu de santé publique",doc:"Tabac, alcool, cannabis, mais aussi jeux d'argent ou écrans : les addictions touchent tous les âges et tous les milieux. Elles se caractérisent par une perte de contrôle et par la poursuite d'un comportement malgré ses conséquences négatives. Souvent associées à la honte, elles restent difficiles à évoquer, ce qui retarde la demande d'aide. Pourtant, des accompagnements existent, et une attitude sans jugement de la part des professionnels de santé peut faciliter le premier pas.",qs:["Comment le texte définit-il une addiction ?","Pourquoi est-il difficile de demander de l'aide ?","Quelle attitude un soignant doit-il adopter face à un patient présentant une addiction ? Argumentez."]},{id:"consentement",theme:"Droits du patient",title:"Le consentement aux soins",doc:"Aucun acte médical ni aucun traitement ne peut être pratiqué sans le consentement libre et éclairé de la personne, et ce consentement peut être retiré à tout moment. Pour qu'il soit éclairé, le patient doit recevoir une information claire, adaptée et compréhensible. Dans la pratique, le respect de ce principe se heurte parfois à l'urgence, au manque de temps ou à des situations où la personne a des difficultés à exprimer sa volonté.",qs:["Qu'est-ce qu'un consentement « libre et éclairé » d'après le texte ?","Pourquoi le respect de ce principe est-il parfois difficile dans la pratique ?","Comment l'infirmier peut-il contribuer au respect du consentement du patient ? Argumentez."]},{id:"pdf-alimentation",theme:"Prévention",title:"Alimentation, obésité et prévention *",doc:`L'alimentation joue un rôle essentiel dans le maintien d'une bonne santé. Elle apporte à l'organisme les nutriments nécessaires à son fonctionnement et contribue au développement physique et intellectuel.

Cependant, les habitudes alimentaires ont évolué au cours des dernières décennies. La consommation de produits transformés, souvent riches en sucres, en sel et en matières grasses, a augmenté. Parallèlement, les modes de vie sont devenus plus sédentaires, notamment en raison du développement des écrans et de la diminution de certaines activités physiques quotidiennes.

Ces changements favorisent l'apparition de maladies chroniques telles que le diabète de type 2, les maladies cardiovasculaires et l'obésité.

La prévention repose notamment sur l'éducation nutritionnelle, la pratique régulière d'une activité physique et l'accès à une alimentation équilibrée. Les professionnels de santé ont un rôle important à jouer dans l'accompagnement des personnes, sans jugement ni culpabilisation.

L'objectif n'est pas d'imposer un modèle alimentaire unique, mais d'aider chacun à comprendre ses besoins et à adopter progressivement des habitudes favorables à sa santé.`,qs:["Explique pourquoi l'alimentation est essentielle au fonctionnement de l'organisme.","Cite trois facteurs qui favorisent le développement de l'obésité selon le texte.","Quelles maladies chroniques sont mentionnées dans le texte ?","Explique ce que signifie « éducation nutritionnelle ».","Pourquoi est-il important que les professionnels de santé accompagnent les patients sans les culpabiliser ?","Selon toi, comment les professionnels de santé peuvent-ils contribuer à améliorer les habitudes alimentaires de la population ? Développe ton argumentation avec des exemples concrets, une introduction, un développement et une conclusion (20 à 25 lignes)."]},{id:"pdf-vieillissement",theme:"Vieillissement",title:"Vieillissement et maintien à domicile *",doc:`L'espérance de vie augmente dans de nombreux pays. Cette évolution constitue un progrès, mais elle entraîne également de nouveaux besoins en matière de santé et d'accompagnement.

Avec l'âge, certaines personnes peuvent rencontrer des difficultés pour effectuer les gestes de la vie quotidienne : se laver, s'habiller, préparer les repas ou se déplacer. Ces difficultés peuvent être liées à des maladies chroniques, à une diminution de la mobilité ou à des troubles cognitifs.

Le maintien à domicile représente une solution privilégiée par de nombreuses personnes âgées. Il leur permet de conserver leurs habitudes, leur environnement et une certaine autonomie. Toutefois, cette solution nécessite parfois l'intervention de professionnels : infirmiers, aides-soignants, auxiliaires de vie ou services d'aide à domicile.

Les proches jouent également un rôle important. Cependant, leur investissement peut entraîner une fatigue physique et psychologique. Il est donc nécessaire de proposer des dispositifs de soutien aux aidants.

L'accompagnement des personnes âgées doit respecter leur dignité, leurs choix et leur rythme de vie. Il ne s'agit pas de faire systématiquement à leur place, mais de les aider à conserver autant que possible leur autonomie.`,qs:["Pourquoi le vieillissement de la population représente-t-il un enjeu pour le système de santé ?","Cite quatre activités quotidiennes pouvant devenir difficiles avec l'âge.","Quels sont les avantages du maintien à domicile ?","Pourquoi les proches aidants peuvent-ils avoir besoin de soutien ?","Explique la différence entre aider une personne et faire systématiquement à sa place.","Le maintien de l'autonomie des personnes âgées doit-il être une priorité dans notre société ? Présente les avantages, les difficultés et le rôle des professionnels de santé (20 à 25 lignes)."]},{id:"pdf-santementale",theme:"Santé mentale",title:"Santé mentale et isolement social *",doc:`La santé mentale constitue une composante essentielle de la santé globale. Elle ne se limite pas à l'absence de maladie psychique : elle concerne également le bien-être émotionnel, psychologique et social.

Chez les jeunes, plusieurs facteurs peuvent fragiliser cet équilibre. Les difficultés scolaires, les problèmes familiaux, la précarité, les discriminations ou encore l'isolement peuvent avoir des conséquences importantes.

Les réseaux sociaux occupent une place croissante dans la vie quotidienne. Ils facilitent les échanges et permettent de maintenir des liens à distance. Toutefois, leur utilisation excessive peut favoriser la comparaison sociale, le sentiment d'exclusion ou les troubles du sommeil.

Certaines personnes rencontrant des difficultés psychologiques hésitent à demander de l'aide. La peur du jugement et les idées reçues concernant les troubles psychiques peuvent constituer des obstacles.

La prévention passe par l'information, l'écoute et l'accès aux professionnels compétents. Il est important de rappeler qu'une souffrance psychologique ne doit pas être minimisée et qu'une demande d'aide constitue une démarche positive.`,qs:["Pourquoi la santé mentale ne se limite-t-elle pas à l'absence de maladie psychique ?","Cite quatre facteurs pouvant fragiliser la santé mentale des jeunes.","Donne deux effets positifs et deux effets négatifs possibles des réseaux sociaux.","Pourquoi certaines personnes hésitent-elles à demander de l'aide ?","Cite trois moyens de prévention évoqués ou suggérés par le texte.","Les problèmes de santé mentale chez les jeunes sont-ils suffisamment pris en considération par la société ? Développe ton point de vue en présentant les difficultés, les conséquences et les solutions possibles (20 à 25 lignes)."]},{id:"pdf-acces",theme:"Accès aux soins",title:"Accès aux soins et déserts médicaux *",doc:`L'accès aux soins constitue un enjeu majeur de santé publique. En France, toutes les personnes ne bénéficient pas des mêmes possibilités pour consulter un professionnel de santé.

Dans certains territoires, notamment les zones rurales ou certaines zones périurbaines, le nombre de médecins disponibles est insuffisant par rapport aux besoins de la population. Ces territoires sont souvent désignés sous le terme de « déserts médicaux ».

Cette situation peut entraîner des délais d'attente importants, des déplacements longs et parfois un renoncement aux soins. Les personnes âgées, les personnes en situation de handicap et les personnes disposant de faibles ressources peuvent être particulièrement touchées.

Plusieurs solutions sont envisagées pour améliorer la situation : développer les maisons de santé pluriprofessionnelles, renforcer les équipes de soins, favoriser la télémédecine et améliorer l'attractivité des territoires pour les professionnels.

Cependant, les outils numériques ne peuvent pas remplacer toutes les consultations physiques. Le contact humain, l'examen clinique et la relation de confiance restent essentiels dans de nombreuses situations.

L'accès aux soins doit être considéré comme un élément fondamental de l'égalité entre les citoyens.`,qs:["Qu'appelle-t-on un désert médical ?","Quelles conséquences peuvent découler du manque de professionnels de santé ?","Quelles populations sont particulièrement touchées ?","Cite trois solutions permettant d'améliorer l'accès aux soins.","Pourquoi la télémédecine ne peut-elle pas remplacer toutes les consultations ?","L'accès aux soins devrait-il être identique pour tous les citoyens, quel que soit leur lieu de résidence ? Argumente ta réponse en utilisant des exemples concrets (20 à 25 lignes)."]},{id:"pdf-ethique",theme:"Éthique",title:"Éthique, bientraitance et profession infirmière *",doc:`La prise en charge d'une personne malade ne se limite pas à la réalisation de soins techniques. Elle nécessite également une attention particulière à sa dignité, à son intimité, à ses choix et à ses besoins.

La bientraitance repose sur une attitude professionnelle respectueuse, bienveillante et adaptée à chaque personne. Elle implique notamment de prendre le temps d'écouter le patient, de lui expliquer les soins et de respecter autant que possible son rythme.

Dans certaines situations, les professionnels de santé sont confrontés à des difficultés : manque de temps, effectifs insuffisants, fatigue ou situations d'urgence. Ces contraintes peuvent fragiliser la qualité de l'accompagnement.

Le respect du consentement est également essentiel. Un patient doit recevoir des informations compréhensibles afin de pouvoir participer aux décisions concernant sa santé. Son refus doit être entendu et pris en compte dans le cadre légal et médical applicable.

Le travail en équipe permet de partager les informations utiles, d'améliorer la coordination et de prévenir certaines erreurs. Chaque professionnel doit connaître ses responsabilités et respecter les compétences des autres membres de l'équipe.

La qualité des soins dépend donc à la fois des connaissances techniques, de l'organisation et des qualités humaines des professionnels.`,qs:["Pourquoi la prise en charge d'un patient ne se limite-t-elle pas aux soins techniques ?","Donne quatre exemples de comportements relevant de la bientraitance.","Quelles contraintes peuvent fragiliser la qualité de l'accompagnement ?","Pourquoi le consentement du patient est-il important ?","Quel est l'intérêt du travail en équipe dans les soins ?","Peut-on être un bon professionnel de santé sans qualités humaines ? Tu développeras une argumentation structurée en abordant les compétences techniques, l'écoute, l'empathie et le travail en équipe (20 à 25 lignes)."]}],X=Nf;let Lr=null;function St(){return Lr||(Lr=typeof window<"u"&&window.claude&&window.claude.use?window.claude.use("sample").catch(()=>null):Promise.resolve(null)),Lr}const Ls={not_granted:"Tu n'as pas autorisé cette page à utiliser Claude.",sampling_disabled:"La correction par Claude n'est pas disponible pour ton compte.",rate_limited:"Trop de demandes pour le moment. Réessaie dans quelques minutes.",session_expired:"Ta session a expiré. Reconnecte-toi à Claude puis réessaie.",invalid_json:"La correction est arrivée dans un format illisible. Réessaie.",refused:"Claude n'a pas pu corriger cette copie.",prompt_too_large:"La copie est trop longue pour être corrigée."},If=e=>["upstream_error","invalid_json","rate_limited","empty_completion","session_expired"].includes(e)||!Ls[e],vo=e=>Math.max(0,Math.min(20,Number(e&&e.note)||0));function Pf(e,t,n){return`Tu es correcteur pour la sélection d'entrée en IFSI (institut de formation en soins infirmiers), voie formation professionnelle continue, en Île-de-France. La sous-épreuve de rédaction dure 30 minutes. Elle évalue les qualités rédactionnelles, l'aptitude au questionnement, à l'analyse et à l'argumentation, et la capacité du candidat à se projeter dans son futur environnement professionnel.

s, puis expliqué en quelques phrases."},{t:"Le texte parle des aidants familiaux. Ils font la toilette et les repas, ils accompagnent leur proche aux rendez-vous médicaux et ils sont parfois présents la nuit.",ok:!1,note:"0,5/2",why:"Tu décris ce que font les aidants, mais tu ne dis jamais quel est le problème : leur épuisement."},{t:"Le problème principal est que « des millions de personnes accompagnent au quotidien un proche âgé, malade ou en situation de handicap » et que « beaucoup disent manquer de temps pour eux-mêmes ».",ok:!1,note:"1/2",why:"Recopier le texte entre guillemets ne montre pas que tu l'as compris : le correcteur attend une reformulation."},{t:"Le problème principal est le manque de places en maison de retraite. C'est pour cela que les familles doivent garder leurs parents chez eux. L'État devrait construire beaucoup plus d'établissements.",ok:!1,note:"0/2",why:"Hors-sujet : le texte ne parle pas des maisons de retraite. Et ton opinion sur l'État n'est pas demandée."}]},{q:"Quelles peuvent être les conséquences de l'épuisement d'un aidant, pour lui et pour la personne aidée ?",points:3,reponses:[{t:`L'épuisement a d'abord des conséquences pour l'aidant lui-même. Fatigué, il manque de sommeil et de temps pour lui. Il peut repousser ses propres soins, s'isoler et finir par tomber malade à son tour, physiquement ou moralement.

Cet épuisement touche aussi la personne aidée. Un aidant à bout de forces est moins disponible et moins patient, ce qui peut nuire à la qualité de l'accompagnement. Dans les cas les plus graves, s'il ne peut plus assumer son rôle, le maintien à domicile devient impossible et une entrée en établissement doit être envisagée, parfois dans l'urgence.`,ok:!0,note:"3/3",why:"La réponse traite les deux parties de la question (l'aidant, puis la personne aidée), dans deux paragraphes clairs, avec des conséquences précises."},{t:`- fatigue
- stress
- il tombe malade
- la personne aidée va en maison de retraite`,ok:!1,note:"1/3",why:"Les idées sont justes, mais une liste de mots n'est pas une rédaction : il faut des phrases et des liens entre les idées."},{t:"L'aidant est très fatigué. Il dort mal, il est stressé et il n'a plus de temps pour ses loisirs ni pour voir ses amis. Il peut même faire une dépression et devoir arrêter de travailler.",ok:!1,note:"1,5/3",why:"Bien rédigé, mais il manque la moitié de la réponse : la question demande aussi les conséquences pour la personne aidée."},{t:"Ben l'aidant il est crevé, du coup il peut plus s'occuper de sa mère correctement et elle va être mal, et lui aussi il va tomber malade c'est sur.",ok:!1,note:"1/3",why:"Les idées sont bonnes, mais le langage est familier (« ben », « crevé », « du coup ») et il y a des fautes : c'est pénalisé à l'écrit."}]},{q:"Selon vous, quel rôle l'infirmier peut-il jouer auprès des aidants ? Argumentez.",points:5,reponses:[{t:`L'infirmier occupe une place privilégiée auprès des aidants, car il intervient souvent au domicile ou rencontre les familles à l'hôpital.

Son premier rôle est de repérer l'épuisement. Lors de ses passages, il peut remarquer des signes de fatigue, une perte de patience, ou un aidant qui néglige sa propre santé. Il peut alors prendre le temps de l'écouter sans le juger, car beaucoup d'aidants n'osent pas dire qu'ils sont à bout.

Son second rôle est d'informer et d'orienter. L'infirmier peut conseiller l'aidant sur les gestes du quotidien pour le soulager, l'informer sur les aides existantes, comme les solutions de répit ou les associations d'aidants, et faire le lien avec le médecin ou l'assistante sociale. Lorsque j'ai accompagné ma mère pendant sa maladie, j'ai constaté combien les explications des soignants rassuraient aussi la famille.

Futur infirmier, je souhaite être attentif au patient, mais aussi à ceux qui l'entourent.`,ok:!0,note:"5/5",why:"Une introduction, deux arguments développés (repérer, puis informer et orienter) avec des exemples, une expérience personnelle et une conclusion tournée vers le métier."},{t:"L'infirmier a un rôle très important auprès des aidants. Il doit les aider, les écouter et les soutenir. Il est essentiel qu'il soit présent pour eux, car ils en ont besoin. C'est pour cela que le rôle de l'infirmier est primordial.",ok:!1,note:"1,5/5",why:"Des affirmations sans explication ni exemple, et des répétitions (« important », « essentiel », « primordial ») : ça n'argumente pas."},{t:"L'infirmier doit remplacer l'aidant : il doit venir tous les jours faire la toilette et les repas, et rester la nuit pour que l'aidant puisse se reposer complètement.",ok:!1,note:"1/5",why:"Idée inexacte et irréaliste : l'infirmier accompagne et oriente l'aidant, il ne le remplace pas."},{t:"Moi, je veux devenir infirmier parce que j'aime aider les gens et que j'ai vu ma mère malade. Je pense que je serai un bon infirmier car je suis à l'écoute et patient. Les aidants, c'est important aussi.",ok:!1,note:"0,5/5",why:"Tu parles de ta motivation au lieu de répondre à la question : c'est un hors-sujet fréquent. Garde-la pour l'oral."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"L'épuisement des aidants familiaux, qui menace leur santé et le maintien à domicile de la personne aidée.",ok:!0,why:"C'est l'idée centrale : le texte part du rôle des aidants pour arriver au risque d'épuisement et à ses conséquences."},{t:"Le manque de maisons de retraite en France.",ok:!1,why:"Le texte n'en parle pas : c'est un hors-sujet, l'erreur la plus pénalisée."},{t:"Les aidants familiaux s'occupent de la toilette et des repas.",ok:!1,why:"C'est un détail du texte, pas le problème qu'il soulève."},{t:"Le vieillissement de la population.",ok:!1,why:"C'est le contexte général, trop large : le texte cible précisément l'épuisement des aidants."}]},{etape:"Choisir le plan",q:"Pour la question « Quel rôle l'infirmier peut-il jouer auprès des aidants ? », quel plan est le plus adapté ?",opts:[{t:"I. Repérer l'épuisement de l'aidant — II. L'informer, l'écouter et l'orienter vers des aides (répit, associations).",ok:!0,why:"Deux parties claires, qui répondent directement à la question et vont du constat à l'action."},{t:"I. Les avantages — II. Les inconvénients.",ok:!1,why:"Plan « pour/contre » plaqué : la question ne demande pas de peser le pour et le contre."},{t:"Une liste de tout ce que fait un infirmier dans une journée.",ok:!1,why:"Pas de plan et hors-sujet : il faut parler de son rôle auprès des aidants."},{t:"I. Ma vie personnelle — II. Mon projet professionnel.",ok:!1,why:"C'est un plan de lettre de motivation, pas de rédaction sur un sujet sanitaire et social."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier peut repérer les signes d'épuisement de l'aidant, car il est souvent présent au domicile. Par exemple, lors d'un passage, il peut remarquer qu'une épouse dort mal et néglige ses propres soins, et lui proposer de l'aide. »",ok:!0,why:"Il y a une idée, une explication (« car… ») et un exemple concret : c'est la structure attendue."},{t:"« L'infirmier a un rôle très important et essentiel auprès des aidants. »",ok:!1,why:"C'est une affirmation sans explication ni exemple : elle ne prouve rien."},{t:"« Les aidants sont fatigués, les infirmiers aussi, tout le monde est fatigué. »",ok:!1,why:"Généralisation familière, sans raisonnement."},{t:"« L'infirmier doit tout faire à la place de l'aidant pour qu'il se repose. »",ok:!1,why:"Idée irréaliste et inexacte : l'infirmier accompagne et oriente, il ne remplace pas l'aidant."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« De nombreuses personnes accompagnent chaque jour un proche malade ou âgé. Ce rôle d'aidant, souvent assuré sans formation, peut mener à l'épuisement. Nous verrons d'abord ce problème et ses conséquences, puis le rôle que l'infirmier peut jouer. »",ok:!0,why:"Elle amène le sujet, pose le problème et annonce le plan : les trois étapes d'une bonne introduction."},{t:"« Dans ce texte, on va parler des aidants. »",ok:!1,why:"Trop pauvre : pas de problème posé, pas de plan annoncé."},{t:"« Depuis la nuit des temps, l'homme aide son prochain. »",ok:!1,why:"Formule creuse et trop générale : les correcteurs la sanctionnent."},{t:"« Je pense que les aidants ont raison d'être fatigués et que l'État ne fait rien. »",ok:!1,why:"Opinion tranchée dès la première phrase, sans nuance ni annonce du plan."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les aidants, qui accompagnent leur proche au quotidien, négligent souvent leur propre santé. »",ok:!0,why:"Accords justes, ponctuation correcte, registre soutenu."},{t:"« Les aidants qui accompagne leurs proche au quotidien néglige souvent leurs propre santé. »",ok:!1,why:"Erreurs d'accord : « accompagnent », « proches » ou « proche », « négligent », « leur propre santé »."},{t:"« Les aidants ils négligent souvent leur santé à eux. »",ok:!1,why:"Registre oral (« ils » répété, « à eux ») : à éviter à l'écrit."},{t:"« Les aidants, négligent souvent, leur propre santé. »",ok:!1,why:"Virgules mal placées : on ne sépare pas le sujet du verbe ni le verbe de son complément."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« L'épuisement des aidants est un enjeu de santé pour eux comme pour leurs proches. Par sa présence et son écoute, l'infirmier peut le repérer et les orienter. Future professionnel, je serai attentif à ne pas oublier ceux qui accompagnent les patients. »",ok:!0,why:"Elle résume la réponse, puis ouvre sur le futur métier : c'est ce que le jury apprécie."},{t:"« Voilà, j'ai fini. »",ok:!1,why:"Ce n'est pas une conclusion."},{t:"« En conclusion, il y a beaucoup de choses à dire sur ce sujet très intéressant. »",ok:!1,why:"Phrase vide, qui ne résume rien et n'ouvre sur rien."},{t:"« Pour conclure, je vais maintenant parler d'un autre problème : le prix des médicaments. »",ok:!1,why:"Une conclusion n'apporte pas une nouvelle partie hors-sujet."}]}]},Ld={copies:[{q:"À partir du texte, expliquez ce que l'on appelle un « désert médical ».",points:2,reponses:[{t:"Un désert médical est un territoire où les habitants ont du mal à accéder à un médecin. D'après le texte, cela se traduit par des délais de plusieurs semaines pour obtenir un rendez-vous chez un généraliste, et par de nombreux habitants qui n'ont plus de médecin traitant. Ce n'est donc pas forcément une zone sans aucun médecin, mais une zone où l'offre de soins ne suffit plus à répondre aux besoins de la population.",ok:!0,note:"2/2",why:"Tu donnes une définition claire, tu l'appuies sur les deux indices du texte et tu la nuances avec tes propres mots."},{t:"Un désert médical, c'est quand « obtenir un rendez-vous chez un médecin généraliste demande plusieurs semaines, et de nombreux habitants n'ont plus de médecin traitant ».",ok:!1,note:"1/2",why:"Tu recopies le texte au lieu d'expliquer : le correcteur attend une définition avec tes mots."},{t:"Un désert médical est une région désertique, comme une zone de montagne isolée, où personne n'habite et où il n'y a donc pas d'hôpital. Les rares habitants doivent faire des centaines de kilomètres pour se soigner.",ok:!1,note:"0/2",why:"Tu prends l'expression au sens littéral : le texte parle de territoires habités où l'on manque de médecins, pas de zones vides."},{t:"Les déserts médicaux sont la faute des jeunes médecins qui ne veulent plus travailler à la campagne. Il faudrait les obliger à s'installer là où on a besoin d'eux, sinon la situation ne fera qu'empirer.",ok:!1,note:"0,5/2",why:"Tu donnes une opinion sur les causes au lieu d'expliquer ce qu'est un désert médical, et cette opinion n'est pas dans le texte."}]},{q:"Quelles sont les conséquences de ces difficultés d'accès aux soins sur le système de santé ?",points:3,reponses:[{t:`Ces difficultés d'accès aux soins ont d'abord des conséquences sur les urgences hospitalières. Faute de médecin disponible en ville, des patients s'y rendent pour des problèmes qui auraient pu être traités en cabinet. Les urgences sont alors encombrées, l'attente s'allonge et les équipes s'épuisent, au détriment des cas les plus graves.
