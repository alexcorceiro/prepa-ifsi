is de prise en charge peuvent atteindre plusieurs mois. Enfin, les jeunes ont du mal à parler de leur souffrance, par peur d'être jugés ou de ne pas être pris au sérieux.",ok:!0,note:"2/2",why:"Les trois idées du texte sont dégagées, reformulées et ordonnées avec des connecteurs."},{t:"Le texte parle de l'anxiété, des troubles du sommeil et de l'isolement des jeunes.",ok:!1,note:"0,5/2",why:"Tu cites seulement les symptômes : il manque la saturation des services et la difficulté à demander de l'aide."},{t:"Les jeunes passent trop de temps sur leur téléphone et les réseaux sociaux, c'est pour cela qu'ils vont mal. Il faudrait interdire les écrans avant 18 ans.",ok:!1,note:"0/2",why:"Hors-sujet : le texte ne parle pas des écrans, et ton opinion n'est pas demandée ici."},{t:"Idée 1 : « une dégradation de la santé mentale des adolescents ». Idée 2 : « les services de pédopsychiatrie sont saturés ». Idée 3 : « parler de sa souffrance psychique reste difficile ».",ok:!1,note:"1/2",why:"Les idées sont bien repérées, mais recopiées entre guillemets au lieu d'être reformulées."}]},{q:"Pourquoi est-il difficile pour un jeune de demander de l'aide ?",points:3,reponses:[{t:`Demander de l'aide est difficile pour un jeune, d'abord à cause du regard des autres. Il peut craindre d'être jugé, d'être considéré comme « fou » ou faible, par ses amis comme par sa famille. La souffrance psychique reste encore entourée de préjugés.

Il peut aussi avoir peur de ne pas être pris au sérieux. Un adolescent qui dit être angoissé s'entend parfois répondre que « c'est l'âge » ou que « ça va passer ». Enfin, même quand il ose demander de l'aide, les délais d'attente pour un rendez-vous peuvent le décourager.`,ok:!0,note:"3/3",why:"Plusieurs raisons, tirées du texte et développées avec des exemples réalistes, dans une réponse bien organisée."},{t:"Parce qu'ils ont peur.",ok:!1,note:"0,5/3",why:"Réponse beaucoup trop courte : peur de quoi, et pourquoi ? Il faut expliquer."},{t:"Les jeunes ont du mal à demander de l'aide car ils ont peur d'être jugés. Ils ont peur que leurs amis se moquent d'eux et ils ne veulent pas passer pour des personnes faibles.",ok:!1,note:"1,5/3",why:"Une raison bien expliquée, mais tu oublies les autres : ne pas être pris au sérieux, les délais d'attente."},{t:"C'est dur de demander de l'aide quand t'es jeune parce que les adultes ils comprennent rien et ils te disent que c'est rien, du coup tu préfères rien dire.",ok:!1,note:"1/3",why:"L'idée est juste, mais le registre est familier et la généralisation « ils comprennent rien » affaiblit la réponse."}]},{q:"Quelles actions de prévention pourraient être menées auprès des jeunes ? Justifiez vos propositions.",points:5,reponses:[{t:`Pour limiter la dégradation de la santé mentale des jeunes, la prévention doit agir avant que la souffrance ne s'installe. Deux types d'actions me semblent prioritaires.

D'abord, il faut parler de santé mentale là où sont les jeunes, au collège, au lycée ou à l'université. Des interventions d'infirmiers scolaires ou de psychologues peuvent expliquer qu'avoir besoin d'aide n'est pas une faiblesse et présenter les lieux où trouver du soutien. Cela réduit la peur d'être jugé, que le texte identifie comme un frein.

Ensuite, il faut former les adultes qui entourent les jeunes, comme les enseignants, les animateurs ou les parents, à repérer les signes d'alerte : isolement, troubles du sommeil, baisse des résultats. Un adulte attentif peut orienter un jeune plus tôt, avant que la situation ne devienne grave.

Ces actions ne remplacent pas des services de soins suffisants, mais elles permettent d'agir tôt. Futur infirmier, je sais que l'écoute est souvent le premier soin.`,ok:!0,note:"5/5",why:"Deux propositions concrètes, chacune justifiée par le texte, une nuance et une conclusion liée au métier."},{t:"Il faudrait faire des campagnes de prévention, des affiches, des vidéos, des numéros d'écoute, des interventions dans les écoles, des formations pour les parents et des applications sur les téléphones.",ok:!1,note:"1,5/5",why:"Une liste de propositions sans justification : la question demande de justifier chaque action."},{t:"Il faudrait que tous les jeunes voient obligatoirement un psychiatre une fois par mois, comme ça on serait sûr qu'aucun ne va mal.",ok:!1,note:"1/5",why:"Proposition irréaliste, d'autant que le texte souligne la saturation des services de pédopsychiatrie."},{t:"Quand j'étais jeune, moi aussi j'ai été stressé par les examens. J'en ai parlé à ma famille et ça m'a aidé. C'est pour cela que je veux devenir infirmier : pour aider les jeunes comme on m'a aidé.",ok:!1,note:"0,5/5",why:"Tu racontes ton histoire et ta motivation au lieu de proposer des actions de prévention."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"La santé mentale des jeunes se dégrade, alors que l'accès aux soins est difficile et que demander de l'aide reste un tabou.",ok:!0,why:"Tu rassembles le constat, le manque de prise en charge et la difficulté à parler."},{t:"Les jeunes dorment mal.",ok:!1,why:"Les troubles du sommeil ne sont qu'un exemple parmi d'autres."},{t:"Les jeunes passent trop de temps sur les écrans.",ok:!1,why:"Le texte n'en parle pas : c'est un hors-sujet."},{t:"La psychiatrie existe depuis longtemps.",ok:!1,why:"Sans rapport avec le texte."}]},{etape:"Choisir le plan",q:"Pour la question « Quelles actions de prévention pourraient être menées auprès des jeunes ? », quel plan est le plus adapté ?",opts:[{t:"I. Informer les jeunes et lever le tabou — II. Former les adultes à repérer les signes d'alerte.",ok:!0,why:"Deux actions distinctes, chacune pouvant être justifiée : c'est ce que demande la question."},{t:"I. Les causes du mal-être — II. Les conséquences du mal-être.",ok:!1,why:"Ce plan ne propose aucune action : il ne répond pas à la question."},{t:"Une liste de dix idées sans explication.",ok:!1,why:"Pas de plan et pas de justification."},{t:"I. Mon adolescence — II. Mon envie d'aider.",ok:!1,why:"Plan centré sur toi, hors-sujet."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Il faut former les enseignants à repérer les signes d'alerte, car ils voient les élèves chaque jour. Par exemple, un professeur qui remarque qu'un élève s'isole peut l'orienter vers l'infirmière scolaire. »",ok:!0,why:"Idée, justification et exemple concret."},{t:"« La prévention est essentielle et indispensable pour les jeunes. »",ok:!1,why:"Affirmation sans contenu."},{t:"« Les jeunes vont mal, c'est triste. »",ok:!1,why:"Un constat émotionnel, pas un argument."},{t:"« Il faut des affiches, des vidéos et des applications. »",ok:!1,why:"Une liste sans explication."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Anxiété, isolement, troubles du sommeil : la santé mentale des jeunes se dégrade. Comment agir avant que la souffrance ne s'installe ? Nous verrons qu'il faut informer les jeunes, puis former les adultes qui les entourent. »",ok:!0,why:"Elle amène le sujet, pose la question et annonce le plan."},{t:"« Les jeunes d'aujourd'hui ne sont plus comme avant. »",ok:!1,why:"Cliché sans rapport précis avec le sujet."},{t:"« Je vais parler de la santé mentale. »",ok:!1,why:"Trop pauvre : pas de problème ni de plan."},{t:"« À mon avis, c'est la faute des parents. »",ok:!1,why:"Opinion tranchée et non justifiée."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Beaucoup de jeunes n'osent pas parler de leur souffrance, de peur d'être jugés. »",ok:!0,why:"Négation complète, accords justes, registre soutenu."},{t:"« Beaucoup de jeunes n'ose pas parler de leurs souffrance, de peur d'être jugé. »",ok:!1,why:"Fautes d'accord : « osent », « leur souffrance », « jugés »."},{t:"« Plein de jeunes osent pas en parler, ils ont peur qu'on les juge. »",ok:!1,why:"Registre oral : « plein de », négation sans « ne »."},{t:"« Beaucoup de jeunes, n'osent pas parler, de leur souffrance de peur, d'être jugés. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Informer les jeunes et former les adultes permettrait d'agir plus tôt, même si des moyens de soins restent nécessaires. Futur infirmier, je retiens que l'écoute est souvent le premier soin. »",ok:!0,why:"Bilan nuancé et ouverture sur le métier."},{t:"« Voilà, c'est fini. »",ok:!1,why:"Ce n'est pas une conclusion."},{t:"« En conclusion, les jeunes doivent se prendre en main. »",ok:!1,why:"Contradiction avec le texte et jugement moralisateur."},{t:"« Pour finir, parlons des personnes âgées. »",ok:!1,why:"Une conclusion n'ouvre pas un autre sujet."}]}]},pd={copies:[{q:"Quelles sont les causes possibles de ces violences d'après le texte ?",points:2,reponses:[{t:"D'après le texte, ces violences naissent surtout d'un contexte tendu. Aux urgences, les patients et leurs proches attendent souvent longtemps, alors qu'ils sont inquiets pour leur santé. Cette angoisse, ajoutée à l'incompréhension de l'organisation des soins, par exemple quand un autre patient passe avant eux, peut se transformer en colère puis en agressivité envers les soignants.",ok:!0,note:"2/2",why:"Les trois causes du texte (attente, angoisse, incompréhension) sont reprises, reliées entre elles et illustrées."},{t:"Les causes sont « un contexte d'attente longue, d'angoisse et d'incompréhension ».",ok:!1,note:"1/2",why:"Tu recopies la phrase du texte sans l'expliquer."},{t:"Les violences viennent du fait que certains patients sont méchants et mal élevés. Ils ne respectent plus rien et pensent que tout leur est dû.",ok:!1,note:"0/2",why:"Jugement moral absent du texte : tu ne t'appuies pas sur les causes qu'il donne."},{t:"Les patients attendent longtemps aux urgences et ils s'énervent.",ok:!1,note:"0,5/2",why:"Une seule cause, à peine développée : il manque l'angoisse et l'incompréhension."}]},{q:"Quelles peuvent en être les conséquences pour les soignants et pour la qualité des soins ?",points:3,reponses:[{t:`Pour les soignants, ces violences ont d'abord des conséquences personnelles. Une insulte ou une agression peut provoquer du stress, de la peur et une perte de confiance. À force, certains s'épuisent, s'arrêtent ou quittent leur métier, ce qui rend la profession moins attractive.

Ces violences dégradent aussi la qualité des soins. Un soignant sous tension est moins disponible et plus exposé à l'erreur. Les départs et les arrêts aggravent le manque de personnel, ce qui allonge encore l'attente des patients et peut entretenir un cercle vicieux.`,ok:!0,note:"3/3",why:"Les deux volets de la question sont traités, avec un enchaînement logique qui va jusqu'au cercle vicieux."},{t:"Les soignants sont stressés, ils ont peur de venir travailler et certains font des dépressions ou démissionnent.",ok:!1,note:"1,5/3",why:"Juste pour les soignants, mais tu oublies la seconde partie : la qualité des soins."},{t:`- peur
- stress
- démissions
- moins bons soins`,ok:!1,note:"1/3",why:"Les idées sont présentes, mais une liste de mots ne montre aucun raisonnement."},{t:"Les conséquences sont graves. Il faudrait mettre des policiers à l'entrée de chaque service d'urgences et porter plainte systématiquement contre les patients agressifs.",ok:!1,note:"0,5/3",why:"Tu proposes des solutions au lieu de décrire les conséquences demandées."}]},{q:"Comment un infirmier peut-il prévenir ou apaiser une situation de tension ? Argumentez.",points:5,reponses:[{t:`La violence naît souvent de l'attente, de l'angoisse et de l'incompréhension. L'infirmier peut donc agir sur ces trois facteurs, avant et pendant une situation de tension.

D'abord, il peut prévenir la tension en informant. Expliquer à une famille pourquoi l'attente est longue, comment les patients sont pris en charge selon leur gravité, ou donner régulièrement des nouvelles, réduit l'incompréhension. Un patient informé se sent considéré.

Ensuite, face à une personne qui s'énerve, l'infirmier peut apaiser par son attitude : rester calme, parler d'une voix posée, écouter ce qui inquiète la personne et reformuler sa demande. Par exemple, reconnaître l'angoisse d'un fils inquiet pour sa mère désamorce souvent sa colère.

Enfin, si la situation devient dangereuse, il ne reste pas seul : il alerte ses collègues et suit les procédures de l'établissement.

Futur infirmier, je considère que la communication fait partie du soin, et qu'elle protège aussi les soignants.`,ok:!0,note:"5/5",why:"Une réponse construite sur les causes du texte : prévenir, apaiser, se protéger, avec des exemples concrets et une conclusion professionnelle."},{t:"L'infirmier doit rester calme. Il doit être à l'écoute. Il doit être patient. Il doit communiquer. C'est essentiel pour éviter les violences et c'est le rôle de l'infirmier.",ok:!1,note:"1,5/5",why:"Des attitudes justes mais seulement listées, sans explication ni exemple."},{t:"L'infirmier doit montrer qu'il est le plus fort : élever la voix, menacer d'appeler la police et faire sortir immédiatement le patient du service s'il continue.",ok:!1,note:"0,5/5",why:"Cette attitude risque d'aggraver la tension : le soin passe d'abord par l'écoute et l'apaisement."},{t:"Bah l'infirmier il doit parler calmement au patient et lui expliquer pourquoi il attend, comme ça il se calme. Et si ça marche pas il appelle ses collègues.",ok:!1,note:"2/5",why:"Les idées sont bonnes mais peu développées, et le registre familier est pénalisé."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Les violences envers les soignants augmentent, nourries par l'attente et l'angoisse, et menacent leur santé et l'attractivité du métier.",ok:!0,why:"Tu réunis le constat, ses causes et ses conséquences."},{t:"Les urgences sont mal organisées.",ok:!1,why:"C'est un élément de contexte, pas le problème central."},{t:"Les patients sont de plus en plus impolis.",ok:!1,why:"Jugement simpliste qui ne reprend pas l'analyse du texte."},{t:"Les soignants gagnent trop peu.",ok:!1,why:"Hors-sujet : le texte ne parle pas des salaires."}]},{etape:"Choisir le plan",q:"Pour la question « Comment un infirmier peut-il prévenir ou apaiser une situation de tension ? », quel plan est le plus adapté ?",opts:[{t:"I. Prévenir : informer et rassurer — II. Apaiser : écouter, rester calme, s'appuyer sur l'équipe.",ok:!0,why:"Le plan reprend les deux verbes de la question : prévenir, puis apaiser."},{t:"I. Les causes — II. Les conséquences.",ok:!1,why:"Ce plan répond aux deux premières questions, pas à la dernière."},{t:"I. Les urgences — II. La police.",ok:!1,why:"Plan sans rapport avec le rôle infirmier."},{t:"Une seule partie sur le calme.",ok:!1,why:"Trop limité : la question a deux volets."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier peut prévenir la tension en informant, car l'incompréhension nourrit la colère. Par exemple, donner régulièrement des nouvelles à une famille qui attend la rassure. »",ok:!0,why:"Idée, cause, exemple : le paragraphe est complet."},{t:"« La violence, c'est inacceptable. »",ok:!1,why:"Vrai, mais ce n'est pas un argument qui répond à la question."},{t:"« L'infirmier doit être gentil avec tout le monde. »",ok:!1,why:"Trop vague, sans explication ni exemple."},{t:"« Il suffit d'embaucher des vigiles. »",ok:!1,why:"Solution qui ne concerne pas le rôle de l'infirmier."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Insultes, menaces, agressions : les violences envers les soignants augmentent. Que peut faire l'infirmier face à ces tensions ? Nous verrons comment les prévenir, puis comment les apaiser. »",ok:!0,why:"Accroche liée au texte, problème posé, plan annoncé."},{t:"« Moi, je ne me laisserai jamais faire. »",ok:!1,why:"Opinion personnelle, pas une introduction."},{t:"« Le texte est intéressant. »",ok:!1,why:"Phrase vide."},{t:"« Depuis toujours, les hommes se battent. »",ok:!1,why:"Généralité creuse."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les soignants, qui subissent ces violences, se sentent souvent démunis. »",ok:!0,why:"Accords et ponctuation corrects."},{t:"« Les soignants, qui subisse ces violences, se sente souvent démuni. »",ok:!1,why:"Fautes d'accord : « subissent », « sentent », « démunis »."},{t:"« Les soignants ils en ont marre de se faire agresser. »",ok:!1,why:"Registre oral et familier."},{t:"« Les soignants qui, subissent, ces violences se sentent souvent démunis. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« En informant, en écoutant et en s'appuyant sur l'équipe, l'infirmier peut désamorcer bien des tensions. Futur soignant, je considère la communication comme une part du soin. »",ok:!0,why:"Bilan des idées et ouverture sur le métier."},{t:"« En conclusion, la violence c'est mal. »",ok:!1,why:"Banalité qui ne résume rien."},{t:"« Voilà mes idées. »",ok:!1,why:"Pas une conclusion."},{t:"« Pour finir, je parlerai des salaires des infirmiers. »",ok:!1,why:"Nouveau sujet hors-sujet en conclusion."}]}]},md={copies:[{q:"Quels sont les objectifs des soins palliatifs présentés dans le texte ?",points:2,reponses:[{t:"Le texte présente deux grands objectifs des soins palliatifs. Le premier est de soulager la douleur et les autres symptômes, pour préserver le confort de la personne malade. Le second est d'accompagner la personne en fin de vie, mais aussi ses proches. Le texte précise que ces soins ne se limitent pas aux derniers jours : ils peuvent commencer tôt dans l'évolution d'une maladie grave.",ok:!0,note:"2/2",why:"Les deux objectifs sont reformulés, et tu ajoutes la précision importante du texte sur le moment où ils commencent."},{t:"Les soins palliatifs servent à guérir les malades en fin de vie grâce à des traitements spéciaux.",ok:!1,note:"0/2",why:"Contresens : les soins palliatifs visent à soulager et accompagner, pas à guérir."},{t:"Les soins palliatifs visent à « soulager la douleur et les autres symptômes, et à accompagner la personne en fin de vie ainsi que ses proches ».",ok:!1,note:"1/2",why:"C'est juste, mais recopié : il fallait reformuler avec tes mots."},{t:"Les soins palliatifs, c'est pour enlever la douleur.",ok:!1,note:"0,5/2",why:"Un seul objectif, trop vite formulé : tu oublies l'accompagnement de la personne et de ses proches."}]},{q:"En quoi l'accompagnement des proches fait-il partie du soin ?",points:3,reponses:[{t:`L'accompagnement des proches fait partie du soin, car la maladie grave touche toute une famille. Les proches vivent eux aussi de l'angoisse, de la fatigue et de la tristesse, et ils ont besoin d'être informés et écoutés.

De plus, ils jouent un rôle important auprès du patient. Un proche rassuré et bien informé apporte plus de sérénité à la personne malade. L'équipe peut par exemple expliquer à une épouse les changements qu'elle observe, l'aider à trouver sa place auprès de son mari, et continuer à la soutenir après le décès.`,ok:!0,note:"3/3",why:"Deux arguments clairs (les proches souffrent aussi, ils comptent pour le patient) et un exemple concret."},{t:"Les proches font partie du soin car ils sont tristes.",ok:!1,note:"0,5/3",why:"Idée juste mais à peine formulée : il faut expliquer et développer."},{t:"L'accompagnement des proches est important car la famille souffre aussi. Les proches sont inquiets, fatigués et ont besoin de parler.",ok:!1,note:"1,5/3",why:"Bonne première idée, mais tu ne montres pas en quoi cet accompagnement aide aussi le patient."},{t:"Je pense que les proches ne devraient pas être trop présents, car ils gênent le travail des soignants et fatiguent le patient. L'infirmier doit surtout s'occuper du malade.",ok:!1,note:"0/3",why:"Contraire au texte, qui fait de l'accompagnement des proches un objectif des soins palliatifs."}]},{q:"Selon vous, quelles qualités humaines un infirmier doit-il mobiliser auprès d'un patient en fin de vie ?",points:5,reponses:[{t:`Accompagner un patient en fin de vie demande des compétences techniques, mais surtout des qualités humaines. Trois me semblent essentielles.

La première est l'écoute. Un patient en fin de vie peut exprimer des peurs, des regrets ou des souhaits. L'infirmier doit savoir lui laisser le temps de parler, accepter les silences et entendre ce qui compte pour lui.

La deuxième est le respect. Respecter la dignité du patient, c'est veiller à son confort, à son intimité et tenir compte de ses choix, par exemple sur la présence de ses proches ou ses habitudes.

La troisième est la capacité à prendre du recul. Être confronté à la mort est éprouvant : l'infirmier doit rester disponible sans se laisser submerger, en s'appuyant sur l'équipe pour en parler.

Futur infirmier, je sais que ces situations seront difficiles, mais qu'elles donnent tout son sens au « prendre soin ».`,ok:!0,note:"5/5",why:"Trois qualités annoncées, expliquées et illustrées, et une conclusion personnelle tournée vers le métier."},{t:"L'infirmier doit être gentil, doux, patient, à l'écoute, empathique, respectueux, calme, souriant, disponible et professionnel.",ok:!1,note:"1/5",why:"Une simple liste de qualités, sans aucune explication ni exemple."},{t:"L'infirmier doit cacher la vérité au patient pour ne pas le faire souffrir et toujours lui dire qu'il va guérir, pour garder le moral.",ok:!1,note:"0,5/5",why:"Mentir au patient n'est pas une qualité soignante : l'honnêteté et le respect de ses choix sont essentiels."},{t:"L'infirmier doit être à l'écoute du patient, car celui-ci a souvent besoin de parler de ses peurs. Il doit aussi être respectueux. C'est très important dans ce moment difficile.",ok:!1,note:"2,5/5",why:"L'écoute est bien expliquée, mais le respect est seulement cité, et il n'y a ni introduction ni conclusion."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Les soins palliatifs soulagent et accompagnent le patient et ses proches, mais leur accès reste inégal.",ok:!0,why:"Tu associes leur rôle et la limite soulignée par le texte."},{t:"L'euthanasie doit être légalisée.",ok:!1,why:"Le texte évoque des débats, mais ne prend pas cette position : hors-sujet."},{t:"La douleur existe.",ok:!1,why:"Beaucoup trop vague."},{t:"Les hôpitaux manquent de lits.",ok:!1,why:"Le texte n'en parle pas."}]},{etape:"Choisir le plan",q:"Pour la question « Quelles qualités humaines un infirmier doit-il mobiliser auprès d'un patient en fin de vie ? », quel plan est le plus adapté ?",opts:[{t:"I. L'écoute — II. Le respect de la dignité — III. La capacité à prendre du recul.",ok:!0,why:"Une partie par qualité, chacune pouvant être expliquée et illustrée."},{t:"I. Les médicaments contre la douleur — II. Les soins techniques.",ok:!1,why:"La question porte sur les qualités humaines, pas sur la technique."},{t:"I. Pour l'euthanasie — II. Contre l'euthanasie.",ok:!1,why:"Débat hors de la question posée."},{t:"Une liste de dix adjectifs.",ok:!1,why:"Pas de plan ni d'explication."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier doit savoir écouter, car un patient en fin de vie a souvent besoin d'exprimer ses peurs. Par exemple, s'asseoir quelques minutes à son chevet et accepter ses silences peut l'apaiser. »",ok:!0,why:"Qualité, justification, exemple concret."},{t:"« L'écoute est une qualité très importante. »",ok:!1,why:"Affirmation sans explication."},{t:"« La mort fait partie de la vie. »",ok:!1,why:"Phrase générale qui ne répond pas à la question."},{t:"« L'infirmier doit être gentil, doux et patient. »",ok:!1,why:"Liste de qualités sans développement."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Accompagner un patient en fin de vie fait partie du rôle infirmier. Quelles qualités humaines cela demande-t-il ? Nous verrons l'importance de l'écoute, du respect et du recul. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« La mort, c'est triste. »",ok:!1,why:"Constat émotionnel, pas une introduction."},{t:"« Je vais parler des soins palliatifs. »",ok:!1,why:"Trop pauvre."},{t:"« Personnellement, je trouve que la fin de vie est un sujet tabou et que l'État devrait agir. »",ok:!1,why:"Opinion hors de la question."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les proches du patient ont besoin d'être écoutés et rassurés. »",ok:!0,why:"Accords corrects au pluriel."},{t:"« Les proches du patient a besoin d'être écouté et rassuré. »",ok:!1,why:"Fautes d'accord : « ont », « écoutés », « rassurés »."},{t:"« Les proches, faut les écouter et les rassurer. »",ok:!1,why:"Registre oral : « faut » sans « il »."},{t:"« Les proches, du patient, ont besoin, d'être écoutés et rassurés. »",ok:!1,why:"Virgules inutiles."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Écoute, respect et recul permettent d'accompagner dignement un patient en fin de vie. Futur infirmier, je mesure que ces moments donnent tout son sens au « prendre soin ». »",ok:!0,why:"Bilan et ouverture sur le futur métier."},{t:"« En conclusion, c'est un sujet très triste. »",ok:!1,why:"Ne résume pas la réponse."},{t:"« Pour terminer, parlons de la vaccination. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« Voilà tout. »",ok:!1,why:"Pas une conclusion."}]}]},fd={copies:[{q:"Quel lien le texte établit-il entre mode de vie et santé ?",points:2,reponses:[{t:"Le texte établit un lien direct entre le mode de vie et la santé. Le manque d'activité physique et le temps passé assis, notamment devant les écrans, augmentent chez les enfants comme chez les adultes. Or cette sédentarité favorise plusieurs maladies : le surpoids, les maladies cardiovasculaires, le diabète et certains troubles psychologiques. Nos habitudes quotidiennes ont donc des conséquences sur notre santé, physique comme mentale.",ok:!0,note:"2/2",why:"Tu expliques le lien de cause à effet et tu cites les maladies du texte, avec une phrase de synthèse."},{t:"Le texte dit que les écrans sont dangereux pour la santé et qu'il faudrait les interdire aux enfants.",ok:!1,note:"0/2",why:"Le texte ne demande pas d'interdire les écrans : tu déformes son propos."},{t:"La sédentarité favorise le surpoids, les maladies cardiovasculaires, le diabète et certains troubles psychologiques.",ok:!1,note:"1/2",why:"Les conséquences sont justes mais quasi recopiées, et tu n'expliques pas ce qu'est la sédentarité ni le lien avec le mode de vie."},{t:"Bouger c'est bon pour la santé et rester assis c'est pas bon.",ok:!1,note:"0,5/2",why:"Idée juste mais trop simple, sans appui sur le texte et en registre familier."}]},{q:"Pourquoi les campagnes de prévention ne suffisent-elles pas toujours ?",points:3,reponses:[{t:`Les campagnes de prévention ne suffisent pas toujours, car savoir ne suffit pas à changer. La plupart des gens savent qu'il faut bouger, mais les habitudes sont difficiles à modifier : manque de temps, fatigue après le travail, trajets en voiture.

De plus, tout le monde n'a pas les mêmes moyens d'agir. Comme le souligne le texte, les personnes en situation de précarité ont plus de difficultés : une activité sportive peut coûter cher, les équipements sont parfois éloignés, et les préoccupations du quotidien passent avant la santé. Un message général touche donc moins ceux qui en auraient le plus besoin.`,ok:!0,note:"3/3",why:"Deux raisons distinctes, la seconde appuyée sur le texte, développées avec des exemples précis."},{t:"Parce que les gens sont fainéants et ne veulent pas faire d'efforts.",ok:!1,note:"0,5/3",why:"Jugement moral trop simple, qui ignore les difficultés réelles évoquées par le texte."},{t:"Les campagnes ne suffisent pas car changer ses habitudes est difficile. On sait qu'il faut bouger, mais on manque de temps et de motivation.",ok:!1,note:"1,5/3",why:"Une raison juste, mais tu oublies l'inégalité face à la prévention, que le texte souligne."},{t:"Les campagnes de prévention passent à la télévision et sur internet. Il y a des affiches dans les rues et des publicités qui disent de manger cinq fruits et légumes par jour.",ok:!1,note:"0,5/3",why:"Tu décris les campagnes au lieu d'expliquer pourquoi elles ne suffisent pas."}]},{q:"Proposez et justifiez deux actions de prévention qu'un infirmier pourrait mener.",points:5,reponses:[{t:`L'infirmier, présent à l'école, à l'hôpital ou à domicile, peut agir contre la sédentarité. Je proposerais deux actions.

La première serait une action collective auprès des enfants, en milieu scolaire. L'infirmier scolaire pourrait animer des séances sur l'activité physique et le temps d'écran, avec des jeux et des défis concrets, comme marcher davantage sur le trajet de l'école. Agir tôt est utile, car les habitudes prises dans l'enfance durent souvent toute la vie.

La seconde serait une action individuelle auprès des adultes à risque, par exemple les patients en surpoids ou diabétiques. Lors d'un soin, l'infirmier peut prendre le temps d'en parler et fixer avec le patient un objectif réaliste, adapté à ses moyens, comme vingt minutes de marche par jour. Un conseil personnalisé est plus efficace qu'un message général, surtout pour les personnes en situation de précarité.

Ces deux actions montrent que la prévention fait pleinement partie du rôle infirmier.`,ok:!0,note:"5/5",why:"Deux actions précises, l'une collective, l'autre individuelle, chacune justifiée et reliée au texte."},{t:"L'infirmier pourrait faire des affiches et des réunions d'information. Ce sont de bonnes actions car elles permettent de prévenir les maladies.",ok:!1,note:"1,5/5",why:"Actions vagues et justification creuse : on ne sait ni pour qui, ni comment, ni pourquoi ça marcherait."},{t:"L'infirmier devrait obliger les patients en surpoids à faire du sport tous les jours et les peser chaque semaine pour vérifier qu'ils suivent ses consignes.",ok:!1,note:"1/5",why:"L'infirmier accompagne le patient, il ne lui impose rien : cette proposition ne respecte pas son autonomie."},{t:"Première action : intervention à l'école. Deuxième action : conseils aux patients. Ce sont deux actions importantes pour la santé de tous.",ok:!1,note:"2/5",why:"Les deux idées sont pertinentes, mais elles ne sont ni développées ni justifiées."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"La sédentarité progresse et nuit à la santé, mais changer ses habitudes reste difficile, surtout pour les plus précaires.",ok:!0,why:"Constat, conséquences et limite de la prévention : tout le texte est là."},{t:"Les enfants regardent trop la télévision.",ok:!1,why:"Un détail du texte, pas le problème d'ensemble."},{t:"Le sport coûte trop cher.",ok:!1,why:"Idée trop étroite, qui n'est pas dans le texte sous cette forme."},{t:"Le diabète est une maladie grave.",ok:!1,why:"Une conséquence citée, pas le problème."}]},{etape:"Choisir le plan",q:"Pour la consigne « Proposez et justifiez deux actions de prévention qu'un infirmier pourrait mener », quel plan est le plus adapté ?",opts:[{t:"I. Une action collective à l'école — II. Une action individuelle auprès des patients à risque.",ok:!0,why:"Exactement deux actions, différentes et complémentaires, comme le demande la consigne."},{t:"I. Les causes de la sédentarité — II. Ses conséquences.",ok:!1,why:"Ce plan ne propose aucune action."},{t:"I. Action 1 — II. Action 2 — III. Action 3 — IV. Action 4.",ok:!1,why:"La consigne en demande deux : mieux vaut deux actions bien justifiées."},{t:"I. Le sport que je pratique — II. Pourquoi j'aime le sport.",ok:!1,why:"Hors-sujet personnel."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier peut fixer avec un patient diabétique un objectif réaliste, comme vingt minutes de marche par jour, car un conseil adapté est plus facile à suivre qu'un message général. »",ok:!0,why:"Action précise, justification et exemple."},{t:"« Il faut faire du sport, c'est bon pour la santé. »",ok:!1,why:"Affirmation banale, sans lien avec le rôle infirmier."},{t:"« La prévention est primordiale et essentielle. »",ok:!1,why:"Mots forts mais aucun argument."},{t:"« Les gens n'ont qu'à se bouger. »",ok:!1,why:"Jugement familier, sans raisonnement."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Le manque d'activité physique progresse et favorise de nombreuses maladies. Comment l'infirmier peut-il aider à changer ces habitudes ? Nous verrons une action collective, puis une action individuelle. »",ok:!0,why:"Sujet amené, problème posé, plan annoncé."},{t:"« Moi, je fais du sport trois fois par semaine. »",ok:!1,why:"Anecdote personnelle hors propos."},{t:"« Le texte parle de sédentarité. »",ok:!1,why:"Trop pauvre."},{t:"« Depuis la préhistoire, l'homme marche. »",ok:!1,why:"Accroche creuse."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les personnes en situation de précarité ont moins accès aux activités sportives. »",ok:!0,why:"Phrase correcte et claire."},{t:"« Les personnes en situation de précarité a moins accès aux activités sportive. »",ok:!1,why:"Fautes d'accord : « ont », « sportives »."},{t:"« Les gens pauvres, ils peuvent pas faire de sport. »",ok:!1,why:"Registre oral et négation incomplète."},{t:"« Les personnes, en situation de précarité ont, moins accès, aux activités sportives. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Par des actions adaptées à chaque public, l'infirmier peut aider à lutter contre la sédentarité. Futur soignant, je considère la prévention comme une part essentielle du soin. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« Bref, il faut bouger. »",ok:!1,why:"Trop familier et trop pauvre."},{t:"« En conclusion, je vais maintenant parler de l'alcool. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« C'est un sujet que j'aime beaucoup. »",ok:!1,why:"Ne résume rien."}]}]},hd={copies:[{q:"Quels obstacles à l'accès aux soins le texte met-il en évidence ?",points:4,reponses:[{t:"Le texte met en évidence plusieurs obstacles à l'accès aux soins pour les personnes en situation de handicap. Les premiers sont matériels : se déplacer jusqu'au lieu de soins ou entrer dans un cabinet médical peut être difficile, et certains équipements ne sont pas adaptés. D'autres obstacles concernent la compréhension, comme lire ou comprendre une ordonnance. Enfin, le texte évoque le manque de professionnels formés à l'accueil de ces patients. Ces difficultés conduisent certaines personnes à renoncer à des soins courants, comme le dentiste ou les dépistages.",ok:!0,note:"4/4",why:"Les obstacles sont classés (matériels, compréhension, formation) et reliés à leur conséquence : le renoncement aux soins."},{t:"Les obstacles sont : se déplacer, accéder à un cabinet médical, comprendre une ordonnance.",ok:!1,note:"1,5/4",why:"Une partie des obstacles, quasi recopiée, sans explication : il manque les équipements et la formation des professionnels."},{t:"Les personnes handicapées ne peuvent pas se soigner car il n'existe aucun hôpital adapté en France.",ok:!1,note:"0/4",why:"Affirmation fausse et exagérée, absente du texte."},{t:"Les personnes en fauteuil roulant ne peuvent pas monter les escaliers des cabinets médicaux. Elles doivent donc trouver un autre médecin, ce qui est compliqué et fatigant.",ok:!1,note:"1,5/4",why:"Un seul obstacle, bien illustré, mais tu réduis le handicap au fauteuil roulant et oublies les autres obstacles du texte."}]},{q:"Comment les établissements de santé pourraient-ils mieux accueillir les personnes en situation de handicap ? Argumentez.",points:6,reponses:[{t:`L'accès aux soins des personnes handicapées est un droit, mais il reste difficile. Les établissements de santé peuvent mieux les accueillir en agissant sur deux plans.

D'abord, ils doivent rendre leurs locaux et leur matériel accessibles. Des rampes, des ascenseurs, une signalétique claire et des équipements adaptés, comme une table d'examen réglable en hauteur, permettent à chacun d'être soigné dans de bonnes conditions. Sans cela, le patient renonce avant même d'avoir franchi la porte.

Ensuite, ils doivent former leurs équipes. Accueillir une personne sourde, aveugle ou présentant un handicap mental demande des savoir-faire : prendre plus de temps, utiliser des mots simples, des pictogrammes, ou s'adresser à la personne elle-même plutôt qu'à son accompagnant. Un soignant formé rassure et évite des examens vécus comme une épreuve.

Ces changements bénéficient d'ailleurs à tous les patients. Futur infirmier, je veux adapter mes soins à chaque personne, avec ses capacités et ses besoins.`,ok:!0,note:"6/6",why:"Deux axes d'amélioration développés avec des exemples précis, une introduction, une nuance finale et une ouverture sur le métier."},{t:"Les établissements doivent être plus accueillants et plus adaptés. Ils doivent faire des efforts pour les personnes handicapées, car c'est un droit. C'est très important.",ok:!1,note:"1,5/6",why:"Tout est vrai mais vague : aucune mesure concrète n'est proposée ni expliquée."},{t:"Il faudrait créer des hôpitaux réservés aux personnes handicapées, avec des soignants spécialisés, pour qu'elles ne soient plus mélangées avec les autres patients.",ok:!1,note:"1/6",why:"Séparer les patients va à l'inverse de l'accès aux soins pour tous : l'enjeu est d'adapter les lieux existants."},{t:"Les hôpitaux pourraient mettre des rampes et des ascenseurs, et former le personnel à la langue des signes. Comme ça, les personnes handicapées seraient mieux accueillies.",ok:!1,note:"3/6",why:"Deux bonnes idées, mais peu développées, sans introduction ni conclusion, et limitées à deux types de handicap."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Des obstacles matériels et humains poussent des personnes handicapées à renoncer à des soins, alors que l'accès aux soins est un droit.",ok:!0,why:"Tu relies les obstacles, leur conséquence et le principe du droit."},{t:"Les dentistes sont trop chers.",ok:!1,why:"Le dentiste n'est qu'un exemple, et le coût n'est pas évoqué."},{t:"Le handicap est une maladie.",ok:!1,why:"Affirmation inexacte et hors du propos du texte."},{t:"Les ordonnances sont mal écrites.",ok:!1,why:"Un détail, pas le problème."}]},{etape:"Choisir le plan",q:"Pour la question « Comment les établissements pourraient-ils mieux accueillir les personnes handicapées ? », quel plan est le plus adapté ?",opts:[{t:"I. Adapter les locaux et le matériel — II. Former les équipes à l'accueil.",ok:!0,why:"Deux axes concrets qui répondent aux obstacles du texte."},{t:"I. Les différents types de handicap — II. Leurs causes médicales.",ok:!1,why:"Plan de cours de médecine, sans rapport avec l'accueil."},{t:"I. Pour l'accessibilité — II. Contre l'accessibilité.",ok:!1,why:"Faux débat : la question demande des propositions."},{t:"Une seule partie sur les rampes d'accès.",ok:!1,why:"Trop limité : le handicap n'est pas seulement moteur."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Former les soignants est indispensable, car chaque handicap demande une approche adaptée. Par exemple, utiliser des pictogrammes aide un patient présentant un handicap mental à comprendre un examen. »",ok:!0,why:"Idée, justification et exemple concret."},{t:"« Les personnes handicapées ont des droits. »",ok:!1,why:"Vrai mais ce n'est pas une proposition argumentée."},{t:"« Il faut tout changer dans les hôpitaux. »",ok:!1,why:"Trop vague."},{t:"« Le handicap, c'est difficile à vivre. »",ok:!1,why:"Constat sans rapport avec la question."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Pour une personne handicapée, se soigner peut devenir un parcours d'obstacles. Comment les établissements peuvent-ils mieux l'accueillir ? Nous verrons l'adaptation des locaux, puis la formation des équipes. »",ok:!0,why:"Accroche, problème et plan."},{t:"« Le handicap touche beaucoup de monde. »",ok:!1,why:"Banal et sans annonce."},{t:"« J'ai un cousin en fauteuil roulant. »",ok:!1,why:"Anecdote personnelle hors propos en introduction."},{t:"« Voici ma réponse. »",ok:!1,why:"Pas une introduction."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Certaines personnes renoncent à des soins courants, faute d'équipements adaptés. »",ok:!0,why:"Accords et ponctuation corrects."},{t:"« Certaines personnes renonce à des soins courant, faute d'équipements adapté. »",ok:!1,why:"Fautes d'accord : « renoncent », « courants », « adaptés »."},{t:"« Y a des gens qui se soignent plus parce que c'est pas adapté. »",ok:!1,why:"Registre oral."},{t:"« Certaines personnes, renoncent, à des soins courants faute, d'équipements adaptés. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Des locaux accessibles et des équipes formées rendraient l'accès aux soins plus juste. Futur infirmier, je veux adapter mes soins aux capacités et aux besoins de chaque patient. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« En conclusion, le handicap est un vaste sujet. »",ok:!1,why:"Phrase vide."},{t:"« Voilà ce que je propose. »",ok:!1,why:"Ne résume rien."},{t:"« Pour finir, je parlerai des maisons de retraite. »",ok:!1,why:"Nouveau sujet en conclusion."}]}]},vd={copies:[{q:"Quelles sont les causes du renoncement aux soins évoquées dans le texte ?",points:2,reponses:[{t:"Le texte évoque plusieurs causes au renoncement aux soins. La première est financière : certains soins, comme les consultations mal remboursées, les lunettes ou les soins dentaires, coûtent trop cher pour les personnes aux revenus modestes. Mais le texte souligne que le coût n'explique pas tout : la complexité des démarches administratives, l'éloignement géographique des lieux de soins et la méfiance envers les institutions découragent aussi de se soigner.",ok:!0,note:"2/2",why:"Toutes les causes sont citées et reformulées, et tu reprends la nuance du texte : le coût n'est pas la seule cause."},{t:"Les gens renoncent aux soins parce qu'ils n'ont pas assez d'argent pour payer le médecin, les lunettes et le dentiste.",ok:!1,note:"0,5/2",why:"Tu ne donnes que la cause financière, alors que le texte insiste justement sur les autres causes."},{t:"Les causes sont « la complexité des démarches administratives, l'éloignement géographique ou la méfiance envers les institutions ».",ok:!1,note:"1/2",why:"Recopié, et tu oublies la cause financière."},{t:"Les gens renoncent aux soins parce qu'ils ne prennent pas leur santé au sérieux et préfèrent dépenser leur argent pour autre chose.",ok:!1,note:"0/2",why:"Jugement absent du texte, qui culpabilise les personnes au lieu d'analyser les causes."}]},{q:"Quelles en sont les conséquences pour la personne et pour la société ?",points:3,reponses:[{t:`Pour la personne, renoncer aux soins a des conséquences directes sur sa santé. Un problème non traité, comme une carie ou une maladie chronique non suivie, s'aggrave avec le temps. La personne souffre plus longtemps et peut voir sa qualité de vie se dégrader, jusqu'à ne plus pouvoir travailler.

Pour la société, ces retards ont aussi un coût. Le texte explique qu'ils conduisent à des prises en charge plus lourdes : une hospitalisation en urgence coûte plus cher qu'une consultation faite à temps. Le renoncement aux soins creuse enfin les inégalités de santé entre les personnes aisées et les plus modestes.`,ok:!0,note:"3/3",why:"Les deux parties de la question sont traitées, avec des exemples et un lien avec le texte."},{t:"La personne est de plus en plus malade et elle souffre. Sa maladie s'aggrave et elle peut même mourir si elle ne se soigne pas.",ok:!1,note:"1/3",why:"Tu ne traites que la personne, sans nuance, et oublies les conséquences pour la société."},{t:`- maladie plus grave
- hospitalisation
- plus cher pour la Sécurité sociale
- inégalités`,ok:!1,note:"1/3",why:"Idées justes mais simple liste, sans phrases ni explications."},{t:"Les conséquences pour la société sont que la Sécurité sociale va faire faillite à cause des pauvres qui ne se soignent pas.",ok:!1,note:"0,5/3",why:"Exagération et ton stigmatisant : ce n'est pas ce que dit le texte."}]},{q:"Quel peut être le rôle du soignant face à un patient en situation de précarité ?",points:5,reponses:[{t:`Face à un patient en situation de précarité, le soignant ne peut pas résoudre seul ses difficultés, mais il peut l'aider à rester dans le parcours de soins.

Son premier rôle est de créer la confiance. Le texte évoque la méfiance envers les institutions : un accueil sans jugement, qui prend le temps d'écouter, peut la lever. Un patient qui se sent respecté reviendra plus facilement.

Son deuxième rôle est d'expliquer et d'orienter. Le soignant peut expliquer simplement le traitement, vérifier que le patient a compris, et l'orienter vers l'assistante sociale pour l'aider dans ses démarches et ses droits à une couverture santé. Il peut aussi adapter ses conseils à la situation réelle de la personne, par exemple en tenant compte de ses moyens.

Enfin, il transmet à l'équipe les difficultés repérées, pour une prise en charge coordonnée.

Futur infirmier, je veux soigner chaque patient avec la même attention, quelle que soit sa situation.`,ok:!0,note:"5/5",why:"Des rôles concrets (confiance, explication, orientation, coordination), justifiés par le texte, avec une conclusion personnelle."},{t:"Le soignant doit aider le patient. Il doit être à l'écoute, compréhensif et ne pas juger. Il doit aussi l'aider dans ses démarches. C'est le rôle du soignant d'aider tout le monde.",ok:!1,note:"2/5",why:"Les bonnes intentions sont là, mais rien n'est développé ni illustré."},{t:"Le soignant peut donner de l'argent au patient pour qu'il puisse payer ses soins, ou lui faire les soins gratuitement en dehors de ses heures de travail.",ok:!1,note:"0,5/5",why:"Idée inadaptée : le soignant oriente vers les dispositifs existants, il ne finance pas ses patients."},{t:"Moi j'ai connu des périodes difficiles financièrement, donc je comprends ces patients. C'est pour ça que je veux devenir infirmier, pour aider les gens qui en ont besoin.",ok:!1,note:"0,5/5",why:"Tu parles de ta motivation au lieu de décrire le rôle du soignant."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Le renoncement aux soins, dû au coût mais aussi aux démarches, à la distance et à la méfiance, aggrave l'état de santé des plus modestes.",ok:!0,why:"Causes multiples et conséquences : c'est le cœur du texte."},{t:"Les lunettes coûtent cher.",ok:!1,why:"Un exemple, pas le problème."},{t:"La Sécurité sociale est en déficit.",ok:!1,why:"Le texte n'en parle pas."},{t:"Les administrations sont compliquées.",ok:!1,why:"Une seule des causes, prise pour le problème."}]},{etape:"Choisir le plan",q:"Pour la question « Quel peut être le rôle du soignant face à un patient en situation de précarité ? », quel plan est le plus adapté ?",opts:[{t:"I. Créer la confiance par un accueil sans jugement — II. Expliquer, orienter et coordonner.",ok:!0,why:"Deux rôles concrets qui répondent aux causes décrites dans le texte."},{t:"I. La pauvreté en France — II. Le chômage.",ok:!1,why:"Plan hors de la question sur le rôle du soignant."},{t:"I. Les riches — II. Les pauvres.",ok:!1,why:"Opposition caricaturale et hors-sujet."},{t:"Un seul paragraphe sur la gentillesse.",ok:!1,why:"Trop pauvre pour une question d'argumentation."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Le soignant peut orienter le patient vers l'assistante sociale, car les démarches administratives découragent beaucoup de personnes. Elle pourra par exemple l'aider à faire valoir ses droits à une couverture santé. »",ok:!0,why:"Action, cause tirée du texte, exemple concret."},{t:"« Il faut aider les pauvres. »",ok:!1,why:"Affirmation sans contenu, au vocabulaire peu adapté."},{t:"« La précarité est un fléau de notre société. »",ok:!1,why:"Formule générale qui ne répond pas à la question."},{t:"« Le soignant doit tout faire pour le patient. »",ok:!1,why:"Trop vague et irréaliste."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Pour les personnes aux revenus modestes, certains soins sont repoussés ou abandonnés. Que peut faire le soignant face à cette situation ? Nous verrons qu'il doit créer la confiance, puis expliquer et orienter. »",ok:!0,why:"Sujet, problème, plan."},{t:"« La pauvreté existe depuis toujours. »",ok:!1,why:"Généralité creuse."},{t:"« Je pense que c'est injuste. »",ok:!1,why:"Opinion sans annonce de plan."},{t:"« Le texte parle de la santé. »",ok:!1,why:"Trop vague."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Ces retards aggravent souvent l'état de santé des patients concernés. »",ok:!0,why:"Phrase correcte."},{t:"« Ces retards aggrave souvent l'état de santé des patients concerné. »",ok:!1,why:"Fautes d'accord : « aggravent », « concernés »."},{t:"« Les gens qui se soignent pas, après c'est pire. »",ok:!1,why:"Registre oral."},{t:"« Ces retards, aggravent souvent, l'état de santé des patients, concernés. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« En instaurant la confiance et en orientant le patient, le soignant l'aide à rester dans le parcours de soins. Futur infirmier, je veux accorder la même attention à chaque patient, quelle que soit sa situation. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« Voilà, c'est tout ce que j'ai à dire. »",ok:!1,why:"Pas une conclusion."},{t:"« En conclusion, l'argent ne fait pas le bonheur. »",ok:!1,why:"Proverbe hors de propos."},{t:"« Pour finir, parlons des déserts médicaux. »",ok:!1,why:"Nouveau sujet en conclusion."}]}]},gd={copies:[{q:"Présentez les avantages et les limites du numérique en santé évoqués dans le texte.",points:4,reponses:[{t:`Selon le texte, le numérique apporte des avantages réels à l'organisation des soins. La prise de rendez-vous en ligne, la téléconsultation, le dossier médical partagé et les objets connectés facilitent le suivi des patients à distance et font gagner du temps aux professionnels.

Mais le texte en souligne aussi les limites. Les données de santé, très personnelles, doivent être protégées. Les personnes peu à l'aise avec les outils numériques risquent d'être exclues de certains soins. Enfin, la relation de soin pourrait se déshumaniser si l'écran remplace le contact direct.`,ok:!0,note:"4/4",why:"Avantages et limites sont présentés en deux paragraphes équilibrés, reformulés et complets."},{t:"Le numérique, c'est la téléconsultation, le dossier médical partagé et les objets connectés. C'est pratique et rapide.",ok:!1,note:"1/4",why:"Tu cites les outils mais tu oublies presque tous les avantages et toutes les limites."},{t:"Le numérique est très pratique : on peut prendre rendez-vous en ligne, consulter à distance et on gagne du temps. Les médecins aussi gagnent du temps et peuvent suivre leurs patients de loin.",ok:!1,note:"2/4",why:"Les avantages sont bien présentés, mais la question demande aussi les limites."},{t:"Le numérique est dangereux car les hackers vont voler toutes nos données de santé et les vendre. Il faut arrêter d'utiliser internet dans les hôpitaux.",ok:!1,note:"0,5/4",why:"Une seule limite, exagérée, et une conclusion qui contredit l'équilibre du texte."}]},{q:"Le numérique peut-il remplacer la relation humaine dans le soin ? Argumentez votre réponse.",points:6,reponses:[{t:`Téléconsultation, dossiers partagés, objets connectés : le numérique prend une place croissante dans le soin. Peut-il pour autant remplacer la relation humaine ? Je ne le pense pas, même s'il peut l'enrichir.

Le numérique est un outil précieux. Il permet à un patient isolé de consulter sans se déplacer, ou à un patient diabétique d'envoyer ses résultats à l'équipe qui le suit. Il facilite aussi la transmission d'informations entre professionnels.

Cependant, le soin ne se réduit pas à des données. Un regard, un geste, une présence rassurent un patient inquiet, et certaines observations ne passent pas par un écran : une pâleur, une gêne à la marche, une tristesse qui ne se dit pas. De plus, certaines personnes, notamment âgées, ne maîtrisent pas ces outils et ont besoin d'un contact direct.

Le numérique doit donc rester au service de la relation, sans s'y substituer. Grâce à mon parcours en informatique, je sais combien ces outils sont utiles, mais futur infirmier, je veux qu'ils me laissent plus de temps pour le patient, pas moins.`,ok:!0,note:"6/6",why:"Une position nuancée, des arguments illustrés de chaque côté, et une conclusion qui relie ton parcours au futur métier."},{t:"Oui, le numérique va remplacer la relation humaine, car les robots et l'intelligence artificielle feront bientôt tout mieux que les soignants. Il n'y aura plus besoin d'infirmiers dans quelques années.",ok:!1,note:"0,5/6",why:"Affirmation non argumentée et excessive, qui ignore les limites soulignées par le texte."},{t:"Non, le numérique ne peut pas remplacer la relation humaine. La relation humaine est très importante dans le soin. Les patients ont besoin de contact humain. Rien ne peut remplacer l'humain.",ok:!1,note:"1,5/6",why:"Position claire mais répétée sans arguments ni exemples, et sans reconnaître les apports du numérique."},{t:"Le numérique peut aider, par exemple avec la téléconsultation pour les gens loin du médecin. Mais il ne remplace pas le contact, car le patient a besoin d'être rassuré par une vraie personne.",ok:!1,note:"3/6",why:"Bon raisonnement, mais trop court : les idées mériteraient d'être développées, avec une introduction et une conclusion."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Le numérique améliore l'organisation des soins, mais pose des questions de protection des données, d'exclusion et de relation humaine.",ok:!0,why:"Tu présentes les deux faces du sujet, comme le texte."},{t:"La téléconsultation existe.",ok:!1,why:"Un exemple, pas le problème."},{t:"Les jeunes passent trop de temps sur internet.",ok:!1,why:"Hors-sujet."},{t:"Les ordinateurs tombent souvent en panne.",ok:!1,why:"Le texte n'en parle pas."}]},{etape:"Choisir le plan",q:"Pour la question « Le numérique peut-il remplacer la relation humaine dans le soin ? », quel plan est le plus adapté ?",opts:[{t:"I. Le numérique, un outil précieux pour le soin — II. Mais il ne peut pas remplacer la présence humaine.",ok:!0,why:"Plan dialectique qui permet une réponse nuancée et argumentée."},{t:"I. L'histoire d'internet — II. Les réseaux sociaux.",ok:!1,why:"Hors de la question."},{t:"Une liste des applications de santé.",ok:!1,why:"Pas de plan ni d'argumentation."},{t:"I. Mon métier d'informaticien — II. Mon envie de devenir infirmier.",ok:!1,why:"Plan centré sur toi, hors-sujet."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Certaines observations ne passent pas par un écran, car elles demandent la présence du soignant. Par exemple, une infirmière remarque au domicile qu'une patiente a du mal à se lever, ce qu'une téléconsultation aurait pu manquer. »",ok:!0,why:"Idée, justification et exemple concret."},{t:"« Le numérique, c'est l'avenir. »",ok:!1,why:"Slogan sans argument."},{t:"« L'humain est irremplaçable. »",ok:!1,why:"Affirmation non démontrée."},{t:"« Les données de santé sont importantes. »",ok:!1,why:"Vague et sans lien avec la question posée."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Le numérique transforme l'organisation des soins. Peut-il pour autant remplacer la relation humaine ? Nous verrons ses apports, puis ses limites. »",ok:!0,why:"Sujet amené, question posée, plan annoncé."},{t:"« Je travaille dans l'informatique depuis des années. »",ok:!1,why:"Information personnelle sans rapport avec une introduction de rédaction."},{t:"« Internet a changé le monde. »",ok:!1,why:"Généralité creuse."},{t:"« Je vais répondre à la question. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les outils numériques facilitent le suivi des patients à distance. »",ok:!0,why:"Phrase correcte."},{t:"« Les outils numérique facilite le suivi des patients à distance. »",ok:!1,why:"Fautes d'accord : « numériques », « facilitent »."},{t:"« Avec le numérique, on suit les patients de loin, c'est trop pratique. »",ok:!1,why:"Registre familier : « trop pratique »."},{t:"« Les outils numériques, facilitent, le suivi des patients, à distance. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Le numérique enrichit le soin, mais ne remplace pas la présence humaine. Futur infirmier, je veux utiliser ces outils pour gagner du temps auprès du patient. »",ok:!0,why:"Bilan nuancé et ouverture sur le métier."},{t:"« Bref, le numérique c'est bien et pas bien. »",ok:!1,why:"Formulation vague et familière."},{t:"« Pour finir, parlons de l'intelligence artificielle dans les voitures. »",ok:!1,why:"Nouveau sujet hors propos."},{t:"« En conclusion, j'ai fini ma copie. »",ok:!1,why:"Pas une conclusion."}]}]},yd={copies:[{q:"Expliquez avec vos mots ce qu'est l'antibiorésistance d'après le texte.",points:2,reponses:[{t:"L'antibiorésistance désigne la capacité de certaines bactéries à résister aux antibiotiques qui devraient les détruire. D'après le texte, elle apparaît quand les antibiotiques sont utilisés trop souvent ou de manière inadaptée. Les infections causées par ces bactéries deviennent alors plus difficiles, et parfois impossibles, à soigner.",ok:!0,note:"2/2",why:"Une définition claire avec tes mots, sa cause et sa conséquence, tirées du texte."},{t:"L'antibiorésistance, c'est quand le corps humain devient résistant aux antibiotiques à force d'en prendre, si bien que les médicaments ne lui font plus d'effet.",ok:!1,note:"0,5/2",why:"Contresens fréquent : ce sont les bactéries qui deviennent résistantes, pas le corps."},{t:"L'antibiorésistance est due à « l'utilisation excessive ou inadaptée des antibiotiques » qui « favorise l'apparition de bactéries résistantes ».",ok:!1,note:"1/2",why:"Recopié, et la consigne demande « avec vos mots »."},{t:"C'est quand les antibiotiques ne marchent plus contre les virus comme la grippe.",ok:!1,note:"0/2",why:"Erreur : le texte rappelle que les antibiotiques n'agissent pas sur les virus. Il s'agit de bactéries."}]},{q:"Quels comportements permettent de limiter ce phénomène ?",points:3,reponses:[{t:`Plusieurs comportements permettent de limiter l'antibiorésistance. D'abord, il faut utiliser les antibiotiques seulement quand ils sont utiles, c'est-à-dire contre les infections bactériennes et sur prescription : ils sont inefficaces contre les virus, comme ceux du rhume ou de la grippe.

Ensuite, il faut respecter la durée du traitement prescrite, même si l'on se sent mieux avant la fin, et ne pas réutiliser un reste de boîte sans avis médical.

Enfin, l'hygiène des mains, à l'hôpital comme en ville, limite la transmission des bactéries, y compris des bactéries résistantes.`,ok:!0,note:"3/3",why:"Les trois comportements du texte sont présentés et expliqués, avec des exemples concrets."},{t:"Il faut prendre des antibiotiques dès qu'on est malade pour guérir plus vite et éviter que l'infection devienne résistante.",ok:!1,note:"0/3",why:"C'est exactement le comportement qui favorise l'antibiorésistance : contresens complet."},{t:"Il faut se laver les mains souvent, surtout à l'hôpital, car cela évite de transmettre les bactéries.",ok:!1,note:"1/3",why:"Juste mais incomplet : tu oublies le bon usage des antibiotiques et le respect de la durée du traitement."},{t:`- pas d'antibiotiques contre les virus
- respecter la durée
- se laver les mains`,ok:!1,note:"1,5/3",why:"Les trois idées sont justes, mais en liste, sans phrases ni explications."}]},{q:"Quel rôle le futur infirmier peut-il jouer dans cette lutte ?",points:5,reponses:[{t:`L'antibiorésistance est un enjeu de santé publique, et le futur infirmier peut y contribuer à plusieurs niveaux.

D'abord, il doit montrer l'exemple par l'hygiène. Se désinfecter les mains avant et après chaque soin, appliquer les règles d'hygiène de l'établissement, c'est limiter la transmission des bactéries entre patients. À l'hôpital, ce geste simple a un effet direct.

Ensuite, il a un rôle d'éducation. L'infirmier peut expliquer à un patient pourquoi il doit prendre son antibiotique jusqu'au bout, même s'il se sent mieux, ou rappeler à une mère qu'un antibiotique ne soignera pas le rhume de son enfant. Ces explications, données avec des mots simples, changent les comportements.

Enfin, il administre les traitements selon la prescription et surveille leur efficacité, en alertant le médecin si l'infection ne recule pas.

Futur infirmier, je mesure que chaque geste quotidien compte dans cette lutte collective.`,ok:!0,note:"5/5",why:"Trois rôles concrets (hygiène, éducation, surveillance), chacun illustré, une introduction et une conclusion engagée."},{t:"Le futur infirmier peut jouer un grand rôle dans cette lutte. Il est important qu'il s'implique, car l'antibiorésistance est un problème grave. Il doit donc agir pour lutter contre ce phénomène.",ok:!1,note:"1/5",why:"Des phrases qui tournent en rond, sans dire concrètement ce que fait l'infirmier."},{t:"L'infirmier peut décider lui-même de ne pas donner l'antibiotique prescrit par le médecin s'il pense que le patient a un virus.",ok:!1,note:"0,5/5",why:"Inexact : l'infirmier ne modifie pas seul une prescription, il en parle au médecin."},{t:"L'infirmier doit se laver les mains et expliquer aux patients qu'il faut finir leur traitement. Ce sont deux gestes importants qui aident à limiter les bactéries résistantes.",ok:!1,note:"2,5/5",why:"Deux bonnes idées, mais à peine développées, sans exemple ni conclusion."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Le mauvais usage des antibiotiques rend des bactéries résistantes, ce qui menace notre capacité à soigner certaines infections.",ok:!0,why:"Cause et conséquence réunies : c'est le cœur du texte."},{t:"Les virus sont dangereux.",ok:!1,why:"Le texte précise justement que les antibiotiques n'agissent pas sur les virus."},{t:"Il faut se laver les mains.",ok:!1,why:"C'est une solution citée, pas le problème."},{t:"Les médicaments coûtent cher.",ok:!1,why:"Hors-sujet."}]},{etape:"Choisir le plan",q:"Pour la question « Quel rôle le futur infirmier peut-il jouer dans cette lutte ? », quel plan est le plus adapté ?",opts:[{t:"I. Appliquer et montrer les règles d'hygiène — II. Éduquer les patients au bon usage des antibiotiques.",ok:!0,why:"Deux rôles concrets de l'infirmier, liés au texte."},{t:"I. La découverte de la pénicilline — II. L'histoire des antibiotiques.",ok:!1,why:"Plan historique sans rapport avec le rôle infirmier."},{t:"I. Les bactéries — II. Les virus — III. Les champignons.",ok:!1,why:"Plan de cours de biologie, hors de la question."},{t:"Un seul paragraphe sur le lavage des mains.",ok:!1,why:"Trop limité pour une question d'argumentation."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« L'infirmier peut expliquer pourquoi il faut finir son traitement, car un patient qui arrête trop tôt favorise les bactéries résistantes. Par exemple, il peut le rappeler lors de la sortie d'hospitalisation. »",ok:!0,why:"Action, justification et exemple concret."},{t:"« Les antibiotiques, c'est pas automatique. »",ok:!1,why:"Un slogan n'est pas un argument."},{t:"« L'infirmier est très important. »",ok:!1,why:"Affirmation vide."},{t:"« Les bactéries sont partout. »",ok:!1,why:"Constat sans lien avec le rôle infirmier."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Le mauvais usage des antibiotiques rend certaines bactéries résistantes. Quel rôle le futur infirmier peut-il jouer face à ce danger ? Nous verrons l'importance de l'hygiène, puis celle de l'éducation des patients. »",ok:!0,why:"Sujet amené, problème posé, plan annoncé."},{t:"« Les antibiotiques ont été inventés il y a longtemps. »",ok:!1,why:"Accroche imprécise qui ne pose pas le problème."},{t:"« Je n'aime pas prendre de médicaments. »",ok:!1,why:"Opinion personnelle hors propos."},{t:"« Voici ma réponse sur les antibiotiques. »",ok:!1,why:"Trop pauvre."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Les antibiotiques sont inefficaces contre les virus. »",ok:!0,why:"Phrase correcte et exacte."},{t:"« Les antibiotiques est inefficace contre les virus. »",ok:!1,why:"Faute d'accord : « sont inefficaces »."},{t:"« Les antibio ça marche pas sur les virus. »",ok:!1,why:"Abréviation et registre oral."},{t:"« Les antibiotiques, sont inefficaces, contre les virus. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Par ses gestes d'hygiène et ses explications, l'infirmier participe à la lutte contre l'antibiorésistance. Futur soignant, je sais que chaque geste quotidien compte. »",ok:!0,why:"Bilan et ouverture sur le métier."},{t:"« En conclusion, les bactéries c'est dangereux. »",ok:!1,why:"Banal et familier."},{t:"« Pour finir, parlons du cancer. »",ok:!1,why:"Nouveau sujet en conclusion."},{t:"« J'espère avoir bien répondu. »",ok:!1,why:"Ne résume rien."}]}]},xd={copies:[{q:"« Soigner, ce n'est pas seulement traiter une maladie, c'est prendre soin d'une personne. » Que vous inspire cette affirmation ? Développez une réponse argumentée, appuyée sur des exemples.",points:10,reponses:[{t:`Le mot « soin » recouvre deux réalités : traiter une maladie et prendre soin d'une personne. L'affirmation proposée invite à ne pas les séparer. Je la partage, car soigner efficacement suppose de considérer le patient dans sa globalité.

D'abord, le traitement de la maladie reste indispensable. Administrer un médicament, réaliser un pansement ou surveiller des constantes demande rigueur et compétence. Sans ces gestes techniques, il n'y a pas de guérison possible.

Mais le patient n'est pas réduit à sa maladie. Il a une histoire, des peurs, des habitudes et des proches. Une personne âgée hospitalisée après une chute a besoin d'un soin pour sa blessure, mais aussi d'être rassurée, informée et respectée dans sa pudeur. Prendre le temps de lui expliquer un soin ou d'écouter ses inquiétudes améliore son confort et souvent sa coopération.

Enfin, prendre soin, c'est aussi penser à l'après : préparer le retour à domicile, impliquer la famille, prévenir une nouvelle chute.

En définitive, soigner et prendre soin se complètent. Futur infirmier, je veux allier la rigueur des gestes à l'attention portée à chaque personne.`,ok:!0,note:"10/10",why:"Une introduction qui pose le problème, trois parties argumentées et illustrées, et une conclusion qui répond et ouvre sur le métier."},{t:"Cette phrase veut dire que soigner ce n'est pas seulement traiter une maladie mais aussi prendre soin d'une personne. C'est une phrase très juste. En effet, il faut prendre soin des personnes et pas seulement traiter les maladies. Les patients sont des personnes et pas seulement des maladies. C'est pour cela que je suis d'accord avec cette phrase.",ok:!1,note:"2/10",why:"Tu paraphrases la citation sans l'argumenter : aucune idée n'est développée ni illustrée."},{t:"Je suis d'accord avec cette affirmation. J'ai toujours voulu aider les autres et c'est pour cela que je veux devenir infirmier. Dans mon ancien métier, j'étais déjà à l'écoute de mes collègues. Je pense avoir les qualités pour ce métier : je suis patient, organisé et empathique.",ok:!1,note:"1/10",why:"Tu parles de ta motivation au lieu de réfléchir à l'affirmation : c'est un hors-sujet, à garder pour l'oral."},{t:"Le traitement de la maladie est indispensable : sans médicaments ni gestes techniques, le patient ne guérit pas. Mais le patient a aussi besoin d'être écouté et rassuré. Par exemple, un patient qui va être opéré est souvent inquiet, et quelques explications l'apaisent. Donc soigner et prendre soin vont ensemble.",ok:!1,note:"5/10",why:"Le raisonnement est juste et illustré, mais beaucoup trop court pour un sujet de réflexion : il manque introduction, développement et ouverture."}]}],methode:[{etape:"Comprendre le sujet",q:"Que demande exactement ce sujet de réflexion ?",opts:[{t:"Réfléchir au lien entre traiter une maladie et prendre soin d'une personne, et donner un avis argumenté avec des exemples.",ok:!0,why:"Tu identifies les deux notions à relier et la consigne : argumenter avec des exemples."},{t:"Expliquer pourquoi je veux devenir infirmier.",ok:!1,why:"Piège classique : ce n'est pas une lettre de motivation."},{t:"Lister toutes les maladies qu'un infirmier soigne.",ok:!1,why:"Hors-sujet : la réflexion porte sur la relation de soin."},{t:"Dire si l'on est d'accord, en une phrase.",ok:!1,why:"La consigne demande une réponse développée et argumentée."}]},{etape:"Choisir le plan",q:"Quel plan est le plus adapté ?",opts:[{t:"I. Traiter la maladie reste indispensable — II. Mais il faut aussi prendre soin de la personne — III. Les deux se complètent.",ok:!0,why:"Un plan progressif qui examine chaque notion avant de les relier."},{t:"I. Ma vie — II. Mes qualités — III. Mon projet.",ok:!1,why:"Plan de lettre de motivation."},{t:"I. Les médecins — II. Les infirmiers — III. Les aides-soignants.",ok:!1,why:"Plan par métiers, sans lien avec la réflexion demandée."},{t:"Un seul paragraphe pour dire que c'est vrai.",ok:!1,why:"Pas de plan pour un sujet qui en demande un."}]},{etape:"Argumenter",q:"Quel paragraphe est le mieux argumenté ?",opts:[{t:"« Le patient n'est pas réduit à sa maladie, car il a des peurs et une histoire. Par exemple, expliquer un soin à une personne âgée inquiète l'apaise et facilite sa coopération. »",ok:!0,why:"Idée, justification, exemple concret."},{t:"« Prendre soin, c'est très important dans le métier. »",ok:!1,why:"Affirmation sans démonstration."},{t:"« Les malades sont des êtres humains comme nous. »",ok:!1,why:"Évidence qui ne fait pas avancer la réflexion."},{t:"« Je suis quelqu'un de très empathique. »",ok:!1,why:"Parler de soi n'est pas argumenter sur le sujet."}]},{etape:"Introduire",q:"Quelle introduction est la meilleure ?",opts:[{t:"« Le mot « soin » recouvre deux réalités : traiter une maladie et prendre soin d'une personne. Faut-il les distinguer ? Nous verrons que la technique reste indispensable, mais qu'elle ne suffit pas. »",ok:!0,why:"Elle définit les termes, pose une question et annonce le plan."},{t:"« Cette phrase est très belle. »",ok:!1,why:"Jugement esthétique, pas une introduction."},{t:"« Depuis toujours, les hommes soignent les hommes. »",ok:!1,why:"Accroche creuse."},{t:"« Je veux devenir infirmier depuis que je suis petit. »",ok:!1,why:"Début de lettre de motivation, hors-sujet."}]},{etape:"Bien écrire",q:"Quelle phrase est correctement écrite ?",opts:[{t:"« Prendre soin d'une personne, c'est aussi l'écouter et respecter sa pudeur. »",ok:!0,why:"Phrase correcte, virgule bien placée."},{t:"« Prendre soin d'une personne, c'est aussi l'écoutée et respecté sa pudeur. »",ok:!1,why:"Infinitifs fautifs : « l'écouter », « respecter »."},{t:"« Prendre soin des gens, c'est genre les écouter. »",ok:!1,why:"Registre oral : « genre »."},{t:"« Prendre soin, d'une personne c'est aussi, l'écouter et respecter, sa pudeur. »",ok:!1,why:"Virgules mal placées."}]},{etape:"Conclure",q:"Quelle conclusion est la meilleure ?",opts:[{t:"« Soigner et prendre soin se complètent : la technique guérit, l'attention accompagne. Futur infirmier, je veux allier la rigueur des gestes à l'écoute de chaque personne. »",ok:!0,why:"Réponse claire à la question et ouverture sur le métier."},{t:"« En conclusion, je suis d'accord. »",ok:!1,why:"Trop pauvre : rien n'est résumé."},{t:"« Pour finir, voici mes qualités. »",ok:!1,why:"Retour à la lettre de motivation."},{t:"« Voilà ce que m'inspire cette phrase. »",ok:!1,why:"Pas une vraie conclusion."}]}]},qd={copies:[{q:"Quelles sont les causes de l'épuisement professionnel des soignants d'après le texte ?",points:2,reponses:[{t:"D'après le texte, l'épuisement professionnel des soignants a trois causes principales. La première tient à l'organisation du travail : les horaires décalés, de nuit ou le week-end, perturbent le sommeil et la vie personnelle. La deuxième est la charge de travail importante, qui laisse peu de temps pour récupérer. La troisième est la confrontation quotidienne à la souffrance des patients, qui pèse sur le moral.",ok:!0,note:"2/2",why:"Les trois causes sont citées, reformulées et brièvement expliquées."},{t:"Les causes sont « horaires décalés, charge de travail importante, confrontation quotidienne à la souffrance ».",ok:!1,note:"1/2",why:"Recopié sans explication : il fallait montrer en quoi chaque cause épuise."},{t:"Les soignants s'épuisent parce qu'ils ne sont pas assez payés et qu'ils n'aiment plus leur métier.",ok:!1,note:"0/2",why:"Ces causes ne sont pas dans le texte : tu réponds avec tes idées au lieu de t'appuyer sur lui."},{t:"Les soignants travaillent la nuit et le week-end, ce qui les fatigue beaucoup et les empêche de voir leur famille.",ok:!1,note:"0,5/2",why:"Une seule cause, bien expliquée, mais il en manque deux."}]},{q:"Comment se manifeste-t-il, et quelles en sont les conséquences ?",points:3,reponses:[{t:`Selon le texte, l'épuisement professionnel se manifeste par une fatigue intense, qui ne disparaît pas avec le repos, par le sentiment de ne plus être efficace dans son travail, et par une mise à distance des patients : le soignant devient moins disponible, parfois plus froid.

Ses conséquences dépassent la personne. Le soignant épuisé peut être arrêté, voire quitter la profession. Ces absences et ces départs désorganisent les équipes et rendent difficile la continuité des soins, ce qui augmente la charge des collègues restants et peut les épuiser à leur tour.`,ok:!0,note:"3/3",why:"Manifestations et conséquences sont traitées dans deux paragraphes, avec la logique du cercle vicieux."},{t:"Le soignant est très fatigué, il n'a plus envie d'aller travailler et il peut faire une dépression.",ok:!1,note:"1/3",why:"Tu évoques quelques signes, mais pas les conséquences sur les équipes et la continuité des soins."},{t:`- fatigue
- sentiment d'inefficacité
- distance avec les patients
- arrêts
- départs`,ok:!1,note:"1,5/3",why:"Toutes les idées y sont, mais une liste n'est pas une réponse rédigée."},{t:"Il faut que les hôpitaux embauchent plus de personnel et augmentent les salaires pour éviter le burn-out.",ok:!1,note:"0,5/3",why:"Tu proposes des solutions alors que la question porte sur les manifestations et les conséquences."}]},{q:"Comment un futur infirmier peut-il préserver sa santé tout au long de sa carrière ? Argumentez.",points:5,reponses:[{t:`L'épuisement professionnel menace de nombreux soignants. Pour exercer longtemps, le futur infirmier doit apprendre à préserver sa santé, en s'appuyant sur lui-même et sur l'équipe.

D'abord, il doit prendre soin de son équilibre personnel. Respecter son temps de repos, garder des activités en dehors du travail et entretenir ses relations aident à récupérer après des journées difficiles. Connaître ses limites permet aussi de repérer tôt les premiers signes de fatigue.

Ensuite, il ne doit pas rester seul face aux situations difficiles. Parler d'un décès ou d'un patient agressif avec ses collègues, participer aux temps d'échange de l'équipe ou solliciter le psychologue du service aide à prendre du recul. Une équipe solidaire protège chacun de ses membres.

Enfin, il peut continuer à se former, car se sentir compétent réduit le stress.

Ces démarches individuelles ne remplacent pas des conditions de travail correctes, mais elles y contribuent. Futur infirmier, je veux prendre soin de moi pour pouvoir prendre soin des autres.`,ok:!0,note:"5/5",why:"Des moyens concrets, à la fois personnels et collectifs, chacun justifié, une nuance et une conclusion forte."},{t:"Le futur infirmier doit faire attention à sa santé. Il doit se reposer, faire du sport et bien manger. Il doit aussi parler à ses collègues. Comme ça, il ne fera pas de burn-out.",ok:!1,note:"2/5",why:"Les idées sont justes mais listées sans explication, et la dernière phrase promet trop."},{t:"Le futur infirmier doit se protéger en ne s'attachant jamais aux patients et en restant toujours froid et distant, pour ne pas être touché par leur souffrance.",ok:!1,note:"0,5/5",why:"La mise à distance des patients est justement un signe d'épuisement selon le texte : ce n'est pas une protection."},{t:"Franchement, le mieux c'est de pas faire trop d'heures sup et de se changer les idées le week-end. Et si ça va pas, faut en parler aux collègues.",ok:!1,note:"1,5/5",why:"De bonnes pistes, mais en registre familier et sans développement ni structure."}]}],methode:[{etape:"Comprendre le sujet",q:"Quel est le problème principal soulevé par ce texte ?",opts:[{t:"Les conditions d'exercice exposent les soignants à l'épuisement, avec des conséquences pour eux et pour la continuité des soins.",ok:!0,why:"Causes, effets et enjeu réunis."},{t:"Les soignants travaillent la nuit.",ok:!1,why:"Une cause parmi d'autres, pas le problème."},{t:"Les patients sont de plus en plus exigeants.",ok:!1,why:"Le texte n'en parle pas."},{t:"Le travail, c'est fatigant.",ok:!1,why:"Beaucoup trop général."}]},{etape:"Choisir le plan",q:"Pour la question « Comment un futur infirmier peut-il préserver sa santé ? », quel plan est le plus adapté ?",opts:[{t:"I. Préserver son équilibre personnel — II. S'appuyer sur l'équipe pour prendre du recul.",ok:!0,why:"Deux leviers complémentaire
